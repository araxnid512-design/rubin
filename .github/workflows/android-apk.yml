name: Android APK

on:
  push:
    # Сборка и из main, и из рабочих веток Claude — чтобы APK можно было проверить до слияния.
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Установить зависимости
        run: npm ci

      - name: Синхронизировать web-часть с Android
        run: npm run sync

      - name: Собрать debug APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.3.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Переименовать APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk styx-road.apk

      - name: Опубликовать в GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Стикс: Дорога стабов 0.3.${{ github.run_number }} (${{ github.ref_name }})
          target_commitish: ${{ github.sha }}
          body: |
            Сборка из ветки ${{ github.ref_name }}, коммит ${{ github.sha }}.
            Debug-подпись. Установка: скачайте styx-road.apk на телефон и откройте (разрешите установку из неизвестных источников).
          files: styx-road.apk
          make_latest: true
