# Сборка Android-приложения (APK) из веб-версии игры с помощью Capacitor.
# Готовый APK — в артефактах запуска: Actions → «Android APK» → kolrat-apk.
name: Android APK

on:
  push:
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Зависимости
        run: npm ci

      - name: Тесты игры
        run: npm test

      - name: Android-проект (Capacitor)
        run: |
          npm run build:www
          npx cap add android
          node tools/android-setup.js
          npx cap sync android

      - name: Сборка APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Переименовать APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk kolrat-tatooine.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kolrat-apk
          path: kolrat-tatooine.apk
          retention-days: 30
