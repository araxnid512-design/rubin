# Сборка Android-версии «Колрата» при каждом изменении игры.
# Всё лежит по постоянным ссылкам (релиз с тегом kolrat):
#   https://github.com/araxnid512-design/rubin/releases/download/kolrat/kolrat.apk      — приложение
#   https://github.com/araxnid512-design/rubin/releases/download/kolrat/kolrat-apk.zip  — то же приложение в ZIP
#   https://github.com/araxnid512-design/rubin/releases/download/kolrat/kolrat.html     — игра одним файлом, без установки
name: Колрат APK

on:
  push:
    branches: ['claude/star-wars-survival-strategy-035wez']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kolrat-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # номер сборки → versionCode: каждая новая версия ставится поверх старой
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Тесты игры
        run: npm test

      - name: Веб-версия для приложения и игра одним файлом
        run: |
          node tools/build-www.js
          node tools/build-single.js

      # APK собирается так же, как у «Клонов против дроидов» (их APK на телефоне ставится):
      # tools/build-apk.py — манифест и ресурсы вручную, подписи v1 + v2, minSdk 21, пакет com.rubin.kolrat
      - name: Собрать APK
        run: |
          python3 -m pip install --quiet cryptography
          python3 tools/build-apk.py

      - name: Проверить подпись и манифест
        run: |
          APK=dist/kolrat.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT"/apksigner verify --verbose --print-certs "$APK" | tee apksigner.txt | head -12
          grep -q "Verified using v1 scheme (JAR signing): true" apksigner.txt || { echo "Нет подписи v1"; exit 1; }
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner.txt || { echo "Нет подписи v2"; exit 1; }
          "$BT"/aapt2 dump badging "$APK" | grep -E "targetSdkVersion|sdkVersion" || true
          "$BT"/aapt2 dump badging "$APK" | grep -E "^package|^application-label:|launchable-activity" || true
          "$BT"/aapt2 dump badging "$APK" | grep -q "package: name='com.rubin.kolrat'" || { echo "Неверный пакет"; exit 1; }
          "$BT"/aapt2 dump badging "$APK" | grep -q "versionCode='$VERSION_CODE'" || { echo "Неверный versionCode"; exit 1; }
          # горизонтальная ориентация: sensorLandscape = 6
          "$BT"/aapt2 dump xmltree --file AndroidManifest.xml "$APK" | grep -i "screenOrientation" | tee /dev/stderr | grep -q "6" || { echo "Нет горизонтальной ориентации"; exit 1; }
          cp "$APK" kolrat.apk
          zip -9 kolrat-apk.zip kolrat.apk
          cp dist/kolrat.html kolrat.html
          ls -l kolrat.apk kolrat-apk.zip kolrat.html

      # Отдельный релиз с постоянным тегом; «последним» не помечается, чтобы не сбить ссылки других игр
      - name: Опубликовать
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="Колрат: Песок Татуина 1.0.${{ github.run_number }}"
          NOTES=$(printf '%s\n' \
            "Сборка из коммита ${{ github.sha }}." \
            "" \
            "kolrat.apk — приложение для Android (горизонтально, во весь экран), собрано так же, как «Клоны против дроидов». Новая версия ставится поверх старой, сохранения остаются." \
            "С версии 1.0.10 у приложения новое имя пакета: если остался старый «Колрат», удалите его." \
            "" \
            "Как установить: ссылку открыть в Chrome (в приложении Claude: ⋮ → «Відкрити в Chrome»), «Завантажити» → открыть файл → «Встановити»." \
            "Если появится окно Play Захисту — нажать «Надіслати цього разу» или «Не надсилати» (не закрывать окно мимо кнопок)." \
            "Если «Додаток не встановлено» — удалить старый «Колрат» (Налаштування → Додатки) и поставить заново." \
            "" \
            "kolrat-apk.zip — то же приложение в ZIP: если браузер не даёт скачать .apk, скачайте ZIP, откройте его в «Файлах» и нажмите на kolrat.apk." \
            "kolrat.html — игра одним файлом: откройте в браузере, без интернета и без установки.")
          FILES="kolrat.apk kolrat-apk.zip kolrat.html"
          if gh release view kolrat >/dev/null 2>&1; then
            gh release upload kolrat $FILES --clobber
            gh release edit kolrat --title "$TITLE" --notes "$NOTES" --latest=false
          else
            gh release create kolrat $FILES --title "$TITLE" --notes "$NOTES" --target "${{ github.sha }}" --latest=false
          fi
