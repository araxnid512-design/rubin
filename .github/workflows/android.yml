name: Рубеж APK

# Собирает игру в один HTML и APK тем же способом, что у «Колрата» и «Клонов» (без Gradle, подписи v1 + v2),
# ставит и запускает APK на эмуляторах Android 10 и 14 и только потом публикует:
#   релиз «rubezh»: https://github.com/araxnid512-design/rubin/releases/download/rubezh/rubezh.apk
#   сайт (ветка gh-pages, папка rubezh/): https://araxnid512-design.github.io/rubin/rubezh/
on:
  push:
    branches: ['claude/zombie-apocalypse-strategy-game-g3fgaw']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: rubezh-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Игра в один файл (код переводится для старых WebView)
        run: |
          npm ci --no-audit --no-fund
          node tools/build.mjs

      - name: Сборка APK (без Gradle, подписи v1 + v2)
        run: |
          python3 -m pip install --quiet cryptography
          python3 tools/build-apk.py

      - name: Проверить подпись и манифест
        run: |
          APK=dist/rubezh.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT"/apksigner verify --verbose --print-certs "$APK" | tee apksigner.txt | head -12
          grep -q "Verified using v1 scheme (JAR signing): true" apksigner.txt || { echo "Нет подписи v1"; exit 1; }
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner.txt || { echo "Нет подписи v2"; exit 1; }
          "$BT"/aapt2 dump badging "$APK" | grep -E "^package|^application-label:|launchable-activity|sdkVersion" || true
          "$BT"/aapt2 dump badging "$APK" | grep -q "package: name='ru.rubezh.game'" || { echo "Неверный пакет"; exit 1; }
          "$BT"/aapt2 dump badging "$APK" | grep -q "versionCode='$VERSION_CODE'" || { echo "Неверный versionCode"; exit 1; }
          cp "$APK" rubezh.apk
          zip -9 rubezh-apk.zip rubezh.apk
          ls -l rubezh.apk rubezh-apk.zip

      - uses: actions/upload-artifact@v4
        with:
          name: rubezh-files
          path: |
            rubezh.apk
            rubezh-apk.zip

  # Проверка на настоящем Android: эмулятор ставит APK, запускает игру и снимает экран
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34]
    steps:
      - name: Включить ускорение эмулятора (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: rubezh-files

      - name: Установить и запустить на Android ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r rubezh.apk 2>&1 | tee install.txt
            grep -q Success install.txt
            adb shell pm list packages | grep ru.rubezh.game
            adb shell dumpsys package ru.rubezh.game | grep -E "versionName|versionCode|targetSdk" | head -5
            sleep 15
            for t in 1 2 3; do adb shell am start -W -n ru.rubezh.game/.MainActivity; sleep 20; adb shell pidof ru.rubezh.game && break; echo "запуск $t не удался, ещё раз"; done
            # снимок меню, затем «Новая игра» (кнопка в 152,149 при экране 640×320) и снимок базы
            adb shell wm size
            adb shell screencap -p /sdcard/a.png
            adb pull /sdcard/a.png shot-${{ matrix.api }}-menu.png
            adb shell input tap 152 149
            sleep 12
            adb shell screencap -p /sdcard/b.png
            adb pull /sdcard/b.png shot-${{ matrix.api }}-base.png
            adb logcat -d -b crash | tail -40 || true
            adb logcat -d | grep -iE "chromium.*(Uncaught|Error)|console" | tail -30 || true
            adb logcat -d | grep -iE "rubezh|AndroidRuntime|FATAL|chromium" | tail -60 || true
            adb shell pidof ru.rubezh.game

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rubezh-android-${{ matrix.api }}
          path: |
            shot-*.png
            install.txt

  publish:
    needs: [build, emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          name: rubezh-files
          path: apk

      - name: Снимки с эмуляторов
        uses: actions/download-artifact@v4
        with:
          pattern: rubezh-android-*
          merge-multiple: true
          path: ci

      - name: Обновить релиз «rubezh»
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          npm ci --no-audit --no-fund
          node tools/build.mjs
          cp dist/index.html rubezh.html
          TITLE="Рубеж 1.0.${{ github.run_number }}"
          NOTES=$(printf '%s\n' \
            "Сборка из коммита ${{ github.sha }}. Проверено: ставится и запускается на Android 10 и 14." \
            "" \
            "rubezh.apk — приложение для Android (горизонтально, во весь экран). Новая версия ставится поверх старой, сохранения остаются." \
            "" \
            "Как установить: ссылку открыть в Chrome (в приложении Claude: ⋮ → «Открыть в браузере»), скачать → открыть файл → «Установить»." \
            "Если появится окно Play Защиты — нажмите кнопку в окне («Всё равно установить», «Отправить» или «Не отправлять»), не закрывайте его мимо кнопок." \
            "Если «Приложение не установлено» — удалите старый «Рубеж» (Настройки → Приложения) и поставьте заново." \
            "" \
            "rubezh-apk.zip — то же приложение в ZIP: если браузер не даёт скачать .apk, откройте ZIP в «Файлах» и нажмите на rubezh.apk." \
            "rubezh.html — игра одним файлом: откройте в браузере, без установки.")
          FILES="apk/rubezh.apk apk/rubezh-apk.zip rubezh.html"
          if gh release view rubezh >/dev/null 2>&1; then
            gh release upload rubezh $FILES --clobber
            gh release edit rubezh --title "$TITLE" --notes "$NOTES" --latest=false
          else
            gh release create rubezh $FILES --title "$TITLE" --notes "$NOTES" --target "${{ github.sha }}" --latest=false
          fi

      - name: Сайт для установки
        run: |
          node tools/build-site.mjs --apk apk/rubezh.apk --zip apk/rubezh-apk.zip --version 1.0.${{ github.run_number }}
          mkdir -p _site/ci && cp ci/*.png _site/ci/ 2>/dev/null || true
          ls -l _site/ci

      - name: Выложить в gh-pages/rubezh
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          destination_dir: rubezh
          keep_files: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: Рубеж 1.0.${{ github.run_number }}

      - name: Включить GitHub Pages из ветки gh-pages (если хватит прав)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api repos/${{ github.repository }}/pages --jq .html_url 2>/dev/null; then echo "Pages уже включены"; else
            gh api -X POST repos/${{ github.repository }}/pages -f "source[branch]=gh-pages" -f "source[path]=/" --jq .html_url || echo "Включить не удалось: это может только владелец в настройках репозитория"
          fi

      - name: Проверить адреса сайта
        continue-on-error: true
        run: |
          sleep 20
          for u in https://araxnid512-design.github.io/rubin/rubezh/ \
                   https://raw.githack.com/araxnid512-design/rubin/gh-pages/rubezh/index.html \
                   https://raw.githack.com/araxnid512-design/rubin/gh-pages/rubezh/rubezh.apk \
                   https://raw.githack.com/araxnid512-design/rubin/gh-pages/rubezh/sw.js \
                   https://raw.githack.com/araxnid512-design/rubin/gh-pages/rubezh/manifest.webmanifest; do
            curl -sS -o /dev/null -L -w "%{http_code} %{content_type} %{size_download}  $u\n" --max-time 30 "$u" || echo "нет ответа  $u"
          done
