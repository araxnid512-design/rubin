name: Android APK

# Собирает игру в один HTML, заворачивает в Android-приложение и выкладывает APK в релизы.
# Свежая сборка всегда по ссылке:
# https://github.com/araxnid512-design/rubin/releases/latest/download/rubezh.apk
on:
  push:
    branches: [main, 'claude/**']
    paths: ['src/**', 'index.html', 'tools/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Игра в один файл
        run: |
          node tools/build.mjs
          mkdir -p android/app/src/main/assets
          cp dist/index.html android/app/src/main/assets/index.html

      - name: Сборка APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Имя файла
        run: cp android/app/build/outputs/apk/release/app-release.apk rubezh.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rubezh-apk
          path: rubezh.apk

      - name: Выложить в релизы
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Рубеж для Android, сборка ${{ github.run_number }}
          make_latest: true
          files: rubezh.apk
          body: |
            Скачайте rubezh.apk на телефон и откройте его. Android попросит разрешить установку из этого источника (браузера или файлового менеджера) — разрешите.
            Новая сборка ставится поверх старой, сохранения остаются.
