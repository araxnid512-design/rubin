name: Рубеж APK

# Собирает игру в один HTML, заворачивает в Android-приложение, обновляет постоянный релиз «rubezh»
# и выкладывает сайт для установки в ветку gh-pages, папку rubezh/ (файлы других игр в ветке не трогает).
# Свежий APK: https://github.com/araxnid512-design/rubin/releases/download/rubezh/rubezh.apk
# Сайт:       https://araxnid512-design.github.io/rubin/rubezh/
on:
  push:
    branches: ['claude/zombie-apocalypse-strategy-game-g3fgaw']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rubezh-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Игра в один файл
        run: |
          node tools/build.mjs
          mkdir -p android/app/src/main/assets
          cp dist/index.html android/app/src/main/assets/index.html

      - name: Сборка APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Проверить подпись и манифест
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT"/apksigner verify --verbose --print-certs "$APK" | tee apksigner.txt | head -12
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner.txt || { echo "Нет подписи v2"; exit 1; }
          "$BT"/aapt2 dump badging "$APK" | grep -E "^package|^application-label:|launchable-activity|sdkVersion" || true
          "$BT"/aapt2 dump badging "$APK" | grep -q "package: name='ru.rubezh.game'" || { echo "Неверный пакет"; exit 1; }
          "$BT"/aapt2 dump badging "$APK" | grep -q "versionCode='${{ github.run_number }}'" || { echo "Неверный versionCode"; exit 1; }
          cp "$APK" rubezh.apk
          zip -9 rubezh-apk.zip rubezh.apk
          cp dist/index.html rubezh.html
          ls -l rubezh.apk rubezh-apk.zip rubezh.html

      - uses: actions/upload-artifact@v4
        with:
          name: rubezh-files
          path: |
            rubezh.apk
            rubezh-apk.zip

      - name: Опубликовать
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="Рубеж 1.0.${{ github.run_number }}"
          NOTES=$(printf '%s\n' \
            "Сборка из коммита ${{ github.sha }}." \
            "" \
            "rubezh.apk — приложение для Android (горизонтально, во весь экран). Новая версия ставится поверх старой, сохранения остаются." \
            "" \
            "Как установить: ссылку открыть в Chrome, скачать файл → открыть его → «Установить». Android попросит разрешить установку из браузера или «Файлов» — разрешите." \
            "Если появится окно Play Защиты — нажмите «Всё равно установить» (или «Не отправлять»)." \
            "" \
            "rubezh-apk.zip — то же приложение в ZIP: если браузер не даёт скачать .apk, скачайте ZIP, откройте его в «Файлах» и нажмите на rubezh.apk." \
            "rubezh.html — игра одним файлом: откройте в браузере, без установки.")
          FILES="rubezh.apk rubezh-apk.zip rubezh.html"
          if gh release view rubezh >/dev/null 2>&1; then
            gh release upload rubezh $FILES --clobber
            gh release edit rubezh --title "$TITLE" --notes "$NOTES" --latest=false
          else
            gh release create rubezh $FILES --title "$TITLE" --notes "$NOTES" --target "${{ github.sha }}" --latest=false
          fi

  site:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          name: rubezh-files
          path: apk

      - name: Сайт для установки
        run: |
          node tools/build.mjs
          node tools/build-site.mjs --apk apk/rubezh.apk --zip apk/rubezh-apk.zip --version 1.0.${{ github.run_number }}

      - name: Выложить в gh-pages/rubezh
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          destination_dir: rubezh
          keep_files: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: Рубеж 1.0.${{ github.run_number }}
