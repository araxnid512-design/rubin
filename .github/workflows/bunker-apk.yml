# BUNKER SURVIVAL: сборка APK. Официальный Godot 4.6.3 упаковывает игру (export-pack, текстуры ETC2/ASTC),
# Gradle собирает Android-приложение с официальной библиотекой Godot 4.6.3 (Maven Central). Готовый APK —
# в ветке bunker-apk (файл BunkerSurvival.apk) и в артефактах сборки.
# Запуск: изменить bunker/tools/apk_build.txt в рабочей ветке (или вручную).
name: 'BUNKER SURVIVAL: APK'

on:
  push:
    paths:
      - 'bunker/tools/apk_build.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Godot 4.6.3 (официальная сборка)
        run: |
          curl -sfL -o godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 godot4
          ./godot4 --version

      - name: Импорт и упаковка игры
        working-directory: bunker
        run: |
          mkdir -p export
          ../godot4 --headless --path . --import > export/import.log 2>&1 || true
          ../godot4 --headless --path . --export-pack "Android" export/bunker.zip 2>&1 | tail -20
          ls -la export/bunker.zip
          mkdir -p android/app/build/godot_assets
          unzip -q export/bunker.zip -d android/app/build/godot_assets

      - name: Сборка APK
        working-directory: bunker/android
        run: |
          mkdir -p app/libs
          curl -sfL --retry 5 -o app/libs/godot-4.6.3.stable.aar https://repo1.maven.org/maven2/org/godotengine/godot/4.6.3.stable/godot-4.6.3.stable.aar
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk ../../BunkerSurvival.apk
          ls -la ../../BunkerSurvival.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BunkerSurvival-apk
          path: BunkerSurvival.apk

      - name: APK в ветку bunker-apk
        run: |
          d=$(mktemp -d)
          cp BunkerSurvival.apk bunker/export/import.log "$d/" 2>/dev/null || cp BunkerSurvival.apk "$d/"
          cd "$d"
          echo "Сборка: ${GITHUB_SHA} ($(date -u +%Y-%m-%dT%H:%M:%SZ))" > BUILD.txt
          git init -q && git checkout -q -b bunker-apk && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "BUNKER SURVIVAL: APK ${GITHUB_SHA::8}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" bunker-apk
