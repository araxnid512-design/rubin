# Godot-версия игры (godot/): на каждом изменении — выгрузка локаций, оружия и персонажей из браузерной игры
# (scripts/export-godot.mjs), импорт в Godot, автотест (godot -- --smoke: бой, износ, обыск, переходы по всем
# локациям), сборка APK для Android и выкладка в релиз «game»:
#   https://github.com/araxnid512-design/rubin/releases/download/game/ulei-godot.apk
#   https://github.com/araxnid512-design/rubin/releases/download/game/ulei-godot-apk.zip (тот же APK в ZIP)
name: Godot-версия

on:
  push:
    branches: [main, ccr-f5d34f3a-q7wlgf]
    paths:
      - 'godot/**'
      - 'game/**'
      - '!game/version.js'
      - 'models/game/*.glb'
      - 'assets/sounds/**'
      - 'tools/godot-export.html'
      - 'scripts/export-godot.mjs'
      - '.github/workflows/godot-release.yml'
      - 'site/ulei-godot/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-release
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.4.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright с Chromium (для выгрузки локаций)
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Выгрузить локации, оружие и персонажей
        run: node scripts/export-godot.mjs
      # фото-текстуры CC0 (Poly Haven, ambientCG) для земли, стен и крыш — авторы в godot/assets/external/LICENSES.md;
      # скачанное хранится в кэше Actions, повторно не качается
      - uses: actions/cache@v4
        with:
          path: godot/assets/external
          key: free-assets-${{ hashFiles('scripts/fetch-assets.mjs') }}
      - name: Бесплатные текстуры CC0
        continue-on-error: true
        run: |
          node scripts/fetch-assets.mjs --only=road_damaged,brown_mud_leaves_01,Grass007,asbestos_sheet,rusty_corrugated_iron,raw_plank_wall,wood_peeling_paint_weathered,concrete_wall_001,concrete_wall_008,mixed_brick_wall
          # в игру — только цвет и нормали: прочие карты шейдеру не нужны, а место в APK заняли бы
          find godot/assets/external/textures -type f \( -iname '*_arm_*' -o -iname '*roughness*' -o -iname '*ambientocclusion*' -o -iname '*metalness*' -o -iname '*displacement*' -o -iname '*opacity*' -o -iname '*.usda' -o -iname '*.mtlx' \) -delete
          ls -la godot/assets/external/textures/* | head -60
          du -sh godot/assets/external/textures || true
      - name: Установить Godot и шаблоны экспорта
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/godot-bin"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -d "$HOME/godot-bin"
          mv "$HOME/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot-bin/godot"
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d /tmp/tpl
          mv /tmp/tpl/templates/* "$tpl/"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Импорт ресурсов
        run: |
          godot --version
          # без Android SDK в окружении: иначе редактор ждёт adb и может не выйти после импорта
          timeout 600 env -u ANDROID_HOME -u ANDROID_SDK_ROOT -u ANDROID_NDK_HOME godot --headless --path godot --import 2>&1 | grep -v "^\s*$" | tail -60 || true
          test -d godot/.godot/imported
      - name: Автотест
        run: |
          timeout 600 env -u ANDROID_HOME -u ANDROID_SDK_ROOT -u ANDROID_NDK_HOME godot --headless --path godot -- --smoke 2>&1 | tee smoke.log
          grep -q "SMOKE: OK" smoke.log
      # снимки всех локаций настоящим рендером (OpenGL через Mesa под xvfb, экран как у телефона 1600×720) и нагрузка
      # кадра у каждого — в gh-pages/godot-shots: по ним дорабатывается картинка (scripts/shots.gd)
      - name: Снимки локаций
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null || true
          mkdir -p shots
          timeout 900 env -u ANDROID_HOME -u ANDROID_SDK_ROOT -u ANDROID_NDK_HOME xvfb-run -a -s "-screen 0 1600x720x24" godot --path godot --rendering-driver opengl3 --resolution 1600x720 -- --shots "$PWD/shots" > shots/log.txt 2>&1 || true
          grep -E "SHOTS|снимок|ERROR|SCRIPT|✗" shots/log.txt | head -150
          ls -la shots
      - name: Выложить снимки
        if: always() && hashFiles('shots/stats.txt') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./shots
          destination_dir: godot-shots
          keep_files: true # сайты «Стикса» и «Клонов» в gh-pages не трогаем
          commit_message: "Godot: снимки локаций, сборка ${{ github.run_number }}"
      - name: Собрать APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/android/app/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p "$HOME/.config/godot" download
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.4.tres"
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name=\"0.${{ github.run_number }}\"/" godot/export_presets.cfg
          # основная сборка — через Gradle, как у «Стикса» и «Клонов» (стандартный Android-пакет);
          # если Gradle не справится — прежняя сборка из готового шаблона
          timeout 600 godot --headless --path godot --install-android-build-template 2>&1 | tail -5 || true
          timeout 1500 godot --headless --path godot --export-release "Android" "$PWD/download/ulei-godot.apk" 2>&1 | tail -60 || true
          if [ -s download/ulei-godot.apk ]; then echo "APK_BUILD=gradle" | tee -a "$GITHUB_ENV"; else
            echo "Gradle-сборка не удалась — собираю из готового шаблона"
            timeout 1200 godot --headless --path godot --export-release "Android-plain" "$PWD/download/ulei-godot.apk" 2>&1 | tail -40
            echo "APK_BUILD=plain" | tee -a "$GITHUB_ENV"
          fi
          # тестовая сборка под x86_64 — только для проверки на эмуляторе (в релиз не идёт)
          sed -i "s/^version\/code=1$/version\/code=${{ github.run_number }}/" godot/export_presets.cfg
          timeout 1200 godot --headless --path godot --export-release "Android-x86_64" "$PWD/download/ulei-godot-x86_64.apk" 2>&1 | tail -5
          ls -la download
      - name: Проверить APK
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --verbose --print-certs download/ulei-godot.apk | head -20
          "$bt/aapt2" dump badging download/ulei-godot.apk | grep -E "^(package|sdkVersion|targetSdkVersion|launchable-activity|native-code)"
          echo "сборка: $APK_BUILD, размер: $(du -h download/ulei-godot.apk | cut -f1)"
          # что занимает место в APK
          unzip -l download/ulei-godot.apk | sort -k1 -n -r | head -15
      - name: Выложить в релиз «game»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # тот же APK в ZIP: встроенный браузер приложений (и Chrome при проверке «опасного файла») может
          # застревать на 100% у .apk — ZIP скачивается сразу, APK внутри ставится из «Файлов»
          (cd download && zip -0 -q ulei-godot-apk.zip ulei-godot.apk)
          gh release upload game download/ulei-godot.apk download/ulei-godot-apk.zip --clobber
      - name: Страница скачивания (gh-pages/ulei-godot)
        run: |
          mkdir -p _site_godot
          cp godot/icons/icon_512.png _site_godot/icon.png
          sed -e "s/__VERSION__/0.${{ github.run_number }}/g" -e "s/__SIZE__/$(du -m download/ulei-godot.apk | cut -f1)/g" -e "s/__DATE__/$(date -u +%d.%m.%Y)/g" site/ulei-godot/index.html > _site_godot/index.html
      - name: Опубликовать страницу скачивания
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site_godot
          destination_dir: ulei-godot
          keep_files: true # сайты «Стикса», «Клонов» и браузерного «Улья» в gh-pages не трогаем
          commit_message: "Сайт: Улей Godot, сборка 0.${{ github.run_number }}"
      # установка и запуск на Android-эмуляторе: снимок экрана и журнал — в gh-pages/godot-test/
      - name: Включить KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Установить и запустить на эмуляторе Android 13
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          ram-size: 4096M
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android-smoke.sh
      - name: Выложить результат проверки на эмуляторе
        if: always() && hashFiles('android-test/result.txt') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./android-test
          destination_dir: godot-test
          keep_files: true # сайты «Стикса» и «Клонов» в gh-pages не трогаем
          commit_message: "Godot: проверка APK на эмуляторе, сборка ${{ github.run_number }}"
