# Скачиваемая версия игры для всех: после каждого изменения игры собирает download/ulei-cluster17.html
# (scripts/build-offline.mjs) и приложение для Android (android/, та же игра внутри) и выкладывает их
# на сайт araxnid512-design.github.io/rubin/ulei/ (страница со «Скачать APK» и «Играть в браузере», как у «Стикса»
# и «Клонов») и в релиз «game». Постоянные открытые ссылки, по которым файлы скачиваются обычным нажатием:
#   https://araxnid512-design.github.io/rubin/ulei/
#   https://github.com/araxnid512-design/rubin/releases/download/game/ulei-cluster17.html
#   https://github.com/araxnid512-design/rubin/releases/download/game/ulei-cluster17.apk
#   https://github.com/araxnid512-design/rubin/releases/download/game/ulei-cluster17-apk.zip (тот же APK в ZIP)
name: Скачиваемая версия

on:
  push:
    branches: [main, ccr-f5d34f3a-q7wlgf]
    paths:
      - 'game/**'
      - 'game.html'
      - 'src/**'
      - 'models/game/*.glb'
      - 'assets/**'
      - 'scripts/build-offline.mjs'
      - 'scripts/build-ulei-site.mjs'
      - 'site/ulei/**'
      - 'package-lock.json'
      - 'android/**'
      - '.github/workflows/offline-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: offline-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:offline
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Собрать APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: |
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk download/ulei-cluster17.apk
          # тот же APK в ZIP: браузер на телефоне не задерживает его проверкой «опасного файла»
          (cd download && zip -0 -q ulei-cluster17-apk.zip ulei-cluster17.apk)
      # тем же, чем проверяет телефон: выравнивание, подпись, манифест — битый APK в релиз не попадёт
      - name: Проверить APK
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/zipalign" -c 4 download/ulei-cluster17.apk && echo "выравнивание: ок"
          "$bt/apksigner" verify --verbose --print-certs download/ulei-cluster17.apk
          "$bt/aapt2" dump badging download/ulei-cluster17.apk | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|launchable-activity|native-code)"
      - name: Выложить в релиз «game»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Игра «Улей. Кластер-17». ulei-cluster17.apk — приложение для Android: скачай и установи (разреши установку из этого источника); новая версия ставится поверх, сохранение остаётся. ulei-cluster17.html — та же игра одним файлом: открой в браузере, без интернета и без установки. Сборка 1.${GITHUB_RUN_NUMBER} от $(date -u +'%d.%m.%Y %H:%M') UTC, коммит ${GITHUB_SHA::7}."
          if gh release view game >/dev/null 2>&1; then
            gh release edit game --title "Улей. Кластер-17 — скачать игру" --notes "$notes"
          else
            gh release create game --target "$GITHUB_SHA" --title "Улей. Кластер-17 — скачать игру" --notes "$notes" --latest
          fi
          gh release upload game download/ulei-cluster17.html download/ulei-cluster17.apk download/ulei-cluster17-apk.zip --clobber
      # сайт: только папка ulei/ в ветке gh-pages — страницы «Стикса» и «Клонов» остаются как есть
      - name: Собрать страницу игры
        run: node scripts/build-ulei-site.mjs 1.${{ github.run_number }}
      - name: Опубликовать на сайте (GitHub Pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site_ulei
          destination_dir: ulei
          keep_files: true
          commit_message: "Сайт: Улей. Кластер-17, сборка 1.${{ github.run_number }}"
