# Открытый сайт игры на GitHub Pages: страница из docs/ (установить на телефон, играть, скачать APK).
#   https://araxnid512-design.github.io/rubin/
name: Колрат — сайт

on:
  push:
    branches: ['claude/star-wars-survival-strategy-035wez']
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

concurrency:
  group: kolrat-pages
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Включить Pages (если ещё не включены)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
