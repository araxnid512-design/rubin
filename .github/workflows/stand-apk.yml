# «Стикс: Человеческий улей»: сборка APK. Официальный Godot 4.6.3 упаковывает игру (export-pack, текстуры
# ETC2/ASTC), Gradle собирает Android-приложение с официальной библиотекой Godot 4.6.3 (Maven Central). Готовый
# APK — в выпуске «stiks» (прямая ссылка: releases/download/stiks/Stiks.apk; сборка Б на Vulkan — Stiks_vulkan.apk), в ветке stand-apk (файл Stiks.apk;
# больше 95 МБ — частями Stiks.apk.part-NN) и в артефактах сборки.
# Запуск: изменить stand/tools/apk_build.txt в рабочей ветке (или вручную).
name: 'Стикс: Человеческий улей — APK'

on:
  push:
    paths:
      - 'stand/tools/apk_build.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Godot 4.6.3 (официальная сборка)
        run: |
          curl -sfL -o godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 godot4
          ./godot4 --version

      - name: Импорт и упаковка игры
        working-directory: stand
        run: |
          mkdir -p export
          ../godot4 --headless --path . --import > export/import.log 2>&1 || true
          ../godot4 --headless --path . --export-pack "Android" export/stand.zip 2>&1 | tail -20
          ls -la export/stand.zip
          mkdir -p android/app/build/godot_assets
          unzip -q export/stand.zip -d android/app/build/godot_assets

      - name: Сборка APK
        working-directory: stand/android
        run: |
          mkdir -p app/libs
          # библиотека Godot: Maven Central иногда отвечает «слишком много запросов» (429) — тогда берётся тот же файл
          # с официального зеркала Maven Central у Google; файл сверяется по контрольной сумме
          AAR=org/godotengine/godot/4.6.3.stable/godot-4.6.3.stable.aar
          for U in https://repo1.maven.org/maven2 https://maven-central.storage-download.googleapis.com/maven2 https://repo.maven.apache.org/maven2 https://repo1.maven.org/maven2; do
            if curl -sfL --retry 4 --retry-all-errors -o app/libs/godot-4.6.3.stable.aar "$U/$AAR" && echo "d10e62b444c5cf3fcfc573fd0ed21c588331c7b8  app/libs/godot-4.6.3.stable.aar" | sha1sum -c -; then break; fi
            echo "не скачалось с $U — пробую следующий источник"; rm -f app/libs/godot-4.6.3.stable.aar; sleep 20
          done
          test -s app/libs/godot-4.6.3.stable.aar
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk ../../Stiks.apk
          ls -la ../../Stiks.apk

      # сборка Б: тот же код, отрисовщик «Мобильный» (Vulkan) вместо «Совместимости» (OpenGL ES 3); если у телефона
      # нет Vulkan — Godot сам откатывается на OpenGL. Для сравнения на телефоне: Stiks.apk (А) и Stiks_vulkan.apk (Б)
      - name: Сборка Б (Vulkan)
        working-directory: stand
        run: |
          cp project.godot ../project.godot.bak
          sed -i 's/^renderer\/rendering_method.mobile="gl_compatibility"/renderer\/rendering_method.mobile="mobile"/' project.godot
          sed -i 's/^\[rendering\]$/[rendering]\n\nrendering_device\/fallback_to_opengl3=true/' project.godot
          grep -n "rendering_method\|fallback_to_opengl3" project.godot
          ../godot4 --headless --path . --export-pack "Android" export/stand_vk.zip 2>&1 | tail -5
          rm -rf android/app/build/godot_assets
          mkdir -p android/app/build/godot_assets
          unzip -q export/stand_vk.zip -d android/app/build/godot_assets
          cd android && ./gradlew assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk ../../Stiks_vulkan.apk
          cd .. && cp ../project.godot.bak project.godot
          ls -la ../Stiks_vulkan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Stiks-apk
          path: |
            Stiks.apk
            Stiks_vulkan.apk

      # прямая ссылка для телефона (без входа в GitHub, одним файлом):
      # https://github.com/<репозиторий>/releases/download/stiks/Stiks.apk — каждая сборка заменяет файл
      - name: APK в выпуск «stiks»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="${{ github.repository }}"
          BN=$(grep -o 'Сборка [0-9]*' stand/tools/apk_build.txt | head -1)
          if ! gh release view stiks --repo "$R" > /dev/null 2>&1; then
            gh release create stiks --repo "$R" --target "${GITHUB_SHA}" --title "Стикс: Человеческий улей — APK" --notes "APK для телефона."
          fi
          gh release upload stiks Stiks.apk --repo "$R" --clobber
          if [ -f Stiks_vulkan.apk ]; then gh release upload stiks Stiks_vulkan.apk --repo "$R" --clobber; fi
          gh release edit stiks --repo "$R" --title "Стикс: Человеческий улей — ${BN} (${GITHUB_SHA::8})" --notes-file stand/tools/apk_build.txt

      - name: APK в ветку stand-apk
        run: |
          d=$(mktemp -d)
          cp Stiks.apk stand/export/import.log "$d/" 2>/dev/null || cp Stiks.apk "$d/"
          cd "$d"
          # GitHub не принимает файлы больше 100 МБ: большой APK кладётся частями по 90 МБ
          # (собрать: cat Stiks.apk.part-* > Stiks.apk)
          if [ "$(stat -c %s Stiks.apk)" -gt 95000000 ]; then
            split -b 90m -d Stiks.apk Stiks.apk.part-
            rm Stiks.apk
            ls -la Stiks.apk.part-*
          fi
          echo "Сборка: ${GITHUB_SHA} ($(date -u +%Y-%m-%dT%H:%M:%SZ))" > BUILD.txt
          git init -q && git checkout -q -b stand-apk && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Стикс: Человеческий улей — APK ${GITHUB_SHA::8}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" stand-apk
