# Tripo через вход по аккаунту (кредиты сайта Studio): официальная программа tripo (@tripo3d/cli).
# 1) вход (scripts/tripo-login.sh): сохранённая зашифрованная сессия из ветки tripo-session, иначе tripo auth
#    login — Tripo шлёт код на почту аккаунта, пользователь кладёт его в секрет TRIPO_CODE, сборка «Tripo: код»
#    (tripo-code.yml) передаёт его сюда зашифрованным (ветка tripo-code), сессия сохраняется; 2) баланс, цены и справка по командам — в
#    status/info.md; 3) задания из ветки tripo-control (jobs.json) выполняет scripts/tripo-cli-runner.py,
#    готовые файлы и журнал — в ветке tripo-status. Предел трат — budget кредитов от баланса на старте.
name: Tripo (аккаунт)

on:
  # запуск и при изменении этого файла: новую сборку GitHub иначе не даёт запустить вручную вне основной ветки
  push:
    branches: [ccr-f5d34f3a-q7wlgf]
    paths:
      - '.github/workflows/tripo-cli.yml'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Сколько минут ждать заданий после входа'
        default: '120'
      budget:
        description: 'Предел трат, кредитов'
        default: '500'

permissions:
  contents: write

concurrency:
  group: tripo-cli
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      GH_TOKEN: ${{ github.token }}
      # почта аккаунта Tripo — секрет репозитория (в журналах GitHub скрывается, в выкладываемых файлах заменяется)
      TRIPO_EMAIL: ${{ secrets.TRIPO_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Программа tripo
        run: |
          npm i -g @tripo3d/cli@0.8.1 > /dev/null
          tripo version
      - name: Вход по аккаунту
        env:
          # сохранённый вход (сессия программы tripo) хранится в ветке tripo-session зашифрованным этим секретом
          SESSION_PASS: ${{ secrets.TRIPO_API_KEY }}
        run: bash scripts/tripo-login.sh
      - name: Баланс, цены, справка по командам
        run: |
          set +e
          {
            echo "# Tripo: аккаунт"; echo
            for c in "auth whoami" "account balance" "account prices"; do echo "## tripo $c"; echo '```'; tripo $c 2>&1 | head -80; echo '```'; done
            for c in "generate text" "process rig" "process animate" "process" "export" "project get"; do echo "## tripo $c --help"; echo '```'; tripo $c --help 2>&1 | head -120; echo '```'; done
          } > info.raw
          sed "s/$TRIPO_EMAIL/<почта>/g" info.raw > status/info.md
          bash scripts/tripo-publish.sh
      # бесплатно: справка Tripo по анимациям (список пресетов, версии скелета, цены) и список проектов аккаунта —
      # какие модели уже со скелетом (для анимаций нужен готовый риг); в status/anim.md и status/projects.json
      - name: Справка по анимациям, проекты
        run: |
          set +e
          {
            echo "# Tripo: анимации — документация"; echo
            for u in https://developers.tripo3d.ai/en/models/animation.md https://developers.tripo3d.com/en/models/animation.md \
                     https://developers.tripo3d.ai/en/docs/quick-start.md https://docs.comfy.org/built-in-nodes/TripoRetargetNode.md; do
              echo "## $u"; echo; curl -sL --max-time 60 "$u" | head -c 150000; echo; echo
            done
          } > status/anim.md
          tripo project list --size 60 --output-format json > projects.raw 2>&1
          sed "s/$TRIPO_EMAIL/<почта>/g" projects.raw > status/projects.json
          bash scripts/tripo-publish.sh
      - name: Задания из ветки tripo-control
        env:
          TRIPO_MINUTES: ${{ github.event.inputs.minutes || '120' }}
          TRIPO_BUDGET: ${{ github.event.inputs.budget || '500' }}
        run: python3 scripts/tripo-cli-runner.py
