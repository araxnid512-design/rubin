plugins {
	id 'com.android.application'
}

android {
	namespace 'com.araxnid.ulei'
	compileSdk 35

	defaultConfig {
		applicationId 'com.araxnid.ulei'
		// Android 6+: с ним сборка подписывается и старой схемой v1 — её ждут установщики некоторых телефонов
		minSdk 23
		targetSdk 35
		// номер сборки на GitHub: каждая новая версия ставится поверх старой, сохранение остаётся
		versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
		versionName(System.getenv('VERSION_NAME') ?: '1.0')
	}

	// Постоянный debug-ключ в репозитории — тот же, что у «Стикса» и «Клонов» (android/app/debug.keystore там):
	// каждая сборка подписана одинаково, поэтому новый APK ставится поверх старого без удаления игры
	signingConfigs {
		release {
			storeFile file('debug.keystore')
			storePassword 'android'
			keyAlias 'androiddebugkey'
			keyPassword 'android'
			// все схемы подписи: старая v1 (JAR) нужна установщикам некоторых телефонов, иначе «Приложение не установлено»
			// (при minSdk 24 и выше её отключает сама сборка)
			enableV1Signing true
			enableV2Signing true
			enableV3Signing true
		}
	}

	buildTypes {
		release {
			minifyEnabled false
			signingConfig signingConfigs.release
		}
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}
}

dependencies {
	implementation 'androidx.webkit:webkit:1.12.1'
}
