plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.rubin.kurier'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.rubin.kurier'
        // Android 5.0 и новее: на бюджетных телефонах ещё встречаются 5–6
        minSdk 21
        targetSdk 34
        // номер сборки GitHub Actions — чтобы новая версия ставилась поверх старой
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer)
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    // Один и тот же ключ для всех сборок, чтобы обновления ставились без удаления игры.
    signingConfigs {
        shared {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            // старая подпись v1 нужна Android 5–6, новые v2/v3 — свежим версиям
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
