<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Рубин: Убежище</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="title">
<canvas id="cv"></canvas>
<div id="vignette"></div>
<div id="hurt"></div>

<div id="hud">
  <div id="top">
    <div class="chip bar" id="c-energy"><img alt=""><div class="cb"><b></b></div><span></span></div>
    <div class="chip bar" id="c-water"><img alt=""><div class="cb"><b></b></div><span></span></div>
    <div class="chip bar" id="c-food"><img alt=""><div class="cb"><b></b></div><span></span></div>
    <div class="chip" id="c-scrap"><img alt=""><span></span></div>
    <div class="chip" id="c-meds"><img alt=""><span></span></div>
    <div class="chip" id="c-ppl"><img alt=""><span></span></div>
    <div id="clock"></div>
    <button id="btn-menu" aria-label="Меню"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <div id="goal"><span class="tag">ЦЕЛЬ</span><span id="goal-t"></span></div>
  <div id="banner"></div>
  <div id="fps"></div>

  <div id="sel">
    <div class="sel-info"><b id="sel-name"></b><div id="sel-stats"></div><small id="sel-job"></small></div>
    <button id="sel-rest">Отдых</button>
    <button id="sel-go" class="gold">На вылазку</button>
    <button id="sel-x" aria-label="Закрыть">✕</button>
  </div>
  <div id="bar">
    <button id="b-zoom" class="sq" aria-label="Обзор"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg></button>
    <button id="b-build"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg>Строить</button>
    <button id="b-alarm"><svg viewBox="0 0 24 24"><path d="M12 3v2M5 19h14M7 19v-6a5 5 0 0110 0v6M3 9l2 1M21 9l-2 1"/></svg>Тревога</button>
    <button id="b-exp" class="gold"><svg viewBox="0 0 24 24"><path d="M12 20V6M6 11l6-6 6 6M4 21h16"/></svg>Вылазка</button>
  </div>

  <div id="xh">
    <div id="x-stat">
      <b id="x-name"></b>
      <div class="sb hp"><i id="x-hp"></i></div>
      <div class="sb st"><i id="x-st"></i></div>
      <div class="sb tm"><i id="x-time"></i><span id="x-timer"></span></div>
      <small id="x-pack"></small>
    </div>
    <button id="x-l" class="mv" aria-label="Влево"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button id="x-r" class="mv" aria-label="Вправо"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button id="x-med" class="rb"><img id="x-medi" alt=""><span id="x-meds"></span></button>
    <button id="x-roll" class="rb"><svg viewBox="0 0 24 24"><path d="M4 14a8 8 0 0114-5M20 10a8 8 0 01-14 5M18 4v5h-5M6 20v-5h5"/></svg><em>Кувырок</em></button>
    <button id="x-act"><span>Удар</span></button>
  </div>
</div>

<div id="modal" class="hide">
  <div id="m-panel">
    <header><h2 id="m-title"></h2><button class="x" data-close aria-label="Закрыть">✕</button></header>
    <div id="m-body"></div>
  </div>
</div>

<div id="title">
  <div class="t-box">
    <div class="gem"></div>
    <h1>РУБИН</h1>
    <h2>УБЕЖИЩЕ</h2>
    <p>Наверху — мёртвый мир. Копай вглубь, распределяй людей по отсекам,<br>выходи на вылазки за припасами и держи гермодверь закрытой.</p>
    <button id="btn-play">ИГРАТЬ</button>
    <button id="btn-new" class="ghost hide">Новое убежище</button>
  </div>
</div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/rig.js"></script>
<script src="js/gfx.js"></script>
<script src="js/shelter.js"></script>
<script src="js/expedition.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
