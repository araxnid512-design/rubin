plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rubin.charmer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rubin.charmer'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.7.0'
    }

    // Подпись релиза: файл keystore.properties (не в git) с storeFile/storePassword/keyAlias/keyPassword
    def ksFile = rootProject.file('charmer/keystore.properties')
    def ks = new Properties()
    if (ksFile.exists()) ks.load(new FileInputStream(ksFile))
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    // записи голосов уже сжаты (Opus) — не пережимать, чтобы проигрывались прямо из APK
    androidResources {
        noCompress 'ogg'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
