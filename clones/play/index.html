<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d1117">
<title>Клоны против дроидов</title>
<!-- Шрифт заголовков лежит рядом (fonts/, лицензия OFL): игра работает без интернета -->
<style>
  @font-face { font-family: "Russo One"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/russo-one-cyrillic.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: "Russo One"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/russo-one-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF, U+FFFD; }
</style>
<style>
  :root {
    color-scheme: dark;
    --panel: rgba(9, 16, 24, .82); --panel2: rgba(20, 34, 48, .9); --line: rgba(120, 200, 255, .28);
    --holo: #6fd0ff; --rep: #e2463a; --sep: #7a8cff; --gold: #ffc65a; --ok: #6fe39a; --warn: #ffb347;
    --txt: #e9f3fb; --dim: #8aa3b8;
    --disp: "Russo One", "Arial Black", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0d1117; color: var(--txt);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #view { position: fixed; inset: 0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--holo); outline-offset: 2px; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5; }
  body.playing #hud { display: block; }
  .pe { pointer-events: auto; }
  .top { position: absolute; top: calc(8px + env(safe-area-inset-top)); left: calc(10px + env(safe-area-inset-left)); right: calc(10px + env(safe-area-inset-right)); display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .tgroup { display: flex; gap: 6px; }
  .ib {
    width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
    display: grid; place-items: center; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .ib svg { width: 22px; height: 22px; fill: none; stroke: var(--txt); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ib.off { opacity: .45; }
  .ib:active { transform: scale(.94); }
  #turnBox { text-align: center; padding: 6px 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); min-width: 210px; }
  #turnTitle { font-family: var(--disp); letter-spacing: 2px; font-size: 15px; }
  #turnTitle.rep { color: var(--holo); } #turnTitle.sep { color: #ff8a7a; }
  #objective { font-size: 12px; color: var(--dim); margin-top: 2px; }
  #turnBox { position: relative; }
  #fps { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 3px; font-size: 9px; color: var(--dim); opacity: .75; pointer-events: none; white-space: nowrap; }

  /* отряд */
  #squad { position: absolute; left: calc(10px + env(safe-area-inset-left)); bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 6px; }
  .card {
    width: 74px; padding: 6px 6px 5px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 3px; position: relative; transition: transform .15s, border-color .15s;
  }
  .card.sel { border-color: var(--holo); transform: translateY(-6px); box-shadow: 0 0 0 1px var(--holo), 0 6px 22px rgba(111, 208, 255, .25); }
  .card.dead { opacity: .35; }
  .card.done .cname { color: var(--dim); }
  .card canvas { width: 100%; height: 40px; border-radius: 8px; object-fit: cover; display: block; }
  .cname { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hp { display: flex; gap: 2px; } .hp i { flex: 1; height: 5px; border-radius: 2px; background: var(--ok); } .hp i.e { background: rgba(255,255,255,.15); }
  .ap { position: absolute; top: 4px; right: 5px; display: flex; gap: 3px; } .ap i { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 6px var(--gold); } .ap i.e { background: rgba(255,255,255,.18); box-shadow: none; }
  .badge { position: absolute; top: 4px; left: 5px; font-size: 10px; }

  /* действия */
  #actions { position: absolute; right: calc(10px + env(safe-area-inset-right)); bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 6px; align-items: flex-end; }
  .act {
    width: 64px; height: 64px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; color: var(--txt);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .act svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .act:disabled { opacity: .3; }
  .act.primary { background: linear-gradient(#2c6fa0, #17405e); border-color: var(--holo); }
  .act.end { background: linear-gradient(#7a2a24, #4a1714); border-color: #ff8a7a; }
  .act.on { border-color: var(--gold); color: var(--gold); }
  .act:active:not(:disabled) { transform: scale(.94); }
  .act .k { font-size: 9px; opacity: .55; }
  .act { position: relative; }
  .act .cnt { position: absolute; top: 3px; right: 5px; font: 800 10px/1 system-ui, sans-serif; color: var(--gold); }
  .act.reload { border-color: var(--warn); color: var(--warn); }
  .act.evacB { background: linear-gradient(#1f7a4a, #0f4428); border-color: #6fe39a; }
  .warnT { color: var(--warn); }
  .card.evac { opacity: .55; }

  /* панель цели */
  #targetPanel {
    position: absolute; right: calc(10px + env(safe-area-inset-right)); bottom: calc(84px + env(safe-area-inset-bottom));
    width: 250px; padding: 10px 12px; border-radius: 14px; background: var(--panel2); border: 1px solid rgba(255,120,100,.5); display: none;
  }
  #targetPanel.show { display: block; }
  .tp-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #tpName { font-weight: 800; font-size: 14px; }
  #tpChance { font-family: var(--disp); font-size: 34px; color: var(--gold); line-height: 1; }
  .tp-sub { font-size: 12px; color: var(--dim); }
  .tp-nav { display: flex; gap: 6px; margin-top: 8px; }
  .tp-nav button { flex: 1; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.06); font-weight: 700; }
  .tp-nav .fire { flex: 2; background: linear-gradient(#e2463a, #9b241b); border-color: #ff9d8f; font-family: var(--disp); letter-spacing: 1px; }

  #hint {
    position: absolute; left: 50%; top: calc(64px + env(safe-area-inset-top)); transform: translateX(-50%);
    padding: 6px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); font-size: 12px; white-space: nowrap; opacity: 0; transition: opacity .2s;
  }
  #hint.show { opacity: 1; }

  /* надписи над юнитами */
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
  .ul { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .ul .pips { display: flex; gap: 1px; padding: 2px; border-radius: 4px; background: rgba(0,0,0,.55); }
  .ul .pips i { width: 6px; height: 5px; border-radius: 1px; background: var(--ok); }
  .ul.sep .pips i { background: #ff6b5a; }
  .ul .pips i.e { background: rgba(255,255,255,.18); }
  .ul .st { font-size: 11px; line-height: 1; text-shadow: 0 1px 2px #000; }
  .pop {
    position: absolute; transform: translate(-50%, -100%); font-family: var(--disp); font-size: 20px; color: #fff;
    text-shadow: 0 2px 0 #000, 0 0 12px rgba(0,0,0,.6); animation: pop 1.4s ease-out forwards; white-space: nowrap;
  }
  .pop.miss { color: #c9d6e2; } .pop.crit { color: var(--gold); font-size: 24px; } .pop.dmg { color: #ff6b5a; }
  @keyframes pop { 0% { opacity: 0; margin-top: 10px; } 15% { opacity: 1; margin-top: 0; } 75% { opacity: 1; } 100% { opacity: 0; margin-top: -36px; } }

  /* баннер */
  #banner {
    position: fixed; left: 0; right: 0; top: 34%; z-index: 8; text-align: center; pointer-events: none;
    font-family: var(--disp); font-size: clamp(22px, 7vh, 44px); letter-spacing: 4px; opacity: 0;
    background: linear-gradient(90deg, transparent, rgba(5,10,16,.85) 25%, rgba(5,10,16,.85) 75%, transparent); padding: 10px 0;
  }
  #banner.show { animation: banner 1.8s ease-out forwards; }
  #banner.rep { color: var(--holo); } #banner.sep { color: #ff8a7a; } #banner.alert { color: var(--warn); }
  @keyframes banner { 0% { opacity: 0; transform: scaleY(.2); } 12% { opacity: 1; transform: scaleY(1); } 80% { opacity: 1; } 100% { opacity: 0; } }

  /* кинокамера */
  .bar { position: fixed; left: 0; right: 0; height: 0; background: #000; z-index: 6; transition: height .45s ease; pointer-events: none; }
  #barT { top: 0; } #barB { bottom: 0; }
  body.cine .bar { height: 10vh; }
  body.cine #hud, body.cine #labels { opacity: 0; transition: opacity .3s; }
  #cineInfo { position: fixed; z-index: 7; left: 50%; bottom: 2.5vh; transform: translateX(-50%); font-family: var(--disp); font-size: 14px; letter-spacing: 2px; color: var(--gold); opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
  body.cine #cineInfo { opacity: 1; }

  /* экраны */
  .screen {
    position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; padding: 16px;
    background: radial-gradient(ellipse at 50% 60%, rgba(10,18,28,.35), rgba(5,8,12,.88));
  }
  .screen.show { display: flex; }
  .box { width: min(600px, 100%); text-align: center; }
  h1 {
    margin: 0; font-family: var(--disp); font-weight: 400; font-size: clamp(28px, 10vh, 64px); line-height: 1; letter-spacing: 3px;
    background: linear-gradient(#fff, #9fd9ff 55%, #4aa6e0); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 18px rgba(80,180,255,.35)); text-wrap: balance;
  }
  h1 .vs { display: block; font-size: .42em; letter-spacing: 8px; color: #ff8a7a; -webkit-text-fill-color: #ff8a7a; margin: 6px 0; }
  h2 { margin: 0 0 8px; font-family: var(--disp); font-weight: 400; font-size: clamp(24px, 8vh, 44px); letter-spacing: 2px; }
  .lead { color: var(--dim); margin: 10px auto 18px; max-width: 46ch; font-size: clamp(13px, 3.4vh, 16px); line-height: 1.45; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; margin: 5px; padding: clamp(10px, 2.6vh, 14px) clamp(20px, 5vh, 34px);
    border-radius: 14px; border: 1px solid var(--holo); background: linear-gradient(#2c6fa0, #17405e); color: #fff;
    font-family: var(--disp); font-size: clamp(15px, 4vh, 20px); letter-spacing: 2px; box-shadow: 0 0 24px rgba(111,208,255,.25);
  }
  .btn.ghost { background: rgba(255,255,255,.06); border-color: var(--line); box-shadow: none; }
  .btn:active { transform: translateY(2px); }
  .help { text-align: left; font-size: clamp(12px, 3.2vh, 14px); line-height: 1.55; color: #c9d8e6; max-width: 56ch; margin: 0 auto 12px; }
  .help b { color: var(--holo); }
  .stats { font-size: clamp(14px, 3.8vh, 18px); line-height: 1.8; margin: 8px 0 14px; }
  #loading { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: #0d1117; font-family: var(--disp); letter-spacing: 3px; color: var(--holo); }
  #rotate { z-index: 40; background: #0d1117; flex-direction: column; text-align: center; }
  #rotate .phone { width: 56px; height: 96px; border: 4px solid var(--holo); border-radius: 12px; margin: 0 auto 16px; animation: rot 2s ease-in-out infinite; }
  @keyframes rot { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }

  /* вид от первого лица */
  #fp { position: fixed; inset: 0; pointer-events: none; z-index: 6; }
  #fp > * { position: absolute; display: none; }
  #xhair { left: 50%; top: 50%; width: 54px; height: 54px; transform: translate(-50%, -50%); }
  body.xhair #xhair { display: block; }
  #scope { inset: 0; background: radial-gradient(circle at 50% 50%, transparent 0 34vh, rgba(0,0,0,.96) 34.4vh); }
  #scope svg { position: absolute; left: 50%; top: 50%; width: 68vh; height: 68vh; transform: translate(-50%, -50%); }
  body.scope #scope { display: block; }
  #hitmark { left: 50%; top: 50%; width: 64px; height: 64px; transform: translate(-50%, -50%); opacity: 0; }
  #hitmark.show { display: block; animation: hm .55s ease-out forwards; }
  #hitmark.kill path { stroke: #ff4a3a; }
  @keyframes hm { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1.5); } 30% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.1); } }
  #dv { inset: 0; background: repeating-linear-gradient(0deg, rgba(255,50,30,.07) 0 2px, transparent 2px 5px), radial-gradient(ellipse at center, transparent 45%, rgba(140,10,0,.5)); }
  body.droidvision #dv { display: block; }
  body.droidvision #xhair path, body.droidvision #xhair circle { stroke: #ff5a4a; }

  /* панель целей */
  #enemyBar { position: absolute; top: calc(60px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); display: flex; gap: 6px; }
  .eb { width: 48px; padding: 4px 0 3px; border-radius: 10px; border: 1px solid rgba(255,110,90,.55); background: var(--panel); text-align: center; font-size: 12px; font-weight: 800; color: #ffd9d2; }
  .eb .ic canvas { width: 40px; height: 24px; border-radius: 6px; display: block; margin: 0 auto 2px; object-fit: cover; }
  .eb.fl { border-color: var(--gold); color: var(--gold); }
  .eb.cur { background: rgba(160,40,30,.85); }
  #unitInfo { position: absolute; left: calc(10px + env(safe-area-inset-left)); bottom: calc(118px + env(safe-area-inset-bottom)); padding: 5px 10px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); font-size: 12px; color: var(--dim); white-space: nowrap; }
  #unitInfo b { color: var(--txt); }
  .ul .ch { font-family: var(--disp); font-size: 13px; color: #ffd9d2; background: rgba(120,20,15,.8); padding: 1px 5px; border-radius: 5px; line-height: 1.2; }
  .ul .ch.fl { color: #2a1400; background: var(--gold); }
  .ul .ch.pre { outline: 1px dashed rgba(255,255,255,.7); }
  .ul .ap2 { display: flex; gap: 2px; } .ul .ap2 i { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 5px var(--gold); }
  #bCam { position: relative; }
  .camk { position: absolute; right: 3px; bottom: 2px; font: 800 10px/1 system-ui, sans-serif; color: var(--gold); }
  .ib.on { border-color: var(--gold); }
  .ib.on svg { stroke: var(--gold); }

  @media (max-height: 460px), (max-width: 900px) {
    .card { width: 56px; padding: 4px 4px 3px; gap: 2px; } .card canvas { height: 30px; } .cname { font-size: 9px; }
    .hp i { height: 4px; } .ap i { width: 6px; height: 6px; }
    .act { width: 48px; height: 48px; border-radius: 13px; } .act svg { width: 22px; height: 22px; } .act .lbl { display: none; }
    #actions, #squad { gap: 5px; }
    #unitInfo { bottom: calc(84px + env(safe-area-inset-bottom)); font-size: 10.5px; padding: 4px 8px; }
    #targetPanel { bottom: calc(64px + env(safe-area-inset-bottom)); width: 230px; }
    #hint { top: calc(52px + env(safe-area-inset-top)); font-size: 11px; padding: 4px 10px; }
    .ib { width: 36px; height: 36px; border-radius: 10px; } .ib svg { width: 19px; height: 19px; }
    #turnBox { min-width: 0; padding: 4px 10px; } #turnTitle { font-size: 12px; } #objective { font-size: 10px; }
    #enemyBar { top: calc(50px + env(safe-area-inset-top)); } .eb { width: 44px; }
  }
  @media (prefers-reduced-motion: reduce) { .pop, #banner.show { animation-duration: .01s; } }
  /* ---------- КАМПАНИЯ: корабль, операции, брифинг ---------- */
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 50; transition: opacity .5s; }
  #fade.on { opacity: 1; }
  #toast { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); z-index: 45; padding: 8px 16px; border-radius: 12px;
    background: rgba(8, 20, 32, .94); border: 1px solid var(--holo); color: var(--txt); font-size: 13px; opacity: 0; transition: .25s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  .kicker { font-family: var(--disp); letter-spacing: 4px; font-size: 12px; color: var(--gold); }
  #startStat { color: var(--dim); font-size: 12px; margin-top: 6px; min-height: 1em; }
  #startScr { justify-content: flex-start; padding-left: calc(4vw + env(safe-area-inset-left)); background: linear-gradient(90deg, rgba(3,6,10,.82), rgba(3,6,10,.45) 45%, rgba(3,6,10,0) 70%); }
  #startScr .box { width: min(500px, 54vw); }
  #startScr h1 { font-size: clamp(26px, 9vh, 58px); }
  #startScr .lead { margin: 8px auto 12px; }

  #prologScr .box { max-width: 640px; text-align: left; }
  #prologText p { margin: 0 0 12px; font-size: clamp(13px, 3.6vh, 17px); line-height: 1.55; color: #d6e6f3; opacity: 0; animation: lineIn .8s ease-out forwards; }
  #prologText p:first-child { font-family: var(--disp); color: var(--holo); letter-spacing: 1px; }
  @keyframes lineIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .hp2 { --pad: 10px; }
  #hubScr { position: fixed; inset: 0; z-index: 9; display: none; pointer-events: none;
    padding: calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
    grid-template-columns: auto minmax(0, min(620px, 60vw)) 1fr; grid-template-rows: auto minmax(0, 1fr); gap: 8px; }
  #hubScr.show { display: grid; }
  #hubScr > * { pointer-events: auto; }
  .hubTop { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .shipName { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 8px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .shipName svg { width: 30px; height: 30px; fill: none; stroke: var(--rep); stroke-width: 1.8; }
  .shipName b { display: block; font-family: var(--disp); font-weight: 400; letter-spacing: 2px; font-size: 14px; }
  .shipName small { color: var(--dim); font-size: 11px; }
  .res { display: flex; gap: 6px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-weight: 800; font-size: 14px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .chip.cr { color: var(--gold); border-color: rgba(255,198,90,.45); }
  .chip svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }
  #hubTabs { display: flex; flex-direction: column; gap: 6px; }
  #hubTabs button { width: 74px; flex: 1; max-height: 70px; min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--dim);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10.5px; font-weight: 700; position: relative; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #hubTabs svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  #hubTabs button.on { color: #fff; border-color: var(--holo); background: linear-gradient(rgba(44,111,160,.75), rgba(16,44,66,.85)); box-shadow: 0 0 18px rgba(111,208,255,.25); }
  #hubTabs button.on::before { content: ''; position: absolute; left: -1px; top: 22%; bottom: 22%; width: 3px; border-radius: 2px; background: var(--holo); box-shadow: 0 0 8px var(--holo); }
  .holo { position: relative; border-radius: 16px; background: linear-gradient(160deg, rgba(14,28,42,.9), rgba(6,12,20,.9)); border: 1px solid var(--line);
    box-shadow: inset 0 0 40px rgba(60,150,220,.08), 0 10px 40px rgba(0,0,0,.4); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .holo::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(var(--holo), var(--holo)) 0 0 / 18px 2px, linear-gradient(var(--holo), var(--holo)) 0 0 / 2px 18px,
      linear-gradient(var(--holo), var(--holo)) 100% 100% / 18px 2px, linear-gradient(var(--holo), var(--holo)) 100% 100% / 2px 18px; background-repeat: no-repeat; opacity: .8; }

    #endScr .box { padding: 10px 14px 8px; } #endScr h2 { font-size: 22px; } .eOp { font-size: 11px; } .eStory { font-size: 11.5px; margin: 4px auto 6px; }
    .eGrid { gap: 8px; margin-bottom: 6px; } .eRew > div { font-size: 11.5px; padding: 3px 0; } .eRew .sum { font-size: 14px; }

    /* бой */

    .ib { width: 32px; height: 32px; border-radius: 9px; } .ib svg { width: 16px; height: 16px; } .tgroup { gap: 4px; }
    #turnBox { padding: 3px 9px; border-radius: 9px; } #turnTitle { font-size: 10.5px; letter-spacing: 1.5px; } #objective { font-size: 9px; margin-top: 0; }
    #squad { left: calc(8px + env(safe-area-inset-left)); bottom: calc(6px + env(safe-area-inset-bottom)); gap: 4px; }
    .card { width: 46px; padding: 3px 3px 2px; border-radius: 9px; gap: 1px; } .card canvas { height: 22px; border-radius: 5px; } .cname { font-size: 8px; }
    .hp i { height: 3px; } .ap { top: 2px; right: 3px; gap: 2px; } .ap i { width: 5px; height: 5px; } .card.sel { transform: translateY(-4px); }
    #actions { right: calc(8px + env(safe-area-inset-right)); bottom: calc(6px + env(safe-area-inset-bottom)); gap: 4px; }
    .act { width: 42px; height: 42px; border-radius: 11px; } .act svg { width: 19px; height: 19px; }
    #aUse { width: auto; min-width: 42px; padding: 0 8px; } #aUse .lbl { display: block; font-size: 8.5px; }
    #unitInfo { left: calc(8px + env(safe-area-inset-left)); bottom: calc(58px + env(safe-area-inset-bottom)); font-size: 9.5px; padding: 3px 7px; border-radius: 8px; }
    #targetPanel { bottom: calc(54px + env(safe-area-inset-bottom)); width: 200px; padding: 7px 9px; border-radius: 11px; } #tpName { font-size: 12px; } #tpChance { font-size: 26px; }
    .tp-sub { font-size: 10.5px; } .tp-nav { margin-top: 5px; } .tp-nav button { height: 32px; border-radius: 8px; }
    #enemyBar { top: calc(44px + env(safe-area-inset-top)); gap: 4px; } .eb { width: 38px; font-size: 10.5px; border-radius: 8px; } .eb .ic canvas { width: 32px; height: 19px; }
    #hint { top: calc(44px + env(safe-area-inset-top)); font-size: 10px; padding: 3px 9px; }
    #banner { font-size: clamp(18px, 7vh, 30px); }
    .ul .pips i { width: 5px; height: 4px; } .ul .st { font-size: 10px; } .ul .ch { font-size: 11px; }
  }

  /* XCOM-слой: типы заданий, «Колосс», навыки, ранения */
  .chip.doom { gap: 6px; font-size: 11px; color: #ffb3a8; border-color: rgba(255,110,90,.4); }
  .chip.doom i { display: flex; gap: 2px; } .chip.doom b { width: 5px; height: 12px; border-radius: 1px; background: rgba(255,255,255,.14); } .chip.doom b.on { background: #ff6a50; box-shadow: 0 0 5px #ff6a50; }
  .chip.doom.hot { animation: hot 1.2s ease-in-out infinite; } @keyframes hot { 50% { box-shadow: 0 0 14px rgba(255,90,60,.6); } }
  #hubTabs button.dot::after { content: ''; position: absolute; top: 5px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  .ty { position: absolute; right: 6px; bottom: 6px; padding: 2px 6px; border-radius: 6px; font: 700 10px system-ui, sans-serif; background: rgba(5,10,16,.82); color: #fff; }
  .ty-rescue { color: #ffc65a; } .ty-sabotage { color: #ff8a6a; } .ty-hack { color: #6fd0ff; } .ty-defend { color: #8fe3b0; } .ty-elim { color: #e9f3fb; }
  .ad { color: #ff9d8f; font-style: normal; font-weight: 700; font-size: .92em; }
  .lost { padding: 14px; border-radius: 14px; border: 1px solid rgba(255,110,90,.55); background: rgba(70,20,16,.55); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .lost b { font-family: var(--disp); font-weight: 400; color: #ff8a7a; letter-spacing: 1px; font-size: 18px; } .lost span { color: #e3c8c2; font-size: 12px; line-height: 1.45; }
  .perks { margin: 2px 0 8px; display: flex; flex-direction: column; gap: 5px; }
  .abil { font-size: 11px; color: var(--holo); }
  .pk small { font-size: 10px; color: var(--dim); } .pk.pend small { color: var(--gold); font-weight: 700; }
  .pk > div { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 2px; }
  .pb { text-align: left; padding: 5px 7px; border-radius: 9px; border: 1px solid var(--line); background: rgba(255,255,255,.04); display: flex; flex-direction: column; gap: 1px; }
  .pb b { font-size: 11px; } .pb span { font-size: 9.5px; color: var(--dim); line-height: 1.25; }
  .pb.on { border-color: var(--gold); background: rgba(255,198,90,.12); } .pb.on b { color: var(--gold); }
  .pk.pend .pb:not(:disabled) { border-color: var(--gold); animation: hot 1.4s ease-in-out infinite; }
  .pb:disabled:not(.on) { opacity: .45; }
  .pb em { font-style: normal; font-size: 9.5px; color: var(--gold); margin-top: 1px; } .pb.on em { color: var(--ok); }
  .frow.hurt img, .pf.hurt img { filter: grayscale(.8) sepia(.4) hue-rotate(-30deg); } .frow.hurt small, .hurtT { color: #ff9d8f; font-style: normal; }
  .frow .pp { position: absolute; right: 6px; top: 4px; font-style: normal; color: var(--gold); font-size: 12px; text-shadow: 0 0 6px var(--gold); }
  .goal { display: flex; gap: 6px; align-items: center; margin-top: 7px; padding: 5px 8px; border-radius: 9px; background: rgba(255,198,90,.1); border: 1px solid rgba(255,198,90,.35); color: #ffe2a8; font-size: 12px; font-weight: 600; }
  .goal svg { width: 16px; height: 16px; flex: none; fill: none; stroke: var(--gold); stroke-width: 2; }
  @media (max-height: 430px) {
    .chip.doom { font-size: 9.5px; gap: 4px; } .chip.doom b { width: 4px; height: 10px; }
    .ty { font-size: 8.5px; padding: 1px 4px; right: 4px; bottom: 4px; }
    .pb { padding: 3px 5px; } .pb b { font-size: 10px; } .pb span { font-size: 8.5px; } .abil { font-size: 9.5px; } .pk small { font-size: 9px; }
    .goal { font-size: 10px; padding: 3px 6px; margin-top: 4px; } .lost b { font-size: 15px; }
  }
  @media (max-width: 700px) { #hubDay { display: none; } }
</style>
