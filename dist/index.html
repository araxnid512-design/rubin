<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Рубеж</title>
<meta name="theme-color" content="#13120e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=PT+Sans+Narrow:wght@400;700&family=Rubik+Dirt&display=swap">
<style>
/* Рубеж — layout: full-bleed tactical canvas under thumb-sized HUD rails (squad left, actions right; swapped for left hand).
   Base screen = roster column + tabbed panel. Hazard-tape amber marks the two decisive buttons: end turn and head out. */
:root {
  --bg: #13120e;
  --bg-2: #191813;
  --panel: rgba(28, 26, 20, 0.9);
  --panel-solid: #1e1c16;
  --panel-2: #26231b;
  --line: #3a3528;
  --line-2: #4d4733;
  --ink: #ece4cc;
  --ink-2: #d6cfba;
  --muted: #a09781;
  --dim: #746c58;
  --amber: #e8a62b;
  --amber-2: #cf9020;
  --amber-ink: #1b1406;
  --rust: #c9472f;
  --rust-ink: #ffb3a3;
  --moss: #86a85d;
  --moss-ink: #cfe3b5;
  --toxic: #a4d03c;
  --warn-ink: #f0c46a;
  --scrim: rgba(8, 7, 5, 0.62);
  --f-title: "Rubik Dirt", "Oswald", Impact, sans-serif;
  --f-ui: "Oswald", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "PT Sans Narrow", "Arial Narrow", "Roboto Condensed", sans-serif;
  --r: 5px;
  --gut-l: max(10px, env(safe-area-inset-left, 0px));
  --gut-r: max(10px, env(safe-area-inset-right, 0px));
  --gut-t: max(6px, env(safe-area-inset-top, 0px));
  --gut-b: max(6px, env(safe-area-inset-bottom, 0px));
  color-scheme: dark;
}
html { font-size: 15px; height: 100%; background: var(--bg); }
body {
  height: 100%; margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 1rem; line-height: 1.3;
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
#app { position: fixed; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; transform-origin: 0 0; background: var(--bg); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.screen { position: absolute; inset: 0; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; touch-action: manipulation; }
.ic { width: 1.15em; height: 1.15em; flex: none; display: inline-block; vertical-align: -0.2em; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* ----- кнопки ----- */
.btn {
  font-family: var(--f-ui); font-weight: 500; font-size: 0.95rem; letter-spacing: 0.04em; text-transform: uppercase;
  min-height: 2.75rem; padding: 0.35rem 0.95rem; border: 1px solid var(--line-2); border-radius: var(--r);
  background: var(--panel-2); color: var(--ink); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); }
.btn.danger { border-color: var(--rust); color: var(--rust-ink); background: transparent; }
.btn.hazard {
  color: var(--amber-ink); border: 0; font-weight: 600;
  background: repeating-linear-gradient(-45deg, var(--amber) 0 12px, var(--amber-2) 12px 24px);
  box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.22);
}
.btn.sm { min-height: 2.3rem; padding: 0.2rem 0.7rem; font-size: 0.82rem; }
.btn.big { min-height: 3.3rem; font-size: 1.1rem; }
.hbtn {
  width: 2.6rem; height: 2.6rem; flex: none; display: grid; place-items: center; cursor: pointer;
  border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 0;
}
.hbtn .ic { width: 1.3rem; height: 1.3rem; }

/* ----- меню ----- */
#scr-menu { display: flex; align-items: stretch; }
.menu-in {
  display: flex; flex-direction: column; justify-content: center; gap: 0.9rem; max-width: 26rem;
  padding: var(--gut-t) 1.5rem var(--gut-b) max(1.6rem, env(safe-area-inset-left, 0px));
}
.logo { margin: 0; font-family: var(--f-title); font-weight: 400; font-size: clamp(3rem, 15vh, 5.6rem); line-height: 0.9; color: var(--ink); letter-spacing: 0.02em; }
.logo::after { content: ""; display: block; height: 0.55rem; width: 8.5rem; margin-top: 0.55rem; background: repeating-linear-gradient(-45deg, var(--amber) 0 10px, var(--bg) 10px 20px); }
.tagline { margin: 0; color: var(--ink-2); font-size: 1.02rem; max-width: 34ch; }
.mbtns { display: flex; flex-direction: column; gap: 0.45rem; width: min(17rem, 100%); }
.ver { margin: 0; font-size: 0.78rem; color: var(--dim); }

/* ----- убежище ----- */
#scr-base { background: transparent; display: flex; flex-direction: column; pointer-events: none; }
#scr-base .bbar, #scr-base .survs, #scr-base .dock-p, #scr-base .rail { pointer-events: auto; }
.bbar {
  display: flex; align-items: center; gap: 0.8rem; background: rgba(19, 18, 14, 0.9); border-bottom: 1px solid var(--line);
  padding: var(--gut-t) var(--gut-r) 0.35rem var(--gut-l);
}
.brand { font-family: var(--f-title); font-size: 1.55rem; color: var(--amber); line-height: 1; }
.day { display: flex; align-items: baseline; gap: 0.3rem; font-family: var(--f-ui); }
.day span { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; }
.day b { font-size: 1.4rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.day small { color: var(--dim); font-size: 0.78rem; }
.resrow { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.15rem 0.6rem; flex: 1; min-width: 0; }
.res { display: inline-flex; align-items: center; gap: 0.2rem; font-family: var(--f-ui); font-variant-numeric: tabular-nums; }
.res .ic { color: var(--rc); }
.res b { font-weight: 500; min-width: 1.1em; }
.res.low b { color: #ff8a70; }
.bmain { flex: 1; min-height: 0; display: flex; }
.survs {
  width: min(15.5rem, 31vw); flex: none; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line);
  padding: 0.45rem 0.5rem 0 var(--gut-l); background: linear-gradient(90deg, rgba(19, 18, 14, 0.93), rgba(19, 18, 14, 0.84));
}
.survs h2 { margin: 0 0 0.35rem; display: flex; align-items: baseline; gap: 0.4rem; font-family: var(--f-ui); font-weight: 500; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
.survs h2 span { color: var(--ink); }
.survs h2 small { margin-left: auto; font-size: 0.7rem; letter-spacing: 0.02em; text-transform: none; color: var(--dim); font-family: var(--f-body); }
.bview { flex: 1; min-width: 0; }
.bact { display: flex; flex-direction: column; gap: 0.35rem; padding: 0.45rem 0 var(--gut-b); border-top: 1px solid var(--line); }
.bact .btn { width: 100%; }
.bact .btn.big { min-height: 3rem; font-size: 1.02rem; }
.dock { display: flex; align-items: stretch; flex: none; }
.dock-p { width: min(23rem, 44vw); display: flex; flex-direction: column; min-height: 0; background: rgba(24, 22, 17, 0.95); border-left: 1px solid var(--line); }
.dock-p > header { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.25rem 0.4rem 0.25rem 0.75rem; border-bottom: 1px solid var(--line); }
.dock-p h2 { margin: 0; font-family: var(--f-ui); font-weight: 500; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.1em; }
.rail { display: flex; flex-direction: column; gap: 0.3rem; padding: 0.45rem var(--gut-r) var(--gut-b) 0.4rem; background: rgba(19, 18, 14, 0.9); border-left: 1px solid var(--line); }
.rail button {
  width: 3.5rem; min-height: 3.3rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.15rem; cursor: pointer;
  font-family: var(--f-ui); font-weight: 500; font-size: 0.56rem; text-transform: uppercase; letter-spacing: 0.03em; line-height: 1.05;
  color: var(--ink-2); background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r);
}
.rail button.on { color: var(--amber-ink); background: var(--amber); border-color: var(--amber); }
.chip-tr {
  display: inline-flex; align-items: center; gap: 0.3rem; min-height: 2.2rem; padding: 0.15rem 0.6rem; cursor: pointer;
  font-family: var(--f-ui); font-size: 0.8rem; color: var(--rust-ink); background: rgba(201, 71, 47, 0.14); border: 1px solid var(--rust); border-radius: var(--r);
}
.chip-tr.now { background: var(--rust); color: #fff3e8; }
.bld.hl { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
.facs { display: flex; flex-direction: column; gap: 0.45rem; }
.fac { display: flex; flex-direction: column; gap: 0.3rem; padding: 0.55rem 0.65rem; border-radius: var(--r); border: 1px solid var(--line); border-left: 4px solid var(--fc); background: var(--panel-2); }
.fac p { margin: 0; font-size: 0.86rem; }
.fac.off { opacity: 0.6; }
.fst { font-family: var(--f-ui); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fc); }
.fmeta { color: var(--muted); }
.fac .warn { color: var(--warn-ink); }
.fac .ok { color: var(--moss); }
/* ----- карта округи ----- */
#scr-world { background: var(--bg); display: flex; flex-direction: column; }
.wbar { display: flex; align-items: center; gap: 0.7rem; padding: var(--gut-t) var(--gut-r) 0.35rem var(--gut-l); background: var(--bg-2); border-bottom: 1px solid var(--line); }
.wbar h2 { margin: 0; font-family: var(--f-ui); font-weight: 500; font-size: 1.05rem; text-transform: uppercase; letter-spacing: 0.08em; }
.wsub { color: var(--dim); font-size: 0.85rem; margin-right: auto; }
.wmain { flex: 1; min-height: 0; display: flex; }
.wmap { flex: 1; min-width: 0; position: relative; }
.wmap canvas { position: absolute; left: 0; top: 0; display: block; cursor: pointer; touch-action: manipulation; }
.wcard { width: min(21rem, 42vw); flex: none; overflow-y: auto; display: flex; flex-direction: column; gap: 0.4rem; padding: 0.55rem var(--gut-r) var(--gut-b) 0.7rem; border-left: 1px solid var(--line); background: var(--bg-2); }
.wc-h { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
.wc-h b { font-family: var(--f-ui); font-weight: 500; font-size: 1.15rem; line-height: 1.15; }
.wc-m { margin: 0; font-size: 0.82rem; color: var(--dim); }
.wc-f { margin: 0; display: flex; align-items: center; gap: 0.35rem; color: var(--fc); font-family: var(--f-ui); font-size: 0.9rem; }
.wc-d { margin: 0; font-size: 0.9rem; color: var(--ink-2); }
.wcard h3 { margin: 0.2rem 0 0; font-family: var(--f-ui); font-weight: 500; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.wcard h3 span { color: var(--ink); }
.wsq { display: grid; grid-template-columns: 1fr 1fr; gap: 0.3rem; }
.wsq-b { text-align: left; display: flex; flex-direction: column; gap: 0.1rem; min-height: 2.75rem; padding: 0.3rem 0.45rem; cursor: pointer; color: var(--ink); border-radius: var(--r); border: 1px solid var(--line); border-left: 3px solid var(--uc); background: var(--panel-2); }
.wsq-b b { font-family: var(--f-ui); font-weight: 500; font-size: 0.92rem; }
.wsq-b span { font-size: 0.72rem; color: var(--muted); }
.wsq-b.on { border-color: var(--amber); border-left-color: var(--uc); background: #2e2919; }
.wsq-b.inf span { color: var(--toxic); }
.wcard .warn { margin: 0; color: var(--warn-ink); font-size: 0.85rem; }
.wcard .btn.big { margin-top: auto; min-height: 3rem; }
.hint { color: var(--dim); }
.need { margin: 0.1rem 0 0.4rem; font-size: 0.8rem; color: var(--dim); }
.slist { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.4rem; padding-bottom: var(--gut-b); }
.sw { display: flex; flex-direction: column; gap: 0.25rem; }
.sc {
  text-align: left; display: grid; grid-template-columns: 2.9rem minmax(0, 1fr); gap: 0.25rem 0.6rem; align-items: center; cursor: pointer;
  padding: 0.4rem 0.55rem 0.4rem 0.5rem; border-radius: var(--r);
  background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--uc);
}
.sc > :not(.pt) { grid-column: 2; }
.pt {
  grid-row: 1 / span 4; width: 2.9rem; height: 3.5rem; align-self: stretch; border-radius: 4px;
  background: radial-gradient(ellipse at 50% 30%, rgba(236, 228, 204, 0.12), transparent 70%), rgba(0, 0, 0, 0.28);
}
.sc.sel { border-color: var(--amber); border-left-color: var(--uc); background: #2e2919; }
.sc.inf { background: linear-gradient(90deg, rgba(164, 208, 60, 0.09), transparent 60%), var(--panel-2); }
.sc-top { display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; }
.sc-top b { font-family: var(--f-ui); font-weight: 500; font-size: 1rem; }
.trait { font-style: normal; font-size: 0.72rem; color: var(--muted); border: 1px solid var(--line-2); padding: 0 0.3rem; border-radius: 3px; }
.lvl { font-style: normal; display: inline-flex; align-items: center; gap: 0.1rem; font-size: 0.75rem; color: var(--amber); }
.lvl .ic { width: 0.8rem; height: 0.8rem; }
.sq { font-style: normal; margin-left: auto; font-family: var(--f-ui); font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.08em; background: var(--amber); color: var(--amber-ink); padding: 0.05rem 0.35rem; border-radius: 3px; }
.sc-meta { font-size: 0.82rem; color: var(--muted); }
.sc-inf { font-size: 0.82rem; color: var(--toxic); display: flex; align-items: center; gap: 0.3rem; }
.cure { align-self: flex-start; }
.cure-hint { font-size: 0.76rem; color: var(--dim); }
.bar { display: block; height: 0.32rem; background: rgba(0, 0, 0, 0.5); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--moss); }
.bar.lowhp i { background: var(--rust); }
.bpanel { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tabs { display: flex; gap: 0.2rem; padding: 0.35rem var(--gut-r) 0 0.7rem; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button {
  display: inline-flex; align-items: center; gap: 0.35rem; min-height: 2.6rem; padding: 0.4rem 0.6rem; cursor: pointer; white-space: nowrap;
  background: none; border: 0; border-bottom: 2px solid transparent;
  font-family: var(--f-ui); font-size: 0.88rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;
}
.tabs button.on { color: var(--ink); border-bottom-color: var(--amber); }
.tabc { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 0.55rem; padding: 0.6rem var(--gut-r) var(--gut-b) 0.7rem; }
.locs { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.6rem, 1fr)); gap: 0.45rem; }
.loc {
  text-align: left; display: flex; flex-direction: column; gap: 0.2rem; cursor: pointer;
  padding: 0.5rem 0.6rem; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel-2);
}
.loc.sel { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
.loc.locked { opacity: 0.5; cursor: default; }
.loc-h { display: flex; justify-content: space-between; align-items: center; }
.loc-h b { font-family: var(--f-ui); font-weight: 500; font-size: 1.1rem; }
.dng { display: inline-flex; gap: 3px; }
.dng i { width: 0.45rem; height: 0.45rem; background: var(--line-2); transform: rotate(45deg); }
.dng i.on { background: var(--rust); }
.loc-n { font-size: 0.84rem; color: var(--ink-2); }
.loc-m { font-size: 0.78rem; color: var(--dim); font-variant-numeric: tabular-nums; }
.loc-l { display: flex; gap: 0.35rem; }
.loc-l i { color: var(--rc); }
.lock { font-family: var(--f-ui); font-size: 0.72rem; color: var(--amber); text-transform: uppercase; letter-spacing: 0.06em; }
.loc-d { margin: 0; color: var(--ink-2); font-size: 0.92rem; max-width: 62ch; }
.sortie-f {
  display: flex; align-items: center; gap: 0.5rem; border-top: 1px solid var(--line); background: var(--bg-2);
  padding: 0.45rem var(--gut-r) var(--gut-b) 0.7rem;
}
.sq-list { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 0.9rem; line-height: 1.25; }
.sq-list b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sq-list span { color: var(--muted); }
.sq-list .warn { color: var(--warn-ink); }
.blds { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: 0.45rem; }
.bld { display: flex; flex-direction: column; gap: 0.3rem; padding: 0.55rem 0.65rem; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel-2); }
.bld-h { display: flex; justify-content: space-between; align-items: center; }
.bld-h b { font-family: var(--f-ui); font-weight: 500; font-size: 1rem; }
.lv { display: inline-flex; gap: 3px; }
.lv i { width: 0.9rem; height: 0.35rem; background: var(--line-2); border-radius: 1px; }
.lv i.on { background: var(--amber); }
.bld p { margin: 0; font-size: 0.86rem; }
.bld .next { color: var(--muted); }
.bld .max { color: var(--moss); }
.bld-f { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.4rem; margin-top: auto; }
.cost { display: inline-flex; gap: 0.3rem; flex-wrap: wrap; }
.cc {
  display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.1rem 0.45rem; border-radius: 3px;
  font-family: var(--f-ui); font-size: 0.85rem; font-variant-numeric: tabular-nums;
  background: rgba(255, 255, 255, 0.05); color: var(--rc, var(--ink));
}
.cost .cc { color: var(--ink); }
.cc.miss, .cost .cc.miss { color: #ff9b85; background: rgba(201, 71, 47, 0.13); }
.crafts { display: flex; flex-direction: column; gap: 0.4rem; }
.rc { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 0.6rem; padding: 0.5rem 0.65rem; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel-2); }
.rc-t { display: flex; flex-direction: column; min-width: 0; }
.rc-t b { font-family: var(--f-ui); font-weight: 500; }
.rc-t span { font-size: 0.82rem; color: var(--muted); }
.perks h3 { margin: 0.2rem 0; font-family: var(--f-ui); font-weight: 500; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.perks ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.2rem; font-size: 0.9rem; color: var(--dim); }
.perks li.on { color: var(--ink); }
.perks p { margin: 0.3rem 0 0; font-size: 0.84rem; color: var(--moss); }
.journal { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.4rem; }
.journal li { font-size: 0.92rem; padding-left: 0.6rem; border-left: 2px solid var(--line-2); max-width: 70ch; }
.journal li span { display: block; font-family: var(--f-ui); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim); }
.journal li.bad { border-color: var(--rust); }
.journal li.good { border-color: var(--moss); }

/* ----- бой ----- */
#scr-tac { pointer-events: none; }
#scr-tac .pop, #scr-tac .sheet-bg { pointer-events: auto; }
.hud {
  position: absolute; inset: 0; pointer-events: none; display: grid; gap: 0.4rem;
  grid-template-columns: 8.6rem minmax(0, 1fr) 4.9rem; grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top top top" "squad mid acts" "squad log acts";
  padding: var(--gut-t) var(--gut-r) var(--gut-b) var(--gut-l);
}
body.lefty .hud { grid-template-columns: 4.9rem minmax(0, 1fr) 8.6rem; grid-template-areas: "top top top" "acts mid squad" "acts log squad"; }
.hud > * { pointer-events: auto; min-height: 0; min-width: 0; }
.hud-top { grid-area: top; display: flex; align-items: center; gap: 0.35rem; pointer-events: none; }
.hud-top > * { pointer-events: auto; }
.hud-top .grow { flex: 1; pointer-events: none; }
.chip {
  display: inline-flex; align-items: center; gap: 0.35rem; height: 2.3rem; padding: 0 0.65rem; white-space: nowrap;
  border-radius: var(--r); background: var(--panel); border: 1px solid var(--line);
  font-family: var(--f-ui); font-size: 0.86rem; letter-spacing: 0.02em;
}
.chip b { font-weight: 600; font-variant-numeric: tabular-nums; }
.chip.tod1 { color: #e6b7d0; }

<script>
'use strict';
// ---------- Общие утилиты ----------

const rnd = Math.random;
function rint(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }

// Детерминированный ГСЧ (mulberry32) для генерации карт
function makeRng(seed) {
  let a = seed >>> 0;
  const f = () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

// Хэш клетки -> [0,1) для визуальных вариаций
function hash2(x, y, s) {

  return (h >>> 0) / 4294967296;

};

  const w = [['walker', 10]];
  if (day >= 3 || threat >= 2) w.push(['runner', 2 + day / 3 + threat]);
  if (day >= 4 || threat >= 3) w.push(['screamer', 1.2 + threat * 0.3]);

  let tot = w.reduce((a, b) => a + b[1], 0), v = rnd() * tot;
  for (const [k, p] of w) { if ((v -= p) < 0) return k; }

}

  const cands = [];

    if (!TP[m.tiles[MI(m, xx, yy)]].floor || !touchesWall(m, xx, yy) || nearDoor(m, xx, yy, 1)) continue;
    cands.push([xx, yy]);
  }
  shuffle(cands, r);
  for (const [xx, yy] of cands) {
    if (n <= 0) break;
    if (!TP[m.tiles[MI(m, xx, yy)]].floor || furnAround(m, xx, yy) > 1) continue;
    placeItem(m, r, xx, yy, r.pick(pal));
    n--;
  }
}
function furnish(m, r, b, pal, per = 10) {
  for (const rm of b.rooms) furnishRoom(m, r, rm, pal, Math.max(1, Math.round(rm.w * rm.h / per)));
}

function placeStart(m, r, x, y) {
  addProp(m, 'car', x, y, 2, 3, { c: '#8a3424', start: true, v: 1 });
  m.start = { x: x + 1, y: y + 1 };
  m.evac = [];
  for (let yy = y - 2; yy <= y + 4; yy++) for (let xx = x - 2; xx <= x + 3; xx++) {
    if (!inb(m, xx, yy)) continue;
    const i = MI(m, xx, yy);
    if (TP[m.tiles[i]].walk) m.evac.push(i);
  }
}
function baseGround(m, a, b, sc, thr) {
  for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) put(m, x, y, vnoise(m.seed, x, y, sc) > thr ? b : a);
}
function scatterGreen(m, r, pTree, pBush, belt = 2) {
  for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
    const i = MI(m, x, y);
    if (m.resv[i]) continue;
    const t = m.tiles[i];
    if (t !== T.GRASS && t !== T.DIRT) continue;
    const d = Math.min(x, y, m.w - 1 - x, m.h - 1 - y);
    if (d < belt && r() < 0.5) put(m, x, y, T.TREE);
    else if (vnoise(m.seed + 7, x, y, 5) > 0.76 && r() < 0.55) put(m, x, y, T.TREE);
    else if (r() < pTree) put(m, x, y, T.TREE);
    else if (r() < pBush) put(m, x, y, T.BUSH);
  }
}
function fenceLine(m, x0, y0, x1, y1, meta, gapEvery = 0) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
  for (let k = 0; k <= n; k++) {
    const x = x0 + Math.sign(x1 - x0) * k, y = y0 + Math.sign(y1 - y0) * k;
    if (gapEvery && k % gapEvery >= gapEvery - 2) continue;
    if (!inb(m, x, y)) continue;
    const i = MI(m, x, y);
    if (!TP[m.tiles[i]].floor) continue;
    m.tiles[i] = T.FENCE; m.meta[i] = meta;
  }
}

// ----- Ферма -----
function genFarm(m, r) {
  const W = m.w, H = m.h;
  baseGround(m, T.GRASS, T.DIRT, 7, 0.72);
  const rx = r.int(27, 33), ry = r.int(24, 30);
  reserve(m, rx - 3, H - 11, 9, 11);
  groundRect(m, rx, 0, 3, H, T.DIRT);
  for (let y = 0; y < H; y++) { m.meta[MI(m, rx, y)] |= 2; m.meta[MI(m, rx + 2, y)] |= 2; }
  groundRect(m, 3, ry, W - 6, 3, T.DIRT);
  for (let x = 3; x < W - 3; x++) if (x < rx || x > rx + 2) { m.meta[MI(m, x, ry)] |= 4; m.meta[MI(m, x, ry + 2)] |= 4; }
  reserve(m, rx - 1, 0, 5, H); reserve(m, 2, ry - 1, W - 4, 5);

  const side = r() < 0.5 ? -1 : 1;
  const hw = r.int(13, 16), hh = r.int(9, 11);
  const hx = side < 0 ? rx - 2 - hw - r.int(0, 3) : rx + 5 + r.int(0, 3), hy = ry - hh - r.int(2, 4);
  const house = building(m, r, hx, hy, hw, hh, { wall: T.WWALL, floor: T.WOOD, minRoom: 3, maxDepth: 3, doors: 2, windows: 5, doorSides: side < 0 ? ['e', 's'] : ['w', 's'] });
  furnish(m, r, house, ['fridge', 'pantry', 'desk', 'furn:bed', 'furn:table', 'furn:sofa', 'locker', 'gun', 'medcab', 'pantry'], 8);

  const bw = r.int(14, 17), bh = r.int(10, 12);
  const bx = side < 0 ? rx + 5 + r.int(0, 3) : rx - 2 - bw - r.int(0, 3), by = ry - bh - r.int(2, 4);
  const barn = building(m, r, bx, by, bw, bh, { wall: T.WWALL, floor: T.DIRT, split: false, doors: 1, doorSides: ['n'] });
  opening(m, barn, side < 0 ? 'w' : 'e', 3);
  for (let k = 0; k < 3; k++) {
    const hx2 = r.int(bx + 2, bx + bw - 5), hy2 = r.int(by + 2, by + bh - 4);
    if (clearRect(m, hx2 - 1, hy2 - 1, 4, 4)) for (let yy = 0; yy < 2; yy++) for (let xx = 0; xx < 2; xx++) put(m, hx2 + xx, hy2 + yy, T.HAY);
  }
  furnish(m, r, barn, ['seeds', 'crate', 'drum', 'toolbox', 'seeds', 'pallet'], 14);

  const yard = { x0: Math.min(hx, bx) - 6, y0: 3, x1: Math.max(hx + hw, bx + bw) + 6, y1: ry - 1 };
  for (let k = 0; k < 3; k++) {
    const sp = findSpot(m, r, 5, 5, yard, 1);
    if (!sp) continue;
    const sh = building(m, r, sp.x, sp.y, 5, 5, { wall: T.WWALL, floor: T.DIRT, split: false, doors: 1 });
    furnish(m, r, sh, ['crate', 'drum', 'toolbox', 'pallet'], 4);
  }
  let sp = findSpot(m, r, 3, 3, yard, 1); if (sp) addProp(m, 'silo', sp.x, sp.y, 3, 3, { tall: true });
  sp = findSpot(m, r, 1, 1, { x0: hx - 4, y0: hy - 4, x1: hx + hw + 4, y1: hy + hh + 4 }, 1); if (sp) { addCont(m, r, sp.x, sp.y, 'well'); reserve(m, sp.x, sp.y, 1, 1); }
  sp = findSpot(m, r, 2, 3, { x0: rx - 10, y0: ry + 4, x1: rx + 12, y1: ry + 16 }, 1); if (sp) addProp(m, 'tractor', sp.x, sp.y, 2, 3, { c: '#3d6b3a', v: 1 });
  sp = findSpot(m, r, 4, 2, yard, 1); if (sp) addCar(m, r, sp.x, sp.y, false, 'car', 'trunk', 0.8);

  // пруд
  sp = findSpot(m, r, 8, 6, { x0: 2, y0: 2, x1: W - 2, y1: H - 2 }, 1);
  if (sp && r() < 0.7) {
    for (let yy = 0; yy < 6; yy++) for (let xx = 0; xx < 8; xx++) if (((xx - 3.5) / 4) ** 2 + ((yy - 2.5) / 3) ** 2 < 1) put(m, sp.x + xx, sp.y + yy, T.WATER);
    reserve(m, sp.x, sp.y, 8, 6);
  }
  // поля
  for (let k = 0; k < 16; k++) {
    const fw = r.int(9, 20), fh = r.int(7, 15);
    const f = findSpot(m, r, fw, fh, { x0: 2, y0: 2, x1: W - 2, y1: H - 2 }, 1);
    if (!f) continue;
    const corn = r() < 0.55 ? 1 : 0;
    for (let yy = 0; yy < fh; yy++) for (let xx = 0; xx < fw; xx++) {
      setGround(m, f.x + xx, f.y + yy, T.DIRT);
      if (yy % 7 === 6) continue;
      put(m, f.x + xx, f.y + yy, T.CROP);
      m.meta[MI(m, f.x + xx, f.y + yy)] = corn;
    }
    if (r() < 0.6) fenceLine(m, f.x - 1, f.y - 1, f.x + fw, f.y - 1, 0, 7);
    if (r() < 0.4) fenceLine(m, f.x - 1, f.y + fh, f.x + fw, f.y + fh, 0, 7);
    reserve(m, f.x - 1, f.y - 1, fw + 2, fh + 2);
  }
  scatterGreen(m, r, 0.01, 0.025);
  placeStart(m, r, rx, H - 7);
}

// Квартал райцентра: кирпичные магазины, конторы и аптека вдоль улиц
function townBlock(m, r, x0, y0, x1, y1) {
  groundRect(m, x0, y0, x1 - x0 + 1, y1 - y0 + 1, T.SIDEWALK);
  const kinds = [
    ['mshelf', 'mshelf', 'register', 'cooler', 'foodcrate'],
    ['medcab', 'medcab', 'register', 'shelf'],
    ['desk', 'desk', 'locker', 'shelf', 'furn:table'],
    ['shelf', 'toolbox', 'crate', 'register'],
    ['fridge', 'furn:table', 'furn:counter', 'pantry', 'register'],
  ];
  for (let k = 0; k < 4; k++) {
    const bw = r.int(9, 14), bh = r.int(8, 10);
    const sp = findSpot(m, r, bw, bh, { x0: x0 + 1, y0: y0 + 1, x1: x1 - 1, y1: y1 - 1 }, 1, 60);
    if (!sp) continue;
    const b = building(m, r, sp.x, sp.y, bw, bh, { wall: T.BRICK, floor: r() < 0.5 ? T.TILE : T.WOOD, minRoom: 4, maxDepth: 2, doors: 2, windows: 6 });
    const pal = r.pick(kinds);
    furnish(m, r, b, pal, 7);
  }
}

// ----- Посёлок -----
function genSuburb(m, r) {
  const W = m.w, H = m.h;
  baseGround(m, T.GRASS, T.DIRT, 6, 0.75);
  const vx = [r.int(12, 16), r.int(36, 42)], hy = [r.int(11, 15), r.int(34, 40)];
  for (const x of vx) { groundRect(m, x, 0, 3, H, T.ASPHALT); for (let y = 0; y < H; y++) m.meta[MI(m, x + 1, y)] |= 2; }
  for (const y of hy) { groundRect(m, 0, y, W, 3, T.ASPHALT); for (let x = 0; x < W; x++) m.meta[MI(m, x, y + 1)] |= 4; }
  for (const x of vx) for (const y of hy) for (let yy = y; yy < y + 3; yy++) for (let xx = x; xx < x + 3; xx++) m.meta[MI(m, xx, yy)] &= ~6;
  // тротуары
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (m.ground[MI(m, x, y)] === T.ASPHALT) continue;
    let near = false;
    for (const [dx, dy] of DIR8) { const nx = x + dx, ny = y + dy; if (inb(m, nx, ny) && m.ground[MI(m, nx, ny)] === T.ASPHALT) near = true; }
    if (near) put(m, x, y, T.SIDEWALK);
  }
  for (const x of vx) reserve(m, x - 1, 0, 5, H);
  for (const y of hy) reserve(m, 0, y - 1, W, 5);
  reserve(m, vx[0] - 3, H - 11, 9, 11);
  const xs = [[1, vx[0] - 2], [vx[0] + 4, vx[1] - 2], [vx[1] + 4, W - 2]];
  const ys = [[1, hy[0] - 2], [hy[0] + 4, hy[1] - 2], [hy[1] + 4, H - 2]];
  for (const [x0, x1] of xs) for (const [y0, y1] of ys) {
    if (m.v === 1) { townBlock(m, r, x0, y0, x1, y1); continue; }
    for (let k = 0; k < 5; k++) {
      const dacha = m.v === 2;
      const hw = dacha ? r.int(5, 7) : r.int(8, 12), hh = dacha ? r.int(5, 6) : r.int(7, 9);
      const sp = findSpot(m, r, hw, hh, { x0: x0 + 2, y0: y0 + 2, x1: x1 - 2, y1: y1 - 2 }, 3, 60);
      if (!sp) continue;
      const brick = !dacha && r() < 0.5;
      const hb = building(m, r, sp.x, sp.y, hw, hh, { wall: brick ? T.BRICK : T.WWALL, floor: r() < 0.6 ? T.WOOD : T.TILE, minRoom: 3, maxDepth: dacha ? 1 : 3, doors: r.int(1, 2), windows: dacha ? 2 : 4 });
      if (dacha) furnish(m, r, hb, ['pantry', 'furn:bed', 'toolbox', 'seeds', 'furn:table', 'drum', 'fridge'], 6);
      else furnish(m, r, hb, ['fridge', 'pantry', 'desk', 'furn:bed', 'furn:sofa', 'furn:table', 'locker', 'medcab', 'shelf', 'gun', 'furn:bed'], 9);
      if (dacha) for (let g = 0; g < 2; g++) {
        const gx = sp.x + (g ? hw - 4 : 0), gy = sp.y + hh + 1;
        if (!isFree(m, gx, gy, 4, 2)) continue;
        for (let yy = 0; yy < 2; yy++) for (let xx = 0; xx < 4; xx++) { setGround(m, gx + xx, gy + yy, T.DIRT); put(m, gx + xx, gy + yy, T.CROP); m.meta[MI(m, gx + xx, gy + yy)] = 0; }
      }
      // забор вокруг двора с калитками у дверей
      const fx = sp.x - 2, fy = sp.y - 2, fw = hw + 4, fh = hh + 4, meta = r() < 0.5 ? 0 : 2;
      const gates = hb.doors.filter(d => d.x === sp.x || d.y === sp.y || d.x === sp.x + hw - 1 || d.y === sp.y + hh - 1);
      for (let k2 = 0; k2 < fw; k2++) for (const yy of [fy, fy + fh - 1]) {
        const xx = fx + k2;
        if (gates.some(g => Math.abs(g.x - xx) <= 1) || r() < 0.08) continue;
        if (inb(m, xx, yy) && TP[m.tiles[MI(m, xx, yy)]].floor) { put(m, xx, yy, T.FENCE); m.meta[MI(m, xx, yy)] = meta; }
      }
      for (let k2 = 1; k2 < fh - 1; k2++) for (const xx of [fx, fx + fw - 1]) {
        const yy = fy + k2;
        if (gates.some(g => Math.abs(g.y - yy) <= 1) || r() < 0.08) continue;
        if (inb(m, xx, yy) && TP[m.tiles[MI(m, xx, yy)]].floor) { put(m, xx, yy, T.FENCE); m.meta[MI(m, xx, yy)] = meta; }
      }
      reserve(m, fx, fy, fw, fh);
    }
    const g = findSpot(m, r, 6, 5, { x0: x0 + 1, y0: y0 + 1, x1: x1 - 1, y1: y1 - 1 }, 1, 40);
    if (g) {
      const gb = building(m, r, g.x, g.y, 6, 5, { wall: T.BRICK, floor: T.CONCRETE, split: false, doors: 0 });
      opening(m, gb, r.pick(['n', 's']), 3);
      furnish(m, r, gb, ['crate', 'drum', 'toolbox', 'pallet'], 4);
    }
  }
  // машины на дорогах
  for (let k = 0; k < 9; k++) {
    if (r() < 0.5) {
      const x = r.pick(vx) + r.int(0, 1), y = r.int(2, H - 16);
      let ok = true;
      for (let yy = y; yy < y + 4; yy++) for (let xx = x; xx < x + 2; xx++) if (m.tiles[MI(m, xx, yy)] !== T.ASPHALT) ok = false;
      if (ok) addCar(m, r, x, y, true);
    } else {
      const y = r.pick(hy) + r.int(0, 1), x = r.int(2, W - 6);
      let ok = true;
      for (let yy = y; yy < y + 2; yy++) for (let xx = x; xx < x + 4; xx++) if (m.tiles[MI(m, xx, yy)] !== T.ASPHALT) ok = false;
      if (ok) addCar(m, r, x, y, false);
    }
  }
  for (let k = 0; k < (m.v === 1 ? 90 : 40); k++) {
    const x = r.int(1, W - 2), y = r.int(1, H - 14), i = MI(m, x, y);
    if ((m.tiles[i] === T.ASPHALT || m.tiles[i] === T.SIDEWALK) && !m.resv[i] && r() < 0.5) put(m, x, y, T.RUBBLE);
  }
  scatterGreen(m, r, m.v === 1 ? 0.01 : 0.035, m.v === 1 ? 0.015 : 0.035, 1);
  placeStart(m, r, vx[0], H - 7);
}

// ----- Завод -----
function genFactory(m, r) {
  const W = m.w, H = m.h;
  baseGround(m, T.GRASS, T.DIRT, 6, 0.55);
  const fx0 = 3, fy0 = 3, fx1 = W - 4, fy1 = H - 11;
  groundRect(m, fx0, fy0, fx1 - fx0 + 1, fy1 - fy0 + 1, T.ASPHALT);
  const gx = r.int(22, 32);
  for (let x = fx0; x <= fx1; x++) {
    put(m, x, fy0, T.FENCE); m.meta[MI(m, x, fy0)] = 1;
    if (x < gx || x >= gx + 4) { put(m, x, fy1, T.FENCE); m.meta[MI(m, x, fy1)] = 1; }
  }
  const sgy = r.int(fy0 + 8, fy1 - 10), sgx = r() < 0.5 ? fx0 : fx1;
  for (let y = fy0; y <= fy1; y++) for (const x of [fx0, fx1]) {
    if (x === sgx && y >= sgy && y < sgy + 3) continue;
    put(m, x, y, T.FENCE); m.meta[MI(m, x, y)] = 1;
  }
  reserve(m, fx0 - 1, fy0 - 1, fx1 - fx0 + 3, 3); reserve(m, fx0 - 1, fy1 - 1, fx1 - fx0 + 3, 3);
  reserve(m, fx0 - 1, fy0 - 1, 3, fy1 - fy0 + 3); reserve(m, fx1 - 1, fy0 - 1, 3, fy1 - fy0 + 3);
  groundRect(m, gx, fy1, 4, H - fy1, T.ASPHALT);
  for (let y = fy1 + 1; y < H; y++) m.meta[MI(m, gx + 1, y)] |= 2;
  reserve(m, gx - 1, fy1 - 3, 6, H - fy1 + 3);
  reserve(m, gx - 3, H - 11, 10, 11);
  for (let y = sgy; y < sgy + 3; y++) for (let x = (sgx === fx0 ? 0 : fx1); x <= (sgx === fx0 ? fx0 : W - 1); x++) setGround(m, x, y, T.ASPHALT);
  const area = { x0: fx0 + 2, y0: fy0 + 2, x1: fx1 - 1, y1: fy1 - 2 };
  if (m.v === 1) {
    // пути и вагоны вдоль северного забора
    for (const ry of [fy0 + 3, fy0 + 7]) {
      for (let x = fx0 + 1; x < fx1; x++) for (let yy = ry; yy < ry + 2; yy++) { setGround(m, x, yy, T.DIRT); m.meta[MI(m, x, yy)] = yy === ry ? 16 : 32; }
      let x = fx0 + 2 + r.int(0, 4);
      while (x + 8 < fx1 - 1) {
        if (r() < 0.75) {
          const p = addProp(m, 'wagon', x, ry, 8, 2, { c: r.pick(['#6a3a2a', '#4a5a6a', '#5a4a3a', '#7a6a4a']), v: 0, f: 0, tall: true });
          if (r() < 0.7) m.cont[MI(m, p.x + 4, p.y + 1)] = { k: r.pick(['foodcrate', 'pallet', 'crate', 'ration']), loot: {}, s: 0 };
          const ct = m.cont[MI(m, p.x + 4, p.y + 1)]; if (ct) ct.loot = rollLoot(r, CONT[ct.k].loot);
        }
        x += 9 + r.int(0, 3);
      }
      reserve(m, fx0, ry - 1, fx1 - fx0, 4);
    }
    area.y0 = fy0 + 11;
    guard(m, Math.floor(W / 2), fy0 + 6, 5);
  }

  // главный цех
  const sw = r.int(24, 30), sh = r.int(14, 17);
  let sp = findSpot(m, r, sw, sh, { x0: area.x0, y0: area.y0, x1: area.x1, y1: area.y0 + sh + 10 }, 2) || findSpot(m, r, sw, sh, area, 2);
  if (sp) {
    const shop = building(m, r, sp.x, sp.y, sw, sh, { wall: T.WALL, floor: T.CONCRETE, minRoom: 6, maxDepth: 1, doors: 3, windows: 6, metal: true, innerDoor: 'open' });
    const big = shop.rooms.reduce((a, b) => (a.w * a.h > b.w * b.h ? a : b));
    for (let yy = big.y + 2; yy + 2 <= big.y + big.h - 2; yy += 4)
      for (let xx = big.x + 2; xx + 3 <= big.x + big.w - 2; xx += 5)
        if (r() < 0.8 && clearRect(m, xx - 1, yy - 1, 5, 4)) addProp(m, 'machine', xx, yy, 3, 2, { tall: r() < 0.5, c: r.pick(['#5d6b70', '#6b6450', '#56605a']) });
    furnish(m, r, shop, ['locker', 'toolbox', 'crate', 'drum', 'locker', 'toolbox'], 12);
  }
  // склад
  const ww = r.int(15, 18), wh = r.int(11, 13);
  sp = findSpot(m, r, ww, wh, area, 2);
  if (sp) {
    const wb = building(m, r, sp.x, sp.y, ww, wh, { wall: T.BRICK, floor: T.CONCRETE, split: false, doors: 2, windows: 2, metal: true });
    for (let yy = sp.y + 2; yy <= sp.y + wh - 3; yy += 3)
      for (let xx = sp.x + 2; xx <= sp.x + ww - 3; xx++) {
        if ((xx - sp.x - 2) % 6 === 5) continue;
        if (TP[m.tiles[MI(m, xx, yy)]].floor && !nearDoor(m, xx, yy, 1)) addCont(m, r, xx, yy, 'wshelf');
      }
  }
  // заводоуправление
  const ow = r.int(13, 15), oh = r.int(9, 11);
  sp = findSpot(m, r, ow, oh, area, 2);
  if (sp) {
    const ob = building(m, r, sp.x, sp.y, ow, oh, { wall: T.BRICK, floor: T.TILE, minRoom: 3, maxDepth: 3, doors: 2, windows: 5 });
    furnish(m, r, ob, ['desk', 'locker', 'medcab', 'furn:table', 'shelf', 'desk'], 8);
  }
  // котельная
  sp = findSpot(m, r, 8, 7, area, 2);
  if (sp) { const kb = building(m, r, sp.x, sp.y, 8, 7, { wall: T.BRICK, floor: T.CONCRETE, split: false, doors: 1, metal: true }); furnish(m, r, kb, ['drum', 'drum', 'toolbox', 'pallet'], 5); }
  // проходная у ворот
  sp = findSpot(m, r, 5, 4, { x0: gx - 9, y0: fy1 - 8, x1: gx + 13, y1: fy1 - 1 }, 1);
  if (sp) { const gb = building(m, r, sp.x, sp.y, 5, 4, { wall: T.WALL, floor: T.TILE, split: false, doors: 1, windows: 2 }); furnishRoom(m, r, gb.rooms[0], ['gun', 'desk'], 2); }
  // двор

// Достижимость от старта, чистка недоступных контейнеров, списки клеток
function finalize(m) {
  const reach = new Uint8Array(m.n);

  const st = [];
  for (const i of m.evac) { reach[i] = 1; st.push(i); }
  if (!st.length) { reach[s] = 1; st.push(s); }
  while (st.length) {
    const i = st.pop(), x = i % m.w, y = (i / m.w) | 0;
    for (const [dx, dy] of DIR4) {
      const nx = x + dx, ny = y + dy;
      if (!inb(m, nx, ny)) continue;
      const j = MI(m, nx, ny);
      if (reach[j] || !TP[m.tiles[j]].walk) continue;
      reach[j] = 1; st.push(j);
    }

  for (const k in m.cont) {
    const i = +k, x = i % m.w, y = (i / m.w) | 0;
    let ok = false;
    for (const [dx, dy] of DIR8) { const nx = x + dx, ny = y + dy; if (inb(m, nx, ny) && reach[MI(m, nx, ny)]) ok = true; }
    if (!ok) delete m.cont[k];
  }

    const i = MI(m, xx, yy);
    if (reach[i] && TP[m.tiles[i]].walk && !isDoorT(m.tiles[i])) m.indoor.push(i);
  }
  const ev = new Set(m.evac);
  m.edge = [];
  for (let i = 0; i < m.n; i++) {
    const x = i % m.w, y = (i / m.w) | 0;
    if ((x < 2 || y < 2 || x >= m.w - 2 || y >= m.h - 2) && reach[i] && TP[m.tiles[i]].walk && !ev.has(i)) m.edge.push(i);
  }
  delete m.resv;
  m.buildings = m.buildings.map(b => ({ x: b.x, y: b.y, w: b.w, h: b.h }));
  return reach;
}

function genMap(loc, seed, lootMul = 1) {
  const L = LOCS[loc];
  const r = makeRng(seed);
  const m = newMap(L.w, L.h, seed);
  m.v = L.v || 0; m.loc = loc;
  const GEN = {
    farm: genFarm, suburb: genSuburb, factory: genFactory, hospital: genHospital, gas: genGas, market: genMarket, police: genPolice,
    school: genSchool, church: genChurch, checkpoint: genCheckpoint, forest: genForest, motel: genMotel, prison: genPrison, raidcamp: genRaidCamp,
  };

}

  for (let yy = hy0 + 2; yy <= hy1 - 4; yy += 3) for (let xx = hx0 + 2; xx <= hx1 - 2; xx++) {
    if ((xx - hx0 - 2) % 8 === 7) continue;
    if (TP[m.tiles[MI(m, xx, yy)]].floor && !nearDoor(m, xx, yy, 1)) addCont(m, r, xx, yy, 'mshelf');
  }
  for (let xx = hx0 + 1; xx <= hx1 - 1; xx += 2) if (TP[m.tiles[MI(m, xx, hy0)]].floor && !nearDoor(m, xx, hy0, 1) && r() < 0.6) addCont(m, r, xx, hy0, 'cooler');
  const mid = bx + Math.floor(bw / 2);
  for (let xx = hx0 + 2; xx <= hx1 - 2; xx += 3) {
    if (Math.abs(xx - mid) <= 1) continue;
    placeItem(m, r, xx, hy1 - 1, 'furn:counter');
    if (r() < 0.6) addCont(m, r, xx + 1 <= hx1 ? xx : xx, hy1 - 2, 'register');
  }
  for (let yy = by + 1; yy < sy; yy++) for (let xx = bx + 2; xx < bx + bw - 2; xx += 2) if (r() < 0.45 && !nearDoor(m, xx, yy, 1)) addCont(m, r, xx, yy, r() < 0.6 ? 'foodcrate' : 'pallet');
  makeDoor(m, b, mid, by + bh - 1, 'open'); makeDoor(m, b, mid + 1, by + bh - 1, 'broken');
  makeDoor(m, b, bx, sy + 3, 'closed'); makeDoor(m, b, bx + bw - 1, by + 2, 'closed');
  for (let k = 0; k < bw / 3; k++) { const xx = r.int(bx + 2, bx + bw - 3); if (!nearDoor(m, xx, by + bh - 1, 1)) put(m, xx, by + bh - 1, T.WINDOW); }
  b.rooms.push({ x: hx0, y: hy0, w: hx1 - hx0 + 1, h: hy1 - hy0 + 1 }, { x: bx + 1, y: by + 1, w: bw - 2, h: sy - by - 1 });
  m.buildings.push(b);
  reserve(m, bx - 2, by - 2, bw + 4, bh + 4);
  for (let x = 5; x < W - 7; x += 3) for (const y of [py0 + 1, py0 + ph - 4]) {
    if (r() > 0.45) continue;
    let ok = true;
    for (let yy = y; yy < y + 3; yy++) for (let xx = x; xx < x + 2; xx++) if (m.tiles[MI(m, xx, yy)] !== T.ASPHALT || m.resv[MI(m, xx, yy)]) ok = false;
    if (ok) { const p = addProp(m, 'car', x, y, 2, 3, { c: r.pick(CAR_COLORS), v: 1, f: r() < 0.5 ? 1 : 0 }); if (r() < 0.4) m.cont[MI(m, p.x, p.y + 2)] = { k: 'trunk', loot: rollLoot(r, CONT.trunk.loot), s: 0 }; }
  }
  reserve(m, 3, py0, W - 6, ph);
  scatterGreen(m, r, 0.03, 0.04, 2);
  placeStart(m, r, rdx, H - 7);
}

// ----- отдел полиции -----
function genPolice(m, r) {
  const W = m.w, H = m.h;
  baseGround(m, T.GRASS, T.DIRT, 6, 0.75);
  const sy = H - 13;
  groundRect(m, 0, sy, W, 3, T.ASPHALT);
  for (let x = 0; x < W; x++) m.meta[MI(m, x, sy + 1)] |= 4;
  const rdx = r.int(8, W - 12);
  groundRect(m, rdx, sy, 3, H - sy, T.ASPHALT);
  reserve(m, 0, sy - 1, W, 5); reserve(m, rdx - 3, H - 11, 9, 11);
  const fx0 = 3, fy0 = 3, fx1 = W - 4, fy1 = sy - 2;
  groundRect(m, fx0 + 1, fy0 + 1, fx1 - fx0 - 1, fy1 - fy0 - 1, T.CONCRETE);
  const gx = r.int(fx0 + 6, fx1 - 9);
  for (let x = fx0; x <= fx1; x++) { if (x < gx || x > gx + 3) { put(m, x, fy1, T.FENCE); m.meta[MI(m, x, fy1)] = 1; } put(m, x, fy0, T.FENCE); m.meta[MI(m, x, fy0)] = 1; }
  for (let y = fy0; y <= fy1; y++) for (const x of [fx0, fx1]) { put(m, x, y, T.FENCE); m.meta[MI(m, x, y)] = 1; }
  groundRect(m, gx, fy1, 4, sy - fy1, T.ASPHALT);
  reserve(m, fx0 - 1, fy0 - 1, fx1 - fx0 + 3, 2); reserve(m, fx0 - 1, fy1 - 1, fx1 - fx0 + 3, 2);
  reserve(m, fx0 - 1, fy0, 2, fy1 - fy0); reserve(m, fx1, fy0, 2, fy1 - fy0);
  const area = { x0: fx0 + 2, y0: fy0 + 2, x1: fx1 - 1, y1: fy1 - 2 };
  let bw = 24, bh = 14, sp = findSpot(m, r, bw, bh, area, 2);
  if (!sp) { bw = 20; bh = 12; sp = findSpot(m, r, bw, bh, area, 1); }
  if (sp) {
    const b = building(m, r, sp.x, sp.y, bw, bh, { wall: T.BRICK, floor: T.TILE, minRoom: 4, maxDepth: 3, doors: 2, windows: 7, doorSides: ['s', 'w', 'e'] });
    const rooms = b.rooms.slice().sort((a, c) => a.w * a.h - c.w * c.h);
    furnishRoom(m, r, rooms[0], ['armory', 'armory', 'locker'], 3);
    if (rooms[1]) furnishRoom(m, r, rooms[1], ['evidence', 'locker', 'shelf'], 3);
    for (const rm of rooms.slice(2)) furnishRoom(m, r, rm, ['desk', 'desk', 'locker', 'furn:table', 'medcab', 'shelf'], Math.max(2, Math.round(rm.w * rm.h / 8)));
  }
  sp = findSpot(m, r, 13, 6, area, 1);
  if (sp) {
    const cb = building(m, r, sp.x, sp.y, 13, 6, { wall: T.WALL, floor: T.CONCRETE, split: false, doors: 1, doorSides: ['s'], metal: true });
    for (let k = 0; k < 3; k++) {
      const cx = sp.x + 1 + k * 4;
      for (let xx = cx; xx < cx + 3; xx++) if (xx !== cx + 1) { put(m, xx, sp.y + 3, T.FENCE); m.meta[MI(m, xx, sp.y + 3)] = 1; }
      if (k < 2) for (let yy = sp.y + 1; yy <= sp.y + 3; yy++) put(m, cx + 3, yy, T.WALL);
      placeItem(m, r, cx, sp.y + 1, 'furn:cot');
    }
    m.buildings[m.buildings.length - 1] = cb;
  }
  for (let k = 0; k < 4; k++) { const s2 = findSpot(m, r, 2, 4, area, 1, 60); if (s2) { const p = addCar(m, r, s2.x, s2.y, true, 'car', 'trunk', 0.5); p.c = '#dcdad2'; p.pol = 1; } }
  for (let k = 0; k < 3; k++) { const s2 = findSpot(m, r, 4, 2, { x0: 1, y0: sy, x1: W - 1, y1: sy + 3 }, 0, 40); if (s2) addCar(m, r, s2.x, s2.y, false); }
  scatterGreen(m, r, 0.03, 0.04, 2);
  placeStart(m, r, rdx, H - 7);
}

// ----- школа -----
function genSchool(m, r) {
  const W = m.w, H = m.h;
  baseGround(m, T.GRASS, T.DIRT, 7, 0.78);
  const bw = r.int(40, 46), bh = 17, bx = Math.floor((W - bw) / 2), by = 4;
  const yard = { x: 4, y: by + bh + 2, w: W - 8, h: H - by - bh - 14 };
  groundRect(m, yard.x, yard.y, yard.w, yard.h, T.ASPHALT);
  const rdx = r.int(6, W - 10);
  groundRect(m, rdx, yard.y + yard.h, 3, H - yard.y - yard.h, T.ASPHALT);
  reserve(m, rdx - 3, H - 11, 9, 11);
  const cb = corridorBuilding(m, r, bx, by, bw, bh, { wall: T.BRICK, floor: T.WOOD, rw: [6, 9] });
  const kinds = shuffle(['class', 'class', 'class', 'class', 'class', 'canteen', 'office', 'gym', 'class', 'class', 'medic'], r);
  let ki = 0;
  for (const rm of [...cb.north, ...cb.south]) {
    if (rm.lobby) { furnishRoom(m, r, rm, ['furn:bench', 'locker', 'shelf'], 3); continue; }
    const k = kinds[ki++ % kinds.length];
    if (k === 'class') { deskRows(m, rm); furnishRoom(m, r, rm, ['desk', 'locker', 'shelf'], 2); }
    else if (k === 'canteen') furnishRoom(m, r, rm, ['fridge', 'pantry', 'foodcrate', 'furn:table', 'furn:table'], 6);
    else if (k === 'medic') furnishRoom(m, r, rm, ['medcab', 'medcab', 'furn:bed', 'desk'], 4);
    else if (k === 'gym') furnishRoom(m, r, rm, ['locker', 'crate'], 2);
    else furnishRoom(m, r, rm, ['desk', 'locker', 'medcab', 'shelf'], 3);
  }
  const fx0 = yard.x - 1, fy0 = by - 2, fx1 = yard.x + yard.w, fy1 = yard.y + yard.h;
  const gate = rdx;
  for (let x = fx0; x <= fx1; x++) { if (x < gate - 1 || x > gate + 3) { put(m, x, fy1, T.FENCE); m.meta[MI(m, x, fy1)] = 2; } }
  for (let y = fy0 + 6; y <= fy1; y++) for (const x of [fx0, fx1]) if (inb(m, x, y) && TP[m.tiles[MI(m, x, y)]].floor) { put(m, x, y, T.FENCE); m.meta[MI(m, x, y)] = 2; }
  reserve(m, fx0 - 1, fy1 - 1, fx1 - fx0 + 3, 3);
  const sp = findSpot(m, r, 7, 3, { x0: yard.x + 1, y0: yard.y + 1, x1: yard.x + yard.w - 1, y1: yard.y + yard.h - 1 }, 1, 60);
  if (sp) addProp(m, 'bus', sp.x, sp.y, 7, 3, { c: '#d9a62b', v: 0, f: r() < 0.5 ? 1 : 0 });
  for (let k = 0; k < 5; k++) { const s2 = findSpot(m, r, 1, 1, { x0: yard.x + 1, y0: yard.y + 1, x1: yard.x + yard.w - 1, y1: yard.y + yard.h - 1 }, 1, 40); if (s2) { placeItem(m, r, s2.x, s2.y, 'furn:bench'); reserve(m, s2.x, s2.y, 1, 1); } }
  reserve(m, yard.x, yard.y, yard.w, yard.h);
  scatterGreen(m, r, 0.04, 0.04, 2);
  placeStart(m, r, rdx, H - 7);
}

// ----- церковь и кладбище -----
function genChurch(m, r) {
  const W = m.w, H = m.h;
  baseGround(m, T.GRASS, T.DIRT, 6, 0.74);
  const rdx = r.int(Math.floor(W * 0.35), Math.floor(W * 0.5));
  groundRect(m, rdx, Math.floor(H * 0.55), 3, H, T.DIRT);
  for (let y = Math.floor(H * 0.55); y < H; y++) { m.meta[MI(m, rdx, y)] |= 2; m.meta[MI(m, rdx + 2, y)] |= 2; }
  reserve(m, rdx - 1, Math.floor(H * 0.55), 5, H); reserve(m, rdx - 3, H - 11, 9, 11);
  const cw = 11, ch = 17, cx = rdx - 4, cy = 4;
  const b = building(m, r, cx, cy, cw, ch, { wall: T.WALL, floor: T.WOOD, split: false, doors: 1, doorSides: ['s'], extDoor: 'open', windows: 8 });
  makeDoor(m, b, cx + cw - 1, cy + 4, 'closed');
  for (let yy = cy + 5; yy <= cy + ch - 4; yy += 2) for (const xx of [cx + 2, cx + 3, cx + 4, cx + cw - 5, cx + cw - 4, cx + cw - 3]) if (TP[m.tiles[MI(m, xx, yy)]].floor) placeItem(m, r, xx, yy, 'furn:pew');
  addCont(m, r, cx + Math.floor(cw / 2), cy + 2, 'desk');
  addCont(m, r, cx + 1, cy + 1, 'pantry'); addCont(m, r, cx + cw - 2, cy + 1, 'medcab');
  const rightSp = W - 3 - (cx + cw + 2), leftSp = cx - 4;
  const gw = Math.min(16, Math.max(rightSp, leftSp)), gh = 14, gx = rightSp >= leftSp ? cx + cw + 2 : cx - 2 - gw, gy = 5;
  if (gw >= 8 && isFree(m, gx - 1, gy - 1, gw + 2, gh + 2)) {
    for (let yy = gy; yy < gy + gh; yy++) for (let xx = gx; xx < gx + gw; xx++) {
      const edge = xx === gx || yy === gy || xx === gx + gw - 1 || yy === gy + gh - 1;
      if (edge) { if (!(yy === gy + gh - 1 && Math.abs(xx - (gx + gw / 2)) < 1.5)) { put(m, xx, yy, T.FENCE); m.meta[MI(m, xx, yy)] = 2; } }
      else if ((xx - gx) % 2 === 1 && (yy - gy) % 3 === 1 && r() < 0.85) { put(m, xx, yy, T.GRAVE); m.meta[MI(m, xx, yy)] = r() < 0.5 ? 1 : 0; }
    }
    reserve(m, gx - 1, gy - 1, gw + 2, gh + 2);
    // склеп-сторожка у кладбища
    const kx = gx + Math.floor(gw / 2) - 2, ky = gy + gh + 1;
    if (isFree(m, kx - 1, ky, 6, 5)) { const kb = building(m, r, kx, ky, 5, 4, { wall: T.WALL, floor: T.CONCRETE, split: false, doors: 1, doorSides: ['s'] }); furnish(m, r, kb, ['crate', 'medcab', 'pantry', 'toolbox'], 2); }
  }
  for (let k = 0; k < 2; k++) {
    const sp = findSpot(m, r, 8, 6, { x0: 2, y0: 2, x1: W - 2, y1: H - 12 }, 2);
    if (sp) { const hb = building(m, r, sp.x, sp.y, 8, 6, { wall: T.WWALL, floor: T.WOOD, minRoom: 3, maxDepth: 1, doors: 1, windows: 2 }); furnish(m, r, hb, ['fridge', 'pantry', 'furn:bed', 'locker', 'medcab', 'desk'], 5); }
  }
  const camp = { x0: 3, y0: cy + ch + 1, x1: W - 3, y1: H - 12 };
  tents(m, r, camp, 3, '#7a7466', true);
  tentStash(m, r, ['crate', 'foodcrate', 'medcab', 'pantry'], 0.8);
  const fsp = findSpot(m, r, 1, 1, camp, 1);
  if (fsp) { campfire(m, fsp.x, fsp.y); guard(m, fsp.x, fsp.y, 3); }
  scatterGreen(m, r, 0.05, 0.04, 2);
  placeStart(m, r, rdx, H - 7);
}

// ----- блокпост / военная часть -----
function genCheckpoint(m, r) {
  const W = m.w, H = m.h, big = m.v === 1;
  baseGround(m, T.DIRT, T.GRASS, 6, 0.55);
  const rx = Math.floor(W / 2) - 2;
  groundRect(m, rx, 0, 4, H, T.ASPHALT);
  for (let y = 0; y < H; y++) m.meta[MI(m, rx + 2, y)] |= 2;
  reserve(m, rx - 1, 0, 6, H); reserve(m, rx - 3, H - 11, 10, 11);
  const ly = Math.floor(H * (big ? 0.62 : 0.5));
  if (big) {
    const fx0 = 3, fy0 = 3, fx1 = W - 4, fy1 = ly;
    for (let x = fx0; x <= fx1; x++) { put(m, x, fy0, T.WALL); if (x < rx || x > rx + 3) put(m, x, fy1, T.WALL); }
    for (let y = fy0; y <= fy1; y++) { put(m, fx0, y, T.WALL); put(m, fx1, y, T.WALL); }
    groundRect(m, fx0 + 1, fy0 + 1, fx1 - fx0 - 1, fy1 - fy0 - 1, T.CONCRETE);
    reserve(m, fx0 - 1, fy0 - 1, fx1 - fx0 + 3, 2); reserve(m, fx0 - 1, fy1 - 1, fx1 - fx0 + 3, 3);
    reserve(m, fx0 - 1, fy0, 2, fy1 - fy0); reserve(m, fx1, fy0, 2, fy1 - fy0);
    for (const [tx, ty] of [[fx0 + 1, fy0 + 1], [fx1 - 2, fy0 + 1], [rx - 3, fy1 - 2], [rx + 5, fy1 - 2]]) { addProp(m, 'tower', tx, ty, 2, 2, { tall: true }); guard(m, tx, ty + 2, 2); }
    const area = { x0: fx0 + 2, y0: fy0 + 2, x1: fx1 - 1, y1: fy1 - 2 };
    let sp = findSpot(m, r, 20, 7, area, 1);
    if (sp) { const bb = building(m, r, sp.x, sp.y, 20, 7, { wall: T.WALL, floor: T.CONCRETE, minRoom: 6, maxDepth: 1, doors: 2, windows: 5 }); for (const rm of bb.rooms) furnishRoom(m, r, rm, ['furn:bunk', 'furn:bunk', 'locker', 'ration'], Math.max(3, Math.round(rm.w * rm.h / 6))); guard(m, sp.x + 10, sp.y + 8, 3); }
    sp = findSpot(m, r, 12, 8, area, 1);
    if (sp) { const hq = building(m, r, sp.x, sp.y, 12, 8, { wall: T.WALL, floor: T.TILE, minRoom: 3, maxDepth: 2, doors: 2, windows: 4 }); const rooms = hq.rooms.slice().sort((a, c) => a.w * a.h - c.w * c.h); furnishRoom(m, r, rooms[0], ['armory', 'armory'], 2); for (const rm of rooms.slice(1)) furnishRoom(m, r, rm, ['desk', 'medcab', 'locker', 'ration'], 3); }
    sp = findSpot(m, r, 12, 8, area, 1);
    if (sp) { const wh = building(m, r, sp.x, sp.y, 12, 8, { wall: T.WALL, floor: T.CONCRETE, split: false, doors: 1, metal: true }); furnish(m, r, wh, ['ration', 'crate', 'ration', 'drum', 'armory'], 5); }
    for (let k = 0; k < 3; k++) { const s2 = findSpot(m, r, 3, 6, area, 1, 60); if (s2) { const p = addCar(m, r, s2.x, s2.y, true, 'truck', 'ration', 0.8); p.c = '#4a5a3a'; } }
    for (let k = 0; k < 3; k++) { const s2 = findSpot(m, r, 3, 4, area, 1, 60); if (s2) addProp(m, 'mtent', s2.x, s2.y, 3, 4, { c: '#4a5a3a' }); }
    const cpts = findSpot(m, r, 2, 2, area, 1);
    if (cpts) captive(m, r, cpts.x, cpts.y);
  }
  // линия мешков с песком поперёк дороги и гнёзда
  const sy = big ? ly + 6 : ly;
  for (let x = rx - 6; x <= rx + 9; x++) if (x < rx + 1 || x > rx + 2) { put(m, x, sy, T.SANDBAG); }
  for (const nx of [rx - 9, rx + 11]) for (let k = 0; k < 3; k++) { put(m, nx + k, sy - 2, T.SANDBAG); put(m, nx, sy - 2 + k, T.SANDBAG); put(m, nx + 2, sy - 2 + k, T.SANDBAG); }
  reserve(m, rx - 10, sy - 3, 24, 4);
  guard(m, rx + 1, sy - 2, 3);
  if (!big) {
    for (const tx of [rx - 4, rx + 6]) if (isFree(m, tx, sy - 5, 2, 2)) { addProp(m, 'tower', tx, sy - 5, 2, 2, { tall: true }); guard(m, tx, sy - 3, 1); }
    const camp = { x0: 3, y0: 3, x1: W - 3, y1: sy - 4 };
    for (let k = 0; k < 4; k++) { const s2 = findSpot(m, r, 3, 4, camp, 1, 60); if (s2) { addProp(m, 'mtent', s2.x, s2.y, 3, 4, { c: '#4a5a3a' }); if (inb(m, s2.x + 3, s2.y + 1) && !m.resv[MI(m, s2.x + 3, s2.y + 1)]) { addCont(m, r, s2.x + 3, s2.y + 1, 'ration'); reserve(m, s2.x + 3, s2.y + 1, 1, 1); } guard(m, s2.x + 1, s2.y + 5, 1); } }
    const bsp = findSpot(m, r, 6, 5, camp, 1);
    if (bsp) { const bk = building(m, r, bsp.x, bsp.y, 6, 5, { wall: T.WALL, floor: T.CONCRETE, split: false, doors: 1, metal: true }); furnish(m, r, bk, ['armory', 'ration', 'medcab'], 3); }
    for (let k = 0; k < 2; k++) { const s2 = findSpot(m, r, 3, 6, camp, 1, 60); if (s2) { const p = addCar(m, r, s2.x, s2.y, true, 'truck', 'ration', 0.7); p.c = '#4a5a3a'; } }
    fenceLine(m, 2, sy - 1, rx - 11, sy - 1, 1, 9); fenceLine(m, rx + 14, sy - 1, W - 3, sy - 1, 1, 9);
  }
  scatterGreen(m, r, 0.02, 0.05, 2);
  placeStart(m, r, rx, H - 7);
}

// ----- турбаза / стан Паствы -----
function genForest(m, r) {
  const W = m.w, H = m.h, cult = m.v === 1;
  baseGround(m, T.GRASS, T.DIRT, 6, 0.72);
  const rdx = r.int(Math.floor(W * 0.4), Math.floor(W * 0.55)), ry = Math.floor(H * 0.45);
  groundRect(m, rdx, ry, 3, H - ry, T.DIRT);
  for (let y = ry; y < H; y++) { m.meta[MI(m, rdx, y)] |= 2; m.meta[MI(m, rdx + 2, y)] |= 2; }
  reserve(m, rdx - 1, ry, 5, H - ry); reserve(m, rdx - 3, H - 11, 9, 11);
  if (cult) {
    const cx = rdx + 1, cy = Math.floor(H * 0.3), rad = 10;
    for (let y = cy - rad; y <= cy + rad; y++) for (let x = cx - rad; x <= cx + rad; x++) if (inb(m, x, y) && (x - cx) ** 2 + (y - cy) ** 2 <= rad * rad) setGround(m, x, y, T.DIRT);
    groundRect(m, rdx, cy, 3, ry - cy, T.DIRT);
    campfire(m, cx, cy); reserve(m, cx - 1, cy - 1, 3, 3);
    addCont(m, r, cx, cy - 3, 'desk'); reserve(m, cx, cy - 3, 1, 1);
    for (let k = 0; k < 7; k++) { const a = (k / 7) * Math.PI * 2, tx = Math.round(cx + Math.cos(a) * 6) - 1, ty = Math.round(cy + Math.sin(a) * 6) - 1; if (isFree(m, tx, ty, 2, 2)) addProp(m, 'tent', tx, ty, 2, 2, { c: r.pick(['#7a7466', '#6a645a', '#8a8070']), round: 1 }); }
    for (let k = 0; k < 6; k++) { const a = r() * Math.PI * 2, tx = Math.round(cx + Math.cos(a) * 3.5), ty = Math.round(cy + Math.sin(a) * 3.5); if (isFree(m, tx, ty, 1, 1)) { addCont(m, r, tx, ty, r.pick(['pantry', 'crate', 'medcab', 'drum'])); reserve(m, tx, ty, 1, 1); } }
    tentStash(m, r, ['crate', 'foodcrate', 'medcab', 'pantry', 'drum'], 0.9);
    for (let k = 0; k < 3; k++) {
      const sp = findSpot(m, r, 5, 4, { x0: 2, y0: 2, x1: W - 2, y1: H - 12 }, 2, 80);
      if (sp) { const hb = building(m, r, sp.x, sp.y, 5, 4, { wall: T.WWALL, floor: T.WOOD, split: false, doors: 1, windows: 1 }); furnish(m, r, hb, ['pantry', 'crate', 'medcab', 'furn:bed'], 3); }
    }
    const caps = findSpot(m, r, 1, 1, { x0: cx - 8, y0: cy - 8, x1: cx + 8, y1: cy + 8 }, 1, 80);
    if (caps) captive(m, r, caps.x, caps.y);
    guard(m, cx, cy, 5);
    reserve(m, cx - rad, cy - rad, rad * 2 + 1, rad * 2 + 1);
  } else {
    const lsp = findSpot(m, r, 14, 9, { x0: 2, y0: 2, x1: W - 2, y1: H - 14 }, 1);
    if (lsp) { for (let yy = 0; yy < 9; yy++) for (let xx = 0; xx < 14; xx++) if (((xx - 6.5) / 7) ** 2 + ((yy - 4) / 4.5) ** 2 < 1) put(m, lsp.x + xx, lsp.y + yy, T.WATER); reserve(m, lsp.x, lsp.y, 14, 9); }
    for (let k = 0; k < 6; k++) {
      const sp = findSpot(m, r, 6, 5, { x0: 2, y0: 2, x1: W - 2, y1: H - 12 }, 2, 80);
      if (!sp) continue;
      const b = building(m, r, sp.x, sp.y, 6, 5, { wall: T.WWALL, floor: T.WOOD, split: false, doors: 1, windows: 2 });
      furnish(m, r, b, ['furn:bed', 'fridge', 'pantry', 'locker', 'desk'], 4);
    }
    tents(m, r, { x0: 3, y0: 3, x1: W - 3, y1: H - 12 }, 3);
    tentStash(m, r, ['crate', 'foodcrate', 'drum'], 0.6);
    const fsp = findSpot(m, r, 1, 1, { x0: 3, y0: 3, x1: W - 3, y1: H - 12 }, 2);
    if (fsp) { campfire(m, fsp.x, fsp.y); for (const [dx, dy] of [[2, 0], [-2, 0], [0, 2]]) if (isFree(m, fsp.x + dx, fsp.y + dy, 1, 1)) { placeItem(m, r, fsp.x + dx, fsp.y + dy, 'furn:bench'); reserve(m, fsp.x + dx, fsp.y + dy, 1, 1); } }
    const csp = findSpot(m, r, 2, 4, { x0: 2, y0: 2, x1: W - 2, y1: H - 12 }, 1);
    if (csp) addCar(m, r, csp.x, csp.y, true, 'car', 'trunk', 0.8);
  }
  scatterGreen(m, r, 0.12, 0.06, 3);
  placeStart(m, r, rdx, H - 7);
}

// ----- мотель -----
function genMotel(m, r) {
  const W = m.w, H = m.h;
  baseGround(m, T.GRASS, T.DIRT, 6, 0.7);
  const ry = H - 9;
  groundRect(m, 0, ry, W, 3, T.ASPHALT);
  for (let x = 0; x < W; x++) m.meta[MI(m, x, ry + 1)] |= 4;
  const rdx = r.int(5, 10);
  groundRect(m, rdx, ry, 3, H - ry, T.ASPHALT);
  reserve(m, 0, ry - 1, W, 4); reserve(m, rdx - 3, H - 11, 9, 11);
  const py = ry - 12;
  groundRect(m, 3, py, W - 6, 11, T.ASPHALT);
  for (let x = 5; x < W - 5; x += 3) m.meta[MI(m, x, py + 1)] |= 8;
  const n = r.int(6, 7), bw = n * 5 + 1, bx = 3, by = py - 8;
  const b = { x: bx, y: by, w: bw, h: 8, o: { floor: T.WOOD }, rooms: [], doors: [] };
  for (let yy = by; yy < by + 8; yy++) for (let xx = bx; xx < bx + bw; xx++) {
    const i = MI(m, xx, yy);
    m.ground[i] = T.WOOD;
    m.tiles[i] = (xx === bx || yy === by || xx === bx + bw - 1 || yy === by + 7 || (xx - bx) % 5 === 0) ? T.BRICK : T.WOOD;
  }
  for (let k = 0; k < n; k++) {
    const x0 = bx + k * 5 + 1, rm = { x: x0, y: by + 1, w: 4, h: 6 };
    b.rooms.push(rm);
    const v = r();
    makeDoor(m, b, x0 + 1, by + 7, v < 0.5 ? 'closed' : v < 0.8 ? 'open' : 'broken');
    put(m, x0 + 3, by + 7, T.WINDOW);
    placeItem(m, r, x0, by + 1, 'furn:bed'); placeItem(m, r, x0 + 1, by + 1, 'furn:bed');
    furnishRoom(m, r, rm, ['fridge', 'locker', 'desk', 'medcab'], 2);
  }
  m.buildings.push(b);
  reserve(m, bx - 1, by - 1, bw + 2, 10);
  const ob = building(m, r, bx + bw + 2, by + 1, 8, 6, { wall: T.BRICK, floor: T.TILE, split: false, doors: 1, doorSides: ['s'], windows: 2 });
  furnishRoom(m, r, ob.rooms[0], ['register', 'desk', 'locker', 'vending'], 4);
  const psp = findSpot(m, r, 9, 6, { x0: 2, y0: 2, x1: W - 2, y1: by - 1 }, 1, 80) || findSpot(m, r, 9, 6, { x0: bx + bw + 2, y0: 2, x1: W - 2, y1: py }, 1, 80);
  if (psp) { groundRect(m, psp.x, psp.y, 9, 6, T.SIDEWALK); for (let yy = 1; yy < 5; yy++) for (let xx = 1; xx < 8; xx++) put(m, psp.x + xx, psp.y + yy, T.WATER); reserve(m, psp.x, psp.y, 9, 6); }
  for (let k = 0; k < 6; k++) { const x = r.int(4, W - 6); let ok = true; for (let yy = py + 2; yy < py + 5; yy++) for (let xx = x; xx < x + 2; xx++) if (m.tiles[MI(m, xx, yy)] !== T.ASPHALT || m.resv[MI(m, xx, yy)]) ok = false; if (ok) { const p = addProp(m, 'car', x, py + 2, 2, 3, { c: r.pick(CAR_COLORS), v: 1, f: 0 }); if (r() < 0.5) m.cont[MI(m, p.x, p.y + 2)] = { k: 'trunk', loot: rollLoot(r, CONT.trunk.loot), s: 0 }; } }
  const tsp = findSpot(m, r, 3, 5, { x0: 3, y0: py, x1: W - 3, y1: py + 11 }, 0, 40);
  if (tsp) addProp(m, 'trailer', tsp.x, tsp.y, 3, 5, { c: '#d6d2c4', v: 1 });
  guard(m, bx + Math.floor(bw / 2), py + 5, 4);
  reserve(m, 3, py, W - 6, 11);
  scatterGreen(m, r, 0.04, 0.04, 2);
  placeStart(m, r, rdx, H - 7);
}

// ----- колония -----
function genPrison(m, r) {
  const W = m.w, H = m.h;
  baseGround(m, T.DIRT, T.GRASS, 6, 0.6);
  const gx = Math.floor(W / 2) - 2;
  groundRect(m, gx, H - 12, 4, 12, T.ASPHALT);
  reserve(m, gx - 3, H - 11, 10, 11);
  const ring = (mg, gap) => {
    const x0 = mg, y0 = mg, x1 = W - 1 - mg, y1 = H - 11 - mg;
    for (let x = x0; x <= x1; x++) { put(m, x, y0, T.FENCE); m.meta[MI(m, x, y0)] = 1; if (x < gap || x > gap + 3) { put(m, x, y1, T.FENCE); m.meta[MI(m, x, y1)] = 1; } }
    for (let y = y0; y <= y1; y++) for (const x of [x0, x1]) { put(m, x, y, T.FENCE); m.meta[MI(m, x, y)] = 1; }
    reserve(m, x0 - 1, y0 - 1, x1 - x0 + 3, 3); reserve(m, x0 - 1, y1 - 1, x1 - x0 + 3, 3);
    reserve(m, x0 - 1, y0, 3, y1 - y0); reserve(m, x1 - 1, y0, 3, y1 - y0);
    return [x0, y0, x1, y1];
  };
  const [ox0, oy0, ox1, oy1] = ring(2, gx);
  const [ix0, iy0, ix1, iy1] = ring(5, gx);
  groundRect(m, gx, oy1, 4, H - oy1, T.ASPHALT);
  groundRect(m, ix0 + 1, iy0 + 1, ix1 - ix0 - 1, iy1 - iy0 - 1, T.ASPHALT);
  for (const [tx, ty] of [[ox0 + 1, oy0 + 1], [ox1 - 2, oy0 + 1], [ox0 + 1, oy1 - 2], [ox1 - 2, oy1 - 2]]) addProp(m, 'tower', tx, ty, 2, 2, { tall: true });
  const area = { x0: ix0 + 2, y0: iy0 + 2, x1: ix1 - 1, y1: iy1 - 2 };
  const left = r() < 0.5, bx0 = left ? ix0 + 3 : ix1 - 3 - 28, ox = left ? ix0 + 3 + 28 + 4 : ix0 + 3;
  for (let k = 0; k < 2; k++) {
    const sy = iy0 + 3 + k * 15;
    if (sy + 11 > iy1 - 2) break;
    const cb = corridorBuilding(m, r, bx0, sy, 28, 11, { wall: T.WALL, floor: T.CONCRETE, rw: [3, 4], entrance: true, metal: true, cellDoor: 'open' });
    for (const rm of [...cb.north, ...cb.south]) { if (rm.lobby) continue; placeItem(m, r, rm.x, rm.y + (rm.south ? rm.h - 1 : 0), 'furn:cot'); if (r() < 0.55) addCont(m, r, rm.x + rm.w - 1, rm.y + (rm.south ? rm.h - 1 : 0), r() < 0.8 ? 'locker' : 'pantry'); }
  }
  let sp = isFree(m, ox - 1, iy0 + 2, 16, 11) ? { x: ox, y: iy0 + 3 } : findSpot(m, r, 14, 9, area, 1);
  if (sp) { const ad = building(m, r, sp.x, sp.y, 14, 9, { wall: T.BRICK, floor: T.TILE, minRoom: 3, maxDepth: 2, doors: 2, windows: 4 }); const rooms = ad.rooms.slice().sort((a, c) => a.w * a.h - c.w * c.h); furnishRoom(m, r, rooms[0], ['armory', 'evidence'], 2); for (const rm of rooms.slice(1)) furnishRoom(m, r, rm, ['desk', 'medcab', 'locker', 'shelf'], 3); }
  sp = isFree(m, ox - 1, iy0 + 15, 14, 10) ? { x: ox, y: iy0 + 16 } : findSpot(m, r, 12, 8, area, 1);
  if (sp) { const cn = building(m, r, sp.x, sp.y, 12, 8, { wall: T.WALL, floor: T.TILE, split: false, doors: 2, windows: 3 }); furnishRoom(m, r, cn.rooms[0], ['fridge', 'pantry', 'foodcrate', 'furn:table', 'furn:table', 'furn:table'], 8); }
  for (let k = 0; k < 6; k++) { const s2 = findSpot(m, r, 1, 1, area, 1, 40); if (s2) { placeItem(m, r, s2.x, s2.y, 'furn:bench'); reserve(m, s2.x, s2.y, 1, 1); } }
  scatterGreen(m, r, 0.015, 0.03, 2);
  placeStart(m, r, gx, H - 7);
}

// ----- лагерь группировки -----
function genRaidCamp(m, r) {
  const W = m.w, H = m.h, big = m.v === 1;
  baseGround(m, T.DIRT, T.GRASS, 6, 0.6);
  const cw = big ? 36 : 30, ch = big ? 30 : 26, cx0 = Math.floor((W - cw) / 2), cy0 = 3;
  const gate = cx0 + Math.floor(cw / 2) - 1, rdx = gate;
  groundRect(m, rdx, cy0 + ch, 3, H - cy0 - ch, T.DIRT);
  reserve(m, rdx - 1, cy0 + ch - 1, 5, H - cy0 - ch + 1); reserve(m, rdx - 3, H - 11, 9, 11);
  // баррикада: забор, мешки и машины по кругу, ворота снизу
  for (let x = cx0; x < cx0 + cw; x++) for (const y of [cy0, cy0 + ch - 1]) {
    if (y === cy0 + ch - 1 && x >= gate && x < gate + 3) continue;
    put(m, x, y, (x + y) % 7 < 2 ? T.SANDBAG : T.FENCE); m.meta[MI(m, x, y)] = big ? 1 : 0;
  }
  for (let y = cy0; y < cy0 + ch; y++) for (const x of [cx0, cx0 + cw - 1]) { put(m, x, y, (x + y) % 6 < 2 ? T.SANDBAG : T.FENCE); m.meta[MI(m, x, y)] = big ? 1 : 0; }
  reserve(m, cx0 - 1, cy0 - 1, cw + 2, 2); reserve(m, cx0 - 1, cy0 + ch - 2, cw + 2, 3);
  reserve(m, cx0 - 1, cy0, 2, ch); reserve(m, cx0 + cw - 2, cy0, 3, ch);
  const area = { x0: cx0 + 2, y0: cy0 + 2, x1: cx0 + cw - 2, y1: cy0 + ch - 3 };
  const sp = findSpot(m, r, big ? 14 : 9, big ? 9 : 7, area, 1);
  if (sp) {
    const mb = building(m, r, sp.x, sp.y, big ? 14 : 9, big ? 9 : 7, { wall: big ? T.BRICK : T.WWALL, floor: big ? T.CONCRETE : T.WOOD, minRoom: 3, maxDepth: big ? 2 : 1, doors: 2, windows: 3 });
    const rooms = mb.rooms.slice().sort((a, c) => a.w * a.h - c.w * c.h);
    furnishRoom(m, r, rooms[0], ['armory', 'ration', 'foodcrate'], 3);
    for (const rm of rooms.slice(1)) furnishRoom(m, r, rm, ['foodcrate', 'ration', 'furn:bed', 'crate', 'drum', 'medcab'], 4);
    guard(m, sp.x + 3, sp.y + (big ? 10 : 8), 2);
  }
  tents(m, r, area, big ? 5 : 4);
  tentStash(m, r, ['crate', 'foodcrate', 'ration', 'drum', 'medcab'], 0.7);
  const fsp = findSpot(m, r, 1, 1, area, 2);
  if (fsp) { campfire(m, fsp.x, fsp.y); guard(m, fsp.x, fsp.y, 3); }
  if (isFree(m, gate - 4, cy0 + ch - 5, 2, 2)) addProp(m, 'tower', gate - 4, cy0 + ch - 5, 2, 2, { tall: true });
  guard(m, gate + 1, cy0 + ch - 3, 2);
  for (let k = 0; k < 2; k++) { const s2 = findSpot(m, r, 3, 6, area, 1, 60); if (s2) addCar(m, r, s2.x, s2.y, true, 'truck', 'ration', 0.7); }
  for (let k = 0; k < 6; k++) { const s2 = findSpot(m, r, 1, 1, area, 1, 40); if (s2) { addCont(m, r, s2.x, s2.y, r.pick(['crate', 'drum', 'ration', 'pallet'])); reserve(m, s2.x, s2.y, 1, 1); } }
  const nc = big ? 2 : 1;
  for (let k = 0; k < nc; k++) { const s2 = findSpot(m, r, 1, 1, area, 1, 80); if (s2) captive(m, r, s2.x, s2.y); }
  scatterGreen(m, r, 0.04, 0.04, 2);
  placeStart(m, r, rdx, H - 7);
}

// ----- карта базы: насосная станция и всё, что построено -----
const BASE_W = 40, BASE_H = 36;
function genBase(st) {
  const W = BASE_W, H = BASE_H, seed = st.seed || 777;
  const m = newMap(W, H, seed), r = makeRng(seed), B = st.build;
  m.v = 0; m.loc = 'base'; m.isBase = true;
  baseGround(m, T.GRASS, T.DIRT, 6, 0.62);
  const fx0 = 4, fy0 = 3, fx1 = 35, fy1 = 30, gx = 19;
  groundRect(m, fx0 + 1, fy0 + 1, fx1 - fx0 - 1, fy1 - fy0 - 1, T.DIRT);
  groundRect(m, gx, fy1, 3, H - fy1, T.DIRT);
  for (let y = fy1; y < H; y++) { m.meta[MI(m, gx, y)] |= 2; m.meta[MI(m, gx + 2, y)] |= 2; }
  groundRect(m, gx, 14, 3, fy1 - 14, T.DIRT);
  // насосная станция
  const sb = building(m, r, 15, 5, 12, 9, { wall: T.WALL, floor: T.CONCRETE, minRoom: 4, maxDepth: 1, doors: 0, windows: 0 });
  makeDoor(m, sb, 20, 13, 'open'); makeDoor(m, sb, 26, 9, 'closed');
  for (const [x, y] of [[17, 5], [23, 5], [15, 9], [18, 13], [24, 13]]) if (!nearDoor(m, x, y, 1)) put(m, x, y, T.WINDOW);
  const rooms = sb.rooms.slice().sort((a, c) => c.w * c.h - a.w * a.h);
  furnishRoom(m, r, rooms[0], ['furn:bunk', 'furn:bunk', 'furn:table', 'locker', 'shelf'], 6);
  for (const rm of rooms.slice(1)) furnishRoom(m, r, rm, ['shelf', 'crate', 'drum', 'locker', 'fridge'], 3);
  // периметр
  if (B.walls >= 1) {
    const wallT = B.walls >= 3 ? T.WALL : T.FENCE;
    for (let x = fx0; x <= fx1; x++) for (const y of [fy0, fy1]) { if (y === fy1 && x >= gx && x <= gx + 2) continue; put(m, x, y, wallT); m.meta[MI(m, x, y)] = 0; }
    for (let y = fy0; y <= fy1; y++) for (const x of [fx0, fx1]) { put(m, x, y, wallT); m.meta[MI(m, x, y)] = 0; }
    if (B.walls >= 3) for (const x of [gx - 1, gx + 3]) put(m, x, fy1, T.WALL);
  } else {
    for (let x = fx0 + 1; x < fx1; x += 1) for (const y of [fy0, fy1]) { if (y === fy1 && x >= gx - 1 && x <= gx + 3) continue; if (r() < 0.22) put(m, x, y, r() < 0.5 ? T.CRATE : T.DRUM); }
  }
  if (B.walls >= 2) {
    for (let x = fx0 - 2; x <= fx1 + 2; x++) for (const y of [fy0 - 2, fy1 + 2]) { if (!inb(m, x, y) || (y === fy1 + 2 && x >= gx - 1 && x <= gx + 3)) continue; put(m, x, y, T.FENCE); m.meta[MI(m, x, y)] = 1; }
    for (let y = fy0 - 2; y <= fy1 + 2; y++) for (const x of [fx0 - 2, fx1 + 2]) { if (inb(m, x, y)) { put(m, x, y, T.FENCE); m.meta[MI(m, x, y)] = 1; } }
    for (const x of [gx - 2, gx + 4]) for (let k = 0; k < 2; k++) put(m, x, fy1 - 1 - k, T.SANDBAG);
    for (let k = -1; k <= 3; k++) if (k < 0 || k > 2) put(m, gx + k, fy1 - 3, T.SANDBAG);
  }
  if (B.walls >= 3) { addProp(m, 'tower', fx0 + 1, fy1 - 3, 2, 2, { tall: true }); addProp(m, 'tower', fx1 - 2, fy1 - 3, 2, 2, { tall: true }); addProp(m, 'tower', fx0 + 1, fy0 + 1, 2, 2, { tall: true }); }
  // огород — грядки слева
  const beds = [2, 2, 4, 6][B.garden] - (B.garden ? 0 : 1);
  for (let k = 0; k < beds; k++) {
    const x = 6 + (k % 2) * 4, y = 7 + Math.floor(k / 2) * 3;
    for (let yy = 0; yy < 2; yy++) for (let xx = 0; xx < 3; xx++) { setGround(m, x + xx, y + yy, T.DIRT); put(m, x + xx, y + yy, B.garden ? T.CROP : T.DIRT); m.meta[MI(m, x + xx, y + yy)] = k % 2; }
  }
  if (B.garden >= 3) addCont(m, r, 13, 7, 'seeds');
  // вода — бочки и башня справа
  const nd = [1, 2, 4, 6][B.water];
  for (let k = 0; k < nd; k++) put(m, 29 + (k % 3) * 2, 6 + Math.floor(k / 3) * 2, T.DRUM);
  if (B.water >= 2) addProp(m, 'wtower', 30, 10, 2, 2, { tall: true });
  // рация
  if (B.radio >= 1) addProp(m, 'mast', 27, 5, 1, 1, { tall: true, hgt: B.radio >= 2 ? 6 : 4 });
  // лазарет слева внизу
  if (B.infirmary >= 1) {
    addProp(m, 'medtent', 7, 19, 3, 3, { c: '#d6d2c4' });
    put(m, 6, 23, T.FURN); m.meta[MI(m, 6, 23)] = FURN_V.cot;
    if (B.infirmary >= 2) { put(m, 8, 23, T.FURN); m.meta[MI(m, 8, 23)] = FURN_V.cot; put(m, 11, 19, T.MEDCAB); }
    if (B.infirmary >= 3) { put(m, 10, 23, T.FURN); m.meta[MI(m, 10, 23)] = FURN_V.cot; put(m, 11, 20, T.MEDCAB); }
  }
  // мастерская справа внизу
  if (B.workshop >= 1) { put(m, 28, 18, T.BENCH); put(m, 29, 18, T.CRATE); put(m, 27, 18, T.CRATE); }
  if (B.workshop >= 2) { const wb = building(m, r, 27, 22, 7, 5, { wall: T.WWALL, floor: T.CONCRETE, split: false, doors: 0 }); makeDoor(m, wb, 29, 22, 'open'); put(m, 28, 24, T.BENCH); put(m, 32, 24, T.DRUM); put(m, 32, 23, T.SHELF); }
  if (B.workshop >= 3) addProp(m, 'machine', 31, 17, 3, 2, { c: '#5d6b70' });
  // костёр, лавки, машина
  campfire(m, 20, 20);
  for (const [x, y] of [[18, 20], [22, 20]]) { put(m, x, y, T.FURN); m.meta[MI(m, x, y)] = FURN_V.bench; }
  addProp(m, 'car', 15, 25, 2, 3, { c: '#8a3424', v: 1, f: 1 });
  for (const k in m.cont) m.cont[k].loot = {};
  m.start = { x: 20, y: 22 };
  m.evac = [];
  m.idle = [[19, 19], [21, 19], [19, 21], [21, 21], [20, 15], [12, 12], [26, 19], [11, 22], [24, 23], [16, 17]];
  m.gate = { x: gx + 1, y: fy1 };
  const reach = finalize(m);
  return { m, reach };
}

<script>
'use strict';
// ---------- Тактический бой: правила, ИИ зомби, ход вылазки ----------

const TAC = { m: null, sel: 0, reach: null, busy: false, pend: null, mode: null };
const TOD_NAME = ['День', 'Сумерки', 'Ночь'];
const STEP_MS = 190;
const MELEE_SND = { bat: 'hit_bat', axe: 'hit_axe', crowbar: 'hit_crowbar', knife: 'stab' };
const WAVE_EVERY = 7;
const LURE_RANGE = 8;

function spd(ms) { return ms * [1.6, 1, 0.5, 0][CFG.speed ?? 1]; }
function timeOfDay(m) { return m.tod ?? (m.turn <= 14 ? 0 : m.turn <= 24 ? 1 : 2); }
function sightR(m) { return Math.max(3, [9, 7, 5][timeOfDay(m)] - wxOf(m).sight); }
function liveUnits(m) { return m.units.filter(u => !u.dead && !u.evac); }
function unitAt(m, x, y) { return m.units.find(u => u.x === x && u.y === y && !u.dead && !u.evac); }
function zombieAt(m, x, y) { return m.zombies.find(z => z.x === x && z.y === y); }
function curUnit() { const m = TAC.m; return m && m.units.find(u => u.id === TAC.sel && !u.dead && !u.evac); }
function zVisible(m, z) { return !!m.vis[MI(m, z.x, z.y)]; }
