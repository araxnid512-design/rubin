<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Рубеж</title>
<meta name="theme-color" content="#13120e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=PT+Sans+Narrow:wght@400;700&family=Rubik+Dirt&display=swap">
<style>
/* Рубеж — layout: full-bleed tactical canvas under thumb-sized HUD rails (squad left, actions right; swapped for left hand).
   Base screen = roster column + tabbed panel. Hazard-tape amber marks the two decisive buttons: end turn and head out. */
:root {
  --bg: #13120e;
  --bg-2: #191813;
  --panel: rgba(28, 26, 20, 0.9);
  --panel-solid: #1e1c16;
  --panel-2: #26231b;
  --line: #3a3528;
  --line-2: #4d4733;
  --ink: #ece4cc;
  --ink-2: #d6cfba;
  --muted: #a09781;
  --dim: #746c58;
  --amber: #e8a62b;
  --amber-2: #cf9020;
  --amber-ink: #1b1406;
  --rust: #c9472f;
  --rust-ink: #ffb3a3;
  --moss: #86a85d;
  --moss-ink: #cfe3b5;
  --toxic: #a4d03c;
  --warn-ink: #f0c46a;
  --scrim: rgba(8, 7, 5, 0.62);
  --f-title: "Rubik Dirt", "Oswald", Impact, sans-serif;
  --f-ui: "Oswald", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "PT Sans Narrow", "Arial Narrow", "Roboto Condensed", sans-serif;
  --r: 5px;
  --gut-l: max(10px, env(safe-area-inset-left, 0px));
  --gut-r: max(10px, env(safe-area-inset-right, 0px));
  --gut-t: max(6px, env(safe-area-inset-top, 0px));
  --gut-b: max(6px, env(safe-area-inset-bottom, 0px));
  color-scheme: dark;
}
html { font-size: 15px; height: 100%; background: var(--bg); }
body {
  height: 100%; margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 1rem; line-height: 1.3;
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
#app { position: fixed; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; transform-origin: 0 0; background: var(--bg); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.screen { position: absolute; inset: 0; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; touch-action: manipulation; }
.ic { width: 1.15em; height: 1.15em; flex: none; display: inline-block; vertical-align: -0.2em; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* ----- кнопки ----- */
.btn {
  font-family: var(--f-ui); font-weight: 500; font-size: 0.95rem; letter-spacing: 0.04em; text-transform: uppercase;
  min-height: 2.75rem; padding: 0.35rem 0.95rem; border: 1px solid var(--line-2); border-radius: var(--r);
  background: var(--panel-2); color: var(--ink); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); }
.btn.danger { border-color: var(--rust); color: var(--rust-ink); background: transparent; }
.btn.hazard {
  color: var(--amber-ink); border: 0; font-weight: 600;
  background: repeating-linear-gradient(-45deg, var(--amber) 0 12px, var(--amber-2) 12px 24px);
  box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.22);
}
.btn.sm { min-height: 2.3rem; padding: 0.2rem 0.7rem; font-size: 0.82rem; }
.btn.big { min-height: 3.3rem; font-size: 1.1rem; }
.hbtn {
  width: 2.6rem; height: 2.6rem; flex: none; display: grid; place-items: center; cursor: pointer;
  border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 0;
}
.hbtn .ic { width: 1.3rem; height: 1.3rem; }

/* ----- меню ----- */
#scr-menu { display: flex; align-items: stretch; }
.menu-in {
  display: flex; flex-direction: column; justify-content: center; gap: 0.9rem; max-width: 26rem;
  padding: var(--gut-t) 1.5rem var(--gut-b) max(1.6rem, env(safe-area-inset-left, 0px));
}
.logo { margin: 0; font-family: var(--f-title); font-weight: 400; font-size: clamp(3rem, 15vh, 5.6rem); line-height: 0.9; color: var(--ink); letter-spacing: 0.02em; }
.logo::after { content: ""; display: block; height: 0.55rem; width: 8.5rem; margin-top: 0.55rem; background: repeating-linear-gradient(-45deg, var(--amber) 0 10px, var(--bg) 10px 20px); }
.tagline { margin: 0; color: var(--ink-2); font-size: 1.02rem; max-width: 34ch; }
.mbtns { display: flex; flex-direction: column; gap: 0.45rem; width: min(17rem, 100%); }
.ver { margin: 0; font-size: 0.78rem; color: var(--dim); }

/* ----- убежище ----- */
#scr-base { background: var(--bg); display: flex; flex-direction: column; }
.bbar {
  display: flex; align-items: center; gap: 0.8rem; background: var(--bg-2); border-bottom: 1px solid var(--line);
  padding: var(--gut-t) var(--gut-r) 0.35rem var(--gut-l);
}
.brand { font-family: var(--f-title); font-size: 1.55rem; color: var(--amber); line-height: 1; }
.day { display: flex; align-items: baseline; gap: 0.3rem; font-family: var(--f-ui); }
.day span { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; }
.day b { font-size: 1.4rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.day small { color: var(--dim); font-size: 0.78rem; }
.resrow { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.15rem 0.6rem; flex: 1; min-width: 0; }
.res { display: inline-flex; align-items: center; gap: 0.2rem; font-family: var(--f-ui); font-variant-numeric: tabular-nums; }
.res .ic { color: var(--rc); }
.res b { font-weight: 500; min-width: 1.1em; }
.res.low b { color: #ff8a70; }
.bmain { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(13rem, 17rem) 1fr; }
.survs { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); padding: 0.5rem 0.55rem 0 var(--gut-l); }
.survs h2 { margin: 0; display: flex; gap: 0.4rem; font-family: var(--f-ui); font-weight: 500; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
.survs h2 span { color: var(--ink); }
.need { margin: 0.1rem 0 0.4rem; font-size: 0.8rem; color: var(--dim); }
.slist { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.4rem; padding-bottom: var(--gut-b); }
.sw { display: flex; flex-direction: column; gap: 0.25rem; }
.sc {
  text-align: left; display: grid; grid-template-columns: 2.9rem minmax(0, 1fr); gap: 0.25rem 0.6rem; align-items: center; cursor: pointer;
  padding: 0.4rem 0.55rem 0.4rem 0.5rem; border-radius: var(--r);
  background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--uc);
}
.sc > :not(.pt) { grid-column: 2; }
.pt {
  grid-row: 1 / span 4; width: 2.9rem; height: 3.5rem; align-self: stretch; border-radius: 4px;
  background: radial-gradient(ellipse at 50% 30%, rgba(236, 228, 204, 0.12), transparent 70%), rgba(0, 0, 0, 0.28);
}
.sc.sel { border-color: var(--amber); border-left-color: var(--uc); background: #2e2919; }
.sc.inf { background: linear-gradient(90deg, rgba(164, 208, 60, 0.09), transparent 60%), var(--panel-2); }
.sc-top { display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; }
.sc-top b { font-family: var(--f-ui); font-weight: 500; font-size: 1rem; }
.trait { font-style: normal; font-size: 0.72rem; color: var(--muted); border: 1px solid var(--line-2); padding: 0 0.3rem; border-radius: 3px; }
.lvl { font-style: normal; display: inline-flex; align-items: center; gap: 0.1rem; font-size: 0.75rem; color: var(--amber); }
.lvl .ic { width: 0.8rem; height: 0.8rem; }
.sq { font-style: normal; margin-left: auto; font-family: var(--f-ui); font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.08em; background: var(--amber); color: var(--amber-ink); padding: 0.05rem 0.35rem; border-radius: 3px; }
.sc-meta { font-size: 0.82rem; color: var(--muted); }
.sc-inf { font-size: 0.82rem; color: var(--toxic); display: flex; align-items: center; gap: 0.3rem; }
.cure { align-self: flex-start; }
.cure-hint { font-size: 0.76rem; color: var(--dim); }
.bar { display: block; height: 0.32rem; background: rgba(0, 0, 0, 0.5); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--moss); }
.bar.lowhp i { background: var(--rust); }
.bpanel { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tabs { display: flex; gap: 0.2rem; padding: 0.35rem var(--gut-r) 0 0.7rem; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button {
  display: inline-flex; align-items: center; gap: 0.35rem; min-height: 2.6rem; padding: 0.4rem 0.6rem; cursor: pointer; white-space: nowrap;
  background: none; border: 0; border-bottom: 2px solid transparent;
  font-family: var(--f-ui); font-size: 0.88rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;
}
.tabs button.on { color: var(--ink); border-bottom-color: var(--amber); }
.tabc { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 0.55rem; padding: 0.6rem var(--gut-r) var(--gut-b) 0.7rem; }
.locs { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.6rem, 1fr)); gap: 0.45rem; }
.loc {
  text-align: left; display: flex; flex-direction: column; gap: 0.2rem; cursor: pointer;
  padding: 0.5rem 0.6rem; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel-2);
}
.loc.sel { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
.loc.locked { opacity: 0.5; cursor: default; }
.loc-h { display: flex; justify-content: space-between; align-items: center; }
.loc-h b { font-family: var(--f-ui); font-weight: 500; font-size: 1.1rem; }
.dng { display: inline-flex; gap: 3px; }
.dng i { width: 0.45rem; height: 0.45rem; background: var(--line-2); transform: rotate(45deg); }
.dng i.on { background: var(--rust); }
.loc-n { font-size: 0.84rem; color: var(--ink-2); }
.loc-m { font-size: 0.78rem; color: var(--dim); font-variant-numeric: tabular-nums; }
.loc-l { display: flex; gap: 0.35rem; }
.loc-l i { color: var(--rc); }
.lock { font-family: var(--f-ui); font-size: 0.72rem; color: var(--amber); text-transform: uppercase; letter-spacing: 0.06em; }
.loc-d { margin: 0; color: var(--ink-2); font-size: 0.92rem; max-width: 62ch; }
.sortie-f {
  display: flex; align-items: center; gap: 0.5rem; border-top: 1px solid var(--line); background: var(--bg-2);
  padding: 0.45rem var(--gut-r) var(--gut-b) 0.7rem;
}
.sq-list { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 0.9rem; line-height: 1.25; }
.sq-list b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sq-list span { color: var(--muted); }
.sq-list .warn { color: var(--warn-ink); }
.blds { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: 0.45rem; }
.bld { display: flex; flex-direction: column; gap: 0.3rem; padding: 0.55rem 0.65rem; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel-2); }
.bld-h { display: flex; justify-content: space-between; align-items: center; }
.bld-h b { font-family: var(--f-ui); font-weight: 500; font-size: 1rem; }
.lv { display: inline-flex; gap: 3px; }
.lv i { width: 0.9rem; height: 0.35rem; background: var(--line-2); border-radius: 1px; }
.lv i.on { background: var(--amber); }
.bld p { margin: 0; font-size: 0.86rem; }
.bld .next { color: var(--muted); }
.bld .max { color: var(--moss); }
.bld-f { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.4rem; margin-top: auto; }
.cost { display: inline-flex; gap: 0.3rem; flex-wrap: wrap; }
.cc {
  display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.1rem 0.45rem; border-radius: 3px;
  font-family: var(--f-ui); font-size: 0.85rem; font-variant-numeric: tabular-nums;
  background: rgba(255, 255, 255, 0.05); color: var(--rc, var(--ink));
}
.cost .cc { color: var(--ink); }
.cc.miss, .cost .cc.miss { color: #ff9b85; background: rgba(201, 71, 47, 0.13); }
.crafts { display: flex; flex-direction: column; gap: 0.4rem; }
.rc { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 0.6rem; padding: 0.5rem 0.65rem; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel-2); }
.rc-t { display: flex; flex-direction: column; min-width: 0; }
.rc-t b { font-family: var(--f-ui); font-weight: 500; }
.rc-t span { font-size: 0.82rem; color: var(--muted); }
.perks h3 { margin: 0.2rem 0; font-family: var(--f-ui); font-weight: 500; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.perks ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.2rem; font-size: 0.9rem; color: var(--dim); }
.perks li.on { color: var(--ink); }
.perks p { margin: 0.3rem 0 0; font-size: 0.84rem; color: var(--moss); }
.journal { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.4rem; }
.journal li { font-size: 0.92rem; padding-left: 0.6rem; border-left: 2px solid var(--line-2); max-width: 70ch; }
.journal li span { display: block; font-family: var(--f-ui); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim); }
.journal li.bad { border-color: var(--rust); }
.journal li.good { border-color: var(--moss); }

/* ----- бой ----- */
#scr-tac { pointer-events: none; }
#scr-tac .pop, #scr-tac .sheet-bg { pointer-events: auto; }
.hud {
  position: absolute; inset: 0; pointer-events: none; display: grid; gap: 0.4rem;
  grid-template-columns: 8.6rem minmax(0, 1fr) 4.9rem; grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top top top" "squad mid acts" "squad log acts";
  padding: var(--gut-t) var(--gut-r) var(--gut-b) var(--gut-l);
}
body.lefty .hud { grid-template-columns: 4.9rem minmax(0, 1fr) 8.6rem; grid-template-areas: "top top top" "acts mid squad" "acts log squad"; }
.hud > * { pointer-events: auto; min-height: 0; min-width: 0; }
.hud-top { grid-area: top; display: flex; align-items: center; gap: 0.35rem; pointer-events: none; }
.hud-top > * { pointer-events: auto; }
.hud-top .grow { flex: 1; pointer-events: none; }
.chip {
  display: inline-flex; align-items: center; gap: 0.35rem; height: 2.3rem; padding: 0 0.65rem; white-space: nowrap;
  border-radius: var(--r); background: var(--panel); border: 1px solid var(--line);
  font-family: var(--f-ui); font-size: 0.86rem; letter-spacing: 0.02em;
}
.chip b { font-weight: 600; font-variant-numeric: tabular-nums; }
.chip.tod1 { color: #e6b7d0; }
.chip.tod2 { color: #a9bfe6; }
.threat .lbl { color: var(--muted); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.08em; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 0.45rem; height: 0.85rem; background: var(--line-2); border-radius: 1px; }
.pips i.on { background: var(--rust); }
.wv { display: inline-flex; align-items: center; gap: 0.2rem; color: var(--amber); font-variant-numeric: tabular-nums; }
.squad { grid-area: squad; display: flex; flex-direction: column; gap: 0.3rem; overflow-y: auto; scrollbar-width: none; align-self: start; max-height: 100%; }
.uc {
  text-align: left; display: flex; flex-direction: column; gap: 0.2rem; cursor: pointer;
  padding: 0.35rem 0.5rem 0.35rem 0.6rem; border-radius: var(--r);
  background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--uc);
}
.uc.sel { border-color: var(--amber); border-left-color: var(--uc); box-shadow: 0 0 0 1px var(--amber); }
.uc.dead, .uc.evac { opacity: 0.55; }
.uc-n { display: flex; align-items: center; gap: 0.3rem; font-family: var(--f-ui); font-size: 0.9rem; min-width: 0; }
.uc-n b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { font-style: normal; font-family: var(--f-ui); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em; padding: 0 0.3rem; border-radius: 3px; line-height: 1.5; }
.tag.tox { background: var(--toxic); color: #1a2208; }
.tag.amb { background: var(--amber); color: var(--amber-ink); }
.uc-s { display: flex; flex-wrap: wrap; gap: 0.1rem 0.45rem; font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.uc-s span { display: inline-flex; align-items: center; gap: 0.15rem; }
.uc-s .ic { width: 0.9rem; height: 0.9rem; }
.acts { grid-area: acts; display: flex; flex-direction: column; gap: 0.3rem; overflow-y: auto; scrollbar-width: none; }
.act {
  flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.12rem; cursor: pointer;
  min-height: 3rem; padding: 0.2rem; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line);
  font-family: var(--f-ui); font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink); line-height: 1.1; text-align: center;
}
.act .ic { width: 1.35rem; height: 1.35rem; }
.act:disabled { opacity: 0.35; cursor: default; }
.act.on { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); }
.act.end {
  margin-top: auto; min-height: 3.9rem; font-size: 0.8rem; font-weight: 600; color: var(--amber-ink); border: 0;
  background: repeating-linear-gradient(-45deg, var(--amber) 0 10px, var(--amber-2) 10px 20px);
}
.act.end.ready { animation: pulse 1.4s ease-in-out infinite; }
.act.end.armed { background: var(--rust); color: #fff3ea; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(232, 166, 43, 0.4); } }
.mid { grid-area: mid; pointer-events: none; display: flex; justify-content: center; align-items: flex-start; }
.banner {
  margin-top: 0.3rem; padding: 0.35rem 1rem; border-radius: var(--r); background: rgba(150, 40, 25, 0.88); color: #ffe7dc;
  font-family: var(--f-ui); text-transform: uppercase; letter-spacing: 0.2em; font-size: 0.9rem;
  animation: blink 1.2s ease-in-out infinite;
}
@keyframes blink { 50% { opacity: 0.6; } }
.log { grid-area: log; justify-self: center; display: flex; flex-direction: column; align-items: center; gap: 0.2rem; pointer-events: none; max-width: 32rem; }
.log .ln { background: rgba(14, 13, 10, 0.85); padding: 0.25rem 0.65rem; border-radius: 4px; font-size: 0.9rem; text-align: center; transition: opacity 1.2s; }
.log .ln.warn { color: var(--warn-ink); }
.log .ln.bad { color: #ff9b85; }
.log .ln.old { opacity: 0; }
.tac.flash::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 6px rgba(201, 71, 47, 0.65); animation: fl 0.9s ease-out forwards; }
@keyframes fl { to { box-shadow: inset 0 0 0 0 rgba(201, 71, 47, 0); } }
.pop {
  position: absolute; z-index: 20; min-width: 12.5rem; max-width: 18rem; overflow: hidden;
  background: var(--panel-solid); border: 1px solid var(--line-2); border-radius: var(--r); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
}
.pop-h { display: flex; flex-direction: column; padding: 0.45rem 0.75rem; border-bottom: 1px solid var(--line); }
.pop-h b { font-family: var(--f-ui); font-weight: 500; font-size: 1rem; }
.pop-h span { color: var(--muted); font-size: 0.8rem; }
.pop button {
  width: 100%; display: flex; align-items: center; gap: 0.55rem; min-height: 2.8rem; padding: 0.3rem 0.75rem; cursor: pointer; text-align: left;
  background: none; border: 0; border-top: 1px solid rgba(255, 255, 255, 0.05);
}
.pop button:active:not(:disabled) { background: var(--panel-2); }
.pop button:disabled { opacity: 0.4; cursor: default; }
.pop .pl { flex: 1; display: flex; flex-direction: column; font-size: 0.96rem; }
.pop .pl small { color: var(--muted); font-size: 0.74rem; }
.pop em { font-style: normal; font-family: var(--f-ui); font-size: 0.8rem; color: var(--amber); white-space: nowrap; }
.pop .ic { color: var(--amber); }
.sheet-bg, .modal-bg {
  position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; background: var(--scrim);

<script>
'use strict';
// ---------- Общие утилиты ----------

const rnd = Math.random;
function rint(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }
function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }
function chance(p) { return rnd() < p; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function edist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }
function cheb(ax, ay, bx, by) { return Math.max(Math.abs(ax - bx), Math.abs(ay - by)); }
function sleep(ms) { return ms > 0 ? new Promise(r => setTimeout(r, ms)) : Promise.resolve(); }

// Детерминированный ГСЧ (mulberry32) для генерации карт
function makeRng(seed) {
  let a = seed >>> 0;
  const f = () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  f.int = (lo, hi) => lo + Math.floor(f() * (hi - lo + 1));
  f.pick = arr => arr[Math.floor(f() * arr.length)];
  f.chance = p => f() < p;
  return f;
}

// Хэш клетки -> [0,1) для визуальных вариаций
function hash2(x, y, s) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul((s | 0) + 1, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// Сглаженный value-noise для пятен грунта и травы
function vnoise(seed, x, y, sc) {
  const gx = x / sc, gy = y / sc, x0 = Math.floor(gx), y0 = Math.floor(gy);
  let fx = gx - x0, fy = gy - y0;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  const a = hash2(x0, y0, seed), b = hash2(x0 + 1, y0, seed), c = hash2(x0, y0 + 1, seed), d = hash2(x0 + 1, y0 + 1, seed);
  return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
}

function shuffle(a, r = rnd) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

// Русские окончания: plural(5, 'ход', 'хода', 'ходов')
function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}
// Род: g(s, 'погиб', 'погибла')
function gv(s, m, f) { return s && s.g === 'f' ? f : m; }

// Безопасное хранилище (может быть недоступно)
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* нет доступа */ } },
};

function vibrate(ms) {
  if (typeof CFG !== 'undefined' && !CFG.vibro) return;
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* не поддерживается */ }
}

<script>
'use strict';
// ---------- Генерация карт локаций ----------

const DIR4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];

function newMap(w, h, seed) {
  const n = w * h;

    w, h, n, seed,
    tiles: new Uint8Array(n), ground: new Uint8Array(n), meta: new Uint8Array(n), resv: new Uint8Array(n),

}

const inb = (m, x, y) => x >= 0 && y >= 0 && x < m.w && y < m.h;

function put(m, x, y, t) {
  if (!inb(m, x, y)) return;
  const i = MI(m, x, y);
  m.tiles[i] = t;
  if (TP[t].floor) m.ground[i] = t;
}

  if (!inb(m, x, y)) return;
  const i = MI(m, x, y);
  m.ground[i] = g;
  if (TP[m.tiles[i]].floor) m.tiles[i] = g;
}
function groundRect(m, x, y, w, h, g) { for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) setGround(m, xx, yy, g); }

}

}

    if (!inb(m, xx, yy) || !TP[m.tiles[MI(m, xx, yy)]].floor) return false;
    if (nearDoor(m, xx, yy, 1)) return false;

// Обход, если путь занят другим зомби
function sideStep(m, z, tx, ty) {
  let best = -1, bd = edist(z.x, z.y, tx, ty) + 0.01;
  for (const [dx, dy] of DIR8) {
    const nx = z.x + dx, ny = z.y + dy;
    if (!walkT(m, nx, ny)) continue;
    if (dx && dy && (!walkT(m, z.x + dx, z.y) || !walkT(m, z.x, z.y + dy))) continue;
    const j = MI(m, nx, ny);
    if (m.zocc[j] || m.uocc[j]) continue;
    const d = edist(nx, ny, tx, ty);
    if (d < bd) { bd = d; best = j; }
  }
  return best;
}
function buildOcc(m) {
  m.zocc = new Uint8Array(m.n); m.uocc = new Uint8Array(m.n);
  for (const z of m.zombies) m.zocc[MI(m, z.x, z.y)] = 1;
  for (const u of liveUnits(m)) m.uocc[MI(m, u.x, u.y)] = 1;
}

// ----- Шум -----
function noise(m, x, y, r) {
  if (r <= 0) return;
  FX.ring(x, y, r);
  m.tp += r / 5;
  if (r >= 4) m.lastNoise = { x, y, turn: m.turn };
  for (const z of m.zombies) {
    if (z.state === 'chase') continue;
    if (edist(z.x, z.y, x, y) <= r) {
      z.state = 'investigate';
      z.tx = clamp(x + rint(-1, 1), 0, m.w - 1); z.ty = clamp(y + rint(-1, 1), 0, m.h - 1);
    }
  }
}

// ----- Зомби -----
function addZombie(m, x, y, type, state) {
  const z = { id: m.zid++, type, x, y, hp: ZT[type].hp, state, tx: x, ty: y, target: 0, screamed: false, f: rint(0, 7) };
  m.zombies.push(z);
  if (m.zocc) m.zocc[MI(m, x, y)] = 1;
  return z;
}
function perceive(m, z) {
  const t = ZT[z.type], tod = timeOfDay(m);
  let best = null, bd = 1e9;
  for (const u of liveUnits(m)) {
    const d = edist(z.x, z.y, u.x, u.y);
    let sr = t.sight - tod;
    if (u.trait === 'quiet') sr -= 2;
    if (TP[m.tiles[MI(m, u.x, u.y)]].hide) sr = Math.min(sr, 2.5);
    if ((d <= 1.5 || (d <= sr && los(m, z, u))) && d < bd) { bd = d; best = u; }
  }
  if (best) {
    const was = z.state;
    z.state = 'chase'; z.target = best.id; z.tx = best.x; z.ty = best.y;
    if (was !== 'chase' && zVisible(m, z) && chance(0.5)) Sfx.play('groan', { x: z.x, y: z.y, fall: 14 });
    return was !== 'chase';
  }
  if (z.state === 'chase') z.state = 'investigate';
  return false;
}
async function zMove(m, z, j) {
  const show = zVisible(m, z) || m.vis[j];
  m.zocc[MI(m, z.x, z.y)] = 0; m.zocc[j] = 1;
  await animTo(z, j % m.w, (j / m.w) | 0, show ? spd(STEP_MS * 0.85) : 0);
  if (show && chance(0.5)) Sfx.play('zstep', { x: z.x, y: z.y });
}
async function wander(m, z) {
  const opts = [];
  for (const [dx, dy] of DIR4) {
    const nx = z.x + dx, ny = z.y + dy;
    if (!walkT(m, nx, ny)) continue;
    const j = MI(m, nx, ny);
    if (!m.zocc[j] && !m.uocc[j]) opts.push(j);
  }
  if (opts.length) await zMove(m, z, pick(opts));
}
async function bashDoor(m, z, i) {
  const brute = z.type === 'brute';
  m.doorHP[i] = (m.doorHP[i] ?? 6) - (brute ? rint(4, 6) : rint(1, 3));
  z.ap -= 2;
  const x = i % m.w, y = (i / m.w) | 0, seen = m.vis[i];
  if (seen) { await swing(z, x, y, 460); Sfx.play('bash', { x, y }); R.shake(3); FX.chips(x, y); }
  else Sfx.play('bash', { x, y, vol: 0.5 });
  noise(m, x, y, 5);
  if (m.doorHP[i] <= 0) {
    m.tiles[i] = T.DOOR_BROKEN;
    if (seen) { FX.text(x, y, 'дверь выбита', '#e8a62b'); HUD.log('Зомби выломал дверь.'); }
    computeVis(m);
  } else if (seen) await sleep(spd(80));
}
async function zombieAttack(m, z, u) {
  const t = ZT[z.type];
  if (CFG.follow) R.ensureVisible(u.x, u.y);
  Sfx.play('zswipe', { x: z.x, y: z.y });
  await swing(z, u.x, u.y, 500);
  if (rnd() < t.acc) {
    const d = rint(t.dmg[0], t.dmg[1]);
    u.hp -= d;
    u.hitT = performance.now(); R.until = Math.max(R.until, u.hitT + 280);
    FX.blood(u.x, u.y);
    FX.text(u.x, u.y, '−' + d, '#ff6a50');
    knock(u, z.x, z.y, 0.16);
    Sfx.play('hurt', { x: u.x, y: u.y }); vibrate(70); R.shake(5);
    let msg = `${t.name} ранит: ${u.name} −${d}`;
    if (!u.bitten && u.hp > 0 && rnd() < t.bite * (u.trait === 'tough' ? 0.5 : 1)) {
      u.bitten = true;
      FX.text(u.x, u.y - 0.6, 'УКУС', '#a4d03c');
      msg += '. Укус! Нужны медикаменты.';
      vibrate([60, 60, 120]);
    }
    HUD.log(msg, 'bad');
    if (u.hp <= 0) killUnit(m, u);
  } else { FX.text(u.x, u.y, 'увернулся', '#cfc6ae'); knock(u, z.x, z.y, 0.1); }
  await sleep(spd(260));
}
function killUnit(m, u) {
  u.dead = true; u.hp = 0; u.ow = null;
  if (m.uocc) m.uocc[MI(m, u.x, u.y)] = 0;
  m.decals.push({ x: u.x, y: u.y, k: 'ucorpse', r: rnd(), f: u.f ?? 2, t0: performance.now(), u: { id: u.sid, name: u.name, g: u.g, color: u.color, melee: u.melee, ranged: u.ranged, trait: u.trait } });
  R.until = Math.max(R.until, performance.now() + 700);
  HUD.log(`${u.name} ${gv(u, 'погиб', 'погибла')}.`, 'bad');
  Sfx.play('death'); vibrate(250);
  for (const z of m.zombies) if (z.target === u.id) { z.state = 'investigate'; z.tx = u.x; z.ty = u.y; }
  if (TAC.sel === u.id) { const n = liveUnits(m)[0]; TAC.sel = n ? n.id : 0; }
}
function damageZombie(m, z, d, u) {
  z.hp -= d;
  z.hitT = performance.now(); R.until = Math.max(R.until, z.hitT + 280);
  FX.blood(z.x, z.y, d > 6 ? 14 : 9);
  FX.text(z.x, z.y, '−' + d, '#ffd27a');
  if (z.hp <= 0) { killZombie(m, z, u); return true; }
  if (z.state !== 'chase') { z.state = 'chase'; z.target = u.id; z.tx = u.x; z.ty = u.y; }
  if (u) knock(z, u.x, u.y, 0.18);
  Sfx.play('flesh', { x: z.x, y: z.y });
  return false;
}
function killZombie(m, z, u) {
  m.zombies = m.zombies.filter(o => o !== z);
  if (m.zocc) m.zocc[MI(m, z.x, z.y)] = 0;
  m.decals.push({ x: z.x, y: z.y, k: 'corpse', r: rnd(), zt: z.type, zid: z.id, f: z.f ?? 2, t0: performance.now() });
  R.until = Math.max(R.until, performance.now() + 700);
  if (u) { u.kills++; m.kills++; }
  Sfx.play('zdie', { x: z.x, y: z.y });
}
async function overwatchCheck(m, z) {
  let fired = false;
  for (const u of liveUnits(m)) {
    if (!u.ow || z.hp <= 0) continue;
    if (u.ow === 'gun' && u.ammo > 0 && zVisible(m, z) && edist(u.x, u.y, z.x, z.y) <= WEAP[u.ranged].range + 0.5 && los(m, u, z)) {
      u.ow = null; fired = true;
      FX.text(u.x, u.y, 'ЗАСАДА', '#e8a62b');
      await shootAt(m, u, z, true);
    } else if (u.ow === 'melee' && adjOK(m, u.x, u.y, z.x, z.y)) {
      u.ow = null; fired = true;
      FX.text(u.x, u.y, 'ВСТРЕЧНЫЙ', '#e8a62b');
      Sfx.play('whoosh', { x: u.x, y: u.y });
      await swing(u, z.x, z.y);
      const w = WEAP[u.melee];
      Sfx.play(MELEE_SND[u.melee] || 'hit_bat', { x: z.x, y: z.y });
      damageZombie(m, z, rint(w.dmg[0], w.dmg[1]) + u.meleeB, u);
      noise(m, u.x, u.y, w.noise);
      await sleep(spd(120));
    }
  }
  return fired;
}
async function zombieAct(m, z) {
  const t = ZT[z.type];
  z.ap = t.ap + (timeOfDay(m) === 2 && z.type !== 'brute' ? 1 : 0);
  perceive(m, z);
  if (t.scream && z.state === 'chase' && !z.screamed) { await scream(m, z); return; }
  if (z.state === 'idle') { if (chance(0.18)) await wander(m, z); return; }
  if (z.state === 'wander') { await wander(m, z); if (chance(0.2)) z.state = 'idle'; return; }
  let path = null, key = '';
  for (let guard = 0; z.ap > 0 && z.hp > 0 && guard < 30; guard++) {
    let tx, ty;
    if (z.state === 'chase') {
      const u = m.units.find(o => o.id === z.target && !o.dead && !o.evac);
      if (!u) { z.state = 'investigate'; continue; }
      if (adjOK(m, z.x, z.y, u.x, u.y)) { await zombieAttack(m, z, u); z.ap = 0; break; }
      tx = u.x; ty = u.y;
    } else if (z.state === 'investigate') {
      if (cheb(z.x, z.y, z.tx, z.ty) <= 1) { z.state = 'idle'; break; }
      tx = z.tx; ty = z.ty;
    } else break;
    const k = tx + ',' + ty;
    if (!path || !path.length || key !== k) { path = zPath(m, z, tx, ty); key = k; }
    let next;
    if (!path || !path.length) { next = sideStep(m, z, tx, ty); if (next < 0) { if (z.state === 'investigate') z.state = 'idle'; break; } path = null; }
    else next = path[0];
    if (m.tiles[next] === T.DOOR) { await bashDoor(m, z, next); continue; }
    if (m.zocc[next] || m.uocc[next]) { next = sideStep(m, z, tx, ty); path = null; if (next < 0) break; }
    else if (path) path.shift();
    await zMove(m, z, next);
    z.ap -= TP[m.tiles[next]].cost;
    await overwatchCheck(m, z);
    if (z.hp <= 0) break;
    if (perceive(m, z)) { path = null; if (t.scream && !z.screamed) { await scream(m, z); break; } }
  }
}
async function scream(m, z) {
  z.screamed = true;
  if (zVisible(m, z)) { R.ensureVisible(z.x, z.y); FX.text(z.x, z.y, 'КРИК!', '#e08fa0'); HUD.log('Крикун поднял тревогу. Сюда идут все, кто слышал.', 'bad'); }
  Sfx.play('scream', { x: z.x, y: z.y, fall: 40 });
  noise(m, z.x, z.y, 16);
  m.tp += 3;
  await sleep(spd(380));
}
function spawnWave(m) {
  const lu = liveUnits(m);
  if (!lu.length) return;
  const n = 2 + m.threat + Math.floor(S.day / 4) + (timeOfDay(m) === 2 ? 2 : 0);
  const recent = m.lastNoise && m.turn - m.lastNoise.turn <= 4;
  const tg = recent ? m.lastNoise : (() => { const u = pick(lu); return { x: u.x, y: u.y }; })();
  let made = 0;
  for (let k = 0; k < 300 && made < n; k++) {
    const i = pick(m.edge), x = i % m.w, y = (i / m.w) | 0;
    if (m.vis[i] || m.zocc[i] || m.uocc[i]) continue;
    if (lu.some(u => edist(u.x, u.y, x, y) < 10)) continue;
    const z = addZombie(m, x, y, pickZType(S.day, m.threat), 'investigate');
    z.tx = clamp(tg.x + rint(-4, 4), 0, m.w - 1); z.ty = clamp(tg.y + rint(-4, 4), 0, m.h - 1);
    made++;
  }
  HUD.log(`Угроза ${m.threat}: с окраин подтягиваются ещё ${made}.`, 'warn');
  HUD.flash();
  Sfx.play('alarm');
}

// ----- Действия бойцов -----
function canAct() { return TAC.m && TAC.m.phase === 'player' && !TAC.busy; }
async function act(fn) {
  if (!canAct()) return;
  TAC.busy = true; TAC.pend = null; HUD.hidePop(); HUD.refresh();
  try { await fn(); } catch (e) { console.error(e); }
  TAC.busy = false;
  afterAction();
}
function afterAction() {
  const m = TAC.m;
  if (!m) return;
  if (!liveUnits(m).length) { finishMission(); return; }
  if (!curUnit()) { const n = liveUnits(m)[0]; TAC.sel = n ? n.id : 0; }
  const cu = curUnit();
  if (CFG.autoNext && cu && cu.ap <= 0 && m.phase === 'player' && !TAC.busy) {
    const n = liveUnits(m).find(o => o.ap > 0);
    if (n) { selectUnit(n); return; }
  }
  refreshReach();
  HUD.refresh();
}
function doMove(u, j) {
  return act(async () => {
    const m = TAC.m, path = pathTo(m, TAC.reach, j);
    if (!path) return;
    const seen0 = new Set(visibleZombies(m).map(z => z.id));
    for (const i of path) {
      const x = i % m.w, y = (i / m.w) | 0;
      if (unitAt(m, x, y)) break;
      const z = zombieAt(m, x, y);
      if (z) { HUD.log(`${u.name}: путь преграждает ${ZT[z.type].name.toLowerCase()}!`, 'warn'); computeVis(m); break; }
      const cost = TP[m.tiles[i]].cost;
      if (u.ap < cost) break;
      if (m.tiles[i] === T.DOOR) { m.tiles[i] = T.DOOR_OPEN; Sfx.play('door', { x, y }); }
      Sfx.play('step', { x, y, surf: surfAt(m, x, y) });
      await animTo(u, x, y, spd(STEP_MS));
      u.ap -= cost; u.ow = null;
      computeVis(m);
      const spotted = visibleZombies(m).filter(o => !seen0.has(o.id));
      if (spotted.length) {
        FX.text(u.x, u.y, '!', '#e8a62b');
        HUD.log(`${u.name} замечает: ${spotted.map(o => ZT[o.type].name.toLowerCase()).join(', ')}.`, 'warn');
        break;
      }
    }
  });
}
function doMelee(u, z) {
  return act(async () => {
    const m = TAC.m, w = WEAP[u.melee];
    if (u.ap < w.ap || !adjOK(m, u.x, u.y, z.x, z.y)) return;
    u.ap -= w.ap; u.ow = null;
    const sneak = z.state === 'idle' || z.state === 'wander';
    Sfx.play('whoosh', { x: u.x, y: u.y, dur: u.melee === 'knife' ? 0.12 : 0.22 });
    await swing(u, z.x, z.y);
    if (sneak && w.assassin) {
      FX.text(z.x, z.y, 'тихо', '#ece4cc');
      Sfx.play('stab', { x: z.x, y: z.y });
      FX.blood(z.x, z.y, 8);
      HUD.log(`${u.name} бесшумно снимает: ${ZT[z.type].name.toLowerCase()}.`);
      killZombie(m, z, u);
      noise(m, u.x, u.y, 1);
    } else {
      if (rnd() < (sneak ? 1 : 0.85)) {
        Sfx.play(MELEE_SND[u.melee] || 'hit_bat', { x: z.x, y: z.y }); R.shake(2);
        let d = rint(w.dmg[0], w.dmg[1]) + u.meleeB;
        if (sneak) { d *= 2; FX.text(u.x, u.y, 'со спины', '#ece4cc'); }
        if (damageZombie(m, z, d, u)) HUD.log(`${u.name} добивает: ${ZT[z.type].name.toLowerCase()}.`);
      } else FX.text(z.x, z.y, 'мимо', '#cfc6ae');
      noise(m, u.x, u.y, w.noise);
    }
    await sleep(spd(280));
  });
}
function shotChance(m, u, z, reaction) {
  const w = WEAP[u.ranged], d = edist(u.x, u.y, z.x, z.y);
  let p = w.acc + u.accB - Math.max(0, d - w.opt) * w.fall;
  if (TP[m.tiles[MI(m, z.x, z.y)]].hide) p -= 0.15;
  if (reaction) p -= 0.1;
  return clamp(p, 0.05, 0.95);
}
function canShoot(m, u, z) {
  const w = WEAP[u.ranged];
  return !!w && u.ammo > 0 && zVisible(m, z) && edist(u.x, u.y, z.x, z.y) <= w.range + 0.5 && los(m, u, z);
}
function silenced(u) { return WEAP[u.ranged] && WEAP[u.ranged].silenceable && S.build.workshop >= 2; }
async function shootAt(m, u, z, reaction) {
  const w = WEAP[u.ranged];
  if (!reaction) u.ap -= w.ap;
  u.ammo--;
  u.f = dirIdx(z.x - u.x, z.y - u.y);
  u.aimT = performance.now() + Math.max(200, spd(560));
  R.until = Math.max(R.until, u.aimT);
  R.dirty = true;
  await sleep(spd(130));
  FX.flash(u.x, u.y, u.f);
  const p = shotChance(m, u, z, reaction), d0 = edist(u.x, u.y, z.x, z.y);
  Sfx.play(silenced(u) ? 'silenced' : w.snd, { x: u.x, y: u.y, fall: 40 });
  knock(u, z.x, z.y, 0.05, 140);
  FX.tracer(u.x, u.y, z.x, z.y);
  R.shake(w.noise > 15 ? 3 : 1);
  noise(m, u.x, u.y, silenced(u) ? 4 : w.noise);
  await sleep(spd(140));
  if (rnd() < p) {
    let d = rint(w.dmg[0], w.dmg[1]) + u.dmgB;
    if (w.close && d0 > 3) d = Math.round(d * 0.6);
    if (rnd() < 0.1) { d = Math.round(d * 1.5); FX.text(z.x, z.y - 0.5, 'в голову', '#ffd27a'); }
    if (damageZombie(m, z, d, u)) HUD.log(`${u.name}: ${ZT[z.type].name.toLowerCase()} готов.`);
  } else FX.text(z.x, z.y, 'промах', '#cfc6ae');
  await sleep(spd(160));
}
function doShoot(u, z) {
  return act(async () => {
    const m = TAC.m;
    if (!canShoot(m, u, z) || u.ap < WEAP[u.ranged].ap) return;
    u.ow = null;
    await shootAt(m, u, z, false);
  });
}
function doLure(u, x, y) {
  return act(async () => {
    const m = TAC.m;
    if (u.lures <= 0 || u.ap < 2) return;
    u.ap -= 2; u.lures--; u.ow = null;
    FX.arc(u.x, u.y, x, y);
    Sfx.play('throw', { x, y });
    await sleep(spd(380));
    noise(m, x, y, 9);
    HUD.log(`${u.name} бросает бутылку. Зомби пойдут на звон.`);
  });
}
function doDoor(u, i) {
  return act(async () => {
    const m = TAC.m, t = m.tiles[i], x = i % m.w, y = (i / m.w) | 0;
    if (u.ap < 1 || cheb(u.x, u.y, x, y) !== 1) return;
    if (t === T.DOOR) m.tiles[i] = T.DOOR_OPEN;
    else if (t === T.DOOR_OPEN) { if (unitAt(m, x, y) || zombieAt(m, x, y)) return; m.tiles[i] = T.DOOR; }
    else return;
    u.ap -= 1;
    Sfx.play('door', { x, y });
    computeVis(m);
  });
}
function doBandage(u, target) {
  return act(async () => {
    if (u.bandages <= 0 || u.ap < 2 || target.hp >= target.maxhp) return;
    const heal = 4 + (u.trait === 'medic' ? 3 : 0);
    const before = target.hp;
    target.hp = Math.min(target.maxhp, target.hp + heal);
    u.bandages--; u.ap -= 2; u.ow = null;
    FX.text(target.x, target.y, '+' + (target.hp - before), '#86c25d');
    Sfx.play('heal');
    await sleep(spd(200));
  });
}
function doOverwatch(u) {
  return act(async () => {
    if (u.ranged && u.ammo > 0 && u.ap >= WEAP[u.ranged].ap) u.ow = 'gun';
    else if (u.ap >= WEAP[u.melee].ap) u.ow = 'melee';
    else return;
    u.ap = 0;
    FX.text(u.x, u.y, 'засада', '#e8a62b');
    Sfx.play('click');
  });
}
function doEvac(u) {
  return act(async () => {
    const m = TAC.m;
    if (!inEvac(m, u) || u.ap < 1) return;
    u.evac = true; u.ow = null;
    Sfx.play('evac');
    HUD.log(`${u.name} в машине.`);
    if (!liveUnits(m).length) { finishMission(); return; }
    TAC.sel = liveUnits(m)[0].id;
    R.centerOn(liveUnits(m)[0].x, liveUnits(m)[0].y);
  });
}
function doSearch(u, i) {
  const m = TAC.m, c = m.cont[i], x = i % m.w, y = (i / m.w) | 0;
  if (!c || !canAct() || cheb(u.x, u.y, x, y) > 1) return;
  if (!c.s) {
    if (u.ap < 2) { HUD.log('Не хватает ОД: обыск стоит 2.', 'warn'); return; }
    u.ap -= 2; u.ow = null; c.s = 1;
    if (u.trait === 'mechanic' && chance(0.6)) c.loot.parts = (c.loot.parts || 0) + 1;
