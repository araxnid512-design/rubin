    if (!m || !inf) return;
    const cv = $('#tMini'), r = cv.getBoundingClientRect();
    const p = toApp(e.clientX, e.clientY), q = toApp(r.left, r.top), q2 = toApp(r.right, r.bottom);
    const left = Math.min(q.x, q2.x), top = Math.min(q.y, q2.y);
    const x = Math.floor(((p.x - left) * inf.dpr - inf.ox) / inf.k), y = Math.floor(((p.y - top) * inf.dpr - inf.oy) / inf.k);
    if (inb(m, x, y)) { R.centerOn(x, y, true); this.closeMap(); }
  },
  openMenu() {
    if (TAC.m && TAC.m.siege) {
      Game.modal({
        title: 'Оборона на паузе',
        html: `<p>Ход ${TAC.m.turn}. Можно запереться в насосной и переждать: люди уцелеют, но нападающие растащат часть припасов.</p>`,
        buttons: [
          { label: CFG.music ? 'Музыка: выкл' : 'Музыка: вкл', fn: () => Game.toggleMusic() },
          { label: 'Настройки', fn: () => Game.openSettings() },
          { label: 'Запереться и переждать', cls: 'danger', fn: () => abandonMission() },
          { label: 'Продолжить', cls: 'primary' },
        ],
      });
      return;
    }
    Game.modal({
      title: 'Вылазка на паузе',
      html: `<p>Ход ${TAC.m.turn}. Если покинуть вылазку сейчас, уедут только те, кто стоит в зелёной зоне у машины. Остальные останутся на карте навсегда.</p>`,
      buttons: [
        { label: CFG.music ? 'Музыка: выкл' : 'Музыка: вкл', fn: () => Game.toggleMusic() },
        { label: 'Настройки', fn: () => Game.openSettings() },
        { label: 'Покинуть вылазку', cls: 'danger', fn: () => this.confirmAbandon() },
        { label: 'Продолжить', cls: 'primary' },
      ],
    });
  },
  confirmAbandon() {
    const m = TAC.m, left = liveUnits(m).filter(u => !inEvac(m, u));
    Game.modal({
      title: 'Покинуть вылазку?',
      html: left.length ? `<p>Останутся на карте: <b>${left.map(u => esc(u.name)).join(', ')}</b>. Их больше не будет в группе.</p>` : '<p>Все живые бойцы у машины и уедут вместе.</p>',
      buttons: [{ label: 'Отмена' }, { label: left.length ? 'Бросить их и уехать' : 'Уехать', cls: 'danger', fn: () => abandonMission() }],
    });
  },
};

// ----- Касания: тап, перетаскивание, щипок -----
const Input = {
  ptrs: new Map(), start: null, moved: false,
  attach(cv) {
    cv.addEventListener('pointerdown', e => this.down(e));
    cv.addEventListener('pointermove', e => this.move(e));
    cv.addEventListener('pointerup', e => this.up(e));
    cv.addEventListener('pointercancel', e => { this.ptrs.delete(e.pointerId); if (!this.ptrs.size) this.start = null; });
    cv.addEventListener('wheel', e => {
      if (R.mode !== 'tac' && R.mode !== 'base') return;
      e.preventDefault();
      const p = toApp(e.clientX, e.clientY);
      R.zoomAt(p.x, p.y, e.deltaY < 0 ? 1.15 : 1 / 1.15);
      HUD.hidePop();
    }, { passive: false });
  },
  mid() { const [a, b] = [...this.ptrs.values()]; return [(a.x + b.x) / 2, (a.y + b.y) / 2, Math.hypot(a.x - b.x, a.y - b.y)]; },
  down(e) {
    if (R.mode !== 'tac' && R.mode !== 'base') return;
    Sfx.init();
    try { e.target.setPointerCapture(e.pointerId); } catch (er) { /* старые браузеры */ }
    const p = toApp(e.clientX, e.clientY);
    this.ptrs.set(e.pointerId, p);
    if (this.ptrs.size === 1) { this.start = { x: p.x, y: p.y, t: performance.now() }; this.moved = false; R.panStart(p.x, p.y); }
    else if (this.ptrs.size === 2) { const [mx, my, d] = this.mid(); R.pinchStart(mx, my, d); this.moved = true; }
  },
  move(e) {
    if (!this.ptrs.has(e.pointerId)) return;
    const p = toApp(e.clientX, e.clientY);
    this.ptrs.set(e.pointerId, p);
    if (this.ptrs.size === 1 && this.start) {
      if (!this.moved && Math.hypot(p.x - this.start.x, p.y - this.start.y) > 9) { this.moved = true; HUD.hidePop(); }
      if (this.moved) R.panTo(p.x, p.y);
    } else if (this.ptrs.size >= 2) { const [mx, my, d] = this.mid(); R.pinchTo(mx, my, d); HUD.hidePop(); }
  },
  up(e) {
    const p = this.ptrs.get(e.pointerId);
    this.ptrs.delete(e.pointerId);
    if (!p) return;
    if (this.ptrs.size === 0) {
      if (!this.moved && this.start && performance.now() - this.start.t < 700) HUD.tap(p.x, p.y);
      this.start = null;
    } else if (this.ptrs.size === 1) {
      const q = [...this.ptrs.values()][0];
      this.start = { x: q.x, y: q.y, t: 0 }; this.moved = true; R.panStart(q.x, q.y);
    }
  },
};
</script>
<script>
'use strict';
// ---------- Убежище: отряд, постройки, мастерская, ночь ----------

const RECIPES = [
  { id: 'ammo', name: 'Патроны ×6', need: 1, cost: { parts: 2 }, give: { ammo: 6 }, desc: 'Переснаряжённые гильзы, порох из старых запасов.' },
  { id: 'seeds', name: 'Семена', need: 1, cost: { food: 3 }, give: { seeds: 1 }, desc: 'Отобрать зерно и картофель на посадку.' },
  { id: 'meds', name: 'Аптечка', need: 2, cost: { parts: 2, water: 2 }, give: { meds: 1 }, desc: 'Кипячёные бинты, спирт, шина.' },
  { id: 'fuel', name: 'Канистра спирта', need: 2, cost: { parts: 2, food: 3 }, give: { fuel: 1 }, desc: 'Перегонка из остатков еды. Машина заводится.' },
];
const WORKSHOP_PERKS = ['', '+1 приманка каждому на вылазке', 'Глушители: пистолет слышно на 4 клетки вместо 13', 'Оружейник: +1 урон всем'];

function addLog(t, c = '') { S.log.unshift({ d: S.day, t, c }); if (S.log.length > 80) S.log.length = 80; }
function hasMechanic() { return S.survivors.some(s => s.trait === 'mechanic'); }
function recipeCost(r) {
  const c = Object.assign({}, r.cost);
  if (hasMechanic() && c.parts) c.parts = Math.max(1, c.parts - 1);
  return c;
}
function canPay(cost) { return Object.keys(cost).every(k => (S.res[k] || 0) >= cost[k]); }
function pay(cost) { for (const k in cost) S.res[k] -= cost[k]; }
function costChips(cost) {
  return Object.keys(cost).map(k => `<span class="cc ${(S.res[k] || 0) >= cost[k] ? '' : 'miss'}" title="${RES[k].name}">${icon(k)}${cost[k]}</span>`).join('');
}
function cureCost() { return [0, 3, 2, 1][S.build.infirmary]; }

function newSurvivor() {
  const used = new Set(S.survivors.map(s => s.name));
  const pool = NAMES.filter(n => !used.has(n[0]));
  const [name, g] = pick(pool.length ? pool : NAMES);
  const trait = pick(Object.keys(TRAITS));
  const usedC = new Set(S.survivors.map(s => s.color));
  const color = UNIT_COLORS.find(c => !usedC.has(c)) || pick(UNIT_COLORS);
  const v = rnd();
  const ranged = v < 0.3 ? 'pistol' : v < 0.45 ? 'shotgun' : v < 0.55 ? 'rifle' : null;
  const hp = rint(11, 14) + (trait === 'tough' ? 4 : 0);
  return { id: S.nid++, name, g, trait, melee: pick(['knife', 'bat', 'crowbar', 'axe']), ranged, hp, maxhp: hp, color, kills: 0, level: 1, infected: 0 };
}

function newGameState() {
  S = {
    v: 1, day: 1, nid: 1, mission: null, log: [], squad: [], over: false,
    res: { food: 10, water: 10, parts: 6, meds: 2, ammo: 24, fuel: 3, tools: 0, seeds: 0 },
    build: { walls: 0, infirmary: 0, garden: 0, water: 0, workshop: 0, radio: 0 },
    survivors: [],
  };
  const mk = (name, g, trait, melee, ranged, hp, color) => ({ id: S.nid++, name, g, trait, melee, ranged, hp: hp + (trait === 'tough' ? 4 : 0), maxhp: hp + (trait === 'tough' ? 4 : 0), color, kills: 0, level: 1, infected: 0 });
  S.survivors.push(
    mk('Марина', 'f', 'medic', 'knife', 'pistol', 13, UNIT_COLORS[1]),
    mk('Гоша', 'm', 'strong', 'bat', null, 15, UNIT_COLORS[2]),
    mk('Лёха', 'm', 'marksman', 'crowbar', 'pistol', 13, UNIT_COLORS[0]),
    mk('Семёныч', 'm', 'hunter', 'axe', 'shotgun', 12, UNIT_COLORS[3]),
  );
  S.squad = [1, 2, 3];
  ensureWorld();
  addLog('Мы заняли старую насосную станцию на окраине. Стены крепкие, но еды и воды хватит дня на два.');
  addLog('Первую вылазку лучше сделать на ферму: туда можно дойти пешком. Все места — на карте округи.');
}

// Зоны карты базы: касание открывает нужную постройку
const BASE_ZONES = [
  ['radio', 26, 4, 28, 6], ['garden', 5, 6, 13, 15], ['water', 28, 5, 34, 13], ['infirmary', 5, 18, 12, 24],
  ['workshop', 26, 16, 34, 27], ['walls', 0, 0, 39, 4], ['walls', 0, 29, 39, 35], ['walls', 0, 0, 5, 35], ['walls', 34, 0, 39, 35],
];
const DOCK = { build: ['Постройки', 'home'], arms: ['Оружие', 'target'], craft: ['Мастерская', 'hammer'], fac: ['Группировки', 'shield'], log: ['Журнал', 'log'] };
const wStat = w => { const W = WEAP[w]; return W.melee ? `урон ${W.dmg[0]}–${W.dmg[1]}, ${W.ap} ОД${W.assassin ? ', тихо' : ''}` : `урон ${W.dmg[0]}–${W.dmg[1]}, дальность ${W.range}, шум ${W.noise}`; };

const Base = {
  tab: null, hl: null, life: null,
  // ----- сцена: карта базы с людьми у костра -----
  scene() {
    const { m } = genBase(S);
    m.seen = new Uint8Array(m.n).fill(1); m.vis = new Uint8Array(m.n).fill(1);
    m.units = []; m.zombies = []; m.turn = 1; m.tod = 0;
    m.uocc = new Uint8Array(m.n); m.zocc = new Uint8Array(m.n);
    const ents = [], spots = m.idle.slice(), sick = [[7, 22], [9, 22], [11, 22]];
    for (const s of S.survivors) {
      const hurt = S.build.infirmary && (s.infected || s.hp < s.maxhp * 0.5) && sick.length;
      const [x, y] = hurt ? sick.shift() : spots.shift() || [20 + rint(-3, 3), 17];
      const e = { id: s.id, name: s.name, g: s.g, color: s.color, melee: s.melee, ranged: s.ranged, trait: s.trait, x, y, hp: s.hp, maxhp: s.maxhp };
      e.f = dirIdx(20 - x, 20 - y);
      ents.push({ e });
      m.uocc[MI(m, x, y)] = 1;
    }
    R.base = { m, ents };
  },
  startLife() {
    clearInterval(this.life);
    this.life = setInterval(() => this.lifeTick(), 2600);
  },
  stopLife() { clearInterval(this.life); this.life = null; },
  async lifeTick() {
    const B = R.base;
    if (R.mode !== 'base' || !B || document.hidden) return;
    const free = B.ents.filter(it => !it.busy);
    if (!free.length || chance(0.35)) return;
    const it = pick(free), e = it.e, m = B.m;
    const spot = pick(m.idle.filter(([x, y]) => !m.uocc[MI(m, x, y)]));
    if (!spot) return;
    const path = zPath(m, e, spot[0], spot[1]);
    if (!path || !path.length || path.length > 14) return;
    it.busy = true;
    m.uocc[MI(m, e.x, e.y)] = 0;
    for (const j of path) { if (R.mode !== 'base' || R.base !== B) break; await animTo(e, j % m.w, (j / m.w) | 0, 330); }
    m.uocc[MI(m, e.x, e.y)] = 1;
    e.f = dirIdx(20 - e.x, 20 - e.y);
    it.busy = false; R.dirty = true;
  },
  frame() {
    const root = $('#scr-base');
    const lw = $('.survs', root) ? $('.survs', root).offsetWidth : 0, rw = $('.dock', root) ? $('.dock', root).offsetWidth : 0;
    R.cam.k = clamp(Math.round(R.H / 15.5), 22, 36);
    R.cam.cx = 20; R.cam.cy = 16.5; R.camAnim = null;
    R.panStart(0, 0); R.panTo((lw - rw) / 2, R.H * 0.03); R.pan = null;
    R.dirty = true;
  },
  tapMap(x, y) {
    const e = R.pick(x, y);
    if (e && e.name) {
      const s = S.survivors.find(o => o.id === e.id);
      if (s) { Sfx.play('click'); Game.toast(`${s.name}: ${TRAITS[s.trait].name.toLowerCase()}, ${s.hp}/${s.maxhp}${s.infected ? ', укус' : ''}`); }
      return;
    }
    const t = R.toTile(x, y);
    const z = BASE_ZONES.find(([, x0, y0, x1, y1]) => t.x >= x0 && t.x <= x1 && t.y >= y0 && t.y <= y1);
    if (z) { Sfx.play('click'); this.tab = 'build'; this.hl = z[0]; this.render(); }
  },
  // ----- интерфейс -----
  render() {
    const root = $('#scr-base');
    ensureWorld();
    const n = S.survivors.length, tr = S.fac.collectors.tribute;
    const due = tr && !tr.paid && !S.fac.collectors.beaten ? tr.due - S.day : null;
    root.innerHTML = `
      <header class="bbar">
        <div class="brand">Рубеж</div>
        <div class="day"><span>День</span><b>${S.day}</b><small>из ${VICTORY_DAY}</small></div>
        ${due != null ? `<button class="chip-tr ${due <= 0 ? 'now' : ''}" id="bTr">${icon('shield')}<span>Доля Сборщикам ${due <= 0 ? 'сегодня' : `через ${due} ${plural(due, 'день', 'дня', 'дней')}`}</span></button>` : ''}
        <div class="resrow">${RES_ORDER.map(k => `<span class="res ${(k === 'food' || k === 'water') && S.res[k] < n ? 'low' : ''}" title="${RES[k].name}" style="--rc:${RES[k].color}">${icon(k)}<b>${S.res[k]}</b></span>`).join('')}</div>
        <button class="hbtn" id="bSet" aria-label="Настройки">${icon('gear')}</button>
      </header>
      <div class="bmain">
        <section class="survs">
          <h2>Группа <span>${n}/${GROUP_MAX}</span><small>за ночь: ${n} еды и ${n} воды</small></h2>
          <div class="slist">${S.survivors.map(s => this.card(s)).join('')}</div>
          <div class="bact">
            <button class="btn hazard big" id="bWorld">${icon('map')}<span>Карта округи</span></button>
            <button class="btn" id="bRest">${icon('moon')}<span>Отдыхать</span></button>
          </div>
        </section>
        <div class="bview"></div>
        <section class="dock ${this.tab ? 'open' : ''}">
          ${this.tab ? `<div class="dock-p">
            <header><h2>${DOCK[this.tab][0]}</h2><button class="hbtn" id="bClose" aria-label="Закрыть">${icon('close')}</button></header>
            <div class="tabc">${this['tab_' + this.tab]()}</div>
          </div>` : ''}
          <nav class="rail" role="tablist">${Object.keys(DOCK).map(k => `<button role="tab" aria-selected="${this.tab === k}" class="${this.tab === k ? 'on' : ''}" data-tab="${k}" title="${DOCK[k][0]}">${icon(DOCK[k][1])}<span>${DOCK[k][0]}</span></button>`).join('')}</nav>
        </section>
      </div>`;
    $('#bSet').onclick = () => { Sfx.play('click'); Game.openSettings(); };
    $('#bWorld').onclick = () => { Sfx.init(); Sfx.play('click'); Game.showWorld(); };
    $('#bRest').onclick = () => this.rest();
    const tb = $('#bTr'); if (tb) tb.onclick = () => { Sfx.play('click'); this.tab = 'fac'; this.render(); };
    const cl = $('#bClose'); if (cl) cl.onclick = () => { Sfx.play('click'); this.tab = null; this.hl = null; this.render(); this.frame(); };
    $$('.rail button', root).forEach(b => { b.onclick = () => { Sfx.play('click'); const k = b.dataset.tab; this.tab = this.tab === k ? null : k; this.hl = null; this.render(); this.frame(); }; });
    $$('canvas[data-pt]', root).forEach(cv => { const s = S.survivors.find(o => o.id === +cv.dataset.pt); if (s) try { drawPortrait(cv, s); } catch (e) { console.error(e); } });
    $$('[data-cure]', root).forEach(b => { b.onclick = () => this.cure(+b.dataset.cure); });
    $$('[data-build]', root).forEach(b => { b.onclick = () => this.build(b.dataset.build); });
    $$('[data-craft]', root).forEach(b => { b.onclick = () => this.craft(b.dataset.craft); });
    const pt = $('#bPay'); if (pt) pt.onclick = () => { payTribute(); this.render(); };
    $$('[data-eq]', root).forEach(sel => { sel.onchange = () => { if (equip(+sel.dataset.sid, sel.dataset.eq, sel.value || null)) { Sfx.play('pickup'); saveGame(); this.scene(); } this.render(); }; });
    $$('[data-scrap]', root).forEach(b => { b.onclick = () => { const w = b.dataset.scrap, n = scrapWeapon(w); if (n) { Sfx.play('build'); Game.toast(`${wName(w)}: разобрано, +${n} деталей`); addLog(`${wName(w)} разобран на детали (+${n}).`); saveGame(); } this.render(); }; });
    if (this.hl) { const el = $(`[data-bk="${this.hl}"]`, root); if (el) el.scrollIntoView({ block: 'nearest' }); }
  },
  card(s) {
    const hp = (s.hp / s.maxhp) * 100;
    return `<div class="sw">
      <div class="sc ${s.infected ? 'inf' : ''}" style="--uc:${s.color}">
        <canvas class="pt" data-pt="${s.id}" aria-hidden="true"></canvas>
        <span class="sc-top"><b>${esc(s.name)}</b><i class="trait" title="${esc(TRAITS[s.trait].desc)}">${TRAITS[s.trait].name}</i>${s.level > 1 ? `<i class="lvl">${icon('star')}${s.level}</i>` : ''}</span>
        <span class="bar ${hp < 40 ? 'lowhp' : ''}"><i style="width:${hp}%"></i></span>
        <span class="sc-meta">${s.hp}/${s.maxhp} · ${WEAP[s.melee].name}${s.ranged ? ' и ' + WEAP[s.ranged].name.toLowerCase() : ''}</span>
        ${s.infected ? `<span class="sc-inf">${icon('bite')}Укус: ${s.infected === 1 ? 'обратится этой ночью' : `обратится через ${s.infected} ${plural(s.infected, 'день', 'дня', 'дней')}`}</span>` : ''}
      </div>
      ${s.infected ? (S.build.infirmary >= 1 ? `<button class="btn sm cure" data-cure="${s.id}" ${S.res.meds >= cureCost() ? '' : 'disabled'}>Лечить: ${cureCost()} мед.</button>` : '<span class="cure-hint">Лечить укус можно только в лазарете</span>') : ''}
    </div>`;
  },
  tab_build() {
    return `<div class="blds">${BUILD_ORDER.map(k => {
      const B = BUILD[k], lv = S.build[k];
      let pips = '';
      for (let i = 0; i < B.max; i++) pips += `<i class="${i < lv ? 'on' : ''}"></i>`;
      const cost = lv < B.max ? B.cost[lv] : null;
      return `<div class="bld ${this.hl === k ? 'hl' : ''}" data-bk="${k}">
        <div class="bld-h"><b>${B.name}</b><span class="lv" title="Уровень ${lv} из ${B.max}">${pips}</span></div>
        <p class="now">${B.eff[lv]}</p>
        ${cost ? `<p class="next">Дальше: ${B.eff[lv + 1]}</p><div class="bld-f"><span class="cost">${costChips(cost)}</span><button class="btn sm" data-build="${k}" ${canPay(cost) ? '' : 'disabled'}>${lv ? 'Улучшить' : 'Построить'}</button></div>` : '<p class="max">Готово полностью</p>'}
      </div>`;
    }).join('')}</div>`;
  },
  tab_arms() {
    ensureArsenal();
    const ars = S.arsenal, mech = S.survivors.some(s => s.trait === 'mechanic') ? 1 : 0;
    const keys = MELEE_W.concat(RANGED_W).filter(w => ars[w]);
    const stock = keys.length ? keys.map(w => `<div class="ars-i">${icon(RANGED_W.includes(w) ? 'target' : 'melee')}<span><b>${wName(w)}</b> ×${ars[w]}<small>${wStat(w)}</small></span><button class="btn sm" data-scrap="${w}">Разобрать +${WSCRAP[w] + mech}</button></div>`).join('') :
      '<p class="dim">Пусто. Оружие находят в оружейных шкафах, сейфах полиции, армейских ящиках и на телах врагов.</p>';
    const sel = (slot, s) => {
      const cur = slot === 'melee' ? s.melee : s.ranged, list = slot === 'melee' ? MELEE_W : RANGED_W, o = [];
      if (slot === 'ranged') o.push(`<option value="" ${!cur ? 'selected' : ''}>без огнестрела</option>`);
      for (const w of list) if (w === cur || w === 'knife' || ars[w]) o.push(`<option value="${w}" ${w === cur ? 'selected' : ''}>${wName(w)}${w !== cur && ars[w] ? ` · в запасе ${ars[w]}` : ''}</option>`);
      return `<select data-eq="${slot}" data-sid="${s.id}" aria-label="${slot === 'melee' ? 'Ближний бой' : 'Огнестрел'}: ${esc(s.name)}">${o.join('')}</select>`;
    };
    const rows = S.survivors.map(s => `<div class="eq" style="--uc:${s.color}"><b>${esc(s.name)}</b>${sel('melee', s)}${sel('ranged', s)}<small>${s.ranged ? wStat(s.ranged) : wStat(s.melee)}</small></div>`).join('');
    return `<div class="ars"><h3>Запас</h3>${stock}</div><div class="eqs"><h3>Кто чем вооружён</h3>${rows}</div>
      <p class="dim">Смена оружия бесплатна: старое уходит в запас. Нож всегда под рукой.</p>`;
  },
  tab_craft() {
    const lv = S.build.workshop;
    const perks = WORKSHOP_PERKS.slice(1).map((p, i) => `<li class="${lv > i ? 'on' : ''}">${i + 1}. ${p}</li>`).join('');
    return `<div class="crafts">${RECIPES.map(r => {
      const cost = recipeCost(r), ok = lv >= r.need;
      return `<div class="rc">
        <div class="rc-t"><b>${r.name}</b><span>${r.desc}</span></div>
        <span class="cost">${costChips(cost)}</span>
        <button class="btn sm" data-craft="${r.id}" ${ok && canPay(cost) ? '' : 'disabled'}>${ok ? 'Сделать' : `Мастерская ${r.need}`}</button>
      </div>`;
    }).join('')}</div>
    <div class="perks"><h3>Мастерская, уровень ${lv}</h3><ul>${perks}</ul>${hasMechanic() ? '<p>Механик в группе: крафт на 1 деталь дешевле.</p>' : ''}</div>`;
  },
  tab_fac() {
    return `<div class="facs">${Object.keys(FACTIONS).map(f => {
      const F = FACTIONS[f], st = S.fac[f], camp = LOCS[F.camp];
      const status = st.beaten ? 'разгромлены' : !st.met ? 'неизвестны' : f === 'collectors' && st.tribute ? 'требуют долю' : 'враждебны';
      let extra = '';
      if (f === 'collectors' && st.tribute && !st.beaten) {
        const tr = st.tribute, d = tr.due - S.day;
        extra = tr.paid ? `<p class="ok">Доля отложена. Приедут ${d <= 0 ? 'этой ночью' : `через ${d} ${plural(d, 'день', 'дня', 'дней')}`}.</p>` :
          `<p class="warn">Приедут за долей ${d <= 0 ? 'этой ночью' : `через ${d} ${plural(d, 'день', 'дня', 'дней')}`}. Не отдадите — будет налёт.</p>
           <div class="bld-f"><span class="cost">${costChips(tr.cost)}</span><button class="btn sm" id="bPay" ${canPay(tr.cost) ? '' : 'disabled'}>Отложить долю</button></div>`;
      }
      return `<div class="fac ${st.beaten ? 'off' : ''}" style="--fc:${F.color}">
        <div class="bld-h"><b>${st.met || st.beaten ? F.name : '???'}</b><span class="fst">${status}</span></div>
        <p>${st.met || st.beaten ? F.desc : 'О них пока ничего не известно. Слухи доходят с дорог.'}</p>
        <p class="fmeta">${st.kills ? `Убито: ${st.kills}. ` : ''}Лагерь: ${isKnown(F.camp) ? `${camp.name}, на карте` : 'неизвестно где'}.</p>
        ${extra}
      </div>`;
    }).join('')}</div>`;
  },
  tab_log() {
    return `<ol class="journal">${S.log.map(e => `<li class="${e.c || ''}"><span>День ${e.d}</span>${esc(e.t)}</li>`).join('')}</ol>`;
  },
  cure(id) {
    const s = S.survivors.find(o => o.id === id), c = cureCost();
    if (!s || S.res.meds < c) return;
    S.res.meds -= c; s.infected = 0;
    addLog(`${s.name}: укус обработан, заражение остановлено.`, 'good');
    Sfx.play('heal');
    this.render(); saveGame();
  },
  build(k) {
    const B = BUILD[k], lv = S.build[k];
    if (lv >= B.max || !canPay(B.cost[lv])) return;
    pay(B.cost[lv]);
    S.build[k]++;
    addLog(`${B.name}: уровень ${S.build[k]}. ${B.eff[S.build[k]]}.`, 'good');
    if (k === 'radio') for (const l of LOC_ORDER) if (LOCS[l].needRadio === S.build.radio && !LOCS[l].camp && reveal(l)) addLog(`В эфире нашлось место: ${LOCS[l].name}. Теперь туда можно съездить.`, 'good');
    Sfx.play('build');
    Game.toast(`${B.name}: уровень ${S.build[k]}`);
    this.hl = k;
    this.scene();
    this.render(); saveGame();
  },
  craft(id) {
    const r = RECIPES.find(x => x.id === id), cost = recipeCost(r);
    if (S.build.workshop < r.need || !canPay(cost)) return;
    pay(cost);
    for (const k in r.give) S.res[k] += r.give[k];
    Sfx.play('search');
    Game.toast(`Готово: ${r.name}`);
    this.render(); saveGame();
  },
  rest() {
    Sfx.init();
    Game.modal({
      title: 'Пропустить день?',
      html: '<p>Группа останется в убежище: раны подлечатся, но еда и вода всё равно уйдут.</p>',
      buttons: [{ label: 'Отмена' }, { label: 'Отдыхать до утра', cls: 'primary', fn: () => this.night([]) }],
    });
  },
  missionReport(rep) {
    if (rep.siege) return this.siegeReport(rep);
    const L = LOCS[rep.loc];
    const got = RES_ORDER.filter(k => rep.got[k]).map(k => `<span class="cc" style="--rc:${RES[k].color}">${icon(k)}${RES[k].name} +${rep.got[k]}</span>`).join('');
    const hk = Object.values(rep.hkills || {}).reduce((a, b) => a + b, 0);
    if (rep.wpn && rep.wpn.length) rep.lines.unshift({ t: `Привезли оружие: ${wList(rep.wpn)}. Оно в арсенале — выдайте в панели «Оружие».`, c: 'good' });
    addLog(`${L.short}: вернулись за ${rep.turns} ${plural(rep.turns, 'ход', 'хода', 'ходов')}, убито: ${rep.kills}.`);
    for (const l of rep.lines) addLog(l.t, l.c);
    Game.modal({
      title: `${L.short}: итоги`,
      html: `<div class="rep">${got || '<p>Ничего не привезли.</p>'}</div>
        <p>Убито: <b>${rep.kills}</b>${hk ? `, из них людей: ${hk}` : ''}. Ходов: ${rep.turns}.</p>
        ${rep.lines.length ? `<ul class="lines">${rep.lines.map(l => `<li class="${l.c || ''}">${esc(l.t)}</li>`).join('')}</ul>` : ''}`,
      buttons: [{ label: 'Наступает ночь', cls: 'primary', fn: () => this.night([]) }],
      noClose: true,
    });
  },
  siegeReport(rep) {
    const pn = S.pendingNight || { lines: [] };
    const lines = siegeLines(rep).concat(rep.lines);
    S.pendingNight = null;
    const all = pn.lines.concat(lines);
    const got = RES_ORDER.filter(k => rep.got[k]).map(k => `<span class="cc" style="--rc:${RES[k].color}">${icon(k)}${RES[k].name} +${rep.got[k]}</span>`).join('');
    Game.modal({
      title: rep.siege.won ? 'Отбились' : rep.siege.fled ? 'Пересидели' : 'Ночь кончилась',
      html: `${got ? `<div class="rep">${got}</div>` : ''}<ul class="lines">${lines.map(l => `<li class="${l.c || ''}">${esc(l.t)}</li>`).join('')}</ul>`,
      buttons: [{ label: 'Дождаться утра', cls: 'primary', fn: () => this.nightEnd(all) }],
      noClose: true,
    });
  },
  // ----- ночь -----
  night(lines) {
    const ppl = S.survivors, n = ppl.length;
    const wProd = [1, 2, 3, 5][S.build.water], fProd = [0, 1, 2, 4][S.build.garden];
    S.res.water += wProd; S.res.food += fProd;
    lines.push({ t: `Убежище дало: ${[fProd ? `еда +${fProd}` : '', `вода +${wProd}`].filter(Boolean).join(', ')}.` });
    let hungry = 0, thirsty = 0;
    for (let k = 0; k < n; k++) {
      if (S.res.food > 0) S.res.food--; else hungry++;
      if (S.res.water > 0) S.res.water--; else thirsty++;
    }
    lines.push({ t: `Съедено ${n - hungry} еды, выпито ${n - thirsty} воды.` });
    if (hungry || thirsty) {
      for (let k = 0; k < hungry; k++) { const s = pick(ppl); s.hp -= 2; }
      for (let k = 0; k < thirsty; k++) { const s = pick(ppl); s.hp -= 3; }
      lines.push({ t: `Не хватило: ${[hungry ? `еды на ${hungry}` : '', thirsty ? `воды на ${thirsty}` : ''].filter(Boolean).join(', ')}. Люди слабеют.`, c: 'bad' });
    }
    const heal = [1, 3, 5, 7][S.build.infirmary] + (S.build.infirmary && ppl.some(s => s.trait === 'medic') ? 2 : 0);
    for (const s of ppl) if (s.hp > 0 && !s.infected) s.hp = Math.min(s.maxhp, s.hp + heal);
    for (const s of ppl.slice()) {
      if (!s.infected || s.hp <= 0) continue;
      s.infected--;
      if (s.infected <= 0) {
        S.survivors = S.survivors.filter(o => o !== s);
        dropGear(s);
        const other = S.survivors.length ? pick(S.survivors) : null;
        lines.push({ t: `Ночью ${s.name} ${gv(s, 'обратился', 'обратилась')}.${other ? ` ${other.name} ${gv(other, 'ранен', 'ранена')}, пока всё не кончилось.` : ''}`, c: 'bad' });
        if (other) other.hp -= 3;
      } else lines.push({ t: `${s.name}: жар. ${s.infected === 1 ? 'Без лечения — последняя ночь.' : `Осталось ${s.infected} ${plural(s.infected, 'день', 'дня', 'дней')}.`}`, c: 'bad' });
    }
    const atk = S.survivors.length ? rollAttack(lines) : null;
    if (atk) { this.alarm(atk, lines); return; }
    this.nightEnd(lines);
  },
  alarm(atk, lines) {
    S.pendingNight = { lines, atk };
    saveGame();
    Sfx.play('alarm');
    const fighters = S.survivors.filter(s => s.hp > 0).slice(0, SQUAD_MAX);
    Game.modal({
      title: 'Ночь. Тревога!',
      html: `<p>${attackText(atk)}</p><p>Можно встретить их у стен — бой на карте базы, ${fighters.length} ${plural(fighters.length, 'боец', 'бойца', 'бойцов')} против ${atk.waves} ${plural(atk.waves, 'волны', 'волн', 'волн')}. Или запереться в насосной и надеяться на укрепления (уровень ${S.build.walls}).</p>`,
      buttons: [
        { label: 'Запереться', fn: () => { const pn = S.pendingNight; S.pendingNight = null; resolveAuto(pn.atk, pn.lines); this.nightEnd(pn.lines); } },
        { label: 'К оружию!', cls: 'hazard', fn: () => { addLog(`Ночью на базу напали: ${SIEGE_NAME[atk.kind](atk)}. Приняли бой.`, 'bad'); startMission('base', fighters.map(s => s.id), { siege: atk }); } },
      ],
      noClose: true,
    });
  },
  nightEnd(lines) {
    for (const s of S.survivors.slice()) if (s.hp <= 0) {
      S.survivors = S.survivors.filter(o => o !== s);
      dropGear(s);
      lines.push({ t: `${s.name} не ${gv(s, 'пережил', 'пережила')} ночь.`, c: 'bad' });
    }
    const chanceRecruit = [0.06, 0.25, 0.4][S.build.radio];
    if (S.survivors.length && S.survivors.length < GROUP_MAX && rnd() < chanceRecruit) {
      const s = newSurvivor();
      S.survivors.push(s);
      S.stats.recruits++;
      lines.push({ t: `${S.build.radio ? 'На позывной ответили.' : 'Под утро в ворота постучали.'} ${s.name} (${TRAITS[s.trait].name.toLowerCase()}) теперь с нами.`, c: 'good' });
    }
    S.day++;
    if (S.survivors.length) { morningNews(lines); careerAdd({ bestDay: S.day }); }
    for (const l of lines) addLog(l.t, l.c);
    saveGame();
    if (!S.survivors.length) return this.gameOver();
    if (S.day > VICTORY_DAY) return this.victory();
    Game.showBase();
    Game.modal({
      title: `Утро. День ${S.day}`,
      html: `<ul class="lines">${lines.map(l => `<li class="${l.c || ''}">${esc(l.t)}</li>`).join('')}</ul>`,
      buttons: [{ label: 'В убежище', cls: 'primary', fn: () => { Game.showBase(); } }],
      noClose: true,
    });
  },
  gameOver() {
    S.over = true; saveGame();
    careerAdd({ runs: 1, bestDay: S.day - 1 });
    Game.modal({
      title: 'Убежище опустело',
      html: `<p>Группа продержалась ${S.day - 1} ${plural(S.day - 1, 'день', 'дня', 'дней')}. Ворота насосной станции так и остались открытыми.</p>`,
      buttons: [{ label: 'Начать заново', cls: 'primary', fn: () => Game.newGame() }],
      noClose: true,
    });
  },
  victory() {
    S.over = true; saveGame();
    careerAdd({ runs: 1, wins: 1, bestDay: VICTORY_DAY });
    Game.modal({
      title: 'Колонна пришла',
      html: `<p>На ${VICTORY_DAY}-й день по радио назвали точку сбора. Выжили: <b>${S.survivors.map(s => esc(s.name)).join(', ')}</b>.</p><p>Вы продержались. Можно начать заново и попробовать сохранить всех.</p>`,
      buttons: [{ label: 'Новая игра', cls: 'primary', fn: () => Game.newGame() }],
      noClose: true,
    });
  },
};
</script>
<script>
'use strict';
// ---------- Округа: карта локаций, разведка, группировки ----------

function ensureWorld() {
  if (!S) return;
  S.known = S.known || LOC_ORDER.filter(k => LOCS[k].start);
  S.known = S.known.filter(k => LOCS[k]);
  S.visits = S.visits || {};
  S.seed = S.seed || ((Math.random() * 2 ** 31) | 0) || 777;
  S.fac = S.fac || {};
  for (const f in FACTIONS) S.fac[f] = Object.assign({ met: false, beaten: false, kills: 0, anger: 0 }, S.fac[f]);
  if (S.fac.collectors.tribute === undefined) S.fac.collectors.tribute = null;
  ensureStats();
  ensureArsenal();
}
const isKnown = k => S.known.includes(k);
function reveal(k) { if (LOCS[k] && !isKnown(k)) { S.known.push(k); return true; } return false; }
function locLocked(k) { const L = LOCS[k]; return !!L.needRadio && S.build.radio < L.needRadio; }
const pdist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

function tributeCost() {
  const d = S.day;
  return { food: 3 + Math.floor(d / 5), water: 2 + Math.floor(d / 7), ammo: 4 + Math.floor(d / 4) };
}
function metFaction(f, lines) {
  const st = S.fac[f];
  if (!st || st.met) return;
  st.met = true;
  const F = FACTIONS[f];
  lines.push({ t: `Новая группировка: ${F.name}. ${F.desc}`, c: 'bad' });
}
function factionHit(f, n) { if (S.fac[f]) { S.fac[f].kills += n; S.fac[f].anger += n; } }
function factionBeaten(f, lines) {
  const st = S.fac[f];
  if (!st || st.beaten) return;
  st.beaten = true;
  const eff = {
    collectors: 'Сборщики больше не придут за долей.',
    raiders: 'Засад на дорогах станет меньше, ночных налётов Вольницы не будет.',
    flock: 'Паства рассеяна: стад мёртвых у стен больше не будет.',
    garrison: 'Гарнизон отошёл. Блокпост охраняет горстка солдат.',
  }[f];
  if (f === 'collectors') st.tribute = null;
  lines.push({ t: eff, c: 'good' });
}
// После вылазки: что увидели с крыш и что нашли на телах
function revealAfterMission(m, lines) {
  const L = LOCS[m.loc];
  const cand = LOC_ORDER.filter(k => !isKnown(k) && !LOCS[k].camp).sort((a, b) => pdist(L.pos, LOCS[a].pos) - pdist(L.pos, LOCS[b].pos));
  for (const k of cand.slice(0, chance(0.5) ? 2 : 1)) { reveal(k); lines.push({ t: `На карте новая точка: ${LOCS[k].name}.`, c: 'good' }); }
  for (const f in m.hseen || {}) {
    metFaction(f, lines);
    const camp = FACTIONS[f].camp;
    if ((m.hkills[f] || 0) >= 1 && !isKnown(camp)) { reveal(camp); lines.push({ t: `У убитого нашли карту с пометкой: ${LOCS[camp].name}.`, c: 'good' }); }
  }
}

// ----- нападения на базу -----
function rollAttack(lines) {
  const fc = S.fac, tr = fc.collectors.tribute;
  if (tr && !fc.collectors.beaten && S.day >= tr.due) {
    const paid = tr.paid;
    fc.collectors.tribute = { due: S.day + 6, cost: tributeCost(), paid: false };
    if (paid) { lines.push({ t: 'Сборщики приехали, забрали долю и уехали. Следующий раз — через шесть дней.' }); return null; }
    fc.collectors.anger++;
    return { kind: 'raid', fac: 'collectors', waves: S.day >= 16 ? 3 : 2 };
  }
  if (fc.raiders.met && !fc.raiders.beaten && S.day >= 6 && chance(0.09 + Math.min(0.1, fc.raiders.anger * 0.015))) return { kind: 'raid', fac: 'raiders', waves: 2 };
  if (fc.flock.met && !fc.flock.beaten && S.day >= 8 && chance(0.09)) return { kind: 'herd', waves: 2 };
  if (chance(clamp(0.1 + S.day * 0.012 - S.build.walls * 0.035, 0.05, 0.42))) return { kind: 'horde', waves: S.day >= 12 ? 3 : 2 };
  return null;
}
function attackText(atk) {
  if (atk.kind === 'horde') return 'Со стороны дороги идёт толпа мёртвых. Их много, и они уже у забора.';
  if (atk.kind === 'herd') return 'В темноте звенит колокольчик: Паства гонит к вашим стенам стадо мёртвых.';
  return atk.fac === 'collectors' ? 'Доли не было — Сборщики приехали сами. Фары, биты, крики у ворот.' : 'Вольница решила, что у вас есть чем поживиться. Тени у забора, щелчки затворов.';
}
// Если запереться и не выходить: решают стены и удача
function resolveAuto(atk, lines) {
  const w = S.build.walls, ppl = S.survivors;
  if (!ppl.length) return;
  const strength = atk.kind === 'raid' ? 2.2 : atk.kind === 'herd' ? 2 : 1.4 + S.day / 15;
  const hold = w * 0.9 + rnd() * 1.5;
  if (hold >= strength) { lines.push({ t: 'Ночь прошла под стук в ворота. Укрепления выдержали.', c: 'good' }); return; }
  const v = pick(ppl), d = Math.max(1, rint(2, 7) - w);
  v.hp -= d;
  const take = {};
  for (const k of atk.kind === 'raid' ? ['food', 'water', 'ammo', 'meds', 'parts'] : ['food', 'parts']) {
    const n = Math.min(S.res[k], atk.kind === 'raid' ? rint(1, 4) : rint(0, 2));
    if (n > 0) { S.res[k] -= n; take[k] = n; }
  }
  const lost = Object.keys(take).map(k => `${RES[k].name.toLowerCase()} ${take[k]}`).join(', ');
  lines.push({ t: `${atk.kind === 'raid' ? FACTIONS[atk.fac].name + ' прорвались' : 'Мёртвые прорвались'} во двор. ${v.name} ${gv(v, 'ранен', 'ранена')} (−${d}).${lost ? ` Пропало: ${lost}.` : ''}`, c: 'bad' });
}
function siegeLines(rep) {
  const sg = rep.siege, lines = [];
  if (sg.fled) {
    const atk = sg;
    resolveAuto(atk, lines);
  } else if (sg.won) {
    lines.push({ t: `Нападение отбито. Убито: ${rep.kills}.`, c: 'good' });
    if (sg.kind === 'raid') { S.fac[sg.fac].anger = Math.max(0, S.fac[sg.fac].anger - 2); lines.push({ t: `${FACTIONS[sg.fac].name} потеряли людей и надолго запомнят эту ночь.` }); }
  }
  return lines;
}
// Утро: новости округи
function morningNews(lines) {
  const fc = S.fac.collectors;
  if (!fc.met && S.day >= 4 && !fc.beaten) {
    fc.met = true;
    fc.tribute = { due: S.day + 2, cost: tributeCost(), paid: false };
    reveal('camp_collectors');
    lines.push({ t: `Утром у ворот остановился пикап. Люди в чёрной коже: «Теперь вы под защитой Сборщиков. Через два дня — доля». Их лагерь отмечен на карте.`, c: 'bad' });
  }
  if (S.build.radio && chance(0.3 + S.build.radio * 0.1)) {
    const cand = LOC_ORDER.filter(k => !isKnown(k) && !LOCS[k].camp);
    if (cand.length) { const k = pick(cand); reveal(k); lines.push({ t: `По радио рассказали про место: ${LOCS[k].name}. Отмечено на карте.`, c: 'good' }); }
  }
}
function payTribute() {
  const tr = S.fac.collectors.tribute;
  if (!tr || tr.paid || !canPay(tr.cost)) return;
  pay(tr.cost); tr.paid = true;
  addLog('Отложили долю для Сборщиков.', '');
  Sfx.play('search');
  Game.toast('Доля отложена');
  saveGame();
}

// ----- экран карты округи -----
// Река и трасса — постоянные черты местности (координаты карты 0..100 × 0..62)
const RIVER = [[-2, 40], [8, 44], [16, 50], [24, 48], [34, 47], [42, 44], [52, 46], [60, 52], [70, 50], [80, 46], [90, 42], [102, 40]];
const HIGHWAY = [[-2, 17], [20, 18], [40, 15], [60, 18], [80, 22], [102, 26]];
const World = {
  sel: null, cv: null, hit: [],
  render() {
    ensureWorld();
    if (this.sel && !isKnown(this.sel)) this.sel = null;
    if (!this.sel) this.sel = S.known.find(k => !locLocked(k)) || null;
    S.squad = S.squad.filter(id => S.survivors.some(s => s.id === id));
    const root = $('#scr-world');
    root.innerHTML = `
      <header class="wbar">
        <button class="btn sm" id="wBack">${icon('home')}<span>База</span></button>
        <h2>Карта округи</h2>
        <span class="wsub">Известно мест: ${S.known.length} из ${LOC_ORDER.length}</span>
        <span class="res" title="Топливо" style="--rc:${RES.fuel.color}">${icon('fuel')}<b>${S.res.fuel}</b></span>
        <span class="res" title="Патроны" style="--rc:${RES.ammo.color}">${icon('ammo')}<b>${S.res.ammo}</b></span>
      </header>
      <div class="wmain">
        <div class="wmap"><canvas id="wcv" aria-label="Карта округи"></canvas></div>
        <aside class="wcard">${this.card()}</aside>
      </div>`;
    $('#wBack').onclick = () => { Sfx.play('click'); Game.showBase(); };
    this.cv = $('#wcv');
    this.cv.onclick = e => this.click(e);
    $$('[data-sq]', root).forEach(b => { b.onclick = () => this.toggle(+b.dataset.sq); });
    const go = $('#wGo'); if (go) go.onclick = () => this.go();
    requestAnimationFrame(() => this.draw());
  },
  card() {
    const k = this.sel;
    if (!k) return '<p class="hint">Выберите точку на карте.</p>';
    const L = LOCS[k], locked = locLocked(k), v = S.visits[k] || 0, F = L.faction && FACTIONS[L.faction], fs = F && S.fac[L.faction];
    let dng = '';
    for (let d = 0; d < 5; d++) dng += `<i class="${d < L.danger ? 'on' : ''}"></i>`;
    const sq = S.squad.map(id => S.survivors.find(s => s.id === id)).filter(Boolean);
    const fuelOk = S.res.fuel >= L.fuel;
    const lootLeft = Math.round(Math.max(0.35, 1 - v * 0.22) * 100);
    return `<div class="wc-h"><b>${L.name}</b><span class="dng" title="Опасность">${dng}</span></div>
      <p class="wc-m">${L.w}×${L.h} клеток · ${L.fuel ? `топливо ${L.fuel}` : 'пешком'}${v ? ` · были ${v} ${plural(v, 'раз', 'раза', 'раз')}, добычи ~${lootLeft}%` : ''}</p>
      ${F ? `<p class="wc-f" style="--fc:${F.color}">${icon('shield')}<span>${fs.met ? F.name : 'Здесь кто-то есть'}${fs.beaten ? ' · разгромлены' : ''}${L.camp ? ' · лагерь' : ''}${L.captives ? ` · пленных: ${L.captives}` : ''}</span></p>` : ''}
      <p class="wc-d">${L.desc}</p>
      <div class="loc-l">${L.loot.map(r => `<i style="--rc:${RES[r].color}" title="${RES[r].name}">${icon(r)}</i>`).join('')}</div>
      <h3>Отряд <span>${sq.length}/${SQUAD_MAX}</span></h3>
      <div class="wsq">${S.survivors.map(s => {
        const on = S.squad.includes(s.id), hp = Math.round((s.hp / s.maxhp) * 100);
        return `<button class="wsq-b ${on ? 'on' : ''} ${s.infected ? 'inf' : ''}" data-sq="${s.id}" style="--uc:${s.color}" aria-pressed="${on}">
          <b>${esc(s.name)}</b><span>${TRAITS[s.trait].name} · ${s.ranged ? WEAP[s.ranged].name.toLowerCase() : WEAP[s.melee].name.toLowerCase()}</span>
          <i class="bar ${hp < 40 ? 'lowhp' : ''}"><i style="width:${hp}%"></i></i></button>`;
      }).join('')}</div>
      ${locked ? `<p class="warn">Сюда не доехать без ${L.needRadio > 1 ? 'мощной антенны (радиоточка 2)' : 'радиоточки'}: не знаем дороги.</p>` : ''}
      ${!fuelOk ? '<p class="warn">Не хватает топлива.</p>' : ''}
      <button class="btn hazard big" id="wGo" ${sq.length && fuelOk && !locked ? '' : 'disabled'}>Выдвигаться</button>`;
  },
  toggle(id) {
    Sfx.init(); Sfx.play('click');
    const k = S.squad.indexOf(id);
    if (k >= 0) S.squad.splice(k, 1);
    else if (S.squad.length < SQUAD_MAX) S.squad.push(id);
    else { Game.toast(`В отряде уже ${SQUAD_MAX}: больше не взять`); return; }
    saveGame();
    this.render();
  },
  go() {
    Sfx.init();
    const k = this.sel, L = LOCS[k];
    if (!k || !S.squad.length || S.res.fuel < L.fuel || locLocked(k)) return;
    addLog(`Вылазка: ${L.name}. Отряд: ${S.squad.map(id => S.survivors.find(s => s.id === id).name).join(', ')}.`);
    startMission(k, S.squad.slice());
  },
  click(e) {
    const x = e.offsetX, y = e.offsetY;
    let best = null, bd = 26;
    for (const h of this.hit) { const d = Math.hypot(h.x - x, h.y - y); if (d < bd) { bd = d; best = h.k; } }
    if (best && best !== 'base') { Sfx.play('click'); this.sel = best; this.render(); }
  },
  draw() {
    const cv = this.cv;
    if (!cv || !cv.isConnected) return;
    const box = cv.parentElement, W = box.clientWidth, H = box.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!W || !H) return;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const sc = Math.min(W / 104, H / 66), ox = (W - 100 * sc) / 2, oy = (H - 62 * sc) / 2;
    const X = x => ox + x * sc, Y = y => oy + y * sc;
    const r = makeRng(S.seed);
    // бумага
    c.fillStyle = '#1c1d16'; c.fillRect(0, 0, W, H);
    c.fillStyle = '#23251b'; c.fillRect(X(0), Y(0), 100 * sc, 62 * sc);
    // леса
    for (let k = 0; k < 70; k++) {
      const fx = r() * 100, fy = r() * 62;
      if (fy > 26 && fy < 40 && fx > 25 && fx < 85) continue;
      c.fillStyle = `rgba(${40 + r() * 12},${58 + r() * 14},${36 + r() * 8},${0.5 + r() * 0.3})`;
      for (let j = 0; j < 6; j++) { c.beginPath(); c.arc(X(fx + (r() - 0.5) * 7), Y(fy + (r() - 0.5) * 5), sc * (1.2 + r() * 2.2), 0, Math.PI * 2); c.fill(); }
    }
    // поля
    for (let k = 0; k < 12; k++) {
      const fx = r() * 90, fy = r() * 55, w = 4 + r() * 6, h = 3 + r() * 4;
      c.fillStyle = 'rgba(120,110,60,0.18)'; c.fillRect(X(fx), Y(fy), w * sc, h * sc);
      c.strokeStyle = 'rgba(120,110,60,0.25)'; c.lineWidth = 1;
      for (let j = 1; j < 4; j++) { c.beginPath(); c.moveTo(X(fx), Y(fy + (h * j) / 4)); c.lineTo(X(fx + w), Y(fy + (h * j) / 4)); c.stroke(); }
    }
    // город
    c.fillStyle = 'rgba(150,145,130,0.16)';
    for (let gx = 52; gx < 92; gx += 3.2) for (let gy = 24; gy < 46; gy += 3) if (r() < 0.72) c.fillRect(X(gx), Y(gy), sc * (1.6 + r() * 1.2), sc * (1.4 + r() * 1.1));
    // река
    const line = (pts, col, w, dash) => {
      c.strokeStyle = col; c.lineWidth = w; c.lineJoin = 'round'; c.lineCap = 'round'; c.setLineDash(dash || []);
      c.beginPath(); c.moveTo(X(pts[0][0]), Y(pts[0][1]));
      for (let k = 1; k < pts.length - 1; k++) { const mx = (pts[k][0] + pts[k + 1][0]) / 2, my = (pts[k][1] + pts[k + 1][1]) / 2; c.quadraticCurveTo(X(pts[k][0]), Y(pts[k][1]), X(mx), Y(my)); }
      const l = pts[pts.length - 1]; c.lineTo(X(l[0]), Y(l[1])); c.stroke(); c.setLineDash([]);
    };
    line(RIVER, '#2b3d45', sc * 2.4); line(RIVER, '#35505a', sc * 1.2);
    line(HIGHWAY, '#4a463a', sc * 1.2); line(HIGHWAY, 'rgba(214,180,80,0.5)', 1, [sc * 1.2, sc * 1.2]);
    // дороги к известным местам: каждая точка — к двум ближайшим
    const pts = [['base', BASE_POS], ...S.known.map(k => [k, LOCS[k].pos])];
    const edges = new Set();
    for (const [a, pa] of pts) {
      const near = pts.filter(q => q[0] !== a).sort((p1, p2) => pdist(pa, p1[1]) - pdist(pa, p2[1])).slice(0, 2);
      for (const [b] of near) edges.add([a, b].sort().join('|'));
    }
    const P = Object.fromEntries(pts);
    c.strokeStyle = '#5c5440'; c.lineWidth = Math.max(1.5, sc * 0.5); c.setLineDash([sc * 0.9, sc * 0.6]);
    for (const e of edges) { const [a, b] = e.split('|'); c.beginPath(); c.moveTo(X(P[a][0]), Y(P[a][1])); c.lineTo(X(P[b][0]), Y(P[b][1])); c.stroke(); }
    c.setLineDash([]);
    // туман: темно везде, кроме окрестностей известного
    const fog = document.createElement('canvas'); fog.width = cv.width; fog.height = cv.height;
    const f = fog.getContext('2d');
    f.setTransform(dpr, 0, 0, dpr, 0, 0);
    f.fillStyle = 'rgba(12,12,9,0.82)'; f.fillRect(0, 0, W, H);
    f.globalCompositeOperation = 'destination-out';
    for (const [, p] of pts) {
      const g = f.createRadialGradient(X(p[0]), Y(p[1]), 0, X(p[0]), Y(p[1]), sc * 13);
      g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.55, 'rgba(0,0,0,0.85)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      f.fillStyle = g; f.fillRect(X(p[0]) - sc * 13, Y(p[1]) - sc * 13, sc * 26, sc * 26);
    }
    c.setTransform(1, 0, 0, 1, 0, 0); c.drawImage(fog, 0, 0); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    // метки
    this.hit = [];
    const fs = clamp(sc * 1.9, 10, 14);
    c.font = `500 ${fs}px Oswald, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'top';
    const label = (t, x, y, col) => { c.lineWidth = 3; c.strokeStyle = 'rgba(10,10,8,0.85)'; c.strokeText(t, x, y); c.fillStyle = col; c.fillText(t, x, y); };
    // база
    { const x = X(BASE_POS[0]), y = Y(BASE_POS[1]), s = Math.max(9, sc * 2);
      c.fillStyle = '#e8a62b'; c.strokeStyle = '#1b1406'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(x, y - s); c.lineTo(x + s, y); c.lineTo(x + s * 0.7, y); c.lineTo(x + s * 0.7, y + s * 0.8); c.lineTo(x - s * 0.7, y + s * 0.8); c.lineTo(x - s * 0.7, y); c.lineTo(x - s, y); c.closePath(); c.fill(); c.stroke();
      label('База', x, y + s, '#f0c46a'); this.hit.push({ k: 'base', x, y }); }
    for (const k of S.known) {
      const L = LOCS[k], x = X(L.pos[0]), y = Y(L.pos[1]), sel = k === this.sel, locked = locLocked(k);
      const s = Math.max(7, sc * 1.55);
      const F = L.faction && FACTIONS[L.faction], beaten = F && S.fac[L.faction].beaten;
      const dc = ['#86a85d', '#86a85d', '#c9a43a', '#d9813a', '#c9472f', '#a8322a'][L.danger];
      if (sel) { c.strokeStyle = '#e8a62b'; c.lineWidth = 2.5; c.beginPath(); c.arc(x, y, s + 6, 0, Math.PI * 2); c.stroke(); }
      if (L.camp) {
        c.fillStyle = beaten ? '#4a463a' : F.color; c.strokeStyle = '#0d0c09'; c.lineWidth = 2;
        c.beginPath(); c.moveTo(x, y - s * 1.25); c.lineTo(x + s * 1.1, y); c.lineTo(x, y + s * 1.25); c.lineTo(x - s * 1.1, y); c.closePath(); c.fill(); c.stroke();
        c.fillStyle = '#0d0c09'; c.fillRect(x - s * 0.15, y - s * 0.6, s * 0.3, s * 1.2);
      } else {
        c.fillStyle = locked ? '#3a372c' : '#1d1c16'; c.strokeStyle = locked ? '#5a5440' : dc; c.lineWidth = 2.5;
        c.beginPath(); c.arc(x, y, s, 0, Math.PI * 2); c.fill(); c.stroke();
        if (F && !beaten) { c.fillStyle = F.color; c.beginPath(); c.arc(x + s * 0.75, y - s * 0.75, s * 0.42, 0, Math.PI * 2); c.fill(); }
        c.fillStyle = locked ? '#5a5440' : dc; c.beginPath(); c.arc(x, y, s * 0.38, 0, Math.PI * 2); c.fill();
      }
      const v = S.visits[k] || 0;
      for (let j = 0; j < Math.min(4, v); j++) { c.fillStyle = '#a09781'; c.fillRect(x - s + j * (s * 0.55), y + s + 2, s * 0.4, 2); }
      label(L.short, x, y + s + (v ? 6 : 3), sel ? '#f0c46a' : locked ? '#746c58' : '#ece4cc');
      this.hit.push({ k, x, y });
    }
    // масштабная линейка и роза ветров
    c.fillStyle = '#746c58'; c.font = `500 ${clamp(sc * 1.5, 9, 12)}px Oswald, sans-serif`; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    c.fillText('С ↑', X(1.5), Y(4));
  },
};
</script>
<script>
'use strict';
// ---------- Главное меню: живая сцена, справочник, статистика ----------

const CAREER_KEY = 'rubezh.career.v1';

// ----- сцена за меню: сумеречная улица, костры, бредущие мертвецы -----
const MenuScene = {
  timer: 0,
  build() {
    const { m } = genMap('suburb', 4242);
    m.seen = new Uint8Array(m.n).fill(1); m.vis = new Uint8Array(m.n).fill(1);
    m.units = []; m.zombies = []; m.turn = 1; m.tod = 1; m.fires = [];
    const b = m.buildings[Math.min(2, m.buildings.length - 1)] || { x: 30, y: 30, w: 4, h: 4 };
    const cx = b.x + b.w * 0.2, cy = b.y + b.h * 0.6;
    const r = makeRng(77);
    const walk = (x, y) => inb(m, x, y) && TP[m.tiles[MI(m, x, y)]].walk && m.tiles[MI(m, x, y)] !== T.DOOR;
    // горящие бочки и костры поблизости от камеры
    for (let k = 0, made = 0; k < 400 && made < 4; k++) {
      const x = Math.round(cx + r.int(-12, 12)), y = Math.round(cy + r.int(-10, 10));
      if (!walk(x, y) || m.ground[MI(m, x, y)] !== T.ASPHALT && m.ground[MI(m, x, y)] !== T.SIDEWALK) continue;
      if (m.fires.some(([fx, fy]) => Math.abs(fx - x) + Math.abs(fy - y) < 6)) continue;
      m.props.push({ k: 'campfire', x, y, w: 1, h: 1 }); m.tiles[MI(m, x, y)] = T.BLOCK; m.fires.push([x, y]);
      made++;
    }
    const ents = [];
    for (let k = 0, made = 0; k < 600 && made < 7; k++) {
      const x = Math.round(cx + r.int(-14, 14)), y = Math.round(cy + r.int(-12, 12));
      if (!walk(x, y) || ents.some(it => it.e.x === x && it.e.y === y)) continue;
      const type = ['walker', 'walker', 'walker', 'runner', 'brute', 'screamer', 'walker'][made];
      ents.push({ e: { type, id: made, x, y, f: r.int(0, 7), goal: null }, z: true });
      made++;
    }
    R.menu = { m, ents, cam: { cx, cy, k: clamp(R.H / 9, 30, 70), rot: 1 }, base: { cx, cy }, t0: performance.now() };
    for (const it of ents) Spr.warm(Spr.look(it.e, 'z'), ['i0', 'i1', 'w0', 'w1', 'w2', 'w3', 'w4', 'w5']);
  },
  start() {
    clearInterval(this.timer);
    this.timer = setInterval(() => this.step(), 900);
  },
  stop() { clearInterval(this.timer); this.timer = 0; },
  step() {
    const M = R.menu;
    if (R.mode !== 'menu' || !M || document.hidden) return;
    const m = M.m, now = performance.now();
    const walk = (x, y) => inb(m, x, y) && TP[m.tiles[MI(m, x, y)]].walk && m.tiles[MI(m, x, y)] !== T.DOOR;
    for (const it of M.ents) {
      const e = it.e;
      if (e.anim && now - e.anim.t0 < e.anim.d) continue;
      if (Math.random() < 0.35) continue;
      if (!e.goal || (e.goal[0] === e.x && e.goal[1] === e.y) || Math.random() < 0.05) e.goal = [Math.round(M.base.cx + rint(-14, 14)), Math.round(M.base.cy + rint(-12, 12))];
      let best = null, bd = edist(e.x, e.y, e.goal[0], e.goal[1]);
      for (const [dx, dy] of DIR8) {
        const nx = e.x + dx, ny = e.y + dy;
        if (!walk(nx, ny) || (dx && dy && (!walk(e.x + dx, e.y) || !walk(e.x, e.y + dy)))) continue;
        if (M.ents.some(o => o !== it && o.e.x === nx && o.e.y === ny)) continue;
        const d = edist(nx, ny, e.goal[0], e.goal[1]) + Math.random() * 0.8;
        if (d < bd) { bd = d; best = [nx, ny]; }
      }
      if (best) animTo(e, best[0], best[1], e.type === 'runner' ? 900 : 1700);
      else e.goal = null;
    }
  },
};

// ----- статистика -----
function ensureStats() {
  S.stats = Object.assign({ missions: 0, sieges: 0, siegesWon: 0, zk: 0, hk: 0, rescued: 0, lost: 0, weapons: 0, recruits: 0, locs: [] }, S.stats || {});
}
function career() { return Object.assign({ runs: 0, wins: 0, bestDay: 0, missions: 0, zk: 0, hk: 0, rescued: 0, lost: 0 }, store.get(CAREER_KEY) || {}); }
function careerAdd(o) { const c = career(); for (const k in o) c[k] = k === 'bestDay' ? Math.max(c[k], o[k]) : c[k] + o[k]; store.set(CAREER_KEY, c); }
// Итоги вылазки или обороны — в статистику
function statMission(rep, m) {
  ensureStats();
  const st = S.stats, hk = Object.values(rep.hkills || {}).reduce((a, b) => a + b, 0), zk = Math.max(0, rep.kills - hk);
  const lost = m.units.filter(u => u.dead).length, rescued = rep.rescued || 0;
  if (rep.siege) { st.sieges++; if (rep.siege.won) st.siegesWon++; } else { st.missions++; if (!st.locs.includes(rep.loc)) st.locs.push(rep.loc); }
  st.zk += zk; st.hk += hk; st.lost += lost; st.rescued += rescued; st.weapons += (rep.wpn || []).length;
  careerAdd({ missions: rep.siege ? 0 : 1, zk, hk, lost, rescued });
}

// ----- справочник -----
const ZDESC = {
  walker: 'Медленный и упрямый. Идёт на шум, ломится в двери, кусает, если подпустить.',
  runner: 'Свежий, быстрый, почти не устаёт. Догоняет того, кто решил убежать.',
  screamer: 'Увидев живых, кричит — и сюда идёт всё, что слышало.',
  brute: 'Огромный, в рабочем жилете. Держит много попаданий и выбивает двери за пару ударов.',
};
const Codex = {
  tab: 'z',
  open() {
    const md = Game.modal({ title: 'Справочник', html: '<div class="cx"><nav class="cx-t" role="tablist"></nav><div class="cx-b"></div></div>', buttons: [{ label: 'Закрыть', cls: 'primary' }] });
    md.el.querySelector('.modal').classList.add('wide');
    this.md = md;
    this.render();
  },
  render() {
    const root = this.md.el, tabs = [['z', 'Мертвецы'], ['h', 'Группировки'], ['w', 'Оружие'], ['t', 'Черты'], ['x', 'Погода']];
    $('.cx-t', root).innerHTML = tabs.map(([k, l]) => `<button role="tab" aria-selected="${this.tab === k}" class="${this.tab === k ? 'on' : ''}" data-cx="${k}">${l}</button>`).join('');
    $$('[data-cx]', root).forEach(b => { b.onclick = () => { Sfx.play('click'); this.tab = b.dataset.cx; this.render(); }; });
    let html = '';
    if (this.tab === 'z') html = ['walker', 'runner', 'screamer', 'brute'].map(k => {
      const z = ZT[k];
      return this.card(`z:${k}`, z.name, `${z.hp} здоровья · ${z.ap} ОД · урон ${z.dmg[0]}–${z.dmg[1]} · видит на ${z.sight} · укус ${Math.round(z.bite * 100)}%`, ZDESC[k]);
    }).join('');
    else if (this.tab === 'h') html = Object.keys(FACTIONS).map(f => {
      const F = FACTIONS[f], st = S && S.fac ? S.fac[f] : null, known = !S || !st || st.met || st.beaten;
      const types = [...new Set(F.types)].map(t => ZT[t]);
      return this.card(`x:${F.types[F.types.length - 1]}`, known ? F.name : '???', types.map(t => `${t.name}: ${t.hp} здоровья, ${t.ranged ? WEAP[t.ranged].name.toLowerCase() : WEAP[t.melee].name.toLowerCase()}`).join(' · '), known ? F.desc : 'О них пока ничего не известно.', F.color);
    }).join('');
    else if (this.tab === 'w') html = Object.keys(WEAP).map(k => {
      const W = WEAP[k];
      const s = W.melee ? `ближний бой · ${W.ap} ОД · урон ${W.dmg[0]}–${W.dmg[1]} · шум ${W.noise}` : `${W.ap} ОД · урон ${W.dmg[0]}–${W.dmg[1]} · дальность ${W.range} · точность ${Math.round(W.acc * 100)}% · шум ${W.noise}`;
      const d = { knife: 'Тихо убивает тех, кто вас не видит.', bat: 'Надёжная и громкая.', crowbar: 'Удобна, вскрывает что угодно.', axe: 'Самый сильный удар, но дольше замах.', pistol: 'С глушителем из мастерской почти не слышен.', shotgun: 'Страшен вплотную, бесполезен издалека.', rifle: 'Бьёт далеко и точно. Слышно на полкарты.' }[k];
      return this.card(null, W.name, s, `${d} Вес ${WKG[k]} кг.`);
    }).join('');
    else if (this.tab === 't') html = Object.keys(TRAITS).map(k => this.card(null, TRAITS[k].name, '', TRAITS[k].desc)).join('');
    else html = Object.keys(WEATHER).map(k => this.card(null, WEATHER[k].name, '', WEATHER[k].desc, null, WEATHER[k].icon)).join('');
    $('.cx-b', root).innerHTML = html;
    $$('canvas[data-fig]', root).forEach(cv => { try { drawFigure(cv, cv.dataset.fig); } catch (e) { console.error(e); } });
  },
  card(fig, name, stats, desc, col, ic) {
    return `<div class="cx-c" ${col ? `style="--fc:${col}"` : ''}>
      ${fig ? `<canvas class="cx-f" data-fig="${fig}" aria-hidden="true"></canvas>` : ic ? `<span class="cx-i">${icon(ic)}</span>` : ''}
      <div><b>${esc(name)}</b>${stats ? `<small>${esc(stats)}</small>` : ''}<p>${esc(desc)}</p></div></div>`;
  },
};
// Фигура для справочника: «z:тип» — мертвец, «x:тип» — человек группировки
function drawFigure(cv, spec) {
  const [kind, type] = spec.split(':');
  const dpr = Math.min(3, window.devicePixelRatio || 1), W = cv.clientWidth || 56, H = cv.clientHeight || 72;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const L = Spr.look({ type, id: kind === 'x' ? 1 : 0 }, 'z'), ts = H * 1.2;
  const save = R.dpr; R.dpr = dpr;
  Spr.draw(c, L, 'i0', 3, W * 0.5, H * 0.97, ts, 8);
  R.dpr = save;
}

// ----- окно статистики -----
function openStats() {
  const c = career(), st = S && !S.over ? (ensureStats(), S.stats) : null;
  const tile = (n, l) => `<div class="st-t"><b>${n}</b><span>${l}</span></div>`;
  const run = st ? `<h3>Эта игра · день ${S.day}</h3><div class="st-g">
      ${tile(S.survivors.length, 'в группе')}${tile(st.missions, 'вылазок')}${tile(st.locs.length + ' из ' + LOC_ORDER.length, 'мест посетили')}
      ${tile(st.zk, 'мертвецов упокоено')}${tile(st.hk, 'людей убито')}${tile(`${st.siegesWon}/${st.sieges}`, 'атак на базу отбито')}
      ${tile(st.rescued, 'пленных спасено')}${tile(st.lost, 'погибло своих')}${tile(st.weapons, 'стволов найдено')}
    </div>` : '<p class="dim">Сейчас нет начатой игры.</p>';
  Game.modal({
    title: 'Статистика',
    html: `<div class="stats">${run}<h3>За всё время</h3><div class="st-g">
      ${tile(c.runs, 'игр сыграно')}${tile(c.wins, 'раз дождались колонны')}${tile(c.bestDay, 'лучший день')}
      ${tile(c.missions, 'вылазок')}${tile(c.zk, 'мертвецов')}${tile(c.hk, 'людей')}
    </div></div>`,
    buttons: [{ label: 'Закрыть', cls: 'primary' }],
  });
}
</script>
<script>
'use strict';
// ---------- Запуск, экраны, настройки, сохранения ----------

const SETTINGS_KEY = 'rubezh.settings.v1', SAVE_KEY = 'rubezh.save.v1', HELP_KEY = 'rubezh.help.v1';
const DEF_CFG = { ui: 1, lefty: false, confirmMove: true, confirmEnd: true, autoNext: true, speed: 1, sound: true, vol: 0.7, music: true, musicVol: 0.5, vibro: true, shake: true, follow: true, gfx: 2, autoRotate: true };
const SAVED_CFG = store.get(SETTINGS_KEY) || {};
let CFG = Object.assign({}, DEF_CFG, SAVED_CFG);
if (SAVED_CFG.gfx === undefined && SAVED_CFG.hq === false) CFG.gfx = 0;
CFG.hq = CFG.gfx >= 1;
let S = null;
const APP = { rot: false, vw: 0 };

// Координаты экрана -> координаты интерфейса (учитывает принудительный поворот)
function toApp(cx, cy) { return APP.rot ? { x: cy, y: APP.vw - cx } : { x: cx, y: cy }; }

// ----- Сохранение -----
function u8ToB64(a) { let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); }
function b64ToU8(b) { const s = atob(b), a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
function serMission(m) {
  const o = {};
  for (const k in m) {
    if (k === 'vis' || k === 'zocc' || k === 'uocc') continue;
    const v = m[k];
    if (v instanceof Uint8Array) o[k] = { b64: u8ToB64(v) };
    else if (k === 'units' || k === 'zombies') o[k] = v.map(e => { const c = Object.assign({}, e); delete c.anim; return c; });
    else o[k] = v;
  }
  return o;
}
function deMission(o) {
  const m = {};
  for (const k in o) m[k] = o[k] && o[k].b64 != null ? b64ToU8(o[k].b64) : o[k];
  m.vis = new Uint8Array(m.n);
  return m;
}
function serialize() { const o = Object.assign({}, S); if (S.mission) o.mission = serMission(S.mission); return o; }
function restore(o) {
  if (!o || o.v !== 1 || !Array.isArray(o.survivors)) return null;
  try { if (o.mission) o.mission = deMission(o.mission); } catch (e) { o.mission = null; }
  return o;
}
function saveGame() { if (S) store.set(SAVE_KEY, serialize()); }

// ----- Ориентация и размеры -----
function layout() {
  const w = window.innerWidth, h = window.innerHeight;
  let coarse = false;
  try { coarse = matchMedia('(pointer: coarse)').matches; } catch (e) { /* нет поддержки */ }
  const portrait = h > w * 1.05;
  const rot = portrait && coarse && CFG.autoRotate;
  const app = $('#app');
  APP.rot = rot; APP.vw = w;
  document.body.classList.toggle('rot', rot);
  if (rot) { app.style.width = h + 'px'; app.style.height = w + 'px'; app.style.transform = `translateX(${w}px) rotate(90deg)`; }
  else { app.style.width = ''; app.style.height = ''; app.style.transform = ''; }
  $('#rot-hint').hidden = !(portrait && coarse && !CFG.autoRotate);
  HUD.hidePop();
  R.resize();
  const ws = $('#scr-world');
  if (ws && !ws.hidden) World.draw();
}
function applySettings() {
  CFG.hq = CFG.gfx >= 1;
  document.documentElement.style.fontSize = (15 * CFG.ui).toFixed(2) + 'px';
  document.body.classList.toggle('lefty', !!CFG.lefty);
  Sfx.setVol();
  layout();
  if (TAC.m) HUD.refresh();
}
function saveSettings() { store.set(SETTINGS_KEY, CFG); applySettings(); }

const Game = {
  init(data) {
    R.init($('#cv'));
    WX.init();
    HUD.build();
    applySettings();
    window.addEventListener('resize', () => layout());
    window.addEventListener('orientationchange', () => setTimeout(layout, 150));
    document.addEventListener('visibilitychange', () => { if (document.hidden && S && (!TAC.m || TAC.m.phase === 'player')) saveGame(); });
    document.addEventListener('keydown', e => this.key(e));
    document.addEventListener('pointerdown', () => Sfx.init(), { once: true });
    const hot = data && data.save ? restore(data.save) : null;
    S = hot || restore(store.get(SAVE_KEY));
    if (S) ensureWorld();
    if (hot && !S.over) { if (S.mission) resumeMission(S.mission); else this.showBase(); }
    else this.showMenu();
  },
  show(id) {
    for (const s of $$('.screen')) s.hidden = s.id !== id;
    HUD.hidePop();
  },
  showMenu() {
    Base.stopLife();
    WX.set('rain');
    this.show('scr-menu');
    Music.set('menu');
    R.mode = 'menu';
    if (!R.menu) R.setMenuMap();
    R.dirty = true;
    MenuScene.start();
    const can = S && !S.over;
    const where = can ? (S.mission ? `на вылазке: ${S.mission.siege ? 'оборона базы' : LOCS[S.mission.loc] ? LOCS[S.mission.loc].short : ''}` : 'на базе') : '';
    const tile = (id, ic, label, extra = '') => `<button class="mt" id="${id}" ${extra}>${icon(ic)}<span>${label}</span></button>`;
    $('#scr-menu').innerHTML = `
      <div class="menu-in">
        <h1 class="logo">Рубеж</h1>
        <p class="tagline">Небольшая группа, насосная станция на окраине и город, полный мёртвых. Каждый выстрел слышно за квартал.</p>
        ${can ? `<button class="mcont" id="mCont">
          <span class="mc-t">${icon('play')}<b>Продолжить</b><i>день ${S.day} из ${VICTORY_DAY}</i></span>
          <span class="mc-s">${S.survivors.length} в группе · ${where}</span>
          <span class="mc-r">${['food', 'water', 'ammo', 'meds', 'fuel'].map(k => `<i style="--rc:${RES[k].color}">${icon(k)}${S.res[k]}</i>`).join('')}</span>
        </button>` : ''}
        <div class="mbtns"><button class="btn ${can ? '' : 'hazard big'}" id="mNew">${icon('skull')}Новая игра</button></div>
        <div class="mtiles">
          ${tile('mCodex', 'book', 'Справочник')}${tile('mStats', 'chart', 'Статистика')}${tile('mHelp', 'eye', 'Как играть')}
          ${tile('mMusic', 'note', CFG.music ? 'Музыка вкл' : 'Музыка выкл', `aria-pressed="${CFG.music}"`)}${tile('mSet', 'gear', 'Настройки')}
        </div>
        <p class="ver">Пошаговая тактика · 23 места · группировки · сохранение в этом браузере</p>
      </div>`;
    $('#mCodex').onclick = () => { Sfx.init(); Sfx.play('click'); Codex.open(); };
    $('#mStats').onclick = () => { Sfx.init(); Sfx.play('click'); openStats(); };
    if (can) $('#mCont').onclick = () => { Sfx.init(); if (S.mission) resumeMission(S.mission); else this.showBase(); };
    $('#mNew').onclick = () => {
      Sfx.init();
      if (can) this.modal({ title: 'Начать заново?', html: `<p>Текущая игра (день ${S.day}) будет удалена.</p>`, buttons: [{ label: 'Отмена' }, { label: 'Новая игра', cls: 'danger', fn: () => this.newGame() }] });
      else this.newGame();
    };
    $('#mHelp').onclick = () => this.help();
    $('#mMusic').onclick = () => { this.toggleMusic(); const b = $('#mMusic'); if (b) { b.setAttribute('aria-pressed', CFG.music); $('span', b).textContent = CFG.music ? 'Музыка вкл' : 'Музыка выкл'; } };
    $('#mSet').onclick = () => this.openSettings();
  },
  showBase() {
    TAC.m = null;
    MenuScene.stop();
    WX.set(null);
    Music.set('base');
    this.show('scr-base');
    R.mode = 'base';
    Base.scene();
    Base.render();
    R.resize();
    Base.frame();
    Base.startLife();
  },
  showWorld() {
    Base.stopLife();
    MenuScene.stop();
    WX.set(null);
    this.show('scr-world');
    R.mode = null;
    World.render();
  },
  showTac(center) {
    Base.stopLife();
    MenuScene.stop();
    WX.set(TAC.m && TAC.m.weather);
    this.show('scr-tac');
    Music.set('mission');
    R.mode = 'tac';
    R.resize();
    if (center) {
      R.cam.k = clamp(Math.round(R.H / 9.5), 30, 56);
      const u = curUnit();
      if (u) R.centerOn(u.x, u.y, true);
    }
    refreshReach();
    HUD.refresh();
    if (!store.get(HELP_KEY)) { store.set(HELP_KEY, 1); this.help(); }
  },
  afterMission(rep) {
    this.showBase();
    saveGame();
    Base.missionReport(rep);
  },
  newGame() {
    store.del(SAVE_KEY);
    newGameState();
    Base.tab = null; World.sel = 'farm';
    saveGame();
    this.showBase();
  },
  key(e) {
    if (e.key === 'Escape') {
      const md = $$('#modals .modal-bg');
      if (md.length) { md[md.length - 1].remove(); return; }
      if (!$('#tLootBg').hidden) { HUD.closeLoot(); return; }
      if (!$('#tMapBg').hidden) { HUD.closeMap(); return; }
      HUD.hidePop(); TAC.pend = null; TAC.mode = null; R.dirty = true;
      return;
    }
    if (R.mode !== 'tac' || $$('#modals .modal-bg').length || !$('#tLootBg').hidden) return;
    if (e.key === 'Tab') { e.preventDefault(); nextUnit(); }
    else if (e.key === 'q' || e.key === 'й') R.rotate(-1);
    else if (e.key === 'e' || e.key === 'у') R.rotate(1);
    else if (e.key === 'Enter' && !e.target.closest('button')) endTurn();
  },
  modal({ title, html, buttons = [{ label: 'Понятно', cls: 'primary' }], noClose = false }) {
    const bg = el(`<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2><div class="mb">${html}</div><div class="mf"></div></div></div>`);
    const close = () => bg.remove();
    for (const b of buttons) {
      const btn = el(`<button class="btn ${b.cls || ''}">${esc(b.label)}</button>`);
      btn.onclick = () => { Sfx.play('click'); close(); if (b.fn) b.fn(); };
      $('.mf', bg).appendChild(btn);
    }
    if (!noClose) bg.addEventListener('click', e => { if (e.target === bg) close(); });
    $('#modals').appendChild(bg);
    const last = $('.mf .btn:last-child', bg);
    if (last) try { last.focus({ preventScroll: true }); } catch (e) { /* ок */ }
    return { el: bg, close };
  },
  toggleMusic() {
    Sfx.init();
    CFG.music = !CFG.music;
    saveSettings();
    Music.set(Music.want, true);
    this.toast(CFG.music ? 'Музыка включена' : 'Музыка выключена');
  },
  toastT: 0,
  toast(text) {
    const t = $('#toast');
    t.textContent = text; t.hidden = false;
    clearTimeout(this.toastT);
    this.toastT = setTimeout(() => { t.hidden = true; }, 1900);
  },
  help() {
    this.modal({
      title: 'Как играть',
      html: `<ul class="help">
        <li><b>Касание бойца</b> выбирает его. <b>Касание клетки</b> показывает путь и цену в очках действий (ОД), второе касание — идти.</li>
        <li><b>Касание зомби</b> открывает атаку: удар вплотную или выстрел с шансом попадания.</li>
        <li><b>Шум решает всё.</b> Выстрел слышно за 13–20 клеток, и все зомби в этом кольце пойдут на звук. Нож по зомби без значка над головой убивает бесшумно.</li>
        <li>Значок <b>?</b> — зомби идёт на шум, <b>!</b> — видит вас. В посевах и кустах вас видно только вплотную.</li>
        <li><b>Засада</b> тратит все ОД: боец выстрелит в первого, кто покажется в ход зомби.</li>
        <li>Каждые 7 ходов или от сильного шума растёт <b>угроза</b>, с краёв карты приходят новые зомби. С 15-го хода сумерки, с 25-го ночь.</li>
        <li><b>Жёлтые ромбы</b> — несобранная добыча. Обыск стоит 2 ОД, унести можно сколько позволяет вес.</li>
        <li>Чтобы уехать, дойдите до <b>зелёной зоны у машины</b> и нажмите «В машину».</li>
        <li><b>Укус</b> — три дня до обращения. Лечится медикаментами в лазарете.</li>
        <li><b>Люди опаснее мёртвых.</b> Группировки стреляют из-за укрытий и отходят ранеными. Укрытие рядом с целью снижает шанс попасть.</li>
        <li><b>Мёртвые встают.</b> Убитый не в голову через 2–3 хода поднимается. Тело с зелёным кольцом можно добить за 1 ОД.</li>
        <li><b>Пленных</b> держат в лагерях: освободите (2 ОД) и довезите до машины — человек останется в группе.</li>
        <li><b>База</b> — отдельная карта: касание постройки открывает её улучшение. Ночью на базу могут напасть — тогда бой идёт на её карте.</li>
        <li><b>Укрытия:</b> когда выбираете клетку, синий щит показывает укрытие с той стороны — полный щит для стены и мешков, половинка для мебели и машин. Люди из группировок по вам за укрытием попадают реже.</li>
        <li><b>Погода</b> меняется от вылазки к вылазке: в дождь шум слышно на треть ближе, в тумане обзор у всех на 3 клетки меньше.</li>
        <li><b>Оружие</b> находят в оружейных шкафах, сейфах и на телах врагов. Дома его выдают в панели «Оружие», лишнее разбирают на детали.</li>
        <li><b>Группа</b> растёт до 10 человек, но на вылазку и в бой берите не больше 6. Чем больше отряд, тем больше на карте мертвецов.</li>
        <li><b>Карта округи</b> — все места для вылазок. Новые точки открываются после вылазок и по радио. Повторные вылазки дают меньше добычи.</li>
        <li>Камера: перетаскивание — сдвиг, два пальца или кнопки +/− — масштаб, круглая стрелка — поворот на 90°, кнопка карты — обзор всей местности.</li>
        <li>Стены, которые закрывают бойцов, сами опускаются. Ночью видно только то, что освещают фонари отряда.</li>
      </ul>`,
    });
  },
  openSettings() {
    const tg = (id, label, sub) => `<label for="${id}">${label}${sub ? `<small>${sub}</small>` : ''}</label><input type="checkbox" class="tgl" id="${id}" ${CFG[id.slice(2)] ? 'checked' : ''}>`;
    const speeds = ['Медленно', 'Обычно', 'Быстро', 'Сразу'];
    const fsOk = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
    const md = this.modal({
      title: 'Настройки',
      html: `<div class="set">
        <label for="s-ui">Размер интерфейса<small id="s-ui-v">${Math.round(CFG.ui * 100)}%</small></label><input type="range" id="s-ui" min="0.8" max="1.4" step="0.05" value="${CFG.ui}">
        ${tg('s-lefty', 'Для левой руки', 'кнопки действий слева, отряд справа')}
        ${tg('s-confirmMove', 'Ход вторым касанием', 'защищает от случайных шагов')}
        ${tg('s-confirmEnd', 'Подтверждать конец хода', 'если у бойцов остались очки действий')}
        ${tg('s-autoNext', 'Следующий боец сам', 'когда у текущего кончились ОД')}
        <label>Скорость анимации</label><div class="seg" id="s-speed">${speeds.map((s, i) => `<button data-v="${i}" class="${CFG.speed === i ? 'on' : ''}">${s}</button>`).join('')}</div>
        ${tg('s-sound', 'Звуки')}
        <label for="s-vol">Громкость звуков</label><input type="range" id="s-vol" min="0" max="1" step="0.05" value="${CFG.vol}">
        ${tg('s-music', 'Музыка', 'своя для меню, убежища и вылазки')}
        <label for="s-mvol">Громкость музыки</label><input type="range" id="s-mvol" min="0" max="1" step="0.05" value="${CFG.musicVol}">

        ${tg('s-shake', 'Тряска экрана')}
        ${tg('s-follow', 'Камера к атакам', 'показывать, кого атакуют')}
        <label>Графика<small>если телефон греется — понизьте</small></label><div class="seg" id="s-gfx">${['Экономно', 'Высоко', 'Максимум'].map((s, i) => `<button data-v="${i}" class="${CFG.gfx === i ? 'on' : ''}">${s}</button>`).join('')}</div>
        ${tg('s-autoRotate', 'Поворачивать интерфейс', 'если телефон держат вертикально')}
      </div>
      ${fsOk ? '<button class="btn" id="s-fs">' + icon('full') + 'Во весь экран</button>' : ''}
      <button class="btn danger sm" id="s-reset">Стереть сохранение</button>`,
      buttons: [{ label: 'Готово', cls: 'primary' }],
    });
    const root = md.el;
    $('#s-ui', root).oninput = e => { CFG.ui = +e.target.value; $('#s-ui-v', root).textContent = Math.round(CFG.ui * 100) + '%'; saveSettings(); };
    $('#s-vol', root).oninput = e => { CFG.vol = +e.target.value; saveSettings(); };
    $('#s-vol', root).onchange = () => { Sfx.init(); Sfx.play('shot'); };
    $('#s-mvol', root).oninput = e => { CFG.musicVol = +e.target.value; saveSettings(); };
    $$('#s-gfx button', root).forEach(b => { b.onclick = () => { CFG.gfx = +b.dataset.v; $$('#s-gfx button', root).forEach(x => x.classList.toggle('on', x === b)); Spr.sprites.clear(); Spr.sBytes = 0; saveSettings(); }; });
    $('#s-music', root).onchange = e => { CFG.music = e.target.checked; saveSettings(); Sfx.init(); Music.set(Music.want, true); };
    for (const k of ['lefty', 'confirmMove', 'confirmEnd', 'autoNext', 'sound', 'vibro', 'shake', 'follow', 'autoRotate']) {
      $('#s-' + k, root).onchange = e => { CFG[k] = e.target.checked; saveSettings(); if (k === 'vibro' && CFG.vibro) vibrate(40); };
    }
    $$('#s-speed button', root).forEach(b => { b.onclick = () => { CFG.speed = +b.dataset.v; $$('#s-speed button', root).forEach(x => x.classList.toggle('on', x === b)); saveSettings(); }; });
    const fs = $('#s-fs', root);
    if (fs) fs.onclick = () => {
      const d = document.documentElement, req = d.requestFullscreen || d.webkitRequestFullscreen;
      try {
        const p = req.call(d, { navigationUI: 'hide' });
        const lock = () => { try { const q = screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'); if (q && q.catch) q.catch(() => {}); } catch (e) { /* нет блокировки */ } };
        if (p && p.then) p.then(lock).catch(() => this.toast('Здесь полноэкранный режим недоступен')); else lock();
      } catch (e) { this.toast('Здесь полноэкранный режим недоступен'); }
    };
    $('#s-reset', root).onclick = () => {
      md.close();
      this.modal({
        title: 'Стереть сохранение?', html: '<p>Прогресс пропадёт. Настройки останутся.</p>',
        buttons: [{ label: 'Отмена' }, { label: 'Стереть', cls: 'danger', fn: () => { store.del(SAVE_KEY); S = null; TAC.m = null; this.showMenu(); } }],
      });
    };
  },
};

// ----- Старт (с поддержкой живого обновления страницы) -----
(function boot() {
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) { try { hot.snapshot(() => ({ save: S ? serialize() : null })); } catch (e) { /* нет поддержки */ } }
  const start = data => Game.init(data || {});
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
