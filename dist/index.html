    if (z.state === 'chase') continue;
    let best = lu[0], bd = 1e9;
    for (const u of lu) { const d = edist(z.x, z.y, u.x, u.y); if (d < bd) { bd = d; best = u; } }
    z.state = 'investigate'; z.tx = best.x; z.ty = best.y;
  }
}
function warmSprites(m) {
  for (const u of m.units) if (!u.dead && !u.evac) Spr.warm(Spr.look(u, 'h'), WARM_FRAMES);
  const seenT = new Set();
  for (const z of m.zombies) {
    const k = z.type + (z.id % 3) + (z.rf ? 'r' : '');
    if (seenT.has(k)) continue;
    seenT.add(k);
    Spr.warm(Spr.look(z, 'z'), isHuman(z) ? WARM_FRAMES.concat(['i0', 'i1', 'd0', 'd1', 'd2']) : ['i0', 'i1', 'w0', 'w1', 'w2', 'w3', 'w4', 'w5', 'a0', 'a1', 'hit', 'd0', 'd1', 'd2']);
  }
}
function resumeMission(m) {
  TAC.m = m; TAC.pend = null; TAC.mode = null; TAC.busy = false;
  warmSprites(m);
  m.phase = 'player';
  const u = liveUnits(m)[0];
  if (!u) { finishMission(); return; }
  if (!curUnit()) TAC.sel = u.id;
  computeVis(m);
  Game.showTac(true);
}
// Бросить вылазку: кто в зоне эвакуации — уезжает, остальные пропадают
function abandonMission() {
  const m = TAC.m;
  if (!m) return;
  if (m.siege) { m.siege.fled = true; for (const u of liveUnits(m)) u.evac = true; finishMission(); return; }
  for (const u of liveUnits(m)) { if (inEvac(m, u)) u.evac = true; else { u.lost = true; u.dead = true; } }
  finishMission();
}
function finishMission() {
  const m = TAC.m;
  if (!m || m.done) return;
  m.done = true;
  const rep = { loc: m.loc, got: {}, wpn: [], lines: [], kills: m.kills, turns: m.turn, siege: m.siege || null, hkills: m.hkills || {} };
  for (const u of m.units) {
    const s = S.survivors.find(o => o.id === u.sid);
    if (!s) continue;
    s.away = false;
    if (u.dead) {
      S.survivors = S.survivors.filter(o => o !== s);
      rep.lines.push({ t: u.lost ? `${u.name} ${gv(u, 'остался', 'осталась')} на вылазке. Больше ${gv(u, 'его', 'её')} не видели.` : `${u.name} ${gv(u, 'погиб', 'погибла')}.`, c: 'bad' });
      continue;
    }
    s.hp = Math.max(1, u.hp);
    s.kills = (s.kills || 0) + u.kills;
    if (s.freed) { delete s.freed; rep.rescued = (rep.rescued || 0) + 1; rep.lines.push({ t: `${s.name} — бывший пленник — теперь в группе.`, c: 'good' }); }
    const lvl = Math.min(5, 1 + Math.floor(s.kills / 5));
    if (lvl > (s.level || 1)) { s.level = lvl; s.maxhp += 2; s.hp += 2; rep.lines.push({ t: `${u.name}: опыт растёт, уровень ${lvl}.`, c: 'good' }); }
    if (u.bitten && !s.infected) { s.infected = 3; rep.lines.push({ t: `${u.name} ${gv(u, 'укушен', 'укушена')}. До обращения 3 дня.`, c: 'bad' }); }
    for (const k in u.inv) rep.got[k] = (rep.got[k] || 0) + u.inv[k];
    for (const w of u.found || []) { stash(w); rep.wpn.push(w); }
    if (u.ammo) rep.got.ammo = (rep.got.ammo || 0) + u.ammo;
  }
  for (const k in rep.got) S.res[k] = (S.res[k] || 0) + rep.got[k];
  if (!m.siege) {
    S.visits = S.visits || {};
    S.visits[m.loc] = (S.visits[m.loc] || 0) + 1;
    const L = LOCS[m.loc];
    if (L.faction && m.hostTotal) {
      const left = m.zombies.filter(z => isHuman(z) && ZT[z.type].fac === L.faction).length;
      if (!left) {
        rep.lines.push({ t: L.camp ? `${FACTIONS[L.faction].name}: лагерь разгромлен.` : `${L.short}: люди группировки «${FACTIONS[L.faction].name}» перебиты.`, c: 'good' });
        if (L.camp) factionBeaten(L.faction, rep.lines);
      }
    }
    for (const f in m.hkills) factionHit(f, m.hkills[f]);
    revealAfterMission(m, rep.lines);
  } else for (const f in m.hkills) factionHit(f, m.hkills[f]);
  S.mission = null;
  try { statMission(rep, m); } catch (e) { console.error(e); }
  TAC.m = null; TAC.reach = null;
  Game.afterMission(rep);
}
</script>
<script>
'use strict';
// ---------- Люди из группировок: ИИ, засады, пленные, восставшие мёртвые ----------
// Враги-люди живут в том же списке m.zombies (так их видно, можно бить и стрелять),
// но ходят по своему ИИ: стреляют из-за укрытий, отступают раненными, дерутся с мёртвыми.

const isFlock = z => ZT[z.type] && ZT[z.type].fac === 'flock';
const hostilesOf = m => m.zombies.filter(z => isHuman(z) && z.hp > 0);

function addHostile(m, x, y, type, state = 'guard') {
  const z = addZombie(m, x, y, type, state);
  z.ammo = ZT[type].ammo || 0;
  m.hseen = m.hseen || {}; m.hseen[ZT[type].fac] = 1;
  z.home = MI(m, x, y);
  return z;
}

// Расставить отряд группировки по постам карты
function spawnHostiles(m, L, reach, n, fac) {
  const F = FACTIONS[fac];
  const free = i => reach[i] && TP[m.tiles[i]].walk && m.tiles[i] !== T.DOOR && !zombieAt(m, i % m.w, (i / m.w) | 0) && edist(i % m.w, (i / m.w) | 0, m.start.x, m.start.y) >= 13;
  let spots = (m.guard || []).filter(free);
  if (spots.length < n) for (const i of m.indoor) if (free(i)) spots.push(i);
  if (spots.length < n) for (let i = 0; i < m.n; i++) if (free(i) && chance(0.05)) spots.push(i);
  spots = shuffle(spots.slice());
  const made = [];
  for (const i of spots) {
    if (made.length >= n) break;
    const x = i % m.w, y = (i / m.w) | 0;
    if (zombieAt(m, x, y) || made.some(o => cheb(o.x, o.y, x, y) < 2)) continue;
    made.push(addHostile(m, x, y, pick(F.types), 'guard'));
  }
  return made;
}

// Засада Вольницы: выходят с края карты, где их не видно
function spawnAmbush(m) {
  const a = m.ambush, lu = liveUnits(m);
  if (!a || !lu.length) return;
  m.ambush = null;
  const F = FACTIONS[a.fac], tg = pick(lu);
  let made = 0;
  for (let k = 0; k < 400 && made < a.n; k++) {
    const i = pick(m.edge), x = i % m.w, y = (i / m.w) | 0;
    if (m.vis[i] || m.zocc[i] || m.uocc[i]) continue;
    if (lu.some(u => edist(u.x, u.y, x, y) < 11)) continue;
    const h = addHostile(m, x, y, pick(F.types), 'investigate');
    h.tx = tg.x; h.ty = tg.y;
    made++;
  }
  if (made) { HUD.log(`${F.name}: на вас вышли ${made} ${made > 4 ? 'человек' : 'человека'}. Засада!`, 'bad'); HUD.flash(); Sfx.play('alarm'); }
}

// ----- укрытие -----
// Клетка рядом с целью со стороны стрелка, которая закрывает её по пояс
function coverOf(m, sx, sy, t) {
  const dx = Math.sign(sx - t.x), dy = Math.sign(sy - t.y);
  const cells = dx && dy ? [[dx, dy], [dx, 0], [0, dy]] : [[dx, dy]];
  for (const [ax, ay] of cells) {
    const x = t.x + ax, y = t.y + ay;
    if (!inb(m, x, y)) continue;
    const tt = m.tiles[MI(m, x, y)], tp = TP[tt];
    if (tt === T.SANDBAG || tt === T.BLOCK || tt === T.BLOCKH || tt === T.WALL || tt === T.BRICK || tt === T.WWALL || tp.furn || tt === T.HAY) return tt === T.SANDBAG || tt === T.BLOCKH || tp.wall ? 0.35 : 0.25;
    if (tt === T.FENCE && m.meta[MI(m, x, y)] !== 1) return 0.15;
  }
  return 0;
}

// Укрытия вокруг клетки для подсказки игроку: [dx, dy, 2 — полное, 1 — частичное]
function coverDirs(m, x, y) {
  const out = [];
  for (const [dx, dy] of DIR4) {
    const nx = x + dx, ny = y + dy;
    if (!inb(m, nx, ny)) continue;
    const i = MI(m, nx, ny), t = m.tiles[i], tp = TP[t];
    const lv = tp.wall || t === T.SANDBAG || t === T.BLOCKH ? 2 : tp.furn || t === T.BLOCK || t === T.HAY || (t === T.FENCE && m.meta[i] !== 1) ? 1 : 0;
    if (lv) out.push([dx, dy, lv]);
  }
  return out;
}
const coverWord = cd => !cd.length ? '' : cd.some(c => c[2] === 2) ? 'полное укрытие' : 'частичное укрытие';

// ----- восприятие -----
function perceiveH(m, h) {
  const t = ZT[h.type], tod = timeOfDay(m);
  let best = null, bs = 1e9;
  for (const u of liveUnits(m)) {
    const d = edist(h.x, h.y, u.x, u.y);
    let sr = t.sight - tod - wxOf(m).sight;
    if (u.trait === 'quiet') sr -= 2;
    if (TP[m.tiles[MI(m, u.x, u.y)]].hide) sr = Math.min(sr, 3.5);
    if ((d <= 1.5 || (d <= sr && los(m, h, u))) && d < bs) { bs = d; best = u; }
  }
  if (!isFlock(h)) for (const z of m.zombies) {
    if (isHuman(z) || z.hp <= 0) continue;
    const d = edist(h.x, h.y, z.x, z.y);
    if (d > 7 || d + 2.5 >= bs) continue;
    if (d <= 1.5 || los(m, h, z)) { bs = d + 2.5; best = z; }
  }
  if (best) {
    const was = h.state;
    h.state = 'chase'; h.tx = best.x; h.ty = best.y;
    if (best.type) { h.tz = best.id; h.target = 0; } else { h.target = best.id; h.tz = 0; }
    if (was !== 'chase' && !best.type && m.vis[MI(m, h.x, h.y)]) {
      FX.text(h.x, h.y, '!', ZT[h.type].body);
      HUD.log(`${ZT[h.type].name} замечает ${best.name}.`, 'warn');
    }
    return best;
  }
  if (h.state === 'chase') h.state = 'investigate';
  return null;
}

// ----- урон людям-бойцам игрока -----
function hurtUnit(m, u, d, src, how) {
  u.hp -= d;
  u.hitT = performance.now(); R.until = Math.max(R.until, u.hitT + 280);
  FX.blood(u.x, u.y);
  FX.text(u.x, u.y, '−' + d, '#ff6a50');
  knock(u, src.x, src.y, 0.16);
  Sfx.play('hurt', { x: u.x, y: u.y }); vibrate(70); R.shake(4);
  HUD.log(`${ZT[src.type].name} ${how}: ${u.name} −${d}`, 'bad');
  if (u.hp <= 0) killUnit(m, u);
}

async function hShoot(m, h, tg, w) {
  h.ammo--; h.ap -= w.ap; h.shots = (h.shots || 0) + 1;
  h.f = dirIdx(tg.x - h.x, tg.y - h.y);
  const show = m.vis[MI(m, h.x, h.y)] || m.vis[MI(m, tg.x, tg.y)];
  if (show && CFG.follow) R.ensureVisible(h.x, h.y);
  h.aimT = performance.now() + Math.max(200, spd(560));
  R.until = Math.max(R.until, h.aimT); R.dirty = true;
  await sleep(show ? spd(220) : 0);
  FX.flash(h.x, h.y, h.f);
  Sfx.play(w.snd, { x: h.x, y: h.y, fall: 40 });
  knock(h, tg.x, tg.y, 0.05, 140);
  FX.tracer(h.x, h.y, tg.x, tg.y);
  if (show) R.shake(w.noise > 15 ? 3 : 1);
  noise(m, h.x, h.y, w.noise);
  await sleep(show ? spd(140) : 0);
  const t = ZT[h.type], d0 = edist(h.x, h.y, tg.x, tg.y);
  let p = t.acc - Math.max(0, d0 - w.opt) * w.fall - coverOf(m, h.x, h.y, tg) - wxOf(m).acc;
  if (TP[m.tiles[MI(m, tg.x, tg.y)]].hide) p -= 0.15;
  if (rnd() < clamp(p, 0.08, 0.9)) {
    let d = Math.max(1, Math.round(rint(w.dmg[0], w.dmg[1]) * 0.7));
    if (w.close && d0 > 3) d = Math.max(1, Math.round(d * 0.6));
    if (tg.type) damageZombie(m, tg, d, h, rnd() < 0.15);
    else hurtUnit(m, tg, d, h, 'стреляет');
  } else if (show) FX.text(tg.x, tg.y, 'мимо', '#cfc6ae');
  await sleep(show ? spd(200) : 0);
}

async function hMelee(m, h, tg) {
  const t = ZT[h.type], w = WEAP[t.melee || 'knife'];
  h.ap -= w.ap;
  const show = m.vis[MI(m, h.x, h.y)] || m.vis[MI(m, tg.x, tg.y)];
  if (show && CFG.follow) R.ensureVisible(h.x, h.y);
  if (show) { Sfx.play('whoosh', { x: h.x, y: h.y }); await swing(h, tg.x, tg.y, 520); }
  if (rnd() < t.acc + 0.1) {
    const d = rint(t.dmg[0], t.dmg[1]);
    Sfx.play(MELEE_SND[t.melee] || 'hit_bat', { x: tg.x, y: tg.y });
    if (tg.type) damageZombie(m, tg, d, h, true);
    else hurtUnit(m, tg, d, h, 'бьёт');
  } else if (show) FX.text(tg.x, tg.y, 'увернулся', '#cfc6ae');
  noise(m, h.x, h.y, w.noise);
  await sleep(show ? spd(220) : 0);
}

// Отойти от угрозы: клетка, где дальше всего от неё и есть укрытие
async function hRetreat(m, h, tg) {
  for (let s = 0; s < 4 && h.ap > 0; s++) {
    let best = -1, bs = -1e9;
    for (const [dx, dy] of DIR8) {
      const nx = h.x + dx, ny = h.y + dy;
      if (!walkT(m, nx, ny) || !adjOK(m, h.x, h.y, nx, ny)) continue;
      const j = MI(m, nx, ny);
      if (m.zocc[j] || m.uocc[j]) continue;
      const sc = edist(nx, ny, tg.x, tg.y) + coverOf(m, tg.x, tg.y, { x: nx, y: ny }) * 4;
      if (sc > bs) { bs = sc; best = j; }
    }
    if (best < 0 || bs <= edist(h.x, h.y, tg.x, tg.y)) break;
    await zMove(m, h, best);
    h.ap -= TP[m.tiles[best]].cost;
    await overwatchCheck(m, h);
    if (h.hp <= 0) return;
  }
}

function targetOf(m, h) {
  if (h.state !== 'chase') return null;
  if (h.tz) return m.zombies.find(o => o.id === h.tz && o.hp > 0) || null;
  return m.units.find(o => o.id === h.target && !o.dead && !o.evac) || null;
}

async function humanAct(m, h) {
  const t = ZT[h.type];
  h.ap = t.ap; h.shots = 0;
  const w = t.ranged ? WEAP[t.ranged] : null;
  let path = null, key = '';
  for (let g = 0; g < 16 && h.ap > 0 && h.hp > 0; g++) {
    perceiveH(m, h);
    const tg = targetOf(m, h);
    if (!tg) {
      if (h.state === 'investigate') {
        if (cheb(h.x, h.y, h.tx, h.ty) <= 1) { h.state = 'guard'; h.home = MI(m, h.x, h.y); break; }
        const k = h.tx + ',' + h.ty;
        if (!path || !path.length || key !== k) { path = zPath(m, h, h.tx, h.ty); key = k; }
        if (!path || !path.length) { h.state = 'guard'; break; }
        if (!(await hStep(m, h, path.shift()))) break;
        continue;
      }
      if (h.state === 'guard' && chance(0.2)) {
        const hx = h.home % m.w, hy = (h.home / m.w) | 0, opts = [];
        for (const [dx, dy] of DIR4) { const nx = h.x + dx, ny = h.y + dy; if (walkT(m, nx, ny) && cheb(nx, ny, hx, hy) <= 3 && !m.zocc[MI(m, nx, ny)] && !m.uocc[MI(m, nx, ny)]) opts.push(MI(m, nx, ny)); }
        if (opts.length) await hStep(m, h, pick(opts));
      }
      break;
    }
    path = null;
    const d = edist(h.x, h.y, tg.x, tg.y);
    if (h.hp <= t.hp * 0.3 && !h.fled && d <= 5 && !tg.type) { h.fled = true; if (m.vis[MI(m, h.x, h.y)]) FX.text(h.x, h.y, 'отходит', '#cfc6ae'); await hRetreat(m, h, tg); continue; }
    const adj = adjOK(m, h.x, h.y, tg.x, tg.y);
    if (w && h.ammo > 0 && !h.shots && h.ap >= w.ap && d <= w.range + 0.5 && los(m, h, tg) && !(adj && t.melee && !w.close)) { await hShoot(m, h, tg, w); continue; }
    if (adj) { if (h.ap >= WEAP[t.melee || 'knife'].ap) { await hMelee(m, h, tg); continue; } break; }
    // стрелок, уже стрелявший, не лезет врукопашную, а ищет укрытие
    if (w && h.shots) { if (!coverOf(m, tg.x, tg.y, h)) await hRetreat(m, h, tg); break; }
    const pth = zPath(m, h, tg.x, tg.y);
    if (!pth || !pth.length) { const s = sideStep(m, h, tg.x, tg.y); if (s < 0 || !(await hStep(m, h, s))) break; continue; }
    if (!(await hStep(m, h, pth[0]))) break;
  }
}
// Шаг человека: двери открывает, а не ломает
async function hStep(m, h, j) {
  if (j == null || j < 0) return false;
  if (m.tiles[j] === T.DOOR) {
    if (h.ap < 1) return false;
    m.tiles[j] = T.DOOR_OPEN; h.ap -= 1;
    const x = j % m.w, y = (j / m.w) | 0;
    Sfx.play('door', { x, y, vol: m.vis[j] ? 1 : 0.5 });
    if (m.vis[j]) computeVis(m);
    return true;
  }
  if (m.zocc[j] || m.uocc[j]) return false;
  const cost = TP[m.tiles[j]].cost;
  if (h.ap < cost) return false;
  await zMove(m, h, j);
  h.ap -= cost;
  await overwatchCheck(m, h);
  return h.hp > 0;
}

// ----- мёртвые встают -----
function riseCorpses(m) {
  for (const d of m.decals) {
    if (!d.rise || m.turn < d.rise) continue;
    const i = MI(m, d.x, d.y);
    if (m.zocc[i] || m.uocc[i]) continue;
    d.rise = 0; d.gone = true;
    const z = addZombie(m, d.x, d.y, 'walker', 'investigate');
    z.rf = d.k === 'ucorpse' ? { c: d.u.color, g: d.u.g, n: d.u.name } : { t: d.zt };
    z.f = d.f;
    const lu = liveUnits(m);
    if (lu.length) { const u = pick(lu); z.tx = u.x; z.ty = u.y; }
    if (m.vis[i]) {
      FX.text(d.x, d.y, 'ВСТАЁТ', '#a4d03c');
      HUD.log(d.k === 'ucorpse' ? `${d.u.name} поднимается. Это уже не ${gv(d.u, 'он', 'она')}.` : `Убитый ${ZT[d.zt].name.toLowerCase()} поднимается мертвецом.`, 'bad');
      Sfx.play('groan', { x: d.x, y: d.y });
      R.ensureVisible(d.x, d.y);
    }
  }
  m.decals = m.decals.filter(d => !d.gone);
}
function doFinish(u, d) {
  return act(async () => {
    const m = TAC.m;
    if (u.ap < 1 || cheb(u.x, u.y, d.x, d.y) > 1 || !d.rise) return;
    u.ap -= 1;
    Sfx.play('whoosh', { x: u.x, y: u.y, dur: 0.12 });
    await swing(u, d.x, d.y);
    Sfx.play('stab', { x: d.x, y: d.y });
    FX.blood(d.x, d.y, 6);
    d.rise = 0;
    FX.text(d.x, d.y, 'добит', '#ece4cc');
    noise(m, u.x, u.y, 1);
    await sleep(spd(200));
  });
}

// ----- пленные -----
function captiveAt(m, x, y) { return (m.captives || []).find(c => !c.freed && c.x === x && c.y === y); }
function doFree(u, c) {
  return act(async () => {
    const m = TAC.m;
    if (u.ap < 2 || cheb(u.x, u.y, c.x, c.y) > 1 || c.freed) return;
    u.ap -= 2;
    c.freed = true;
    const i = MI(m, c.x, c.y);
    m.tiles[i] = m.ground[i];
    if (S.survivors.length >= GROUP_MAX) {
      Sfx.play('pickup', { x: c.x, y: c.y });
      FX.text(c.x, c.y, 'спасибо', '#86c25d');
      HUD.log(`${u.name} освобождает пленного: ${c.name}. В группе уже ${GROUP_MAX} человек — ${c.name} благодарит и уходит своей дорогой.`, 'good');
      computeVis(m);
      await sleep(spd(240));
      return;
    }
    const used = new Set(S.survivors.map(s => s.name));

    if (lod === 2 && g === T.GRASS) { c.fillStyle = 'rgba(130,160,80,0.22)'; c.fillRect(X + w * hash2(x, y, 2) * 0.8, Y + h * hash2(x, y, 3) * 0.8, Math.max(1, w * 0.06), h * 0.18); }
  }
  const md = m.meta[i], t = m.tiles[i];
  const road = TP[t].floor || t === T.BLOCK;
  if (road && g === T.ASPHALT) {
    c.fillStyle = 'rgba(214,180,80,0.7)';
    if (md & 2 && y % 3) c.fillRect(X + w * 0.45, Y + h * 0.15, Math.max(1, w * 0.1), h * 0.7);
    if (md & 4 && x % 3) c.fillRect(X + w * 0.15, Y + h * 0.45, w * 0.7, Math.max(1, h * 0.1));
    if (md & 8) { c.fillStyle = 'rgba(220,220,210,0.55)'; c.fillRect(X, Y, Math.max(1, w * 0.07), h); }
  } else if (road && g === T.DIRT && md & 6) {
    c.fillStyle = 'rgba(40,30,18,0.35)';
    if (md & 2) c.fillRect(X + w * 0.38, Y, w * 0.24, h);
    if (md & 4) c.fillRect(X, Y + h * 0.38, w, h * 0.24);
  }
  if (md & 48 && !TP[t].wall) {
    // рельсы: 16 — верхняя нитка пути, 32 — нижняя
    const top = md & 16, a = top ? 0.3 : 0, b = top ? 1 : 0.7, rl = top ? 0.62 : 0.38;
    c.fillStyle = 'rgba(66,48,30,0.92)';
    for (let s = 0.08; s < 1; s += 0.34) c.fillRect(X + w * s, Y + h * a, w * 0.14, h * (b - a));
    c.fillStyle = '#85847e'; c.fillRect(X, Y + h * rl, w, Math.max(1, h * 0.06));
    c.fillStyle = 'rgba(0,0,0,0.3)'; c.fillRect(X, Y + h * (rl + 0.06), w, Math.max(1, h * 0.03));

// Мусор на земле: бумага, банки, шины, листья, осколки
function litter(c, g, x, y, X, Y, w) {
  const hv = hash2(x, y, 31);
  const indoor = g === T.WOOD || g === T.TILE || g === T.CONCRETE;
  if (hv > (indoor ? 0.07 : 0.09)) return;
  const kind = (hash2(x, y, 32) * 5) | 0, px = X + w * (0.2 + hash2(x, y, 33) * 0.6), py = Y + w * (0.2 + hash2(x, y, 34) * 0.6), a = hash2(x, y, 35) * 3;
  c.save(); c.translate(px, py); c.rotate(a);
  if (kind === 0) { c.fillStyle = 'rgba(220,214,196,0.85)'; c.fillRect(-w * 0.09, -w * 0.06, w * 0.18, w * 0.12); c.fillStyle = 'rgba(80,80,80,0.4)'; c.fillRect(-w * 0.06, -w * 0.02, w * 0.12, w * 0.012); }
  else if (kind === 1) { c.fillStyle = '#8a2f24'; c.fillRect(-w * 0.04, -w * 0.025, w * 0.08, w * 0.05); c.fillStyle = '#c9c3b2'; c.fillRect(w * 0.03, -w * 0.025, w * 0.012, w * 0.05); }
  else if (kind === 2 && !indoor) { c.strokeStyle = '#1b1a18'; c.lineWidth = w * 0.06; c.beginPath(); c.ellipse(0, 0, w * 0.13, w * 0.1, 0, 0, Math.PI * 2); c.stroke(); }
  else if (kind === 3) { c.fillStyle = indoor ? 'rgba(170,200,215,0.7)' : '#8a5a2a'; for (let k = 0; k < 4; k++) c.fillRect((hash2(x, k, 36) - 0.5) * w * 0.3, (hash2(k, y, 37) - 0.5) * w * 0.3, w * 0.04, w * 0.03); }
  else { c.fillStyle = 'rgba(60,90,50,0.8)'; c.fillRect(-w * 0.07, -w * 0.02, w * 0.14, w * 0.04); }
  c.restore();
}

// ----- камера и кадр -----
const R = {
  cv: null, c: null, dpr: 1, W: 1, H: 1,
  cam: { cx: 32, cy: 32, k: 46, rot: 0 }, dirty: true, mode: null, moving: new Set(),
  camAnim: null, shakeA: 0, shakeT: 0, menu: null, until: 0, lastIdle: 0, hits: [], objHits: [], pan: null, pinch: null,
  init(cv) {
    this.cv = cv; this.c = cv.getContext('2d', { alpha: false });
    this.resize();
    const loop = () => { requestAnimationFrame(loop); this.tick(); };
    requestAnimationFrame(loop);
  },
  resize() {
    if (!this.cv) return;
    const W = this.cv.clientWidth || 1, H = this.cv.clientHeight || 1;
    this.dpr = Math.min(window.devicePixelRatio || 1, [1.25, 2, 3][CFG.gfx ?? 2]);
    this.W = W; this.H = H;
    this.cv.width = Math.round(W * this.dpr); this.cv.height = Math.round(H * this.dpr);
    this.clampCam();
    this.dirty = true;
  },
  proj(x, y, z = 0) { setCB(this.cam, this.W, this.H); P(x, y, z); return [PX, PY]; },
  unproj(sx, sy) { setCB(this.cam, this.W, this.H); return unP(sx, sy); },
  curMap() { return this.mode === 'base' ? this.base && this.base.m : TAC.m; },
  kMin() {
    const m = this.curMap();
    if (!m) return 8;
    const d = (m.w + m.h) * Math.SQRT1_2;
    return Math.max(6, Math.min(this.W / d, this.H / (d * VX.sE)) * 0.95);
  },
  clampCam() {
    const m = this.curMap();
    if (!m) return;
    this.cam.k = clamp(this.cam.k, this.kMin(), 110);
    this.cam.cx = clamp(this.cam.cx, 0, m.w); this.cam.cy = clamp(this.cam.cy, 0, m.h);
  },
  centerOn(x, y, instant) {
    const tx = x + 0.5, ty = y + 0.5;
    if (instant || CFG.speed >= 3 || reducedMotion) { this.cam.cx = tx; this.cam.cy = ty; this.camAnim = null; this.clampCam(); }
    else this.camAnim = { fx: this.cam.cx, fy: this.cam.cy, tx, ty, t0: performance.now(), d: 300 };
    this.dirty = true;
  },
  ensureVisible(x, y) {
    const [sx, sy] = this.proj(x + 0.5, y + 0.5, 0.9);
    const mx = Math.min(150, this.W * 0.22), my = Math.min(70, this.H * 0.18);
    if (sx < mx || sx > this.W - mx || sy < my || sy > this.H - my) this.centerOn(x, y);
  },
  zoomAt(sx, sy, f) {
    const w = this.unproj(sx, sy);
    this.cam.k = clamp(this.cam.k * f, this.kMin(), 110);
    const w2 = this.unproj(sx, sy);
    this.cam.cx += w[0] - w2[0]; this.cam.cy += w[1] - w2[1];
    this.camAnim = null; this.clampCam(); this.dirty = true;
  },
  rotate(d) { this.cam.rot = (this.cam.rot + d + 4) % 4; this.dirty = true; },
  panStart(sx, sy) { this.pan = { sx, sy, cx: this.cam.cx, cy: this.cam.cy }; this.camAnim = null; },
  panTo(sx, sy) {
    const p = this.pan;
    if (!p) return;
    setCB(this.cam, this.W, this.H);
    const a = (sx - p.sx) / this.cam.k, b = -(sy - p.sy) / (this.cam.k * VX.sE);
    this.cam.cx = p.cx - (a * CB.rx + b * CB.fx); this.cam.cy = p.cy - (a * CB.ry + b * CB.fy);
    this.clampCam(); this.dirty = true;
  },
  pinchStart(mx, my, d) { this.pinch = { d: d || 1, k: this.cam.k, w: this.unproj(mx, my) }; this.camAnim = null; },
  pinchTo(mx, my, d) {
    const q = this.pinch;
    if (!q) return;
    this.cam.k = clamp(q.k * (d || 1) / q.d, this.kMin(), 110);
    const w2 = this.unproj(mx, my);
    this.cam.cx += q.w[0] - w2[0]; this.cam.cy += q.w[1] - w2[1];
    this.clampCam(); this.dirty = true;
  },
  shake(a) {
    if (!CFG.shake || reducedMotion) return;
    this.shakeA = Math.max(this.shakeA, a); this.shakeT = performance.now(); this.dirty = true;
  },
  toTile(sx, sy) {
    for (let k = this.objHits.length - 1; k >= 0; k--) {
      const h = this.objHits[k];
      if (sx >= h.x0 && sx <= h.x1 && sy >= h.y0 && sy <= h.y1) return { x: h.x, y: h.y };
    }
    const w = this.unproj(sx, sy);
    return { x: Math.floor(w[0]), y: Math.floor(w[1]) };
  },
  pick(ax, ay, onlyZ) {
    for (let k = this.hits.length - 1; k >= 0; k--) {
      const h = this.hits[k];
      if (onlyZ && !h.z) continue;
      if (ax >= h.x0 && ax <= h.x1 && ay >= h.y0 && ay <= h.y1) return h.e;
    }
    return null;
  },
  tick() {
    if (!this.mode) return;
    const now = performance.now();
    if (CFG.hq && this.cam.k >= 14 && now - this.lastIdle > (this.fireVis ? 100 : 320)) { this.lastIdle = now; this.dirty = true; }
    const active = this.moving.size || FX.list.length || FX.parts.length || this.camAnim || this.shakeA > 0 || this.until > now;
    if (!this.dirty && !active) return;
    if (this.mode === 'menu' && !this.dirty && now - (this.lastDraw || 0) < 40) return;   // фон меню — 25 кадров
    this.lastDraw = now;
    this.dirty = false;
    GroundTex.budget = 7;
    try { this.draw(now); } catch (e) { console.error(e); }
  },
  draw(now) {
    const c = this.c;
    this.fireVis = false;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = '#0b0a08';
    c.fillRect(0, 0, this.cv.width, this.cv.height);
    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    if (this.mode === 'tac' && TAC.m) {
      if (this.camAnim) {
        const a = this.camAnim, p = Math.min(1, (now - a.t0) / a.d), e = 1 - (1 - p) ** 3;
        this.cam.cx = a.fx + (a.tx - a.fx) * e; this.cam.cy = a.fy + (a.ty - a.fy) * e;
        if (p >= 1) { this.camAnim = null; this.clampCam(); }
      }
      let ox = 0, oy = 0;
      if (this.shakeA > 0) {
        const p = (now - this.shakeT) / 220;
        if (p >= 1) this.shakeA = 0;
        else { const a = this.shakeA * (1 - p); ox = (Math.random() * 2 - 1) * a; oy = (Math.random() * 2 - 1) * a; }
      }
      drawIso(c, TAC.m, this.cam, this.W, this.H, now, false, [ox, oy]);
    } else if (this.mode === 'base' && this.base) {
      if (this.camAnim) {
        const a = this.camAnim, p = Math.min(1, (now - a.t0) / a.d), e = 1 - (1 - p) ** 3;
        this.cam.cx = a.fx + (a.tx - a.fx) * e; this.cam.cy = a.fy + (a.ty - a.fy) * e;
        if (p >= 1) this.camAnim = null;
      }
      drawIso(c, this.base.m, this.cam, this.W, this.H, now, true, [0, 0], this.base.ents);
      c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      const g = c.createLinearGradient(0, 0, 0, this.H);
      g.addColorStop(0, 'rgba(11,10,8,0.55)'); g.addColorStop(0.18, 'rgba(11,10,8,0)'); g.addColorStop(0.82, 'rgba(11,10,8,0)'); g.addColorStop(1, 'rgba(11,10,8,0.6)');
      c.fillStyle = g; c.fillRect(0, 0, this.W, this.H);
    } else if (this.mode === 'menu' && this.menu) {
      const M = this.menu, t = (now - M.t0) / 1000;
      if (M.base && !reducedMotion) { M.cam.cx = M.base.cx + Math.sin(t * 0.045) * 4; M.cam.cy = M.base.cy + Math.sin(t * 0.031 + 1) * 3; this.until = Math.max(this.until, now + 200); }
      drawIso(c, M.m, M.cam, this.W, this.H, now, true, [0, 0], M.ents);
      c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      const g = c.createLinearGradient(0, 0, this.W, 0);
      g.addColorStop(0, 'rgba(11,10,8,0.95)'); g.addColorStop(0.5, 'rgba(11,10,8,0.66)'); g.addColorStop(1, 'rgba(11,10,8,0.25)');
      c.fillStyle = g; c.fillRect(0, 0, this.W, this.H);
      if (this.W >= 600) drawLineup(c, this.W, this.H, now);
    }
  },
  setMenuMap() {
    MenuScene.build();
    this.dirty = true;
  },
};

// ----- разметка на земле (в пространстве клеток) -----
function drawGroundMarks(c, m, k, x0, x1, y0, y1) {
  const SX = x => x * k, SY = y => y * k;
  if (m.evac && m.evac.length) {
    const set = new Set(m.evac);
    c.fillStyle = 'rgba(134,168,93,0.18)';
    c.strokeStyle = 'rgba(160,200,110,0.8)'; c.lineWidth = Math.max(1.5, k * 0.05);
    c.beginPath();
    for (const i of m.evac) {
      const x = i % m.w, y = (i / m.w) | 0;
      if (x < x0 || x > x1 || y < y0 || y > y1 || !m.seen[i]) continue;
      const X = SX(x), Y = SY(y);
      c.fillRect(X, Y, k, k);
      if (!set.has(i - 1) || x === 0) { c.moveTo(X, Y); c.lineTo(X, Y + k); }
      if (!set.has(i + 1)) { c.moveTo(X + k, Y); c.lineTo(X + k, Y + k); }
      if (!set.has(i - m.w)) { c.moveTo(X, Y); c.lineTo(X + k, Y); }
      if (!set.has(i + m.w)) { c.moveTo(X, Y + k); c.lineTo(X + k, Y + k); }
    }
    c.stroke();
  }
  const u = curUnit(), rf = TAC.reach, pd = TAC.pend;
  if (u && rf && rf.uid === u.id && m.phase === 'player' && !TAC.busy && TAC.mode !== 'lure') {
    c.fillStyle = 'rgba(232,166,43,0.15)';
    c.strokeStyle = 'rgba(232,166,43,0.8)'; c.lineWidth = Math.max(1.2, k * 0.035);
    c.beginPath();
    const occ = new Set();
    for (const o of m.units) if (!o.dead && !o.evac) occ.add(MI(m, o.x, o.y));
    for (const z of m.zombies) if (m.vis[MI(m, z.x, z.y)]) occ.add(MI(m, z.x, z.y));
    const ok = j => j >= 0 && j < m.n && (rf.dist[j] >= 0 || !TP[m.tiles[j]].walk || occ.has(j) || !m.seen[j]);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const i = y * m.w + x;
      if (rf.dist[i] <= 0 || !m.seen[i]) continue;
      const X = SX(x), Y = SY(y);
      c.fillRect(X, Y, k, k);
      if (x === 0 || !ok(i - 1)) { c.moveTo(X, Y); c.lineTo(X, Y + k); }
      if (x === m.w - 1 || !ok(i + 1)) { c.moveTo(X + k, Y); c.lineTo(X + k, Y + k); }
      if (!ok(i - m.w)) { c.moveTo(X, Y); c.lineTo(X + k, Y); }
      if (!ok(i + m.w)) { c.moveTo(X, Y + k); c.lineTo(X + k, Y + k); }
    }
    c.stroke();
  }
  if (u && TAC.mode === 'lure') {
    c.setLineDash([k * 0.3, k * 0.3]); c.strokeStyle = 'rgba(232,166,43,0.8)'; c.lineWidth = Math.max(1.5, k * 0.04);
    circ(c, SX(u.x) + k / 2, SY(u.y) + k / 2, LURE_RANGE * k); c.stroke(); c.setLineDash([]);
  }
  if (pd && pd.path && u) {
    c.fillStyle = '#e8a62b';
    for (const i of pd.path) { const x = i % m.w, y = (i / m.w) | 0; circ(c, SX(x) + k / 2, SY(y) + k / 2, Math.max(2, k * 0.09)); c.fill(); }
    const last = pd.path[pd.path.length - 1], lx = last % m.w, ly = (last / m.w) | 0;
    c.strokeStyle = '#e8a62b'; c.lineWidth = Math.max(1.5, k * 0.06);
    circ(c, SX(lx) + k / 2, SY(ly) + k / 2, k * 0.34); c.stroke();
  }
  if (pd && pd.tx != null && pd.col !== '#ff6a50') {
    const X = SX(pd.tx), Y = SY(pd.ty), s = k * 0.28;
    c.strokeStyle = pd.col || '#e8a62b'; c.lineWidth = Math.max(1.5, k * 0.06);
    c.beginPath();
    c.moveTo(X, Y + s); c.lineTo(X, Y); c.lineTo(X + s, Y);
    c.moveTo(X + k - s, Y); c.lineTo(X + k, Y); c.lineTo(X + k, Y + s);
    c.moveTo(X + k, Y + k - s); c.lineTo(X + k, Y + k); c.lineTo(X + k - s, Y + k);
    c.moveTo(X + s, Y + k); c.lineTo(X, Y + k); c.lineTo(X, Y + k - s);
    c.stroke();
  }
}

// ----- эффекты поверх кадра (в экранных координатах) -----
function drawFX(c, now, gfx) {
  const k = CB.k, keep = [];
  for (const f of FX.list) {
    const p = (now - f.t0) / f.d;
    if (p >= 1) continue;
    keep.push(f);
    if (f.k === 'ring') {
      P(f.x + 0.5, f.y + 0.5, 0);
      c.strokeStyle = `rgba(232,166,43,${(1 - p) * 0.6})`; c.lineWidth = 2;
      const r = f.r * k * (0.15 + 0.85 * p);
      c.beginPath(); c.ellipse(PX, PY, r, r * CB.sE, 0, 0, Math.PI * 2); c.stroke();
    } else if (f.k === 'tr') {
      P(f.x0 + 0.5, f.y0 + 0.5, 1.05); const ax = PX, ay = PY; P(f.x1 + 0.5, f.y1 + 0.5, 0.95);
      const g = c.createLinearGradient(ax, ay, PX, PY);
      g.addColorStop(0, `rgba(255,236,170,${1 - p})`); g.addColorStop(1, `rgba(255,190,90,${(1 - p) * 0.4})`);
      c.strokeStyle = g; c.lineWidth = Math.max(1.5, k * 0.04);
      c.beginPath(); c.moveTo(ax, ay); c.lineTo(PX, PY); c.stroke();
    } else if (f.k === 'flash') {
      const a = (f.f * Math.PI) / 4;
      P(f.x + 0.5 + Math.cos(a) * 0.5, f.y + 0.5 + Math.sin(a) * 0.5, 1.02);
      const r = k * 0.35 * (1 - p * 0.5);
      c.globalCompositeOperation = 'lighter';
      c.fillStyle = `rgba(255,220,140,${1 - p})`; circ(c, PX, PY, r * 0.55); c.fill();
      c.strokeStyle = `rgba(255,200,110,${(1 - p) * 0.9})`; c.lineWidth = Math.max(1, k * 0.03);
      c.beginPath();
      for (let n = 0; n < 6; n++) { const b = (n * Math.PI) / 3 + f.t0; c.moveTo(PX, PY); c.lineTo(PX + Math.cos(b) * r, PY + Math.sin(b) * r * 0.7); }
      c.stroke();
      c.globalCompositeOperation = 'source-over';
    } else if (f.k === 'arc') {
      const x = f.x0 + (f.x1 - f.x0) * p, y = f.y0 + (f.y1 - f.y0) * p, z = 1 + Math.sin(Math.PI * p) * 2.2;
      P(x + 0.5, y + 0.5, z);
      c.fillStyle = '#7fb08a'; circ(c, PX, PY, Math.max(2.5, k * 0.09)); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.6)'; circ(c, PX - k * 0.03, PY - k * 0.03, Math.max(1, k * 0.03)); c.fill();
    }
  }
  FX.list = keep;
  // частицы
  const m = TAC.m, live = [];
  for (const q of FX.parts) {
    const p = (now - q.t0) / q.d, t = (now - q.t0) / 1000;
    if (p >= 1) continue;
    const x = q.x + q.vx * t, y = q.y + q.vy * t;
    let z = q.k === 'smoke' || q.k === 'dust' ? q.z + q.vz * t : q.z + q.vz * t - 4.9 * t * t;
    if (z <= 0 && (q.k === 'blood' || q.k === 'chip')) {
      if (q.k === 'blood' && m && m.decals.length < 600) {
        const tx = Math.floor(x), ty = Math.floor(y);
        if (inb(m, tx, ty)) m.decals.push({ k: 'spot', x: tx, y: ty, fx: x - tx, fy: y - ty, s: q.s * 1.6 });
      }
      continue;
    }
    live.push(q);
    P(x, y, z);
    if (q.k === 'smoke' || q.k === 'dust') {
      const r = (q.r + p * 0.25) * k;
      c.fillStyle = q.k === 'smoke' ? `rgba(170,166,158,${0.35 * (1 - p)})` : `rgba(150,130,100,${0.3 * (1 - p)})`;
      circ(c, PX, PY, r); c.fill();
    } else {
      const s = Math.max(1.5, q.s * k);
      c.fillStyle = q.k === 'blood' ? '#7a160e' : '#7a5a34';
      c.fillRect(PX - s / 2, PY - s / 2, s, s);
    }
  }
  FX.parts = live;
  // всплывающий текст
  for (const f of FX.list) {
    if (f.k !== 'text') continue;
    const p = (now - f.t0) / f.d;
    P(f.x + 0.5, f.y + 0.5, 2.1);
    const fs = clamp(k * 0.42, 12, 22);
    c.font = `600 ${fs}px Oswald, "Arial Narrow", sans-serif`;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    const Y = PY - p * k * 0.9;
    c.globalAlpha = p < 0.7 ? 1 : (1 - p) / 0.3;
    c.lineWidth = 3; c.strokeStyle = 'rgba(0,0,0,0.85)'; c.strokeText(f.s, PX, Y);
    c.fillStyle = f.col; c.fillText(f.s, PX, Y);
    c.globalAlpha = 1;

}

        <span class="uc-n"><b>${esc(o.name)}</b>${o.bitten ? '<i class="tag tox">укус</i>' : ''}${o.ow ? '<i class="tag amb">засада</i>' : ''}</span>

  tap(ax, ay) {
    if (R.mode === 'base') { Base.tapMap(ax, ay); return; }
    const m = TAC.m;
    if (!m || !canAct()) return;
    let t = R.toTile(ax, ay);
    const u = curUnit();
    if (!u) return;
    if (TAC.mode !== 'lure' && inb(m, t.x, t.y) && !unitAt(m, t.x, t.y) && !(zombieAt(m, t.x, t.y) && m.vis[MI(m, t.x, t.y)])) {
      const hz = R.pick(ax, ay, true);
      if (hz) t = { x: hz.x, y: hz.y };
    }
    if (!inb(m, t.x, t.y)) { this.hidePop(); TAC.pend = null; R.dirty = true; return; }
    const i = MI(m, t.x, t.y), pd = TAC.pend;
    if (pd && pd.i === i && pd.fn) { const fn = pd.fn; TAC.pend = null; this.hidePop(); fn(); return; }
    TAC.pend = null; this.hidePop(); R.dirty = true;
    if (!m.seen[i]) return;
    const ou = unitAt(m, t.x, t.y), z = zombieAt(m, t.x, t.y), zv = z && zVisible(m, z) ? z : null;
    const tile = m.tiles[i], rf = TAC.reach;

    if (TAC.mode === 'lure') {
      if (edist(u.x, u.y, t.x, t.y) <= LURE_RANGE && !TP[tile].block) { TAC.mode = null; doLure(u, t.x, t.y); }
      else this.log('Слишком далеко: бутылку можно бросить на 8 клеток.', 'warn');
      return;
    }
    if (ou) {
      if (ou !== u) {
        if (u.trait === 'medic' && cheb(u.x, u.y, ou.x, ou.y) === 1 && u.bandages > 0 && ou.hp < ou.maxhp) {
          this.showPop(ax, ay, ou.name, unitSub(ou), [
            { ic: 'bandage', label: 'Перевязать', cost: 2, ok: u.ap >= 2, fn: () => doBandage(u, ou) },
            { ic: 'next', label: 'Выбрать бойца', fn: () => selectUnit(ou) },
          ]);
          return;
        }
        Sfx.play('click');
        selectUnit(ou);
        return;
      }
      const items = [
        { ic: 'bandage', label: `Перевязка (осталось ${u.bandages})`, cost: 2, ok: u.bandages > 0 && u.ap >= 2 && u.hp < u.maxhp, fn: () => doBandage(u, u) },
        { ic: 'eye', label: 'Засада до хода зомби', cost: 'все ОД', ok: canOverwatch(u), fn: () => doOverwatch(u), note: u.ranged && u.ammo ? 'выстрел по первому, кто появится' : 'удар по первому, кто подойдёт' },
      ];
      if (inEvac(m, u)) items.push({ ic: 'exit', label: 'Сесть в машину', cost: 1, ok: u.ap >= 1, fn: () => doEvac(u) });
      this.showPop(ax, ay, u.name, `${TRAITS[u.trait].name} · ${unitSub(u)}`, items);
      return;
    }
    if (zv) {
      const w = WEAP[u.melee], adj = adjOK(m, u.x, u.y, zv.x, zv.y), sneak = isUnaware(zv), hum = isHuman(zv);
      const items = [{
        ic: 'melee', cost: w.ap, ok: adj && u.ap >= w.ap, fn: () => doMelee(u, zv),
        label: !adj ? `${w.name}: нужно подойти вплотную` : sneak && w.assassin ? `${w.name}: тихое убийство` : sneak ? `${w.name}: удар со спины ×2` : `${w.name}: удар 85%`,
      }];
      if (u.ranged) {
        const rw = WEAP[u.ranged], can = canShoot(m, u, zv);
        items.push({
          ic: 'target', cost: rw.ap, ok: can && u.ap >= rw.ap, fn: () => doShoot(u, zv),
          label: can ? `${rw.name}: ${Math.round(shotChance(m, u, zv) * 100)}%` : `${rw.name}: ${u.ammo ? 'не достать' : 'нет патронов'}`,
          note: silenced(u) ? 'с глушителем, почти тихо' : `громко: слышно за ${rw.noise} клеток`,
        });
      }
      const zt = ZT[zv.type], cov = hum && u.ranged ? coverOf(m, u.x, u.y, zv) : 0;
      if (cov && items[1]) items[1].note = `за укрытием: −${Math.round(cov * 100)}% к попаданию`;
      TAC.pend = { tx: zv.x, ty: zv.y, col: '#ff6a50' };
      const title = hum ? `${zt.name} · ${FACTIONS[zt.fac].name}` : zv.rf ? (zv.rf.n ? `${zv.rf.n}, мертвец` : 'Восставший') : zt.name;
      const mhp = zv.rf ? ZT.walker.hp : zt.hp;
      this.showPop(ax, ay, title, `${Math.max(0, zv.hp)}/${mhp} здоровья · ${hum && zv.state === 'chase' ? 'в бою' : ZSTATE[zv.state]}${hum && zt.ranged ? ` · патронов ${zv.ammo}` : ''}`, items);
      return;
    }
    // пленный у столба
    const cap = captiveAt(m, t.x, t.y);
    if (cap) {
      const adj = cheb(u.x, u.y, t.x, t.y) <= 1, items = [];
      if (adj) items.push({ ic: 'exit', label: 'Освободить', cost: 2, ok: u.ap >= 2, fn: () => doFree(u, cap), note: 'пойдёт с вами, оружия нет' });
      else {
        let best = -1, bd = 1e9;
        if (rf) for (const [dx, dy] of DIR8) { const nx = t.x + dx, ny = t.y + dy; if (!inb(m, nx, ny)) continue; const j = MI(m, nx, ny); if (rf.dist[j] > 0 && rf.dist[j] < bd) { bd = rf.dist[j]; best = j; } }
        if (best >= 0) { const go = () => doMove(u, best); TAC.pend = { i, path: pathTo(m, rf, best), fn: go }; items.push({ ic: 'walk', label: 'Подойти', cost: bd, fn: go }); }
      }
      this.showPop(ax, ay, `Пленный: ${cap.name}`, adj ? 'связан и избит, но живой' : 'нужно подойти вплотную', items);
      return;
    }
    // тело, которое скоро встанет
    const dc = m.decals.find(d => d.rise && d.x === t.x && d.y === t.y);
    if (dc && cheb(u.x, u.y, t.x, t.y) <= 1) {
      const ct0 = m.cont[i], left = dc.rise - m.turn;
      const items = [{ ic: 'melee', label: 'Добить, чтобы не встал', cost: 1, ok: u.ap >= 1, fn: () => doFinish(u, dc), note: 'удар в голову, почти тихо' }];
      if (ct0 && !contEmpty(ct0)) items.push({ ic: 'search', label: 'Обыскать тело', cost: 0, fn: () => doSearch(u, i) });
      const nm = dc.k === 'ucorpse' ? dc.u.name : ZT[dc.zt].name;
      this.showPop(ax, ay, nm, left <= 1 ? 'встанет на следующем ходу' : `встанет через ${left} ${plural(left, 'ход', 'хода', 'ходов')}`, items);
      return;
    }
    const ct = m.cont[i];
    if (ct) {
      const name = CONT[ct.k].name;
      if (cheb(u.x, u.y, t.x, t.y) <= 1) {
        if (ct.s) { doSearch(u, i); return; }
        TAC.pend = { i, fn: () => doSearch(u, i), tx: t.x, ty: t.y, col: '#e8a62b' };
        this.showPop(ax, ay, name, 'ещё не обыскано', [{ ic: 'search', label: 'Обыскать', cost: 2, ok: u.ap >= 2, fn: () => doSearch(u, i) }]);
        return;
      }
      let best = -1, bd = 1e9;
      if (rf) for (const [dx, dy] of DIR8) {
        const nx = t.x + dx, ny = t.y + dy;
        if (!inb(m, nx, ny)) continue;
        const j = MI(m, nx, ny);
        if (rf.dist[j] > 0 && rf.dist[j] < bd) { bd = rf.dist[j]; best = j; }
      }
      if (best >= 0) {
        const go = () => doMove(u, best);
        TAC.pend = { i, path: pathTo(m, rf, best), fn: go };
        this.showPop(ax, ay, name, ct.s ? 'обыскано' : 'ещё не обыскано', [{ ic: 'walk', label: 'Подойти', cost: bd, fn: go }]);

    }
    if ((tile === T.DOOR || tile === T.DOOR_OPEN) && cheb(u.x, u.y, t.x, t.y) === 1) {
      const items = [{ ic: 'door', label: tile === T.DOOR ? 'Открыть' : 'Закрыть', cost: 1, ok: u.ap >= 1, fn: () => doDoor(u, i) }];
      if (rf && rf.dist[i] > 0) items.push({ ic: 'walk', label: 'Пройти', cost: rf.dist[i], fn: () => doMove(u, i) });
      if (tile === T.DOOR_OPEN) items[0].note = 'закрытая дверь задержит зомби';
      this.showPop(ax, ay, 'Дверь', tile === T.DOOR ? 'закрыта' : 'открыта', items);
      return;
    }
    if (rf && rf.dist[i] > 0) {
      const cost = rf.dist[i], go = () => doMove(u, i);
      if (!CFG.confirmMove) { go(); return; }
      TAC.pend = { i, path: pathTo(m, rf, i), fn: go };
      const items = [{ ic: 'walk', label: 'Идти сюда', cost, fn: go, note: 'или нажмите на клетку ещё раз' }];
      if (u.lures > 0 && edist(u.x, u.y, t.x, t.y) <= LURE_RANGE) items.push({ ic: 'lure', label: 'Бросить приманку сюда', cost: 2, ok: u.ap >= 2, fn: () => doLure(u, t.x, t.y) });

      this.showPop(ax, ay, TP[tile].name || 'Клетка', u.ap ? 'не хватает очков действий' : 'у бойца закончились ОД', items);
    }

  lootCtx: null,
