<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Клык</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kelly+Slab&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Лента-летопись: одна колонка для чтения, справа скоба с героем; главы открываются широкой полосой-иллюстрацией. Тёмная степная ночь по умолчанию, светлая — как пыльный войлок. */
:root {
  --bg: #1a1712;
  --surface: #221e18;
  --surface-2: #2b261e;
  --ink: #ece5d3;
  --ink-2: #a69d89;
  --rule: #3b342a;
  --lichen: #a8bb6c;
  --ochre: #d9a24c;
  --blood: #e2795d;
  --sky: #8fb2cc;
  --scrim: rgba(8, 7, 5, 0.66);
  --f-display: 'Kelly Slab', 'Rockwell', 'Georgia', serif;
  --f-body: 'Literata', 'PT Serif', Georgia, serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e6e2d6; --surface: #f1eee5; --surface-2: #e7e2d4; --ink: #24211b; --ink-2: #605a4c; --rule: #cec6b4;
    --lichen: #52672a; --ochre: #8a5c12; --blood: #9b3423; --sky: #2f5774; --scrim: rgba(36, 33, 27, 0.5);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e6e2d6; --surface: #f1eee5; --surface-2: #e7e2d4; --ink: #24211b; --ink-2: #605a4c; --rule: #cec6b4;
  --lichen: #52672a; --ochre: #8a5c12; --blood: #9b3423; --sky: #2f5774; --scrim: rgba(36, 33, 27, 0.5);
  color-scheme: light;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 18px; line-height: 1.68;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
  -webkit-font-smoothing: antialiased;
}
body.locked { overflow: hidden; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }
[hidden] { display: none !important; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

/* ---------- шапка ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px;
  padding-block: 12px 10px; border-bottom: 1px solid var(--rule);
}
.brand { background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--f-display); font-size: 1.9rem; line-height: 1; letter-spacing: 0.04em; color: var(--ink); }
.brand:hover { color: var(--lichen); }
.where { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.nav { margin-left: auto; display: flex; gap: 6px; }
.nbtn { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; background: transparent; border: 1px solid var(--rule); padding: 7px 10px; border-radius: 2px; cursor: pointer; }
.nbtn:hover { border-color: var(--lichen); color: var(--lichen); }
#btn-rail { display: none; }
.mini { display: none; width: 100%; flex-wrap: wrap; gap: 2px 14px; font-family: var(--f-mono); font-size: 0.7rem; color: var(--ink-2); }
.mini b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.mini .warn b { color: var(--blood); }

/* ---------- раскладка ---------- */
.layout { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; padding-top: 28px; }
.story-col { min-width: 0; max-width: 720px; width: 100%; justify-self: center; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); align-self: start; display: grid; gap: 18px; max-height: calc(100vh - 96px); overflow: auto; padding-right: 4px; }

/* ---------- лента ---------- */
.story { display: grid; gap: 22px; }
.e.fresh { animation: rise 0.45s ease-out both; }
.band { aspect-ratio: 16 / 7; max-width: 100%; overflow: hidden; border-radius: 3px; background: #0d0c0a; margin-bottom: 18px; }
.band svg { display: block; width: 100%; height: 100%; }
.chap, .cover, .ending { padding-top: 18px; }
.chap + .e, .e.chap { margin-top: 10px; }
.chap-n { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--lichen); }
.chap-t, .cover-t { font-family: var(--f-display); font-weight: 400; font-size: clamp(2.2rem, 5vw, 3.2rem); line-height: 1.02; margin: 4px 0 10px; letter-spacing: 0.01em; text-wrap: balance; }
.cover-t { font-size: clamp(3.4rem, 10vw, 5.6rem); margin-bottom: 0; }
.cover-s { font-family: var(--f-display); font-size: 1.4rem; color: var(--ochre); margin: 0 0 14px; letter-spacing: 0.12em; text-transform: uppercase; }
.cover .band { aspect-ratio: 16 / 6; }
.cover-act { margin-top: 18px; }
.goal { margin: 0 0 14px; font-size: 1rem; color: var(--ink); }
.goal span { font-family: var(--f-mono); font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ochre); margin-right: 8px; }
.ending.bad .chap-n { color: var(--blood); }
.prose { max-width: 66ch; }
.prose p { margin: 0 0 0.8em; }
.prose p:last-child { margin-bottom: 0; }
.lbl { font-family: var(--f-mono); font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
.scene-t { font-family: var(--f-display); font-weight: 400; font-size: 1.55rem; line-height: 1.15; margin: 2px 0 8px; text-wrap: balance; }
.scene .prose p:first-child::first-letter { font-family: var(--f-display); font-size: 2.6em; float: left; line-height: 0.82; padding: 0.06em 0.08em 0 0; color: var(--lichen); }

.why { margin-top: 10px; font-family: var(--f-mono); font-size: 0.68rem; color: var(--ink-2); }
.why summary { cursor: pointer; width: fit-content; }
.why summary:hover { color: var(--lichen); }
.why ul { margin: 6px 0; padding-left: 1.3em; }
.why p { margin: 4px 0; }

.pick { margin: 0; padding: 10px 0 0; border-top: 1px dashed var(--rule); display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; font-style: italic; color: var(--ink); }
.pick .you { font-family: var(--f-mono); font-style: normal; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.resp { display: grid; gap: 10px; }
.roll { margin: 0; font-family: var(--f-mono); font-size: 0.72rem; }
.roll.ok { color: var(--lichen); }
.roll.bad { color: var(--blood); }
.react { margin: 0; padding-left: 14px; border-left: 2px solid var(--ochre); color: var(--ink); }
.thought { margin: 0; font-style: italic; color: var(--ink-2); }
.thought::before { content: 'Мысли Глеба. '; font-family: var(--f-mono); font-style: normal; font-size: 0.64rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--sky); }
.after { color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--f-mono); font-size: 0.68rem; padding: 2px 8px; border: 1px solid currentColor; border-radius: 99px; }
.chip.g { color: var(--lichen); }
.chip.b { color: var(--blood); }
.ai { margin: 0; font-family: var(--f-mono); font-size: 0.64rem; color: var(--ink-2); }

.st { font-family: var(--f-mono); font-style: normal; font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 1px 6px; border-radius: 2px; border: 1px solid currentColor; white-space: nowrap; }
.st-sila { color: var(--blood); }
.st-hitr { color: var(--ochre); }
.st-slovo { color: var(--sky); }
.st-znan { color: var(--lichen); }

/* ---------- ход ---------- */
.turn { margin-top: 26px; display: grid; gap: 12px; }
.turn-h { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ochre); }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 1.8em minmax(0, 1fr); gap: 2px 10px; text-align: left; padding: 11px 13px; background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
.opt:hover { border-color: var(--lichen); background: var(--surface-2); }
.opt.mine { border-color: color-mix(in srgb, var(--lichen) 45%, var(--rule)); }
.num { font-family: var(--f-display); font-size: 1.2rem; color: var(--ochre); line-height: 1.3; }
.ob { display: grid; gap: 4px; min-width: 0; }
.ot { line-height: 1.4; }
.om { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-family: var(--f-mono); font-size: 0.64rem; color: var(--ink-2); }
.free { display: grid; gap: 6px; margin-top: 6px; }
.free label { font-family: var(--f-mono); font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.free-row { display: flex; gap: 8px; }
.free input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--rule); background: var(--surface); border-radius: 4px; font-size: 1rem; }
.free input:focus { border-color: var(--lichen); outline: none; }
.free-hint { margin: 0; font-size: 0.9rem; color: var(--blood); }
.free-hint .ms { font-family: var(--f-mono); font-size: 0.64rem; color: var(--ink-2); }
.turn-end p { color: var(--ink-2); margin: 0 0 10px; }

.btn { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 10px 14px; border: 1px solid var(--ink-2); background: transparent; border-radius: 3px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--lichen); color: var(--lichen); }
.btn.primary { background: var(--lichen); border-color: var(--lichen); color: var(--bg); }
.btn.primary:hover { background: var(--ochre); border-color: var(--ochre); color: var(--bg); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin: 18px 0 0; }
.facts div { background: var(--bg); padding: 8px 10px; min-width: 0; }
.facts dt { font-family: var(--f-display); font-size: 1.5rem; line-height: 1.1; }
.facts dd { margin: 2px 0 0; font-family: var(--f-mono); font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }

/* ---------- скоба героя ---------- */
.rail-sec { display: grid; gap: 5px; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
.rail-sec:last-child { border-bottom: 0; }
.rail-sec h4 { margin: 0 0 2px; font-family: var(--f-mono); font-weight: 500; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ochre); }
.rail-goal { margin: 0; font-family: var(--f-display); font-size: 1.15rem; line-height: 1.2; }
.rail-p { margin: 0; font-size: 0.88rem; color: var(--ink-2); line-height: 1.5; }
.small { font-size: 0.76rem; }
.kv { display: flex; justify-content: space-between; gap: 8px; font-size: 0.9rem; }
.kv b { font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.kv.warn b { color: var(--blood); }
.kv .g { color: var(--lichen); }
.kv .b { color: var(--blood); }
.bar { display: block; height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--ink-2); }
.bar.goal span { background: var(--ochre); }
.bar.hp span { background: var(--lichen); }
.bar.auth span { background: var(--sky); }
.bar.blood span { background: var(--blood); }
.styles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.sty { display: grid; gap: 2px; padding: 7px 8px; border: 1px solid var(--rule); border-radius: 3px; justify-items: start; }
.sty.on { border-color: var(--lichen); }
.sty b { font-family: var(--f-display); font-size: 1.3rem; font-weight: 400; line-height: 1; }
.sty .small { color: var(--ink-2); font-family: var(--f-mono); font-size: 0.6rem; }
.mem { margin: 0; padding-left: 1.1em; font-size: 0.86rem; color: var(--ink-2); display: grid; gap: 4px; }

/* ---------- панель ---------- */
.sheet { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.sheet-panel { margin: auto; width: 100%; max-width: 720px; max-height: 100%; background: var(--bg); border: 1px solid var(--rule); border-radius: 4px; display: flex; flex-direction: column; min-width: 0; }
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--rule); }
.sheet-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 1.5rem; }
#sheet-close { margin-left: auto; }
.sheet-body { overflow: auto; padding: 18px; display: grid; gap: 16px; overscroll-behavior: contain; }
.about h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.3rem; margin: 18px 0 6px; }
.about p, .about li { font-size: 0.98rem; }
.about ul { padding-left: 1.2em; display: grid; gap: 6px; }
.ends { list-style: none; padding: 0 !important; display: flex !important; flex-wrap: wrap; gap: 6px !important; }
.ends li { font-family: var(--f-mono); font-size: 0.66rem; padding: 3px 8px; border: 1px dashed var(--rule); border-radius: 2px; color: var(--ink-2); }
.ends li.got { border-style: solid; border-color: var(--lichen); color: var(--ink); }
.bench { display: grid; gap: 8px; justify-items: start; }
#bench-out p { margin: 0; }

@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .e.fresh { animation: none; } }

/* ---------- узкие экраны ---------- */
@media (max-width: 980px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 0; padding-top: 18px; }
  .rail { display: none; }
  #btn-rail { display: inline-block; }
  .mini { display: flex; }
}
@media (max-width: 560px) {
  body { font-size: 17px; }
  .brand { font-size: 1.6rem; }
  .nav { margin-left: auto; }
  .band { aspect-ratio: 16 / 9; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .free-row { flex-direction: column; }
}

</style>
</head>
<body>
<header class="top">
  <button class="brand" type="button" id="btn-home" title="На титульную страницу">Клык</button>
  <span class="where" id="where">Книга первая · Степь</span>
  <nav class="nav" aria-label="Разделы">
    <button class="nbtn" type="button" id="btn-rail">Герой</button>
    <button class="nbtn" type="button" id="btn-about">О Сказителе</button>
  </nav>
  <div class="mini" id="mini" hidden></div>
</header>
<div class="layout">
  <main class="story-col">
    <div class="story" id="story" aria-live="polite"></div>
    <div class="turn" id="turn"></div>
  </main>
  <aside class="rail" id="rail" aria-label="Герой"></aside>
</div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head"><h2 id="sheet-title"></h2><button class="nbtn" type="button" id="sheet-close">Закрыть</button></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>
<script>
/* Пришлый — общие утилиты: случайность с зерном, текстовая грамматика, генератор имён. */
(function () {
  'use strict';
  const R = (window.R = window.R || {});

  R.hash = function (str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  };

  // Детерминированный генератор для иллюстраций: одна и та же сцена всегда рисуется одинаково.
  R.mulberry = function (a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  R.clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // Игровая случайность. Состояние хранится в сохранении, поэтому перезагрузка страницы
  // не даёт «перебросить» кубик.
  R.makeRng = function (seed) {
    let s = seed >>> 0;
    const next = () => {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), 1 | t);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    return {
      next,
      state: () => s,
      setState: (v) => { s = v >>> 0; },
      int: (a, b) => a + Math.floor(next() * (b - a + 1)),
      pick: (arr) => arr[Math.floor(next() * arr.length)],
      chance: (p) => next() < p,
      weighted(items, wf) {
        let tot = 0;
        const ws = items.map((it) => { const w = Math.max(0, wf(it)); tot += w; return w; });
        if (tot <= 0) return null;
        let x = next() * tot;
        for (let i = 0; i < items.length; i++) { x -= ws[i]; if (x <= 0) return items[i]; }
        return items[items.length - 1];
      },
    };
  };

  // Грамматика Летописца: [вариант|вариант] — случайный выбор, {имя} — подстановка переменной.
  R.expand = function (str, vars, rng) {
    if (typeof str !== 'string') return '';
    let out = str;
    const re = /\[([^\[\]]*)\]/;
    let guard = 0;
    while (re.test(out) && guard++ < 300) out = out.replace(re, (_, body) => rng.pick(body.split('|')));
    return out.replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] !== undefined ? vars[k] : m));
  };

  R.plural = function (n, forms) {
    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return forms[2];
    if (b > 1 && b < 5) return forms[1];
    if (b === 1) return forms[0];
    return forms[2];
  };

  const M1 = ['Ган', 'Бер', 'Ульф', 'Тор', 'Ред', 'Вил', 'Эд', 'Гер', 'Сиг', 'Хар', 'Лот', 'Ар', 'Бор', 'Кун', 'Дит', 'Ост', 'Фал', 'Яр', 'Мил', 'Рад'];
  const M2 = ['ольд', 'ик', 'ман', 'рих', 'вин', 'ер', 'берт', 'мар', 'о', 'ан', 'им', 'ош', 'ек'];
  const F1 = ['Аль', 'Бер', 'Гре', 'Ин', 'Лис', 'Мар', 'Эль', 'Хиль', 'Ур', 'Ве', 'Дан', 'Ро', 'Сан', 'Ти', 'Мил'];
  const F2 = ['та', 'да', 'ина', 'гит', 'ла', 'ве', 'са', 'ника', 'ена', 'рун'];
  const NICK = ['Кривой', 'Рыжий', 'Косой', 'Молчун', 'Тощий', 'Бородач', 'Хромой', 'Весельчак', 'Сова', 'Щербатый', 'Длинный', 'Лис'];
  R.nameM = (rng) => rng.pick(M1) + rng.pick(M2);
  R.nameF = (rng) => rng.pick(F1) + rng.pick(F2);
  R.nick = (rng) => rng.pick(NICK);
})();

</script>
<script>
/* Пришлый — иллюстрации, нарисованные кодом.
   Каждая сцена собирается из слоёв: небо, дальние горы, средний план, передний план, эффекты.
   Цвета слоёв выводятся из палитры времени суток: чем дальше слой, тем сильнее он растворяется
   в дымке горизонта. Так сто картинок выглядят как работа одного художника. */
(function () {
  'use strict';
  const R = (window.R = window.R || {});
  const f = (n) => Math.round(n * 10) / 10;
  const pts = (a) => a.map((p) => f(p[0]) + ',' + f(p[1])).join(' ');
  const poly = (a, extra) => `<polygon points="${pts(a)}"${extra || ''}/>`;
  const GOLD = '#d6b25e';
  const CLOTH = ['#8e3a2f', '#35597f', '#a8822f', '#4b7446', '#6b3f73', '#9a5a2a'];

  function hx(c) {
    c = c.replace('#', '');
    if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
    return [0, 2, 4].map((i) => parseInt(c.slice(i, i + 2), 16));
  }
  function mix(a, b, t) {
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const A = hx(a), B = hx(b);
    return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
  }
  R.mix = mix;

  const PAL = {
    dawn:   { sky: ['#27325e', '#b25f7c', '#f3b57d'], sun: '#ffe1a6', near: '#22192f', light: '#ffcf7a' },
    day:    { sky: ['#3b78b8', '#8bbfe4', '#dcecf6'], sun: '#fff7da', near: '#2b4434', light: '#ffe49a' },
    golden: { sky: ['#4a74a2', '#d6b07a', '#f5d9a2'], sun: '#fff0c0', near: '#3a2a1a', light: '#ffd47a' },
    dusk:   { sky: ['#1b1937', '#7a3456', '#ec874a'], sun: '#ffcd7e', near: '#1c1125', light: '#ffb35c', dark: 1 },
    night:  { sky: ['#03061a', '#0b1736', '#1c2d57'], sun: '#f1efe0', near: '#060a17', light: '#ffc66b', dark: 1 },
    storm:  { sky: ['#13171d', '#313a45', '#5a646f'], sun: '#d8dde2', near: '#101418', light: '#ffd98a', dark: 1 },
    magic:  { sky: ['#0c0420', '#35145a', '#7a3da2'], sun: '#f1dcff', near: '#120922', light: '#d8adff', dark: 1 },
    fire:   { sky: ['#150404', '#5a1608', '#d4582a'], sun: '#ffd28c', near: '#140705', light: '#ffb050', dark: 1 },
    winter: { sky: ['#7c97b2', '#bccad7', '#eaf0f4'], sun: '#ffffff', near: '#2f3d4c', light: '#ffd98a', snow: '#f1f5f9' },
    winnight: { sky: ['#050a1e', '#15254a', '#34507a'], sun: '#eef2ff', near: '#0a1222', light: '#ffc66b', snow: '#b9c8dc', dark: 1 },
    mist:   { sky: ['#5d686e', '#99a19c', '#c8cabd'], sun: '#f0eee0', near: '#2f3631', light: '#ffd98a' },
    spring: { sky: ['#5a98cf', '#a7d2e9', '#e6f5ee'], sun: '#fffbe0', near: '#2a5232', light: '#fff0a0' },
    // Интерьеры: wall — цвет стены, он же «дымка» для дальних предметов.
    tavern:   { wall: '#6a4327', floor: '#3b2414', near: '#170e07', light: '#ffb45e', tex: 'logs', dark: 1 },
    kitchen:  { wall: '#5f4630', floor: '#3a2a1b', near: '#160f08', light: '#ffb85e', tex: 'logs', dark: 1 },
    stone:    { wall: '#5a5754', floor: '#36322d', near: '#14110e', light: '#ffc777', tex: 'stone', dark: 1 },
    study:    { wall: '#4b3a2c', floor: '#2b2018', near: '#120c07', light: '#ffd28a', tex: 'planks', dark: 1 },
    noble:    { wall: '#55252e', floor: '#2b1a1b', near: '#14090b', light: '#ffd88f', tex: 'stone', dark: 1 },
    dungeon:  { wall: '#33373a', floor: '#1d2022', near: '#09090a', light: '#ff9a4a', tex: 'stone', dark: 1 },
    chapel:   { wall: '#6a6872', floor: '#3a3840', near: '#17161b', light: '#ffe6ae', tex: 'stone', dark: 1 },
    workshop: { wall: '#4a3e35', floor: '#29221c', near: '#110d0a', light: '#ffa244', tex: 'planks', dark: 1 },
    cave:     { wall: '#211b33', floor: '#17132a', near: '#07050c', light: '#b98cff', tex: 'none', dark: 1 },
    bath:     { wall: '#6b4a2d', floor: '#3d2a19', near: '#1a1008', light: '#ffc27a', tex: 'logs', dark: 1 },
  };

  let UID = 0;

  class Pic {
    constructor(key) {
      this.r = R.mulberry(R.hash(key));
      this.id = 'k' + (++UID).toString(36) + '_';
      this.o = [];
      this.d = [];
      this.n = 0;
      this.use('day');
    }
    use(name) { this.p = PAL[name]; this.hz = this.p.wall || this.p.sky[2]; return this; }
    rn(a, b) { return a + (b - a) * this.r(); }
    pk(a) { return a[Math.floor(this.r() * a.length)]; }
    add(s) { this.o.push(s); return this; }
    col(d) { return mix(this.hz, this.p.near, 0.12 + 0.88 * d); }
    shade(d, k) { return mix(this.col(d), '#000000', k === undefined ? 0.3 : k); }
    tint(c, d) { return mix(this.hz, c, 0.3 + 0.7 * d); }
    uid() { return this.id + (this.n++); }

    lin(stops, x2, y2) {
      const id = this.uid();
      this.d.push(`<linearGradient id="${id}" x1="0" y1="0" x2="${x2 || 0}" y2="${y2 === undefined ? 1 : y2}">` +
        stops.map((s) => `<stop offset="${s[0]}" stop-color="${s[1]}" stop-opacity="${s[2] === undefined ? 1 : s[2]}"/>`).join('') + '</linearGradient>');
      return `url(#${id})`;
    }
    rad(stops) {
      const id = this.uid();
      this.d.push(`<radialGradient id="${id}">` +
        stops.map((s) => `<stop offset="${s[0]}" stop-color="${s[1]}" stop-opacity="${s[2] === undefined ? 1 : s[2]}"/>`).join('') + '</radialGradient>');
      return `url(#${id})`;
    }
    glowF() {
      if (!this._gf) {
        this._gf = this.uid();
        this.d.push(`<filter id="${this._gf}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`);
      }
      return `url(#${this._gf})`;
    }
    blurF(sd) {
      const id = this.uid();
      this.d.push(`<filter id="${id}" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="${sd}"/></filter>`);
      return `url(#${id})`;
    }
    svg() {
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false"><defs>${this.d.join('')}</defs>${this.o.join('')}</svg>`;
    }

    /* ---------- небо ---------- */
    sky(name) {
      this.use(name);
      const s = this.p.sky;
      return this.add(`<rect width="800" height="450" fill="${this.lin([[0, s[0]], [0.5, s[1]], [0.76, s[2]], [1, s[2]]])}"/>`);
    }
    sun(x, y, r, op) {
      r = r || 28; op = op === undefined ? 1 : op;
      const c = this.p.sun;
      const g = this.rad([[0, c, 0.75 * op], [0.22, c, 0.3 * op], [1, c, 0]]);
      return this.add(`<circle cx="${x}" cy="${y}" r="${r * 6}" fill="${g}"/><circle cx="${x}" cy="${y}" r="${r}" fill="${c}" opacity="${op}"/>`);
    }
    moon(x, y, r, o) {
      r = r || 20; o = o || {};
      const c = o.c || this.p.sun;
      let s = `<circle cx="${x}" cy="${y}" r="${r * 4}" fill="${this.rad([[0, c, 0.35], [1, c, 0]])}"/>`;
      if (o.crescent) s += `<path d="M${x},${y - r}A${r},${r} 0 1 1 ${x},${y + r}A${f(r * 0.68)},${r} 0 1 0 ${x},${y - r}Z" fill="${c}"/>`;
      else s += `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/><circle cx="${f(x - r * 0.3)}" cy="${f(y - r * 0.2)}" r="${f(r * 0.22)}" fill="#000" opacity=".08"/><circle cx="${f(x + r * 0.28)}" cy="${f(y + r * 0.3)}" r="${f(r * 0.15)}" fill="#000" opacity=".08"/><circle cx="${f(x + r * 0.1)}" cy="${f(y - r * 0.45)}" r="${f(r * 0.1)}" fill="#000" opacity=".07"/>`;
      return this.add(s);
    }
    stars(n, maxY) {
      n = n || 90; maxY = maxY || 250;
      let s = '';
      for (let i = 0; i < n; i++) {
        const x = this.rn(0, 800), y = Math.pow(this.r(), 1.4) * maxY, r = this.rn(0.4, 1.5);
        s += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" opacity="${f(this.rn(0.25, 0.95))}"${i % 6 === 0 ? ` class="tw" style="animation-delay:-${f(this.rn(0, 4))}s"` : ''}/>`;
      }
      return this.add(`<g fill="#fff">${s}</g>`);
    }
    clouds(n, y0, y1, op, c) {
      c = c || mix(this.p.sky[1], '#ffffff', 0.25);
      let s = '';
      for (let i = 0; i < n; i++) {
        const cx = this.rn(-40, 840), cy = this.rn(y0, y1), w = this.rn(70, 170);
        for (let j = 0; j < 5; j++) s += `<ellipse cx="${f(cx + this.rn(-w / 2, w / 2))}" cy="${f(cy + this.rn(-8, 8))}" rx="${f(w * this.rn(0.25, 0.45))}" ry="${f(w * this.rn(0.1, 0.17))}"/>`;
      }
      return this.add(`<g class="drift" fill="${c}" opacity="${op === undefined ? 0.55 : op}">${s}</g>`);
    }
    rays(x, y, n, op, len) {
      let s = '';
      len = len || 700;
      for (let i = 0; i < n; i++) {
        const a = this.rn(0, Math.PI * 2), w = this.rn(0.03, 0.08);
        s += poly([[x, y], [x + Math.cos(a - w) * len, y + Math.sin(a - w) * len], [x + Math.cos(a + w) * len, y + Math.sin(a + w) * len]]);
      }
      return this.add(`<g fill="${this.p.light}" opacity="${op || 0.08}">${s}</g>`);
    }
    beams(x0, x1, y0, op) { // лучи сверху вниз, как сквозь кроны или окна
      let s = '';
      for (let x = x0; x < x1; x += this.rn(60, 120)) {
        const w = this.rn(14, 40);
        s += poly([[x, y0], [x + w, y0], [x + w + 140, 450], [x + 120, 450]]);
      }
      return this.add(`<g fill="${this.p.light}" opacity="${op || 0.1}">${s}</g>`);
    }
    meteor(x0, y0, x1, y1) {
      const g = this.lin([[0, '#fff', 0], [1, '#fff', 0.95]], 1, 0);
      return this.add(`<path d="M${x0},${y0}L${x1},${y1}" stroke="${g}" stroke-width="3" stroke-linecap="round"/><circle cx="${x1}" cy="${y1}" r="16" fill="${this.rad([[0, '#fff', 0.9], [1, '#fff', 0]])}"/>`);
    }
    aurora(y, op) {
      let s = '';
      const cols = ['#5cf2b0', '#7ad8ff', '#b07bff'];
      for (let i = 0; i < 3; i++) {
        const c = cols[i], yy = y + i * 26;
        let p = `M-20,${yy}`;
        for (let x = 0; x <= 840; x += 60) p += ` Q${x + 30},${f(yy + this.rn(-40, 40))} ${x + 60},${f(yy + this.rn(-20, 20))}`;
        const g = this.lin([[0, c, 0], [0.5, c, 0.55], [1, c, 0]]);
        s += `<path d="${p}" stroke="${g}" stroke-width="${f(this.rn(28, 46))}" fill="none" opacity="${op || 0.6}"/>`;
      }
      return this.add(`<g class="drift" filter="${this.blurF(6)}">${s}</g>`);
    }

    /* ---------- рельеф ---------- */
    noise(n, rough) {
      const a = new Array(n + 1).fill(0);
      a[0] = this.r(); a[n] = this.r();
      let disp = 1;
      for (let st = n / 2; st >= 1; st /= 2) {
        for (let i = st; i < n; i += st * 2) a[i] = (a[i - st] + a[i + st]) / 2 + (this.r() - 0.5) * disp;
        disp *= rough;
      }
      const mn = Math.min(...a), mx = Math.max(...a);
      return a.map((v) => (v - mn) / (mx - mn || 1));
    }
    ridge(d, base, amp, rough, o) {
      o = o || {};
      const n = 64, v = this.noise(n, rough || 0.55);
      const X = (i) => f(-10 + (i * 820) / n), Y = (i) => f(base - amp * v[i]);
      let p = `M-10,450L-10,${Y(0)}`;
      for (let i = 1; i <= n; i++) p += `L${X(i)},${Y(i)}`;
      this.add(`<path d="${p}L810,450Z" fill="${o.fill || this.col(d)}"/>`);
      if (o.caps || this.p.snow) {
        const T = base - amp * 0.5;
        let top = '', bot = [];
        for (let i = 0; i <= n; i++) {
          const y = base - amp * v[i];
          top += (i ? 'L' : 'M') + X(i) + ',' + f(y);
          bot.push(X(i) + ',' + f(y < T ? Math.min(y + 16, T) : y));
        }
        this.add(`<path d="${top}L${bot.reverse().join('L')}Z" fill="${this.p.snow || '#f4f6f8'}" opacity=".85"/>`);
      }
      return this;
    }
    hills(d, base, amp, fq, fill) {
      amp = amp === undefined ? 30 : amp; fq = fq || 1;
      const a = this.rn(0, 6), b = this.rn(0, 6);
      let p = 'M-10,450';
      for (let x = -10; x <= 810; x += 10) p += `L${x},${f(base - amp * (0.55 + 0.3 * Math.sin(x * 0.007 * fq + a) + 0.15 * Math.sin(x * 0.019 * fq + b)))}`;
      if (!fill && this.p.snow) fill = mix(this.p.snow, this.col(d), 0.12 + 0.22 * d);
      return this.add(`<path d="${p}L810,450Z" fill="${fill || this.col(d)}"/>`);
    }
    ground(d, y, fill) { return this.hills(d, y, 8, 1.5, fill); }
    mound(x, b, w, h, d, fill) { // отдельный холм под замок или башню
      return this.add(`<path d="M${x - w},${b}C${x - w * 0.5},${b} ${x - w * 0.45},${b - h} ${x},${b - h}C${x + w * 0.45},${b - h} ${x + w * 0.5},${b} ${x + w},${b}L${x + w},450L${x - w},450Z" fill="${fill || (this.p.snow ? mix(this.p.snow, this.col(d), 0.25) : this.col(d))}"/>`);
    }
    cliff(x0, x1, top, d, side) { // скала с обрывом
      const c = this.col(d);
      const p = side === 'left'
        ? `M-10,450L-10,${top}L${x1 - 60},${top - 10}L${x1 - 20},${top + 20}L${x1},${top + 70}L${x1 + 20},${top + 160}L${x1 + 10},450Z`
        : `M810,450L810,${top}L${x0 + 60},${top - 10}L${x0 + 20},${top + 20}L${x0},${top + 70}L${x0 - 20},${top + 160}L${x0 - 10},450Z`;
      return this.add(`<path d="${p}" fill="${c}"/>`);
    }

    /* ---------- растительность ---------- */
    pine(x, b, h) {
      const w = h * 0.8;
      const P = [[0, -1], [0.28, -0.66], [0.16, -0.66], [0.42, -0.34], [0.26, -0.34], [0.5, -0.06], [0.07, -0.06], [0.07, 0], [-0.07, 0], [-0.07, -0.06], [-0.5, -0.06], [-0.26, -0.34], [-0.42, -0.34], [-0.16, -0.66], [-0.28, -0.66]];
      return poly(P.map((q) => [x + q[0] * w, b + q[1] * h]));
    }
    leafy(x, b, h, c2) {
      const r = h * 0.3;
      const fillAttr = c2 ? ` fill="${c2}"` : '';
      return `<rect x="${f(x - h * 0.04)}" y="${f(b - h * 0.5)}" width="${f(h * 0.08)}" height="${f(h * 0.5)}"/>` +
        `<g${fillAttr}><circle cx="${f(x)}" cy="${f(b - h * 0.68)}" r="${f(r)}"/><circle cx="${f(x - r * 0.7)}" cy="${f(b - h * 0.52)}" r="${f(r * 0.8)}"/><circle cx="${f(x + r * 0.75)}" cy="${f(b - h * 0.55)}" r="${f(r * 0.75)}"/><circle cx="${f(x + r * 0.1)}" cy="${f(b - h * 0.86)}" r="${f(r * 0.6)}"/></g>`;
    }
    bare(x, b, h) {
      const w = f(Math.max(1.2, h * 0.05));
      return `<path d="M${f(x)},${f(b)}L${f(x)},${f(b - h * 0.6)}L${f(x - h * 0.25)},${f(b - h * 0.95)}M${f(x)},${f(b - h * 0.45)}L${f(x + h * 0.3)},${f(b - h * 0.8)}L${f(x + h * 0.38)},${f(b - h * 0.92)}M${f(x)},${f(b - h * 0.62)}L${f(x + h * 0.06)},${f(b - h)}M${f(x - h * 0.13)},${f(b - h * 0.78)}L${f(x - h * 0.05)},${f(b - h * 0.92)}M${f(x + h * 0.18)},${f(b - h * 0.65)}L${f(x + h * 0.3)},${f(b - h * 0.62)}" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round"/>`;
    }
    willow(x, b, h, d) {
      const c = this.col(d);
      const top = b - h, w = h * 0.55;
      let s = `<path d="M${f(x - h * 0.04)},${b}C${f(x - h * 0.06)},${f(b - h * 0.4)} ${f(x + h * 0.05)},${f(b - h * 0.6)} ${f(x)},${f(top + h * 0.2)}L${f(x + h * 0.05)},${f(top + h * 0.2)}C${f(x + h * 0.1)},${f(b - h * 0.6)} ${f(x + h * 0.02)},${f(b - h * 0.4)} ${f(x + h * 0.05)},${b}Z" fill="${c}"/>`;
      s += `<path d="M${f(x - w)},${f(top + h * 0.32)}C${f(x - w)},${f(top - h * 0.02)} ${f(x + w)},${f(top - h * 0.02)} ${f(x + w)},${f(top + h * 0.32)}Z" fill="${c}"/>`;
      let lines = '';
      for (let i = 0; i < 46; i++) {
        const t = i / 45, xx = x - w + t * 2 * w + this.rn(-6, 6);
        const y0 = top + h * 0.3 - Math.sin(t * Math.PI) * h * 0.18, y1 = y0 + this.rn(h * 0.35, h * 0.75) * (0.55 + 0.45 * Math.sin(t * Math.PI));
        lines += `M${f(xx)},${f(y0)}Q${f(xx + (t - 0.5) * 18)},${f((y0 + y1) / 2)} ${f(xx + (t - 0.5) * 26)},${f(y1)}`;
      }
      s += `<path d="${lines}" stroke="${c}" stroke-width="${f(Math.max(2, h * 0.016))}" fill="none" stroke-linecap="round"/>`;
      return this.add(s);
    }
    forest(d, base, kind, hMin, hMax, dens, x0, x1, fill) {
      kind = kind || 'pine'; hMin = hMin || 28; hMax = hMax || 56; dens = dens || 1;
      x0 = x0 === undefined ? -20 : x0; x1 = x1 === undefined ? 820 : x1;
      const c = fill || this.col(d);
      let s = '', x = x0;
      while (x < x1) {
        const h = this.rn(hMin, hMax), y = base + this.rn(-3, 5);
        if (kind === 'pine') s += this.pine(x, y, h);
        else if (kind === 'mixed') s += this.r() < 0.5 ? this.pine(x, y, h) : this.leafy(x, y, h * 0.9);
        else if (kind === 'dead') s += this.bare(x, y, h);
        else s += this.leafy(x, y, h);
        x += (this.rn(0.25, 0.55) * h) / dens;
      }
      return this.add(`<g fill="${c}" color="${c}">${s}</g>`);
    }
    tree(x, b, h, d, kind, leaf) {
      const c = this.col(d);
      const s = kind === 'pine' ? this.pine(x, b, h) : kind === 'dead' ? this.bare(x, b, h) : this.leafy(x, b, h, leaf);
      return this.add(`<g fill="${c}" color="${c}">${s}</g>`);
    }
    autumnTrees(x0, x1, b, hMin, hMax, d) {
      const leaves = ['#b8642a', '#c99a3a', '#8a3d22', '#a77b2c'];
      let x = x0;
      while (x < x1) {
        const h = this.rn(hMin, hMax);
        this.tree(x, b + this.rn(-4, 4), h, d, 'leafy', this.tint(this.pk(leaves), d));
        x += this.rn(0.4, 0.8) * h;
      }
      return this;
    }
    reeds(x0, x1, b, h, d) {
      let s = '';
      for (let x = x0; x < x1; x += this.rn(3, 9)) {
        const hh = this.rn(h * 0.5, h), lean = this.rn(-8, 8);
        s += `M${f(x)},${b}Q${f(x + lean * 0.3)},${f(b - hh * 0.5)} ${f(x + lean)},${f(b - hh)}`;
        if (this.r() < 0.3) s += `M${f(x + lean)},${f(b - hh)}l0,${f(hh * 0.18)}`;
      }
      return this.add(`<path d="${s}" stroke="${this.col(d)}" stroke-width="2" fill="none" stroke-linecap="round"/>`);
    }
    flowers(x0, x1, y0, y1, n, cols) {
      cols = cols || ['#f2d36b', '#f0f0e8', '#d77fa1', '#8fb4e8'];
      let s = '';
      for (let i = 0; i < n; i++) {
        const y = this.rn(y0, y1);
        s += `<circle cx="${f(this.rn(x0, x1))}" cy="${f(y)}" r="${f(1 + ((y - y0) / (y1 - y0)) * 2.4)}" fill="${this.pk(cols)}"/>`;
      }
      return this.add(`<g opacity=".9">${s}</g>`);
    }

    /* ---------- вода и дороги ---------- */
    water(y, sunX, o) {
      o = o || {};
      const s = this.p.sky;
      const g = this.lin([[0, mix(s[2], s[1], 0.25)], [1, mix(s[1], this.p.near, 0.5)]]);
      let str = `<rect x="0" y="${y}" width="800" height="${450 - y}" fill="${o.fill || g}"/>`;
      let l = '';
      const sx = sunX === undefined ? 400 : sunX;
      for (let i = 0; i < 30; i++) {
        const yy = y + Math.pow(this.r(), 1.6) * (450 - y), w = this.rn(10, 60) * (1 + (yy - y) / 120), xx = sx + this.rn(-1, 1) * (30 + (yy - y) * 1.2);
        l += `<rect x="${f(xx - w / 2)}" y="${f(yy)}" width="${f(w)}" height="${f(this.rn(1, 2.2))}"/>`;
      }
      str += `<g fill="${o.glint || this.p.sun}" opacity="${o.glintOp || 0.4}">${l}</g>`;

<script>
/* Клык — иллюстрации глав. Рисует тот же движок, что и «Пришлого» (game/js/art.js),
   плюс несколько степных фигур: орк, юрта, каменная баба. */
(function () {
  'use strict';
  const R = window.R;
  const P = R.ART.Pic.prototype;
  const f = (n) => Math.round(n * 10) / 10;

  // Орк: сутулый широкоплечий силуэт с клыками. Локальные координаты: ступни на 0, рост около 100.
  P.orc = function (x, b, h, d, o) {
    o = o || {};
    const c = o.c || this.col(d), F = o.flip ? -1 : 1, k = h / 100;
    let s = '<polygon points="-15,-40 -6,-40 -8,0 -19,0"/><polygon points="4,-40 13,-40 17,0 6,0"/>' +
      '<polygon points="-22,-40 -27,-70 -18,-86 10,-91 25,-80 22,-56 14,-40"/>' +
      '<circle cx="16" cy="-93" r="9"/><polygon points="9,-91 27,-93 25,-84 12,-82"/>' +
      '<polygon points="14,-101 18,-110 20,-100"/>' +
      '<polygon points="-24,-78 -31,-50 -27,-33 -20,-35 -22,-52 -16,-74"/>';
    if (o.robe) s += '<polygon points="-24,-80 26,-80 34,0 -32,0" opacity=".92"/>';
    if (o.weapon === 'axe') s += '<polygon points="18,-78 32,-62 36,-48 30,-46 25,-60 14,-70"/><path d="M33,-47L44,-104" stroke="currentColor" stroke-width="3.4"/><path d="M40,-100Q56,-104 58,-86Q48,-90 42,-88Z"/>';
    else if (o.weapon === 'spear') s += '<polygon points="18,-78 32,-62 36,-48 30,-46 25,-60 14,-70"/><path d="M33,-47L38,-140" stroke="currentColor" stroke-width="2.6"/><polygon points="35,-140 38.5,-156 42,-140"/>';
    else if (o.weapon === 'staff') s += '<polygon points="18,-78 30,-64 32,-50 26,-48 23,-60 14,-70"/><path d="M30,-50L32,-128" stroke="currentColor" stroke-width="3"/><circle cx="32" cy="-132" r="5"/>';
    else s += '<polygon points="18,-78 28,-52 26,-34 20,-35 21,-52 14,-70"/>';
    this.add(`<g fill="${c}" color="${c}" transform="translate(${f(x)},${f(b)}) scale(${f(F * k * 100) / 100},${f(k * 100) / 100})">${s}</g>`);
    if (o.tusks !== false && h > 40) this.add(`<g fill="#e9dfc6" opacity=".85" transform="translate(${f(x)},${f(b)}) scale(${f(F * k * 100) / 100},${f(k * 100) / 100})"><polygon points="22,-87 24,-94 25.6,-87"/></g>`);
    if (o.weapon === 'staff') this.light(x + F * 32 * k, b - 132 * k, 26 * k, 0.8);
    return this;
  };

  P.yurt = function (x, b, s, d, o) {
    o = o || {};
    const c = this.col(d), lit = o.lit === undefined ? !!this.p.dark : o.lit;
    const felt = mixFelt(this, c);
    this.add(`<path d="M${f(x - 42 * s)},${b}V${f(b - 26 * s)}Q${f(x)},${f(b - 74 * s)} ${f(x + 42 * s)},${f(b - 26 * s)}V${b}Z" fill="${felt}"/>` +
      `<path d="M${f(x - 42 * s)},${f(b - 26 * s)}Q${f(x)},${f(b - 74 * s)} ${f(x + 42 * s)},${f(b - 26 * s)}" fill="none" stroke="${c}" stroke-width="${f(2 * s)}"/>` +
      `<path d="M${f(x - 42 * s)},${f(b - 14 * s)}H${f(x + 42 * s)}" stroke="${c}" stroke-width="${f(1.4 * s)}" opacity=".7"/>` +
      `<rect x="${f(x - 7 * s)}" y="${f(b - 22 * s)}" width="${f(14 * s)}" height="${f(22 * s)}" fill="${lit ? this.p.light : c}"/>`);
    if (lit) this.light(x, b - 10 * s, 50 * s, 0.5);
    if (o.smoke) this.smoke(x, b - 50 * s, 60 * s);
    if (o.horns) this.add(`<path d="M${f(x + 30 * s)},${f(b - 20 * s)}V${f(b - 86 * s)}" stroke="${c}" stroke-width="${f(2 * s)}"/><path d="M${f(x + 22 * s)},${f(b - 92 * s)}Q${f(x + 30 * s)},${f(b - 80 * s)} ${f(x + 38 * s)},${f(b - 92 * s)}" stroke="${c}" stroke-width="${f(3 * s)}" fill="none"/>`);
    return this;
  };
  function mixFelt(pic, c) { return R.ART.mix(c, '#b9a585', pic.p.dark ? 0.18 : 0.35); }

  P.idol = function (x, b, h, d, glow) { // каменная баба
    const c = this.col(d);
    this.add(`<path d="M${f(x - h * 0.18)},${b}L${f(x - h * 0.16)},${f(b - h * 0.78)}Q${f(x)},${f(b - h * 1.04)} ${f(x + h * 0.16)},${f(b - h * 0.78)}L${f(x + h * 0.18)},${b}Z" fill="${c}"/>` +
      `<path d="M${f(x - h * 0.08)},${f(b - h * 0.78)}h${f(h * 0.05)}M${f(x + h * 0.03)},${f(b - h * 0.78)}h${f(h * 0.05)}M${f(x - h * 0.04)},${f(b - h * 0.66)}h${f(h * 0.08)}M${f(x - h * 0.1)},${f(b - h * 0.45)}q${f(h * 0.1)},${f(h * 0.06)} ${f(h * 0.2)},0" stroke="${glow ? this.p.light : R.ART.mix(c, '#ffffff', 0.18)}" stroke-width="${f(Math.max(1.4, h * 0.02))}" fill="none"${glow ? ` filter="${this.glowF()}"` : ''}/>`);
    return this;
  };

  P.grass = function (y0, y1, n, d) {
    let s = '';
    for (let i = 0; i < n; i++) {
      const y = this.rn(y0, y1), x = this.rn(-10, 810), hh = 6 + ((y - y0) / Math.max(1, y1 - y0)) * 22, l = this.rn(-6, 6);
      s += `M${f(x)},${f(y)}q${f(l * 0.4)},${f(-hh * 0.6)} ${f(l)},${f(-hh)}`;
    }
    return this.add(`<path d="${s}" stroke="${this.col(d)}" stroke-width="1.3" fill="none" opacity=".8"/>`);
  };

  const SC = {};
  const S = (id, title, draw) => { SC[id] = { id, title, draw }; };

  S('o_ravine', 'Овраг', (b) => {

    b.ground(0.85, 400).add(`<g fill="${b.col(0.95)}"><ellipse cx="300" cy="420" rx="40" ry="10"/><ellipse cx="520" cy="430" rx="60" ry="12"/></g>`);
    b.add(`<g transform="translate(420,418) rotate(-82)">`).orc(0, 0, 86, 1, { tusks: false }).add('</g>').vignette(0.4);
  });
  S('o_steppe', 'Степь Ашхар', (b) => {
    b.sky('golden').sun(150, 230, 30).clouds(3, 60, 140, 0.35).hills(0.2, 300, 22).hills(0.4, 330, 26);

  });
  S('o_camp', 'Стойбище Сломанного Рога', (b) => {
    b.sky('dusk').sun(620, 300, 28).hills(0.3, 318, 22);
    for (let i = 0; i < 7; i++) b.yurt(70 + i * 112, 344 + (i % 2) * 6, 0.55, 0.6, { lit: i % 3 === 0 });
    b.yurt(170, 410, 1.3, 0.88, { lit: true, smoke: true, horns: true }).yurt(640, 416, 1.2, 0.9, { lit: true });
    b.ground(0.95, 420).campfire(410, 430, 1.4).orc(330, 446, 90, 1, { weapon: 'axe' }).orc(495, 448, 82, 1, { flip: true }).embers(20, 360, 460, 330, 410);
  });
  S('o_spirits', 'Испытание духов', (b) => {
    b.sky('magic').stars(130, 300).aurora(80, 0.45).hills(0.5, 350, 20);
    b.idol(400, 360, 150, 0.85, true).ground(1, 400).campfire(400, 418, 1.6);
    b.orc(270, 446, 100, 1, { robe: true, weapon: 'staff' }).orc(540, 448, 92, 1, { flip: true }).sparkles(28, 220, 580, 120, 360);
  });
  S('o_ford', 'Верхний Брод', (b) => {
    b.sky('mist').hills(0.25, 300, 20).village(470, 330, 6, 0.6, 0.45, { smoke: true }).church(640, 330, 0.7, 0.45);
    b.river(420, 320, 300, 30, 200).ground(0.8, 380).fog(300, 70, 0.55);
    b.horse(120, 418, 1.1, 1, { c: b.col(1) }).orc(124, 384, 64, 1, { weapon: 'spear' }).horse(220, 430, 1.2, 1).orc(222, 394, 66, 1, { weapon: 'axe' });
  });
  S('o_kurultai', 'Курултай у Чёрного камня', (b) => {
    b.sky('night').stars(140, 260).moon(640, 90, 22).hills(0.4, 330, 20);
    for (let i = 0; i < 9; i++) b.yurt(30 + i * 95, 350, 0.45, 0.6, { lit: i % 2 === 0 });
    b.add(`<polygon points="360,410 372,170 400,140 430,175 446,410" fill="#05060a"/>`).light(400, 400, 260, 0.35);
    b.ground(1, 415).campfire(300, 428, 1.2).campfire(510, 430, 1.2).crowd(80, 260, 450, 70, 1, 4, ['cloak']).crowd(560, 740, 450, 70, 1, 4, ['cloak']).banner(400, 452, 150, 1, '#1a1a1a');
  });
  S('o_whitestone', 'Белый камень', (b) => {

    b.army(470, 800, 344, 18, 0.5, 2, { banners: 3, color: '#d8d0b8' }).army(0, 330, 346, 18, 0.55, 2, { banners: 3, color: '#3a2a1a' });

  R.ORC_ART = {

(function () {

  /* ---------- Герои ---------- */
  const NPC = {

    tx: ['Ночью вы слышите их раньше, чем видите: шорох в ковыле, короткий взвизг, тишина. Потом вокруг загораются глаза. Шесть пар. Седьмая, крупнее, неподвижна. Вожак ждёт, когда раненый орк упадёт сам.'],
    opts: [
      { s: 'sila', t: 'Встать спиной к валуну, взять камень потяжелее и ждать вожака', dc: 13, ok: { r: 'Вожак прыгает первым, и тело Тарга встречает его ударом, который вы бы сами никогда не придумали. Хруст. Тишина. Стая отступает в темноту, оставив вам вожака и его шкуру.', fx: { flag: 'wolf_pelt', auth: 4, mem: 'Вы убили вожака стаи и забрали шкуру.' } }, bad: { r: 'Вы отбиваетесь до рассвета. Волки уходят, но на память о ночи остаётся прокушенная рука.', fx: { hp: -18 } } },
      { s: 'znan', t: 'Развести огонь лучковым сверлом из ремня и палки', dc: 11, ok: { r: 'Сверло визжит, дымок, искра, огонь. Вы сидите у костра до утра, а волки смотрят на вас с уважением тех, кто тоже не понимает, как это работает.', fx: { flag: 'fire_maker' } }, bad: { r: 'Ремень рвётся на третьей попытке. Ночь вы проводите на валуне, а волки внизу проводят её в ожидании.', fx: { hp: -8 } } },
      { s: 'hitr', t: 'Отвести стаю к обрыву над балкой и пройти по самому краю', dc: 12, ok: { r: 'Вы идёте там, где осыпается глина. Двое волков, увлёкшись, срываются вниз. Остальные решают, что сегодня не их ночь.' }, bad: { r: 'Обрыв осыпается и под вами. Вы летите вниз вместе с волком. Волку повезло меньше, но и вам не очень.', fx: { hp: -12 } } },
      { s: 'sila', t: 'Зарычать так, как рычал Тарг. Вдруг тело помнит', dc: 10, ok: { r: 'Из горла вырывается звук, от которого у вас встают дыбом волосы, которых нет. Стая растворяется в ковыле.', fx: { blood: 6 } }, bad: { r: 'Получается скорее кашель. Вожак наклоняет голову, будто ему за вас неловко. Приходится отбиваться палкой.', fx: { hp: -10 } } },
    ] });

  sc({ id: 'nisa', chap: [1], once: true, npc: 'nisa', kind: 'social', adv: 24, title: 'Охотница', ctx: { nom: 'Ниса' },
    tx: [(S) => 'Утром у вашего костра стоит орчиха с копьём. Молодая, жилистая, с выбритым виском и тремя шрамами на щеке. Ниса, дочь кузнеца. Тарг её помнит: она смеялась громче всех, когда Брак сбрасывал его в овраг.' + (S.flags.seen_nisa ? ' Это она смотрела на вас с края оврага.' : '') + '\n\n«Брак послал проверить, сдох ли ты, — говорит она. — Вижу, не сдох. Жаль. Мне теперь врать или правду говорить?»'],
    opts: [
      { s: 'slovo', t: 'Попросить сказать Браку, что она нашла только кости', dc: 12, ok: { r: 'Ниса долго смотрит. «Кости, значит. Ладно. Но ты мне должен, изгой». Уходя, она бросает через плечо: «И вот что. Брак подсыпал тебе дурман-траву в чашу перед поединком. Я видела».', fx: { flags: ['nisa_lied', 'brak_cheat'], mem: 'Ниса соврала Браку ради вас. И рассказала про дурман-траву.' } }, bad: { r: '«Просить — это для людей», — фыркает Ниса и уходит. Вы не знаете, что она скажет в стойбище.' } },
      { s: 'hitr', t: 'Предложить сделку: часть будущей добычи за молчание', dc: 11, ok: { r: 'Ниса прищуривается, прикидывая выгоду. «Половина. И я выбираю, какая половина». Сделка. Уже уходя, она добавляет: «Бесплатный совет: не пей из чаш Брака. В прошлый раз он подсыпал тебе дурман».', fx: { flags: ['nisa_deal', 'brak_cheat'], mem: 'У вас сделка с Нисой. Она знает, что Брак сжульничал.' } }, bad: { r: '«Торгуешься, как гоблин», — смеётся Ниса. Но копьё опускает.' } },
      { s: 'sila', t: 'Выбить у неё копьё и показать, что Тарг уже не тот', dc: 13, ok: { r: 'Копьё летит в траву. Ниса не тянется за ним, только улыбается разбитой губой: «О. Вот это новости».' }, bad: { r: 'Ниса уворачивается и ставит вам подножку. Вы лежите в траве и смотрите в небо. Небо смеётся.', fx: { hp: -6 } } },
      { s: 'znan', t: 'Заметить, что её конь хромает, и вылечить копыто', dc: 11, ok: { r: 'Камень в копыте и воспаление. Вы вынимаете камень её же ножом и промываете рану. Ниса смотрит, будто у вас выросла вторая голова. «Тарг не умел лечить коней». — «Тарг много чего не умел».' }, bad: { r: 'Конь бьёт вас копытом. Ниса смеётся так, что падает с камня.', fx: { hp: -6 } } },
    ] });

  sc({ id: 'shnyr', chap: [1, 2], once: true, npc: 'shnyr', kind: 'social', adv: 20, title: 'Гоблин и телега', ctx: { nom: 'Шнырь' },
    tx: ['На старом тракте вы находите телегу, по ось засевшую в солончаке, и гоблина, который ругается на трёх языках сразу. Гоблин ростом вам по пояс, в шапке из лисьего хвоста.\n\n«Не ешь меня, большой зелёный! — визжит он. — Я Шнырь, я невкусный и очень полезный!»'],
    opts: [
      { s: 'znan', t: 'Подложить жердь под колесо и вытащить телегу рычагом', dc: 9, ok: { r: '«Дайте мне точку опоры», — бормочете вы, и телега, чавкнув, выходит из солончака. Шнырь смотрит на жердь, как на божество. «Научишь?»', fx: { flag: 'lever' } }, bad: { r: 'Жердь ломается. Шнырь сочувственно цокает и предлагает купить новую.' } },
      { s: 'sila', t: 'Просто поднять телегу', dc: 12, ok: { r: 'Вы поднимаете телегу вместе с гоблином. Гоблин визжит от восторга и страха одновременно.' }, bad: { r: 'Спина хрустит. Телега стоит. Шнырь предлагает вам мазь за полцены.', fx: { hp: -6 } } },
      { s: 'hitr', t: 'Объявить солончак проклятым и взять плату за «снятие проклятия»', dc: 12, ok: { r: 'Шнырь платит ножом, мешочком соли и сплетней: Брак должен хану Кхаразгу двадцать коней. Потом вы вытаскиваете телегу. Шнырь до сих пор не уверен, что его обманули.', fx: { flag: 'brak_debt', mem: 'Шнырь рассказал: Брак должен хану двадцать коней.' } }, bad: { r: '«Проклят? Это ты мне рассказываешь? — оскорбляется Шнырь. — Я сам этот солончак продаю как проклятый!»' } },
      { s: 'slovo', t: 'Помочь бесплатно и разговорить его о новостях', dc: 10, ok: { r: 'Шнырь трещит без умолку: хан Кхаразг собирает кланы, людской Орден Рассвета точит мечи, а за Солёной рекой у людей неурожай. «Ты мне нравишься, зелёный. Ты слушаешь».', fx: { flag: 'news_khan' } }, bad: { r: 'Шнырь говорит три часа. Из полезного вы узнаёте только рецепт тушёной ящерицы.' } },
    ] });

  sc({ id: 'kurgan', chap: [1, 2], once: true, kind: 'mystery', adv: 18, title: 'Курган', ctx: { nom: 'курган' },
    tx: ['Среди ковыля встаёт древний курган, поросший полынью. На вершине каменная баба с плоским лицом смотрит на восток. Тарг обошёл бы это место стороной: здесь живут духи. Учитель истории внутри вас чуть не плачет от счастья.'],
    opts: [
      { s: 'znan', t: 'Прочитать зарубки на камне: это же почти скифский стиль', dc: 12, ok: { r: 'Это не руны, а счёт: зарубки лун и солнц. Календарь. По нему выходит, что зимой будет ночь, когда на небе встают две луны. Ночь Двух небес. Вы пока не знаете, почему это важно.', fx: { flag: 'calendar', rel: { yrga: 5 }, mem: 'Календарь на кургане: зимой будет ночь Двух небес.' } }, bad: { r: 'Знаки складываются во что-то знакомое, но смысл ускользает. Как кроссворд, где вы знаете только «Нил».' } },
      { s: 'sila', t: 'Своротить каменную плиту у входа', dc: 13, ok: { r: 'Плита поддаётся. Внутри бронзовый кинжал с волком на рукояти и старые кости. Вы берёте кинжал. Каменная баба смотрит вам в спину.', fx: { flag: 'kurgan_blade' } }, bad: { r: 'Плита съезжает вам на ногу. Духи, похоже, против.', fx: { hp: -10 } } },
      { s: 'slovo', t: 'Оставить духам горсть соли и попросить пути', dc: 9, ok: { r: 'Вы говорите с камнем, чувствуя себя идиотом. Ночью вам снится одноглазая старуха: «Иди на восток. Я тебя жду».', fx: { rel: { yrga: 8 }, flag: 'dream_yrga' } }, bad: { r: 'Ветер уносит соль. Духи, видимо, на совещании.' } },
      { s: 'hitr', t: 'Спрятаться у кургана и посмотреть, кто сюда ходит', dc: 11, ok: { r: 'К ночи приходят двое из клана, грабители могил. Они ругаются на Брака: тот требует половину добычи. Теперь вы знаете, чем прижать двух воинов.', fx: { flag: 'graverobbers', mem: 'Вы знаете двух воинов, которые грабят курганы.' } }, bad: { r: 'Вы засыпаете в засаде. Утром на вас нет сапог. Были ли у вас сапоги? Были.', fx: { hp: -3 } } },
    ] });

  sc({ id: 'trakt', chap: [1, 2], once: true, npc: 'savva', kind: 'threat', adv: 22, title: 'Люди на тракте', ctx: { nom: 'разбойники' },
    tx: ['С холма вы видите обоз: три телеги, бородатые возчики, купец в синем кафтане. И пятерых степных разбойников, которые подбираются к обозу по балке. Люди. Тарг помнит их как добычу. Вы помните их как своих.\n\nСамое странное: вы понимаете, что они кричат. Их язык похож на древнерусский, который вы когда-то читали в летописях.'],
    opts: [
      { s: 'sila', t: 'Ударить по разбойникам с тыла', dc: 13, ok: { r: 'Разбойники не ждали орка с тыла. Купец Савва Кривонос долго не верит, что зелёный спас ему жизнь, а потом дарит вам мешок соли и железный нож.', fx: { flag: 'savva_friend', rel: { savva: 15, humans: 8 } } }, bad: { r: 'Разбойники разбегаются, но люди бегут и от вас. Ваш подвиг видит только суслик.', fx: { hp: -10 } } },
      { s: 'slovo', t: 'Крикнуть купцу на его языке, где засада', dc: 12, ok: { r: '«Сзади! В балке!» — кричите вы на древнерусском с подольским акцентом. Люди успевают развернуть телеги. Потом купец долго разглядывает вас: «Ты где наш язык выучил, зелёный?» — «В школе».', fx: { flags: ['savva_friend', 'speaks_human'], rel: { savva: 12, humans: 10 }, mem: 'Купец Савва знает, что вы говорите на языке людей.' } }, bad: { r: 'Купец не понимает. Возчики стреляют в вас из самострелов. Разбойники в суматохе уходят.', fx: { hp: -8, flag: 'speaks_human' } } },
      { s: 'hitr', t: 'Дождаться, пока все передерутся, и забрать то, что останется', dc: 11, ok: { r: 'После схватки на дороге остаётся брошенная телега и бочонок соли. Соль в степи дороже железа.', fx: { flag: 'salt_barrel' } }, bad: { r: 'Купец замечает вас и запоминает зелёное лицо.', fx: { rel: { savva: -10, humans: -5 } } } },
      { s: 'znan', t: 'Запомнить, откуда идут люди, где броды и сколько охраны', dc: 9, ok: { r: 'Вы рисуете палкой на земле: дорога, броды, сколько телег, какая охрана. Это знание пригодится клану. Или людям.', fx: { flag: 'road_map' } }, bad: { r: 'Вы считаете телеги и сбиваетесь. Учитель истории, а не математики.' } },
    ] });

  sc({ id: 'brak_hunt', chap: [1], once: true, npc: 'brak', kind: 'threat', adv: 32, pressure: true, cond: (S) => S.chTurns >= 2, title: 'Охотники Брака', ctx: { nom: 'Брак' },
    tx: ['Вы натыкаетесь на охотничий отряд клана. Брак, широкий, как дверь, с косой, перевязанной медной проволокой, стоит над убитым туром и смеётся. С ним четверо.\n\nОн вас ещё не видит. Ветер дует от них.'],

      { s: 'hitr', t: 'Пока они пируют, увести тура и принести его в стойбище самому', dc: 13, ok: { r: 'Вы приносите тура к шатру вождя на рассвете. Брак приходит через час с пустыми руками и красным лицом. Весь клан смеётся.', fx: { auth: 10, flag: 'brak_shamed', rel: { gharr: 5 }, mem: 'Вы увели у Брака тура. Клан смеялся.' } }, bad: { r: 'Тур слишком тяжёлый. Вас ловят на полпути, и Брак лично ломает вам палец.', fx: { hp: -12 } } },
      { s: 'znan', t: 'Выследить тропу отряда и поставить ловушку', dc: 12, ok: { r: 'Петля из сыромятного ремня вздёргивает Брака вверх ногами на глазах у его воинов. Вы уходите прежде, чем он вылезает.', fx: { auth: 8, flag: 'brak_shamed' } }, bad: { r: 'В ловушку попадает лошадь. Брак забирает её себе.' } },
      { s: 'slovo', t: 'Окликнуть воинов и напомнить про дурман-траву перед поединком', show: (S) => !!S.flags.brak_cheat, dc: 10, ok: { r: 'Двое воинов переглядываются. Про дурман шептались и раньше. Брак кричит, что вы лжёте, но слишком громко.', fx: { auth: 12, flag: 'brak_exposed' } }, bad: { r: 'Вам не верят. Пока.', fx: { auth: 2 } } },
    ] });

  sc({ id: 'stremena', chap: [2, 3], once: true, npc: 'gharr', kind: 'opp', adv: 24, title: 'Стремена', ctx: { nom: 'Гхарр' },
    tx: ['Орки Сломанного Рога ездят без стремян: ноги болтаются, копьё держат двумя руками, а при ударе слетают с коня вместе с копьём. Вы смотрите на это неделю. Потом не выдерживаете.'],
    opts: [
      { s: 'znan', t: 'Сделать стремена из ремня и кованой петли', dc: 11, ok: { r: 'Гхарр, проехав круг в стременах, бьёт копьём соломенное чучело так, что оно улетает в соседнюю юрту. Вождь долго молчит. Потом говорит одно слово: «Ещё».', fx: { flag: 'stirrups', auth: 8, mem: 'Клан ездит в стременах. Это ваша работа.' } }, bad: { r: 'Ремень рвётся под Гхарром на полном скаку. Вождь выживает. Ваша репутация с трудом.', fx: { auth: -6 } } },
      { s: 'sila', t: 'Показать в деле: в стременах сбить трёх лучших всадников', dc: 14, ok: { r: 'Трое падают один за другим. Четвёртый спешивается сам, чтобы не позориться. К вечеру очередь за стременами длиннее, чем за мясом.', fx: { flag: 'stirrups', auth: 10 } }, bad: { r: 'Падаете вы. В стременах. Вместе с конём. Это обидно вдвойне.', fx: { hp: -12 } } },
      { s: 'slovo', t: 'Уговорить молодых всадников попробовать первыми', dc: 12, ok: { r: 'Молодые всегда хотят нового. Через месяц стремена у всех, кому меньше двадцати, а старики делают вид, что всегда так ездили.', fx: { flag: 'stirrups', auth: 6 } }, bad: { r: '«Ноги в петлях? Как пленник?» Над идеей смеются.', fx: { auth: -2 } } },
      { s: 'hitr', t: 'Отдать идею Шнырю: пусть продаёт как «гоблинское чудо», а прибыль пополам', dc: 11, ok: { r: 'Шнырь продаёт стремена каждому всаднику клана. Половину соли он приносит вам. Вторую половину, вы уверены, он съел.', fx: { flag: 'stirrups', rel: { shnyr: 6 } } }, bad: { r: 'Шнырь продаёт стремена соседнему клану. Всем. Дорого.', fx: { rel: { shnyr: 3 } } } },
    ] });

  sc({ id: 'agnia', chap: [2, 3], once: true, npc: 'agnia', kind: 'social', adv: 22, title: 'Пленница', ctx: { nom: 'Агния' },
    tx: ['Воины Брака привозят из набега пленницу: светловолосую девушку в сером платье с вышитым солнцем. Её держат на цепи у загона, как козу, и спорят, продать её хану или оставить. Она молится вполголоса.\n\nВы понимаете каждое слово.'],
    opts: [
      { s: 'slovo', t: 'Заговорить с ней на её языке', dc: 10, ok: { r: 'Она вздрагивает так, будто заговорила лошадь. Её зовут Агния, она лекарка из монастыря Рассвета под Велгором. «Ты орк, — шепчет она. — Почему ты говоришь как наш отец-настоятель?»', fx: { flags: ['agnia_met', 'speaks_human'], rel: { agnia: 15 } } }, bad: { r: 'Она в ужасе отползает. Зелёный, говорящий на её языке, для неё страшнее молчащего.', fx: { flags: ['agnia_met', 'speaks_human'], rel: { agnia: -5 } } } },
      { s: 'hitr', t: 'Выменять её у воина на бочонок соли', show: (S) => !!S.flags.salt_barrel, auto: true, ok: { r: 'Воин чешет затылок, нюхает соль и отдаёт вам цепь. Теперь у вас есть пленница. Что с ней делать, вы пока не знаете. Вы снимаете цепь.', fx: { flags: ['agnia_met', 'agnia_yours'], rel: { agnia: 14, humans: 5 } } } },
      { s: 'sila', t: 'Потребовать её себе как долю добычи', dc: 13, ok: { r: 'Вы встаёте перед воином молча, всем ростом. Он отдаёт цепь. Агния смотрит на вас с ужасом: она не знает, что вы её спасли.', fx: { flags: ['agnia_met', 'agnia_yours'], rel: { agnia: -4 }, auth: 3 } }, bad: { r: 'Брак встаёт рядом с воином. Вдвоём они сильнее. Пленницу уводят в шатёр Брака.', fx: { flags: ['agnia_met'], hp: -6 } } },
      { s: 'znan', t: 'Предложить: пусть лечит раненых. Живая лекарка полезнее проданной', dc: 11, ok: { r: 'Гхарр соглашается: после набега у клана семеро раненых. Агния лечит их под вашим присмотром. Ырга наблюдает из-за юрты, и вы не можете понять, ревность это или интерес.', fx: { flags: ['agnia_met', 'agnia_healer'], rel: { agnia: 10, yrga: 5 } } }, bad: { r: 'Агния не понимает, чего от неё хотят, и боится подойти к ранам. Её уводят.', fx: { flags: ['agnia_met'] } } },
    ] });

  sc({ id: 'zagadki', chap: [2], once: true, npc: 'yrga', kind: 'mystery', adv: 30, pressure: true, title: 'Загадки Ырги', ctx: { nom: 'Ырга' },
    tx: ['Ырга зовёт вас в свою юрту, где пахнет полынью и кровью. Она бросает в огонь сушёную траву и спрашивает: «Что горит, не сгорая? Что летит без крыльев? Откуда ты пришёл, дух?»'],
    opts: [
      { s: 'znan', t: 'Ответить прямо: солнце горит, время летит, а я из мира, где огонь живёт в проводах', dc: 12, ok: { r: 'Ырга долго смеётся, а потом перестаёт. «Огонь в верёвках. Мне это снилось». Она впервые наливает вам свой отвар.', fx: { rel: { yrga: 15 } } }, bad: { r: 'Ырга мрачнеет: «Слова у тебя странные, а смысл пустой».', fx: { rel: { yrga: -5 } } } },
      { s: 'slovo', t: 'Сказать правду о себе, без загадок', dc: 13, ok: { r: 'Вы рассказываете про Подольск, школу и серверную. Ырга слушает, не перебивая, и в конце говорит: «Значит, гость. Гостей не убивают. Но и домой не отпускают просто так».', fx: { rel: { yrga: 18 }, flag: 'truth_yrga' } }, bad: { r: 'Ырга слушает с каменным лицом. Непонятно, поверила ли она хоть слову.', fx: { rel: { yrga: -3 } } } },
      { s: 'hitr', t: 'Отвечать загадками на загадки, ничего не выдавая', dc: 13, ok: { r: '«Хитрый дух», — говорит Ырга почти с нежностью. Хитрость шаманы уважают: это тоже вид силы.', fx: { rel: { yrga: 8 } } }, bad: { r: '«Лжёшь, значит, боишься. Боишься, значит, есть чего».', fx: { rel: { yrga: -10 } } } },
      { s: 'sila', t: 'Встать и уйти: старуха вам не судья', dc: 8, ok: { r: 'Вы уходите. Ырга кричит вслед: «Дух с характером!» Непонятно, хорошо это или плохо.', fx: { rel: { yrga: -5 } } }, bad: { r: 'Полог юрты не открывается. Вы дёргаете сильнее. Ырга смеётся у вас за спиной.', fx: { rel: { yrga: -5 } } } },
    ] });

  sc({ id: 'koni', chap: [2], once: true, npc: 'brak', kind: 'threat', adv: 24, title: 'Украденные кони', ctx: { nom: 'Брак' },
    tx: ['Ночью из загона уводят пятерых коней Гхарра. Утром Брак указывает на вас: «Изгой! Кто ещё станет красть у своих?» Воины смотрят на вас, руки на топорах.'],
    opts: [
      { s: 'znan', t: 'Прочитать следы: подковы, глубина, куда ушли', dc: 12, ok: { r: 'Следы ведут не в степь, а к юрте друга Брака. Кони там. Друг Брака называет имя Брака вслух. Хороший день.', fx: { auth: 10, rel: { gharr: 8 }, mem: 'Вы доказали, что кони у дружка Брака.' } }, bad: { r: 'Следы затоптаны. Гхарр велит вам неделю пасти коней, чтобы «прочувствовал».', fx: { auth: -6 } } },
      { s: 'slovo', t: 'Потребовать суда по закону: пусть говорят свидетели', dc: 13, ok: { r: 'По закону обвинитель должен показать свидетеля. У Брака его нет. Гхарр, скрипя зубами, признаёт вас невиновным.', fx: { auth: 6 } }, bad: { r: 'Свидетель находится. Очень удобный, очень пьяный. Вас оставляют без еды на три дня.', fx: { hp: -8, auth: -4 } } },
      { s: 'hitr', t: 'Ночью проследить, кто ходит к спрятанным коням', dc: 12, ok: { r: 'В полночь к старой балке приходит Брак собственной персоной. Вы приводите туда Гхарра. Сын и отец долго смотрят друг на друга.', fx: { auth: 12, rel: { gharr: 6 }, flag: 'brak_thief' } }, bad: { r: 'Вы засыпаете в засаде. Опять. Это становится традицией.', fx: { auth: -3 } } },
      { s: 'sila', t: 'Ударить Брака: за клевету у орков бьют', dc: 14, ok: { r: 'Брак падает. Гхарр не вмешивается: по закону за клевету бьют. Вопрос о конях больше никто не поднимает.', fx: { auth: 6 } }, bad: { r: 'Брак ждал этого. Его друзья ждали тоже.', fx: { hp: -15, auth: -5 } } },
    ] });

  sc({ id: 'hvor', chap: [2], once: true, npc: 'yrga', kind: 'threat', adv: 24, title: 'Хворь в стойбище', ctx: { nom: 'хворь' },
    tx: ['В стойбище приходит хворь: животы, жар, дети плачут ночами. Ырга третью ночь бьёт в бубен. Вы знаете, в чём дело: ниже по ручью стоит загон, и из этого ручья все пьют.'],

      { s: 'sila', t: 'Носить чистую воду из родника за перевалом самому, день и ночь', dc: 11, ok: { r: 'Шесть дней вы таскаете бурдюки. Плечи в крови, но дети пьют чистую воду. Клан видит.', fx: { hp: -8, auth: 8 } }, bad: { r: 'На третий день вы падаете на перевале. Хворь отступает сама, а вы неделю лежите.', fx: { hp: -14 } } },
    ] });

  sc({ id: 'serdce', chap: [2, 3], once: true, npc: 'gharr', kind: 'calm', adv: 16, title: 'Праздник Первой крови', ctx: { nom: 'Гхарр' },
    tx: ['Сегодня праздник Первой крови: молодые воины едят сырое сердце тура. Гхарр протягивает вам кусок: «Ты вернулся как новый. Значит, ешь как новый». Сердце ещё тёплое. Учитель истории внутри вас тихо падает в обморок.'],
    opts: [
      { s: 'sila', t: 'Съесть. Орки так делают', dc: 6, ok: { r: 'Вкус медный. Хуже всего то, что вам нравится. Клан ревёт одобрительно.', fx: { blood: 8 } }, bad: { r: 'Вы едите и давитесь. Клан ревёт ещё громче: смешно.', fx: { blood: 4 } } },

      { s: 'slovo', t: 'Сказать тост о предках, которые тоже когда-то были молоды', dc: 11, ok: { r: 'Тост выходит неожиданно трогательным. Старый воин вытирает глаз кулаком и говорит, что это дым.', fx: { auth: 5 } }, bad: { r: 'Тост слишком длинный. Сердце успевает остыть.', fx: { auth: -2 } } },
    ] });

  sc({ id: 'razvedka', chap: [3], once: true, kind: 'opp', adv: 24, title: 'Разведка у брода', ctx: { nom: 'деревенский дозорный' },

      { s: 'znan', t: 'Нарисовать карту местности: броды, холмы, мельницу', dc: 10, ok: { r: 'На карте хорошо видно, что у старой мельницы стоит обоз Ордена Рассвета. С железом. И с охраной поменьше, чем кажется.', fx: { flags: ['scouted', 'road_map'] } }, bad: { r: 'Карта выходит красивой и бесполезной.' } },

  sc({ id: 'savva_offer', chap: [3], once: true, npc: 'savva', kind: 'social', adv: 28, cond: (S) => !!(S.flags.savva_friend || S.flags.speaks_human), title: 'Предложение Саввы', ctx: { nom: 'Савва' },
    tx: ['На старом тракте вас ждёт купец Савва Кривонос с двумя возчиками. «Слыхал, ваши на Верхний Брод собрались, — говорит он. — А если без крови? Соль, железо и сукно каждую осень. Вашим выгоднее, нашим спокойнее».'],

      { s: 'hitr', t: 'Пообещать Савве мир, а клану рассказать, где его обоз', dc: 13, ok: { r: 'Обоз Саввы становится лёгкой добычей. Клан доволен. Савва никогда не узнает. Наверное.', fx: { auth: 8, rel: { savva: -20, humans: -10 }, blood: 4 } }, bad: { r: 'Савва что-то чувствует и уходит другой дорогой. Обоих вы потеряли.', fx: { rel: { savva: -10 } } } },
      { s: 'sila', t: 'Пригрозить: либо платите сейчас, либо придём', dc: 11, ok: { r: 'Савва бледнеет и отдаёт два мешка соли «в залог дружбы».', fx: { auth: 4, rel: { savva: -8, humans: -6 } } }, bad: { r: 'Возчики Саввы держат самострелы наготове. Разговор окончен.', fx: { rel: { savva: -6 } } } },
    ] });

  sc({ id: 'fakely', chap: [3], once: true, npc: 'brak', kind: 'threat', adv: 26, title: 'Факелы Брака', ctx: { nom: 'Брак' },

  sc({ id: 'nozh', chap: [4], once: true, npc: 'brak', kind: 'threat', adv: 24, title: 'Нож в темноте', ctx: { nom: 'убийца' },
