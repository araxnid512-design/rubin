:root {
  --bg: #08070f;
  --panel: rgba(10, 8, 22, 0.88);

  --violet: #b48aff;

  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 18px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px;
  display: grid; place-items: center; overflow-x: hidden;
  background-image: radial-gradient(ellipse at 50% 0%, rgba(120, 80, 220, 0.18), transparent 60%);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.stage { position: relative; width: 100%; width: min(100%, calc((100vh - 24px) * 960 / 544), 1440px); aspect-ratio: 960 / 544; max-width: 100%; background: #000; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 2px #1d1830, 0 20px 60px -20px rgba(120, 80, 255, 0.45); touch-action: none; user-select: none; -webkit-user-select: none; }
#cv { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }

.ov { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: grid; place-items: center; padding: 3%; overflow: auto; }
.panel { background: var(--panel); border: 2px solid var(--line); border-radius: 6px; padding: clamp(14px, 3vw, 28px); max-width: 640px; width: 100%; display: grid; gap: 12px; backdrop-filter: blur(2px); }
.panel.wide { max-width: 940px; }
.panel.center { text-align: center; justify-items: center; }
.kicker { margin: 0; font-family: var(--f-display); font-size: clamp(9px, 1.1vw, 12px); letter-spacing: 0.08em; color: var(--accent); text-transform: uppercase; }
.logo { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(26px, 5.6vw, 58px); line-height: 1.15; color: var(--ink); text-shadow: 4px 4px 0 var(--pink), 8px 8px 0 rgba(180, 138, 255, 0.5); }
h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(14px, 2.2vw, 22px); line-height: 1.3; }
h3 { margin: 0; font-size: 1.1em; }
.lede { margin: 0; color: var(--muted); max-width: 52ch; }
.meta { margin: 0; color: var(--muted); font-size: 0.85em; }
.row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.col { display: grid; gap: 10px; width: min(100%, 360px); }
.small { font-size: 0.85em; }
.btn { font-family: var(--f-display); font-size: clamp(9px, 1.1vw, 12px); padding: 12px 16px; border: 2px solid var(--ink); background: transparent; border-radius: 4px; cursor: pointer; line-height: 1.4; box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.5); }
.btn:hover { background: rgba(255, 255, 255, 0.08); }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(0, 0, 0, 0.5); }
.btn.primary { background: var(--accent); color: #1a1408; border-color: var(--accent); }
.btn.primary:hover { background: #ffe39a; }
.btn.ghost { border-color: var(--line); color: var(--muted); }

.story { max-width: 720px; }
.story-text { margin: 0; font-size: clamp(16px, 2.1vw, 22px); line-height: 1.5; min-height: 4.5em; }

.keys { border-collapse: collapse; text-align: left; font-size: 0.95em; }
.keys td { padding: 5px 10px; border-bottom: 1px solid var(--line); }
.keys td:first-child { color: var(--accent); white-space: nowrap; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; }
.stats div { display: grid; gap: 2px; padding: 10px 6px; border: 2px solid var(--line); border-radius: 4px; }
.stats b { font-family: var(--f-display); font-weight: 400; font-size: clamp(11px, 1.6vw, 16px); }

.map-head .btn { margin-left: auto; }
.worlds { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.world { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; padding: 10px; border-radius: 4px; border: 2px solid var(--line); background: #15122a; background: linear-gradient(135deg, color-mix(in srgb, var(--w1) 55%, #000), color-mix(in srgb, var(--w2) 25%, #000)); }
.world.locked { filter: grayscale(1) brightness(0.6); }
.wnum { font-family: var(--f-display); font-size: 22px; color: var(--wa); display: grid; place-items: center; background: rgba(0, 0, 0, 0.35); border-radius: 4px; }

.st.done { background: var(--green); border-color: var(--green); color: #08200f; }
.st.boss { border-color: var(--pink); }
.st.chase { border-color: #ff8a3a; }
.st.chase::before { content: '!'; position: absolute; top: -2px; left: 3px; font-size: 8px; color: #ff8a3a; }
.st.boss.done { background: var(--pink); color: #2a0612; }
.st.next { animation: pulse 1s ease-in-out infinite alternate; background: var(--accent); color: #1a1408; border-color: var(--accent); }
.st:disabled { opacity: 0.3; cursor: not-allowed; }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }

.pausebtn { position: absolute; top: calc(6px + env(safe-area-inset-top, 0px)); right: 6px; width: 34px; height: 30px; border: 0; background: rgba(0, 0, 0, 0.35); color: #fff; border-radius: 4px; font-family: var(--f-display); font-size: 10px; cursor: pointer; z-index: 3; }

.touch { position: absolute; left: 0; right: 0; bottom: 0; height: 40%; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 1.2% 1.2%; pointer-events: none; z-index: 2; }
.tgroup { display: flex; gap: 10px; align-items: flex-end; pointer-events: none; }

<script>
/* Курьер миров — страховка запуска. Подключается первым: если игра не стартует или падает,
   на экране появится понятное сообщение с текстом ошибки, которое можно сфотографировать. */
(function () {
  'use strict';
  var shown = false;
  function show(msg) {
    if (shown) return;
    shown = true;
    var box = document.createElement('div');
    box.setAttribute('role', 'alert');
    box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#2a0612;color:#fff;border:2px solid #ff4f8b;border-radius:6px;padding:10px 12px;font:14px/1.4 sans-serif;';
    box.innerHTML = '<b>Игра столкнулась с ошибкой.</b> Сделайте скриншот и пришлите его — так проще всего починить.<br><code style="display:block;margin-top:6px;white-space:pre-wrap;word-break:break-word;color:#ffd56b"></code>';
    box.querySelector('code').textContent = String(msg).slice(0, 600) + '\n' + navigator.userAgent;
    (document.body || document.documentElement).appendChild(box);
  }
  window.addEventListener('error', function (e) { show((e.message || 'ошибка') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
  window.addEventListener('unhandledrejection', function (e) { show('promise: ' + (e.reason && e.reason.message || e.reason)); });
  // Если через 4 секунды игра так и не запустилась — значит, её скрипты не загрузились.
  setTimeout(function () {
    if (!window.K || !window.K.debug) show('Игра не запустилась: скрипты не загрузились. Возможно, устарел Android System WebView — обновите его в Play Маркете.');
  }, 4000);
})();

</script>

      1: ['Ночные крыши, краны, неон. Где-то впереди девятый этаж и бабушка Зина.', 'Стрелки или A/D — бег. Пробел, W или стрелка вверх — прыжок. Прыгай врагам на голову.'],
      2: ['Голубиный король уронил термосумку в светящийся люк. Миша прыгнул следом и вывалился в степь: ковыль до горизонта, юрты, дым костров.', 'Орчиха-шаманка Ырна нюхает воздух: «Пахнет вкусно. Хочешь домой, курьер? Собери осколки Разлома. Один у Вожака Волколака»'],
      3: ['Портал выносит Мишу к каменным стенам. Флаги, трубы, стража в латах. Здесь не знают курьеров, зато уважают гонцов.', 'Король обещает помочь, если Миша одолеет Чёрного рыцаря, который держит в страхе весь тракт.'],
      4: ['Грибы ростом с дом, болото, огоньки среди корней. Ведьма Агафья предлагает чай и предупреждает: «Древень не любит гостей. Особенно с шаурмой».', 'В этом лесу много грибов-батутов. Прыгай на шляпку, чтобы взлететь.'],
      5: ['Ледяные пики. Ветер, тишина, лёд скользкий, как пол в торговом центре после уборки. Сверху свисают сосульки.', 'Монахи горы говорят, что проснулся Снежный змей. Огненный шар здесь пригодится: им можно растопить ледяные стены.'],
      6: ['Подземные кузни гномов. Жар, грохот, конвейеры, лава в желобах. Гномы просят: их голем сошёл с ума и громит мастерские.', 'Прыгай от стен, чтобы забираться в шахты. Лава убивает сразу.'],
      7: ['Пустота между мирами. В фиолетовом тумане висят обломки всех миров, где побывал Миша: крыши, юрты, башни, льдины.', 'Навигатор пищит: «До клиента один мир». Впереди ждёт Хранитель Разлома.'],
    },
    bossWin: {
      1: ['Голубиный король повержен, но успевает швырнуть термосумку в люк, светящийся фиолетовым. Миша не раздумывая прыгает следом.'],
      2: ['Волколак убегает в степь, поджав хвост. Ырна дарит Мише пояс ветра.', 'Новое умение: РЫВОК. Shift или X. В рывке Миша неуязвим и сбивает врагов.'],
      3: ['Чёрный рыцарь сдаётся. Под шлемом оказывается усталый дед, которому надоело служить. Король жалует Мише сапоги-скороходы.', 'Новое умение: ДВОЙНОЙ ПРЫЖОК. Нажми прыжок ещё раз в воздухе.'],
      4: ['Древень засыпает, ворча. Ведьма Агафья учит Мишу простому заклинанию, «чтобы шаурму греть».', 'Новое умение: ОГНЕННЫЙ ШАР. C или F. Сжигает врагов и ломает ледяные стены.'],
      5: ['Снежный змей тает и уползает в расщелину. Монахи учат Мишу отталкиваться от стен.', 'Новое умение: ПРЫЖОК ОТ СТЕНЫ. Прижмись к стене в прыжке и нажми прыжок.'],
      6: ['Голем остывает и садится на пол. Гномы чинят Мише разбитый телефон. Навигатор оживает: «Маршрут перестроен. До клиента один мир».'],
      7: ['Хранитель опускает руки. Под капюшоном оказывается курьер в выцветшей куртке. «Я триста лет назад не довёз заказ, — говорит он. — Довези хотя бы ты». И открывает дверь.'],
    },
    ending: [
      'Девятый этаж. Миша звонит в дверь. Открывает бабушка Зина в халате и бигуди.',
      '«Ты где был, милок? Три месяца жду». Она берёт шаурму, нюхает и вздыхает: «Остыла».',
      'Потом улыбается: «Ну ничего. Заходи, разогреем. Расскажешь, где тебя носило». Рейтинг курьера: 5,0.',
    ],
  };

  // Таблички с подсказками в первом уровне.
  K.TUTORIAL = [
    'Стрелки или A/D — бег',
    'Пробел или W — прыжок. Держи дольше, чтобы прыгнуть выше',
    'Прыгай врагам на голову',
    'Флажок сохраняет место',
    'Большие кристаллы — осколки Разлома. На каждом уровне их три',
  ];

<script>
/* Курьер миров — сборщик уровней.
   Уровень складывается из участков: пропасть, ступени, платформы, шипы, враги, движущиеся плиты,
   батуты, лёд, конвейеры, шахты для прыжков от стен. Каждый участок построен так, чтобы
   его можно было пройти с теми способностями, которые у героя уже есть в этом мире.
   Зерно постоянное, поэтому уровень 3-2 всегда один и тот же. */
(function () {
  'use strict';
  const K = window.K;
  const T = (K.T = { EMPTY: 0, GROUND: 1, BLOCK: 2, PLAT: 3, SPIKE: 4, HAZARD: 5, ICE: 6, BOUNCE: 7, CRUMBLE: 8, CONV_L: 9, CONV_R: 10, BREAK: 11 });
  K.TILE = 32;
  K.ROWS = 17;

  function hash(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rngFrom(seed) {
    let a = seed >>> 0;
    const next = () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), 1 | t); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    return { next, int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)), pick: (arr) => arr[Math.floor(next() * arr.length)], chance: (p) => next() < p };
  }
  K.rngFrom = rngFrom;
  K.hash = hash;

  function generate(wid, stage) {
    const world = K.worldById(wid);
    if (K.isBoss(wid, stage)) return arena(world);
    const H = K.ROWS;
    const W0 = world.len[stage - 1] || world.len[world.len.length - 1];
    const W = W0 + 60; // запас: последний участок и финиш не должны обрезаться
    const rng = rngFrom(hash(`kurier:${wid}-${stage}`));
    const ab = K.abilitiesFor(wid);
    const d = Math.min(1, (wid - 1 + (stage - 1) / world.levels) / 6.5);
    const tiles = new Uint8Array(W * H);
    const ents = [];
    const top = new Int16Array(W).fill(-1); // верх земли в каждой колонке (для проверок)
    let x = 0, gy = 13, lastCp = 0, shardsPlaced = 0, prev = '', prev2 = '';
    const signed = {};
    const hz = world.hazard === 'water' || world.hazard === 'lava' || world.hazard === 'void';

    const set = (cx, cy, v) => { if (cx >= 0 && cx < W && cy >= 0 && cy < H) tiles[cy * W + cx] = v; };
    const get = (cx, cy) => (cx >= 0 && cx < W && cy >= 0 && cy < H ? tiles[cy * W + cx] : T.EMPTY);
    const ground = (cx, gyy, surf) => { for (let y = gyy; y < H; y++) set(cx, y, y === gyy && surf ? surf : T.GROUND); top[cx] = gyy; };
    const pit = (cx) => { if (hz) { set(cx, H - 1, T.HAZARD); set(cx, H - 2, T.HAZARD); } top[cx] = -1; };
    const flat = (n, surf) => { for (let i = 0; i < n && x < W; i++) ground(x++, gy, surf); };
    const coin = (cx, cy) => ents.push({ t: 'coin', x: cx, y: cy });
    const coinLine = (x0, n, cy) => { for (let i = 0; i < n; i++) coin(x0 + i, cy); };
    const coinArc = (x0, x1, cy) => { const n = x1 - x0 + 1; for (let i = 0; i < n; i++) { const k = n > 1 ? i / (n - 1) : 0.5; coin(x0 + i, cy - Math.round(Math.sin(k * Math.PI) * 2)); } };
    const enemy = (kind, cx, cy, extra) => ents.push(Object.assign({ t: 'enemy', kind, skin: world.enemies[kind === 'charge' ? 'walk' : kind] || world.enemies.walk, x: cx, y: cy }, extra || {}));
    const sign = (key, text, cx) => { if (signed[key]) return; signed[key] = 1; ents.push({ t: 'sign', x: cx, y: gy - 1, text }); };
    const clampGy = (v) => Math.max(6, Math.min(14, v));

    const seg = {
      flat() {
        const n = rng.int(4, 8), x0 = x;
        flat(n);
        if (rng.chance(0.5)) coinLine(x0 + 1, Math.min(4, n - 2), gy - 2);
        if (rng.chance(0.08)) ents.push({ t: 'heart', x: x0 + 2, y: gy - 1 });
      },
      step() {
        let dlt = rng.pick([-2, -1, 1, 2]);
        if (gy <= 9) dlt = Math.abs(dlt);
        if (gy >= 13) dlt = -Math.abs(dlt);
        gy = clampGy(gy + dlt);
        const x0 = x;
        flat(rng.int(3, 6));
        if (rng.chance(0.4)) coinLine(x0 + 1, 2, gy - 2);
      },
      gap() {
        const maxG = 3 + (d > 0.45 ? 1 : 0);
        const g = rng.int(2, maxG);
        let gy2 = g >= 4 ? gy + rng.pick([0, 0, 1]) : clampGy(gy + rng.pick([0, 0, 1, -1]));
        if (gy2 > 14) gy2 = 14;
        const x0 = x;
        for (let i = 0; i < g; i++) pit(x++);
        coinArc(x0, x - 1, Math.min(gy, gy2) - 3);
        gy = gy2;
        flat(rng.int(3, 5));
      },
      platforms() {
        ground(x++, gy);
        const plats = [];
        let px = x + rng.int(0, 1), py = gy - rng.int(1, 3);
        const k = rng.int(2, 3);
        for (let i = 0; i < k; i++) {
          const pw = rng.int(2, 3);
          plats.push([px, Math.max(5, py), pw]);
          px += pw + rng.int(1, 2);
          py = Math.max(5, Math.min(gy + 1, py + rng.int(-2, 2)));
        }
        const last = plats[plats.length - 1];
        const end = last[0] + last[2] + rng.int(1, 2);
        while (x < end) pit(x++);
        for (const [ppx, ppy, pw] of plats) { for (let i = 0; i < pw; i++) set(ppx + i, ppy, T.PLAT); if (rng.chance(0.6)) coinLine(ppx, pw, ppy - 1); }
        gy = clampGy(last[1] + rng.int(0, 1));
        flat(rng.int(3, 5));
      },
      spikes() {
        flat(2);
        const n = rng.int(2, 3) + (d > 0.6 ? 1 : 0), x0 = x;
        flat(n);
        for (let i = 0; i < n; i++) set(x0 + i, gy - 1, T.SPIKE);
        coinArc(x0, x0 + n - 1, gy - 3);
        flat(2);
      },
      enemies() {
        const n = rng.int(8, 12), x0 = x;
        flat(n);
        const cnt = 1 + (rng.chance(0.3 + d * 0.5) ? 1 : 0);
        enemy('walk', x0 + Math.floor(n / 2), gy - 1);
        if (cnt > 1) {
          const kind = rng.pick(['fly', 'jump', 'walk']);
          enemy(kind, x0 + n - 2, kind === 'fly' ? gy - 4 : gy - 1);
        }
        if (rng.chance(0.4)) coinLine(x0 + 2, 3, gy - 3);
      },
      pillars() {
        const k = rng.int(2, 3);
        for (let i = 0; i < k; i++) {
          const ph = rng.int(1, 3), x0 = x;
          for (let j = 0; j < 2; j++) { ground(x, gy); for (let y = gy - ph; y < gy; y++) set(x, y, T.BLOCK); top[x] = gy - ph; x++; }
          if (rng.chance(0.5)) coinLine(x0, 2, gy - ph - 1);
          const between = rng.int(1, 2);
          for (let j = 0; j < between; j++) { if (hz && rng.chance(0.5)) pit(x++); else ground(x++, gy); }
        }
        flat(2);
      },
      moving() {
        const x0 = x;
        if (rng.chance(0.65) || gy < 10) {
          const pw = rng.int(8, 10);
          for (let i = 0; i < pw; i++) pit(x++);
          ents.push({ t: 'mover', x: x0 + 1, y: gy, w: 3, axis: 'x', range: pw - 5, speed: 1.1 + d * 0.6 });
          coinLine(x0 + 3, pw - 6, gy - 3);
          flat(rng.int(3, 4));
        } else {
          const pw = 5;
          for (let i = 0; i < pw; i++) pit(x++);
          const up = 4;
          ents.push({ t: 'mover', x: x0 + 1, y: gy - 1, w: 3, axis: 'y', range: up, speed: 1 });
          gy = gy - up;
          flat(rng.int(4, 5));
        }
      },
      crumble() {
        const n = rng.int(5, 7), x0 = x;
        for (let i = 0; i < n; i++) { pit(x); set(x, gy, T.CRUMBLE); top[x] = gy; x++; }
        coinLine(x0 + 1, n - 2, gy - 2);
        flat(3);
      },
      shooter() {
        const x0 = x;
        flat(8);
        for (let y = gy - 2; y < gy; y++) { set(x0 + 5, y, T.BLOCK); set(x0 + 6, y, T.BLOCK); }
        top[x0 + 5] = top[x0 + 6] = gy - 2;
        enemy('shoot', x0 + 5, gy - 3);
      },
      charger() {
        const x0 = x;
        flat(12);
        enemy('charge', x0 + 10, gy - 1);
      },
      bounce() {
        if (gy - 6 < 6) { gy = clampGy(gy + 3); }
        const h = rng.int(5, 6), x0 = x;
        flat(3);
        ground(x++, gy, T.BOUNCE);
        flat(1);
        gy = gy - h;
        for (let i = 0; i < 2; i++) ground(x++, gy);
        coinLine(x0 + 3, 1, gy - 2);
        flat(rng.int(3, 4));
        sign('bounce', 'Прыгай на гриб-батут', x0 + 1);
      },
      djwall() {
        if (gy - 5 < 6) gy = clampGy(gy + 3);
        const h = rng.int(4, 5), x0 = x;
        flat(3);
        gy -= h;
        flat(rng.int(4, 6));
        coin(x0 + 3, gy - 2);
        sign('dj', 'Двойной прыжок: прыжок ещё раз в воздухе', x0);
      },
      dashgap() {
        const x0 = x;
        flat(3);
        const g = 6;
        for (let i = 0; i < g; i++) pit(x++);
        coinLine(x0 + 4, g - 2, gy - 2);
        flat(4);
        sign('dash', 'Рывок: Shift или X. Прыгни и сделай рывок', x0);
      },
      walljump() {
        if (gy - 6 < 5) gy = clampGy(gy + 3);
        const h = rng.int(5, 6), x0 = x;
        flat(2);
        // шахта: висячая левая стена, справа скала
        const shaftL = x;
        for (let i = 0; i < 3; i++) ground(x++, gy);
        for (let y = gy - h - 1; y <= gy - 3; y++) set(shaftL, y, T.BLOCK);
        top[shaftL] = gy;
        const hi = gy - h;
        gy = hi;
        flat(rng.int(4, 5));
        coin(shaftL + 1, hi);
        sign('wall', 'Прыжок от стены: в прыжке прижмись к стене и жми прыжок', x0);
      },
      ice() {
        const n = rng.int(10, 14), x0 = x;
        flat(n, T.ICE);
        if (rng.chance(0.5)) enemy('walk', x0 + Math.floor(n / 2), gy - 1);
        coinLine(x0 + 2, 4, gy - 2);
        if (rng.chance(0.6)) { const g = rng.int(2, 3); for (let i = 0; i < g; i++) pit(x++); flat(3); }
      },
      icicles() {
        const x0 = x;
        flat(11);
        for (let i = 1; i < 10; i++) set(x0 + i, gy - 6, T.BLOCK);
        for (const k of [2, 5, 8]) ents.push({ t: 'icicle', x: x0 + k, y: gy - 5 });
      },
      breakable() {
        const x0 = x;
        flat(3);
        for (let i = 0; i < 6; i++) { ground(x, gy); set(x, gy - 6, T.BLOCK); x++; }
        for (let y = gy - 5; y < gy; y++) { set(x0 + 4, y, T.BREAK); set(x0 + 5, y, T.BREAK); }
        coin(x0 + 7, gy - 2);
        flat(2);
        sign('break', ab.fire ? 'Ледяную стену растопит огненный шар (C) или пробьёт рывок' : 'Стену можно пробить рывком', x0);
      },
      conveyor() {
        const n = rng.int(9, 12), x0 = x;
        flat(n, rng.chance(0.5) ? T.CONV_L : T.CONV_R);
        if (rng.chance(0.5)) enemy('walk', x0 + n - 3, gy - 1);
        coinLine(x0 + 2, 3, gy - 2);
      },
      firejet() {
        const x0 = x;
        flat(12);
        [3, 6, 9].forEach((k, i) => ents.push({ t: 'firejet', x: x0 + k, y: gy - 1, phase: i * 50 }));
      },
      hazardpit() {
        const n = rng.int(9, 12), x0 = x;
        for (let i = 0; i < n; i++) pit(x++);
        let c = x0 + rng.int(2, 3);
        while (c < x0 + n - 2) {
          const w = rng.int(1, 2), ry = clampGy(gy + rng.int(-1, 1));
          for (let i = 0; i < w; i++) { for (let y = ry; y < K.ROWS - 2; y++) set(c + i, y, T.BLOCK); top[c + i] = ry; if (rng.chance(0.5)) coin(c + i, ry - 1); }
          c += w + rng.int(2, 3);
        }
        flat(3);
      },
      checkpoint() {
        const x0 = x;
        flat(4);
        ents.push({ t: 'flag', x: x0 + 1, y: gy - 1 });
        lastCp = x0;
      },
      shard() {
        const kind = rng.pick(gy >= 10 ? ['high', 'spikes', 'dip'] : ['spikes', 'dip']);
        const x0 = x;
        if (kind === 'high') {
          flat(7);
          for (let i = 0; i < 2; i++) { set(x0 + 1 + i, gy - 3, T.PLAT); set(x0 + 3 + i, gy - 6, T.PLAT); }
          ents.push({ t: 'shard', x: x0 + 4, y: gy - 8 });
          coin(x0 + 2, gy - 4);
        } else if (kind === 'spikes') {
          flat(2);
          const s = x;
          flat(3);
          for (let i = 0; i < 3; i++) set(s + i, gy - 1, T.SPIKE);
          ents.push({ t: 'shard', x: s + 1, y: gy - 3 });
          flat(2);
        } else {
          flat(2);
          const deep = Math.min(14, gy + 3), s = x;
          for (let i = 0; i < 5; i++) ground(x++, deep);
          ents.push({ t: 'shard', x: s + 2, y: deep - 1 });
          enemy('walk', s + 3, deep - 1);
          flat(3);
        }
        shardsPlaced++;
      },
    };

    // Начало: стена слева и ровная площадка.
    for (let y = 0; y < H; y++) set(0, y, T.BLOCK);
    top[0] = 0;
    x = 1;
    flat(7);
    const start = { x: 3, y: gy - 1 };

    // Первый уровень — обучение по сценарию.
    if (wid === 1 && stage === 1) {
      const tip = (cx, text) => ents.push({ t: 'sign', x: cx, y: top[cx] - 1, text });
      tip(5, K.TUTORIAL[0]);
      flat(4); gy -= 1; flat(5);
      tip(x - 2, K.TUTORIAL[1]);
      for (let i = 0; i < 2; i++) pit(x++);
      coinArc(x - 2, x - 1, gy - 3); flat(6);
      const ex = x; flat(10); enemy('walk', ex + 7, gy - 1); tip(ex + 1, K.TUTORIAL[2]);
      flat(4); tip(x, K.TUTORIAL[3]); flat(2); seg.checkpoint(); flat(6); gy = 12; flat(4); seg.gap();
      flat(2); tip(x - 1, K.TUTORIAL[4]); seg.shard();
    }

    const chase = K.isChase(wid, stage) ? world.chase : null;
    const weights = Object.assign({}, world.seg);
    if (chase) { delete weights.moving; weights.enemies = (weights.enemies || 2) * 0.6; weights.gap = (weights.gap || 2) + 1; }
    const need = { dashgap: 'dash', djwall: 'double', walljump: 'wall', breakable: null };
    for (const k of Object.keys(weights)) {
      if (need[k] && !ab[need[k]]) delete weights[k];
      if (k === 'breakable' && !(ab.fire || ab.dash)) delete weights[k];
    }
    const keys = Object.keys(weights);
    const pickSeg = () => {
      let tot = 0;
      for (const k of keys) tot += (k === prev && k === prev2) ? 0 : weights[k] * (k === 'enemies' ? 1 + d : 1);
      let r = rng.next() * tot;
      for (const k of keys) { const w = (k === prev && k === prev2) ? 0 : weights[k] * (k === 'enemies' ? 1 + d : 1); r -= w; if (r <= 0) return k; }
      return keys[0];
    };

    const shardAt = [0.28, 0.55, 0.8].map((k) => k * W0 / W);
    while (x < W0 - 22) {
      if (shardsPlaced < 3 && x > W * shardAt[shardsPlaced] && gy >= 8) { seg.shard(); continue; }
      if (x - lastCp > 62) { seg.checkpoint(); continue; }
      const k = pickSeg();
      prev2 = prev; prev = k;
      seg[k]();
      if (rng.chance(0.15)) seg.flat();
    }
    while (shardsPlaced < 3) seg.shard();
    // Финиш: ровная площадка, портал, стена справа.
    if (gy < 9) { gy = 12; }
    flat(6);
    const px = x;
    flat(8);

    heroFrames = {};

      case 'mover': { const w = e.w; R(ctx, x, y, w, 12, pal.plat); R(ctx, x, y, w, 3, shade(pal.plat, 0.35)); R(ctx, x, y + 10, w, 2, shade(pal.plat, -0.4)); for (let i = 6; i < w - 6; i += 16) R(ctx, x + i, y + 4, 6, 4, pal.accent); break; }

  G.heart = heart;

  G.drawShot = function (ctx, s, camX, t) {
    const x = Math.round(s.x - camX), y = Math.round(s.y);
    switch (s.kind) {
      case 'fireball': ctx.save(); ctx.shadowColor = '#ffb02a'; ctx.shadowBlur = 12; R(ctx, x, y, 14, 14, '#ff6a1a'); R(ctx, x + 3, y + 3, 8, 8, '#ffe08a'); ctx.restore(); break;
      case 'arrow': R(ctx, x, y + 5, 22, 3, '#8a5a2a'); R(ctx, s.vx > 0 ? x + 20 : x - 4, y + 3, 6, 7, '#c0c6d0'); break;
      case 'spear': R(ctx, x, y + 5, 26, 3, '#8a6a3a'); R(ctx, s.vx > 0 ? x + 24 : x - 4, y + 2, 6, 9, '#c0c6d0'); break;
      case 'seed': R(ctx, x, y, 12, 12, '#7a5a2a'); R(ctx, x + 3, y + 3, 4, 4, '#c9a05a'); break;
      case 'ice': R(ctx, x, y, 12, 12, '#bfe8fa'); R(ctx, x + 3, y + 3, 4, 4, '#ffffff'); break;
      case 'fire': R(ctx, x, y, 12, 12, '#ff5a1a'); R(ctx, x + 3, y + 3, 6, 6, '#ffd06a'); break;
      case 'orb': ctx.save(); ctx.shadowColor = '#ff6ad8'; ctx.shadowBlur = 10; R(ctx, x, y, 14, 14, '#ff6ad8'); R(ctx, x + 4, y + 4, 6, 6, '#ffffff'); ctx.restore(); break;
      case 'laser': R(ctx, x, y, 8, 4, '#ff3a5a'); break;
      case 'shock': for (let i = 0; i < 3; i++) R(ctx, x + i * 6, y + 18 - i * 8, 8, 6 + i * 8, i === 2 ? '#ffffff' : '#ffd56b'); break;
      case 'feather': R(ctx, x, y, 14, 6, '#c0c6d0'); break;
      case 'root': R(ctx, x, y, 24, s.h, '#5a3a24'); R(ctx, x + 8, y, 8, 8, '#7a5a3a'); break;

      default: R(ctx, x, y, 10, 10, '#ffffff');

  G.drawParticles = function (ctx, parts, camX) {
    for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); R(ctx, p.x - camX, p.y, p.s, p.s, p.c); }
    ctx.globalAlpha = 1;
  };

  /* ================= ПОГОНЯ ================= */
  const CHASE = { stampede: ['#4a3020', '#a07a4a', '#e0c49a'], rubble: ['#3f444d', '#8a8f99', '#c8ccd4'], swamp: ['#14382a', '#3f8a6a', '#a8f0c0'], avalanche: ['#9fb4c8', '#e2ecf6', '#ffffff'], lava: ['#6a1404', '#ff6a1a', '#ffd06a'], void: ['#04020c', '#3a1460', '#c08aff'] };
  G.chaseColor = (k) => CHASE[k][2];

    const fx = Math.round(c.x - camX), col = CHASE[c.kind];

    }
    if (c.kind === 'rubble' || c.kind === 'avalanche') for (let i = 0; i < 8; i++) {
      const sx = fx - 20 + ((i * 37 + t * 3) % 70), sy = ((t * (4 + i % 3) + i * 90) % (K.VH + 40)) - 20, sz = 10 + (i % 3) * 6;
      R(ctx, sx, sy, sz, sz, c.kind === 'rubble' ? '#6c717b' : '#ffffff');
    }
    if (c.kind === 'lava') { ctx.fillStyle = 'rgba(255,140,40,0.18)'; ctx.fillRect(fx, 0, 80, K.VH); }
    if (c.kind === 'void') for (let i = 0; i < 26; i++) R(ctx, (fx - 30 - ((i * 53) % Math.max(60, fx + 30))), (i * 97 + t) % K.VH, 2, 2, '#ffffff');
  };
  // Когда погоня за краем экрана — красная полоса слева, ярче по мере приближения.
  G.drawChaseWarn = function (ctx, gap, t) {
    if (gap > 900) return;
    const k = Math.max(0, Math.min(1, (900 - gap) / 600));
    const g = ctx.createLinearGradient(0, 0, 90, 0);
    g.addColorStop(0, `rgba(255,60,60,${0.55 * k * (0.75 + 0.25 * Math.sin(t * 0.3))})`); g.addColorStop(1, 'rgba(255,60,60,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 40, 90, K.VH - 40);
  };

  /* ================= ИНТЕРФЕЙС НА ХОЛСТЕ ================= */
  G.font = (px) => `${px}px "Pixelify Sans", "Press Start 2P", monospace`;
  G.drawHud = function (ctx, S) {
    R(ctx, 0, 0, K.VW, 40, 'rgba(0,0,0,0.35)');
    for (let i = 0; i < S.maxHp; i++) heart(ctx, 12 + i * 26, 10, i < S.hp ? '#ff4f6a' : 'rgba(255,255,255,0.18)');
    ctx.font = G.font(20); ctx.textBaseline = 'middle';
    if (S.totalCoins > 0) {
      R(ctx, 104, 12, 10, 16, pal.light);
      ctx.fillStyle = '#ffffff'; ctx.fillText(`${S.coins}/${S.totalCoins}`, 122, 21);
      for (let i = 0; i < 3; i++) { ctx.fillStyle = S.shards[i] ? '#b48aff' : 'rgba(255,255,255,0.2)'; ctx.beginPath(); const sx = 230 + i * 22; ctx.moveTo(sx + 7, 8); ctx.lineTo(sx + 14, 20); ctx.lineTo(sx + 7, 32); ctx.lineTo(sx, 20); ctx.fill(); }
    }
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.fillText(S.title, K.VW / 2, 21);
    ctx.textAlign = 'right'; const s = Math.floor(S.time / 60); ctx.fillText(`${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`, K.VW - 58, 21);

  };
  G.drawBossBar = function (ctx, b, name) {
    const w = 420, x = (K.VW - w) / 2, y = 50;
    R(ctx, x - 2, y - 2, w + 4, 14, '#000000');

  };
  G.drawSignText = function (ctx, text, x, y) {
    ctx.font = G.font(16);
    const w = Math.min(520, ctx.measureText(text).width + 24);
    const bx = Math.max(8, Math.min(K.VW - w - 8, x - w / 2));
    R(ctx, bx, y - 40, w, 30, 'rgba(10,10,20,0.85)');

  G.setWorld = function (id) {
    if (id === worldId && atlas) return;
    worldId = id;
    pal = K.worldById(id).pal;
    buildAtlas();
    buildBg();
  };
  G.pal = () => pal;
})();

<script>
/* Курьер миров — музыка и звуки. Чиптюн-синтезатор на WebAudio: у каждого мира свой лад,
   темп, тембр и ритм; мелодия сочиняется из зерна мира, поэтому всегда одна и та же.
   Для боссов — та же тема быстрее и жёстче. Никаких файлов: всё синтезируется на лету. */
(function () {
  'use strict';
  const K = window.K;
  const A = (K.AUDIO = {});
  let ac = null, master, mus, sfx, noiseBuf, timer = null, cur = null, step = 0, nextT = 0;
  A.musicOn = true;
  A.sfxOn = true;

  const SCALES = { minor: [0, 2, 3, 5, 7, 8, 10], major: [0, 2, 4, 5, 7, 9, 11], penta: [0, 3, 5, 7, 10], dorian: [0, 2, 3, 5, 7, 9, 10], phryg: [0, 1, 3, 5, 7, 8, 10], lydian: [0, 2, 4, 6, 7, 9, 11], whole: [0, 2, 4, 6, 8, 10], harm: [0, 2, 3, 5, 7, 8, 11] };
  const SONGS = {
    title: { bpm: 96, root: 57, scale: 'harm', chords: [0, 5, 3, 4], lead: 'square', leadVol: 0.06, bass: 'triangle', bassPat: 'x.......x.......', kick: 'x.......x.......', snare: '................', hat: '..x...x...x...x.', arp: 0.03, pad: 0.04, seed: 3, density: 0.4 },
    city: { bpm: 118, root: 57, scale: 'minor', chords: [0, 5, 2, 6], lead: 'sawtooth', leadVol: 0.045, bass: 'square', bassPat: 'x.x.x.x.x.x.x.x.', kick: 'x...x...x...x...', snare: '....x.......x...', hat: '..x...x...x...x.', arp: 0.025, seed: 11, density: 0.55 },
    steppe: { bpm: 100, root: 62, scale: 'penta', chords: [0, 3, 2, 0], lead: 'square', leadVol: 0.055, bass: 'triangle', bassPat: 'x..x..x.x..x..x.', kick: 'x.....x.x.......', snare: '....x.......x.x.', hat: 'x...x...x...x...', tom: 'x.......x...x...', drone: 0.035, seed: 22, density: 0.5 },
    kingdom: { bpm: 112, root: 55, scale: 'major', chords: [0, 3, 4, 0], lead: 'square', leadVol: 0.05, bass: 'triangle', bassPat: 'x...x...x...x...', kick: 'x.......x.......', snare: '....x..x....x.xx', hat: 'x.x.x.x.x.x.x.x.', arp: 0.03, seed: 33, density: 0.5 },
    forest: { bpm: 92, root: 64, scale: 'dorian', chords: [0, 5, 3, 6], steps: 12, lead: 'triangle', leadVol: 0.1, bass: 'triangle', bassPat: 'x...........', kick: 'x...........', snare: '....x...x...', hat: '..x...x...x.', pad: 0.05, seed: 44, density: 0.45 },
    ice: { bpm: 84, root: 66, scale: 'lydian', chords: [0, 4, 5, 1], lead: 'sine', leadOct: 24, leadVol: 0.09, bass: 'triangle', bassPat: 'x.......x.......', kick: 'x...............', snare: '........x.......', hat: '....x.......x...', pad: 0.045, arp: 0.02, seed: 55, density: 0.4 },
    forge: { bpm: 134, root: 48, scale: 'phryg', chords: [0, 1, 0, 6], lead: 'sawtooth', leadVol: 0.045, bass: 'sawtooth', bassPat: 'xxx.xxx.xxx.x.x.', kick: 'x...x...x...x...', snare: '....x.......x...', hat: 'xxxxxxxxxxxxxxxx', seed: 66, density: 0.55 },
    rift: { bpm: 120, root: 59, scale: 'whole', chords: [0, 2, 4, 1], lead: 'square', leadVol: 0.045, bass: 'square', bassPat: 'x...x.x.x...x.x.', kick: 'x..x..x...x.....', snare: '....x.......x...', hat: '..x...x...x...x.', pad: 0.04, arp: 0.025, seed: 77, density: 0.5 },
    ending: { bpm: 100, root: 60, scale: 'major', chords: [0, 5, 3, 4], lead: 'triangle', leadVol: 0.1, bass: 'triangle', bassPat: 'x...x...x...x...', kick: 'x.......x.......', snare: '....x.......x...', hat: '..x...x...x...x.', pad: 0.05, arp: 0.025, seed: 88, density: 0.45 },
  };

  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  // Мелодия: 8 тактов по схеме A A' B A'', сильные доли — звуки аккорда, слабые — шаги по ладу.
  function compose(S) {
    const r = rngFrom(S.seed * 7919);

    const phrase = (barA, barB) => {
      const out = new Array(steps * 2).fill(null);
      let prev = S.chords[barA] + 2;
      for (let i = 0; i < steps * 2; i++) {
        const chord = S.chords[i < steps ? barA : barB];
        const strong = i % 4 === 0;
        if (r() < (strong ? S.density + 0.3 : S.density * 0.55)) {
          let deg = strong ? chord + [0, 2, 4][Math.floor(r() * 3)] : prev + [-1, 1, -2, 2, 0][Math.floor(r() * 5)];
          deg = Math.max(-2, Math.min(L + 4, deg));
          out[i] = { deg, len: [1, 2, 2, 3][Math.floor(r() * 4)] };
          prev = deg;
        }
      }
      return out;
    };
    const A1 = phrase(0, 1), B1 = phrase(2, 3), A2 = A1.slice(), A3 = A1.slice();
    for (let i = steps * 2 - 6; i < steps * 2; i++) A2[i] = r() < 0.5 ? null : { deg: S.chords[1] + Math.floor(r() * 3), len: 2 };
    A3[steps * 2 - 4] = { deg: 0, len: 4 };
    for (let i = steps * 2 - 3; i < steps * 2; i++) A3[i] = null;
    const lead = [].concat(A1, A2, B1, A3);
    const chordAt = (bar) => S.chords[bar % S.chords.length];
    const toMidi = (deg, oct) => S.root + (oct || 0) + sc[((deg % L) + L) % L] + 12 * Math.floor(deg / L);
    return { lead, chordAt, toMidi, steps, bars: 8 };
  }

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }

    if (!AC) return;

    master = ac.createGain(); master.gain.value = 0.7; master.connect(ac.destination);
    mus = ac.createGain(); mus.gain.value = A.musicOn ? 0.55 : 0; mus.connect(master);
    sfx = ac.createGain(); sfx.gain.value = A.sfxOn ? 0.6 : 0; sfx.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  A.init = init;

  function tone(dest, type, f, t, dur, vol, slide) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  }
  function noise(dest, t, dur, vol, type, freq) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = type || 'highpass'; f.frequency.value = freq || 6000;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest);

  }

  function playStep(i, t) {
    const S = cur.S, C = cur.C, sd = cur.stepDur, steps = C.steps;
    const bar = Math.floor(i / steps), s = i % steps;
    const chord = C.chordAt(bar);
    const boss = cur.boss;
    const at = (pat) => pat && pat[s % pat.length] === 'x';
    // ударные
    if (at(S.kick) || (boss && s % 4 === 0)) tone(mus, 'sine', 160, t, 0.2, 0.5, 38);
    if (at(S.snare) || (boss && s % 8 === 4)) { noise(mus, t, 0.14, 0.22, 'bandpass', 1800); tone(mus, 'triangle', 220, t, 0.08, 0.12, 150); }
    if (at(S.hat)) noise(mus, t, 0.04, 0.06, 'highpass', 7500);
    if (at(S.tom)) tone(mus, 'sine', 110, t, 0.25, 0.25, 60);

    if (at(S.bassPat)) {
      const up = (s / 2) % 2 === 1 && S.bassPat.indexOf('x.x.') >= 0 ? 12 : 0;

    if (S.drone && s === 0) tone(mus, 'sawtooth', mtof(S.root - 24), t, sd * steps, S.drone * 0.6);
    if (S.pad && s === 0) for (const k of [0, 2, 4]) tone(mus, 'triangle', mtof(C.toMidi(chord + k, -12)), t, sd * steps * 0.95, S.pad);

    if (S.arp && s % 2 === 0) { const k = [0, 2, 4, 7][(s / 2) % 4]; tone(mus, 'square', mtof(C.toMidi(chord + k, 12)), t, sd * 0.9, S.arp); }
    // мелодия
    const n = C.lead[i % C.lead.length];
    if (n) {
      const f = mtof(C.toMidi(n.deg, S.leadOct || 12));
      tone(mus, S.lead, f, t, sd * n.len * 0.95, S.leadVol);
      if (S.scale === 'whole') tone(mus, S.lead, f * 1.008, t, sd * n.len * 0.95, S.leadVol * 0.6);
      if (S.leadOct === 24) tone(mus, 'sine', f * 2, t, sd * n.len * 0.6, S.leadVol * 0.25);
    }
  }

  function schedule() {
    if (!cur || !ac) return;
    while (nextT < ac.currentTime + 0.15) {
      playStep(step, nextT);
      nextT += cur.stepDur;
      step = (step + 1) % (cur.C.steps * cur.C.bars);
    }
  }

  A.play = function (name, boss) {
    if (!ac) return;
    const key = name + (boss ? ':boss' : '');
    if (cur && cur.key === key) return;
    A.stop();
    const S = SONGS[name] || SONGS.city;
    const C = compose(S);
    const bpm = S.bpm * (boss ? 1.18 : 1);
    cur = { key, S, C, boss: !!boss, stepDur: 60 / bpm / 4 };
    step = 0;
    nextT = ac.currentTime + 0.06;
    timer = setInterval(schedule, 25);
    schedule();
  };
  A.stop = function () { if (timer) clearInterval(timer); timer = null; cur = null; };
  A.setMusic = function (on) { A.musicOn = on; if (mus) mus.gain.setTargetAtTime(on ? 0.55 : 0, ac.currentTime, 0.05); };
  A.setSfx = function (on) { A.sfxOn = on; if (sfx) sfx.gain.setTargetAtTime(on ? 0.6 : 0, ac.currentTime, 0.05); };

  // Звуки
  A.sfx = function (name) {
    if (!ac || !A.sfxOn) return;
    const t = ac.currentTime;
    switch (name) {
      case 'jump': tone(sfx, 'square', 320, t, 0.13, 0.12, 640); break;
      case 'djump': tone(sfx, 'square', 480, t, 0.14, 0.12, 960); break;
      case 'coin': tone(sfx, 'square', 988, t, 0.06, 0.1); tone(sfx, 'square', 1319, t + 0.06, 0.1, 0.1); break;

        case 'mover': { const m = { t: 'mover', x: px, y: py, x0: px, y0: py, w: e.w * TS, h: 12, axis: e.axis, range: e.range * TS, speed: e.speed, dir: 1, dx: 0, dy: 0, py: py }; S.movers.push(m); S.ents.push(m); break; }

  /* ---------- урон и смерть ---------- */

    const ice = P.onGround && P.surf === T.ICE;

        AU.sfx('stomp');
      } else if (P.dashT > 0) {
        if (b.vuln) hitBoss(b);
        P.dashT = 0; P.vx = -P.facing * 5; P.vy = -5; P.inv = Math.max(P.inv, 30);
      } else if (!(b.st === 'rest' || b.st === 'stun' || b.st === 'tired' || b.st === 'recover') || b.kind === 'treant') hurt(b.x + b.w / 2);
    }
    if (S.lava && P.y + P.h > S.lava.y + 6) { hurt(P.x + P.w / 2); P.vy = -12; }
  }

  /* ---------- конец уровня ---------- */
  function complete() {
    if (S.done) return;
    S.done = true;
    AU.sfx('portal');
    S.freeze = 999999;
    setTimeout(() => E.onComplete && E.onComplete(results()), 650);
  }
  function results() { return { world: S.world, stage: S.stage, time: S.time / 60, coins: S.coins, totalCoins: S.totalCoins, shards: S.shards.slice(), deaths: S.deaths, boss: L.boss }; }

  /* ---------- главный шаг ---------- */
  E.update = function () {
    if (!S) return;
    S.t++;
    if (S.banner && S.banner.t > 0) S.banner.t--;
    if (S.flash > 0) S.flash--;
    if (S.shake > 0) S.shake--;
    // частицы живут всегда
    for (const p of S.parts) { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life--; }
    S.parts = S.parts.filter((p) => p.life > 0);
    for (const p of S.pops) { p.y -= 0.7; p.life--; }
    S.pops = S.pops.filter((p) => p.life > 0);
    if (S.freeze) {
      if (S.done) return;
      S.freeze--;
      if (S.freeze === 0) {
        if (S.bossDead) { S.bossDead = false; complete(); return; }
        if (S.dead) respawn();
      }
      return;
    }
    if (S.stop > 0) { S.stop--; return; }
    S.time++;
    updateMovers();
    updatePlayer();
    if (S.freeze) return;
    if (S.P.onGround) S.combo = 0;
    updateChase();
    if (S.freeze) return;
    updateCrumble();
    updateEnemies();
    updateHazards();
    updateShots();
    updateBoss();
    updatePickups();
    // камера
    const P = S.P;
    if (L.boss) S.cam.x = 0;
    else {
      const target = P.x + P.w / 2 - K.VW / 2 + P.facing * 70;
      S.cam.x += (target - S.cam.x) * 0.1;
      S.cam.x = Math.max(0, Math.min(L.w * TS - K.VW, S.cam.x));
    }
    S.ents = S.ents.filter((e) => !(e.t === 'enemy' && !e.alive) && !(e.t === 'icicle' && !e.alive));
  };

  E.render = function (ctx) {
    if (!S) return;
    const camX = Math.round(S.cam.x), t = S.t;
    ctx.save();
    if (S.shake > 0) ctx.translate(Math.round((Math.random() - 0.5) * S.shake), Math.round((Math.random() - 0.5) * S.shake));
    GFX.drawBg(ctx, camX, t);
    GFX.drawAmbient(ctx, camX, t);
    GFX.drawTiles(ctx, L, camX, t, crumble);
    for (const e of S.ents) {
      if (e.taken) continue;
      if (e.x - camX < -80 || e.x - camX > K.VW + 80) continue;
      if (e.t === 'enemy') GFX.drawEnemy(ctx, e, camX, t);
      else GFX.drawItem(ctx, e, camX, t);
    }
    if (S.boss && S.boss.hp > 0) GFX.drawBoss(ctx, S.boss, camX, t);
    for (const s of S.shots) GFX.drawShot(ctx, s, camX, t);
    if (!(S.dead && S.freeze)) GFX.drawHero(ctx, S.P, camX, t);
    if (S.lava) { ctx.fillStyle = '#ff6a1a'; ctx.fillRect(0, S.lava.y, K.VW, K.VH - S.lava.y); ctx.fillStyle = '#ffd06a'; for (let x = 0; x < K.VW; x += 16) ctx.fillRect(x, S.lava.y + Math.sin(t * 0.1 + x) * 3, 10, 4); }
    if (S.chase) GFX.drawChase(ctx, S.chase, camX, t);
    GFX.drawParticles(ctx, S.parts, camX);
    for (const p of S.pops) { ctx.globalAlpha = Math.min(1, p.life / 20); ctx.font = GFX.font(18); ctx.textAlign = 'center'; ctx.fillStyle = '#000'; ctx.fillText(p.text, p.x - camX + 2, p.y + 2); ctx.fillStyle = '#ffd56b'; ctx.fillText(p.text, p.x - camX, p.y); ctx.textAlign = 'left'; ctx.globalAlpha = 1; }
    ctx.restore();
    if (S.chase && !S.done) GFX.drawChaseWarn(ctx, S.P.x - S.chase.x, t);
    if (S.flash > 0) { ctx.fillStyle = `rgba(200,160,255,${S.flash / 30})`; ctx.fillRect(0, 0, K.VW, K.VH); }
    GFX.drawHud(ctx, S);
    if (S.boss && S.boss.hp > 0 && S.boss.st !== 'intro') GFX.drawBossBar(ctx, S.boss, S.bossName);
    if (S.sign) GFX.drawSignText(ctx, S.sign.text, S.sign.x - camX + 15, S.sign.y - 10);
    if (S.banner && S.banner.t > 0) {
      const a = Math.min(1, S.banner.t / 30);
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, K.VH / 2 - 50, K.VW, 84);
      ctx.fillStyle = '#ffffff'; ctx.font = GFX.font(34); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(S.banner.text, K.VW / 2, K.VH / 2 - 10);
      ctx.font = GFX.font(16); ctx.fillStyle = GFX.pal().light;
      ctx.fillText(L.boss ? 'Босс' : S.banner.sub || K.worldById(S.world).sub, K.VW / 2, K.VH / 2 + 20);
      ctx.textAlign = 'left'; ctx.globalAlpha = 1;
    }
  };

  // Сцена для заставок: фон мира и герой.
  E.renderScene = function (ctx, wid, t) {
    GFX.setWorld(wid);
    GFX.drawBg(ctx, t * 0.6, t);
    GFX.drawAmbient(ctx, t * 0.6, t);
    ctx.fillStyle = GFX.pal().groundDark; ctx.fillRect(0, 448, K.VW, 96);
    ctx.fillStyle = GFX.pal().top; ctx.fillRect(0, 448, K.VW, 8);
    GFX.drawHero(ctx, { x: 460, y: 418, vx: 1, vy: 0, onGround: true, facing: 1, inv: 0, dashT: 0 }, 0, t);
  };
})();

</script>
<script>
/* Курьер миров — экраны, управление, сохранения, игровой цикл. */
(function () {
  'use strict';
  const K = window.K, E = K.ENGINE, AU = K.AUDIO;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const SAVE = 'kurier.save.v1';
  const load = () => { try { return JSON.parse(localStorage.getItem(SAVE)) || null; } catch (e) { return null; } };
  const store = () => { try { localStorage.setItem(SAVE, JSON.stringify(save)); } catch (e) { /* без сохранений */ } };
  let save = load() || { done: {}, seen: {}, music: true, sfx: true };
  AU.musicOn = save.music !== false;
  AU.sfxOn = save.sfx !== false;

  const cv = $('#cv'), ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  let mode = 'title', sceneWorld = 1, sceneT = 0, cur = null, story = null;

  /* ---------- прогресс ---------- */
  const last = (w) => K.stageCount(K.worldById(w));
  function unlocked(w, s) {
    if (w === 1 && s === 1) return true;
    if (s > 1) return !!save.done[`${w}-${s - 1}`];
    return !!save.done[`${w - 1}-${last(w - 1)}`];
  }
  function nextStage() {
    for (const wd of K.WORLDS) for (let s = 1; s <= K.stageCount(wd); s++) if (!save.done[`${wd.id}-${s}`] && unlocked(wd.id, s)) return [wd.id, s];
    return null;
  }
  const shardTotal = () => Object.values(save.done).reduce((a, d) => a + (d.shards ? d.shards.filter(Boolean).length : 0), 0);

  /* ---------- экраны ---------- */
  function show(html) { const ov = $('#ov'); ov.innerHTML = html; ov.hidden = !html; ov.scrollTop = 0; const f = ov.querySelector('[data-focus]') || ov.querySelector('button'); if (f) f.focus({ preventScroll: true }); }
  function music(name, boss) { AU.play(name, boss); }

  function titleScreen() {
    mode = 'title'; sceneWorld = 1;
    music('title');
    const nx = nextStage();
    const any = Object.keys(save.done).length > 0;
    show(`<div class="panel center">
      <p class="kicker">Аркада про попаданца</p>
      <h1 class="logo">Курьер<br>миров</h1>
      <p class="lede">Курьер Миша везёт последнюю шаурму за смену и проваливается в Разлом между мирами. Семь миров, двадцать шесть уровней, семь боссов. Заказ должен быть доставлен.</p>
      <div class="row">
        <button class="btn primary" data-act="play" data-focus>${any ? (nx ? `Продолжить: ${nx[0]}-${nx[1]}` : 'Играть') : 'Начать'}</button>
        <button class="btn" data-act="map">Карта миров</button>
      </div>
      <div class="row small">
        <button class="btn ghost" data-act="music">Музыка: ${AU.musicOn ? 'вкл' : 'выкл'}</button>
        <button class="btn ghost" data-act="sfx">Звуки: ${AU.sfxOn ? 'вкл' : 'выкл'}</button>
        <button class="btn ghost" data-act="help">Управление</button>
      </div>
      <p class="meta">Осколков Разлома собрано: ${shardTotal()} из 60</p>
    </div>`);
  }

  function helpScreen() {
    show(`<div class="panel center">
      <h2>Управление</h2>
      <table class="keys"><tbody>
        <tr><td>Бег</td><td>← → или A D</td></tr>
        <tr><td>Прыжок</td><td>Пробел, W, ↑ или Z. Держите дольше — выше</td></tr>
        <tr><td>Рывок</td><td>Shift или X (после мира 2)</td></tr>
        <tr><td>Огненный шар</td><td>C или F (после мира 4)</td></tr>
        <tr><td>Пауза</td><td>Esc или P</td></tr>
        <tr><td>Геймпад</td><td>стик, A — прыжок, B — рывок, X — огонь</td></tr>
        <tr><td>Телефон</td><td>кнопки на экране, лучше держать горизонтально</td></tr>
      </tbody></table>
      <p class="lede">Прыгайте врагам на голову. Флажки сохраняют место. На каждом уровне три осколка Разлома, часть спрятана.</p>
      <button class="btn primary" data-act="title" data-focus>Назад</button>
    </div>`);
  }

  function mapScreen() {
    mode = 'map';
    music('title');
    const nx = nextStage();
    let html = `<div class="panel wide"><div class="map-head"><h2>Карта миров</h2><p class="meta">Осколков: ${shardTotal()} из 60</p><button class="btn ghost" data-act="title">Меню</button></div><div class="worlds">`;
    for (const wd of K.WORLDS) {
      const open = unlocked(wd.id, 1);
      const sh = Array.from({ length: wd.levels }, (_, i) => save.done[`${wd.id}-${i + 1}`]).reduce((a, d) => a + (d ? d.shards.filter(Boolean).length : 0), 0);
      html += `<article class="world ${open ? '' : 'locked'}" style="--w1:${wd.pal.sky[1]};--w2:${wd.pal.sky[2]};--wa:${wd.pal.accent}">
        <div class="wnum">${wd.id}</div><div class="wbody"><h3>${open ? esc(wd.name) : 'Неизвестный мир'}</h3><p>${open ? esc(wd.sub) : 'Откроется после победы над боссом'}</p>
        <div class="stages">`;
      for (let s = 1; s <= K.stageCount(wd); s++) {
        const id = `${wd.id}-${s}`, d = save.done[id], ok = unlocked(wd.id, s), boss = K.isBoss(wd.id, s);
        const isNext = nx && nx[0] === wd.id && nx[1] === s;
        const chase = K.isChase(wd.id, s);
        html += `<button class="st ${d ? 'done' : ''} ${isNext ? 'next' : ''} ${boss ? 'boss' : ''} ${chase ? 'chase' : ''}" data-act="stage" data-w="${wd.id}" data-s="${s}" ${ok ? '' : 'disabled'} title="${boss ? esc(wd.bossName) : chase ? 'Погоня: ' + esc(wd.chase.name) : 'Уровень ' + id}">${boss ? 'Б' : s}${d && !boss ? `<i>${d.shards.filter(Boolean).length}/3</i>` : ''}</button>`;
      }
      html += `</div>${open ? `<p class="meta">Осколков ${sh} из ${wd.levels * 3}${wd.gives && save.done[`${wd.id}-${K.stageCount(wd)}`] ? ` · получено: ${K.ABILITY_NAMES[wd.gives]}` : ''}</p>` : ''}</div></article>`;
    }
    html += '</div></div>';
    show(html);
    sceneWorld = nx ? nx[0] : 7;
  }

  function storyScreen(pages, wid, then, opts) {
    mode = 'story';
    sceneWorld = wid;
    story = { pages, i: 0, then };
    music(opts && opts.song ? opts.song : K.worldById(wid).music);
    renderStory(opts);
  }
  function renderStory(opts) {
    const p = story.pages[story.i];
    const lastPage = story.i === story.pages.length - 1;
    show(`<div class="panel story"><p class="kicker">${esc(opts && opts.kicker ? opts.kicker : K.worldById(sceneWorld).name)}</p><p class="story-text">${esc(p)}</p>
      <div class="row"><button class="btn primary" data-act="next" data-focus>${lastPage ? 'Вперёд' : 'Дальше'}</button>${story.pages.length > 1 && !lastPage ? '<button class="btn ghost" data-act="skip">Пропустить</button>' : ''}</div>
      <p class="meta">${story.i + 1} / ${story.pages.length}</p></div>`);
  }

  function startStage(w, s) {
    const wd = K.worldById(w);
    if (s === 1 && !save.seen['w' + w]) {
      save.seen['w' + w] = 1; store();
      const pages = (w === 1 ? K.STORY.intro : []).concat(K.STORY.worldIntro[w]);
      storyScreen(pages, w, () => play(w, s), { kicker: w === 1 ? 'Пролог' : `Мир ${w}. ${wd.name}` });
      return;
    }
    play(w, s);
  }
  function play(w, s) {
    mode = 'play';
    cur = { w, s };
    show('');
    E.load(w, s);
    E.onComplete = onComplete;
    music(K.worldById(w).music, K.isBoss(w, s) || K.isChase(w, s));
    $('#pausebtn').hidden = false;
    updateTouch();
  }

  function onComplete(r) {
    const id = `${r.world}-${r.stage}`, prev = save.done[id];
    const best = prev ? { time: Math.min(prev.time, r.time), coins: Math.max(prev.coins, r.coins), total: r.totalCoins, shards: prev.shards.map((v, i) => v || r.shards[i]), deaths: Math.min(prev.deaths, r.deaths) } : { time: r.time, coins: r.coins, total: r.totalCoins, shards: r.shards, deaths: r.deaths };
    save.done[id] = best; store();
    $('#pausebtn').hidden = true;
    if (r.boss) {
      AU.sfx('win');
      const after = r.world === 7 ? () => endingScreen() : () => mapScreen();
      storyScreen(K.STORY.bossWin[r.world], r.world, r.world === 7 ? () => storyScreen(K.STORY.ending, 7, after, { song: 'ending', kicker: 'Казань. Девятый этаж' }) : after, { kicker: 'Победа' });
      return;
    }
    mode = 'result';
    const m = Math.floor(r.time / 60), sec = Math.floor(r.time % 60);
    const wd = K.worldById(r.world);
    const nextS = r.stage + 1 <= K.stageCount(wd) ? [r.world, r.stage + 1] : null;
    show(`<div class="panel center"><p class="kicker">Уровень ${id} пройден</p><h2>${esc(wd.name)}</h2>
      <div class="stats"><div><b>${m}:${String(sec).padStart(2, '0')}</b><span>время</span></div><div><b>${r.coins}/${r.totalCoins}</b><span>кристаллы</span></div><div><b class="shards">${r.shards.map((v) => (v ? '◆' : '◇')).join('')}</b><span>осколки</span></div><div><b>${r.deaths}</b><span>падений</span></div></div>
      <div class="row">${nextS ? `<button class="btn primary" data-act="stage" data-w="${nextS[0]}" data-s="${nextS[1]}" data-focus>${K.isBoss(nextS[0], nextS[1]) ? 'К боссу' : 'Дальше'}</button>` : ''}<button class="btn" data-act="map">Карта</button><button class="btn ghost" data-act="stage" data-w="${r.world}" data-s="${r.stage}">Ещё раз</button></div></div>`);
  }

  function endingScreen() {
    mode = 'ending';
    music('ending');
    const total = Object.values(save.done).reduce((a, d) => a + d.time, 0), deaths = Object.values(save.done).reduce((a, d) => a + d.deaths, 0);
    show(`<div class="panel center"><p class="kicker">Конец</p><h1 class="logo">Заказ<br>доставлен</h1>
      <div class="stats"><div><b>${Math.round(total / 60)} мин</b><span>в пути</span></div><div><b>${shardTotal()}/60</b><span>осколков</span></div><div><b>${deaths}</b><span>падений</span></div></div>
      <p class="lede">Спасибо, что доставили шаурму. Все уровни открыты на карте: можно вернуться за пропущенными осколками.</p>
      <div class="row"><button class="btn primary" data-act="map" data-focus>Карта миров</button><button class="btn" data-act="title">Меню</button></div></div>`);
  }

  function pause() {
    if (mode !== 'play') return;
    mode = 'pause';
    const ab = Object.keys(K.abilitiesFor(cur.w)).map((k) => K.ABILITY_NAMES[k]);
    show(`<div class="panel center"><h2>Пауза</h2><p class="meta">${ab.length ? 'Умения: ' + esc(ab.join(', ')) : 'Пока только бег и прыжок'}</p><div class="col">
      <button class="btn primary" data-act="resume" data-focus>Продолжить</button>
      <button class="btn" data-act="restart">Начать уровень заново</button>
      <button class="btn" data-act="map">Карта миров</button>
      <div class="row small"><button class="btn ghost" data-act="music">Музыка: ${AU.musicOn ? 'вкл' : 'выкл'}</button><button class="btn ghost" data-act="sfx">Звуки: ${AU.sfxOn ? 'вкл' : 'выкл'}</button></div></div></div>`);
  }
  function resume() { mode = 'play'; show(''); }

  /* ---------- кнопки экранов ---------- */
  $('#ov').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-act]');
    if (!b || b.disabled) return;
    AU.init();
    AU.sfx('click');
    const act = b.dataset.act;
    if (act === 'play') { const nx = nextStage(); if (nx) startStage(nx[0], nx[1]); else mapScreen(); }
    else if (act === 'map') { $('#pausebtn').hidden = true; mapScreen(); }
    else if (act === 'title') titleScreen();
    else if (act === 'help') helpScreen();
    else if (act === 'stage') startStage(Number(b.dataset.w), Number(b.dataset.s));
    else if (act === 'music') { AU.setMusic(!AU.musicOn); save.music = AU.musicOn; store(); b.textContent = `Музыка: ${AU.musicOn ? 'вкл' : 'выкл'}`; }
    else if (act === 'sfx') { AU.setSfx(!AU.sfxOn); save.sfx = AU.sfxOn; store(); b.textContent = `Звуки: ${AU.sfxOn ? 'вкл' : 'выкл'}`; }
    else if (act === 'next') { if (story.i < story.pages.length - 1) { story.i++; renderStory(); } else story.then(); }
    else if (act === 'skip') story.then();
    else if (act === 'resume') resume();
    else if (act === 'restart') play(cur.w, cur.s);
  });
  $('#pausebtn').addEventListener('click', () => { AU.init(); if (mode === 'play') pause(); else if (mode === 'pause') resume(); });

  /* ---------- управление ---------- */
  const I = E.input;
  const keys = new Set();
  const MAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', KeyZ: 'jump', KeyK: 'jump', ShiftLeft: 'dash', ShiftRight: 'dash', KeyX: 'dash', KeyJ: 'dash', KeyC: 'fire', KeyF: 'fire', KeyL: 'fire', ArrowDown: 'down', KeyS: 'down' };
  const src = { key: {}, touch: {}, pad: {} };
  function press(name, on, from) {
    const was = I[name];
    src[from][name] = on;
    I[name] = !!(src.key[name] || src.touch[name] || src.pad[name]);
    if (I[name] && !was) { if (name === 'jump') I.jumpPressed = true; if (name === 'dash') I.dashPressed = true; if (name === 'fire') I.firePressed = true; }
  }
  window.addEventListener('keydown', (e) => {
    AU.init();
    if ((e.code === 'Escape' || e.code === 'KeyP') && (mode === 'play' || mode === 'pause')) { e.preventDefault(); mode === 'play' ? pause() : resume(); return; }
    if ((e.code === 'Enter' || e.code === 'Space') && mode === 'story') { e.preventDefault(); $('[data-act="next"]').click(); return; }
    const a = MAP[e.code];
    if (a && mode === 'play') { e.preventDefault(); if (!e.repeat) press(a, true, 'key'); }
  });
  window.addEventListener('keyup', (e) => { const a = MAP[e.code]; if (a) press(a, false, 'key'); });
  window.addEventListener('blur', () => { for (const k of Object.keys(src.key)) press(k, false, 'key'); if (mode === 'play') pause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') pause(); });

  // Сенсорные кнопки
  const touchEl = $('#touch');
  const isTouch = () => matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
  function updateTouch() {
    touchEl.hidden = !(isTouch() && mode === 'play');
    if (!cur) return;
    const ab = K.abilitiesFor(cur.w);
    touchEl.querySelector('[data-b="dash"]').classList.toggle('off', !ab.dash);
    touchEl.querySelector('[data-b="fire"]').classList.toggle('off', !ab.fire);
  }
  const ptr = new Map();
  touchEl.addEventListener('pointerdown', (e) => { const b = e.target.closest('[data-b]'); if (!b) return; e.preventDefault(); AU.init(); b.setPointerCapture(e.pointerId); ptr.set(e.pointerId, b.dataset.b); press(b.dataset.b, true, 'touch'); b.classList.add('on'); });
  const up = (e) => { const n = ptr.get(e.pointerId); if (!n) return; ptr.delete(e.pointerId); if (![...ptr.values()].includes(n)) press(n, false, 'touch'); touchEl.querySelectorAll(`[data-b="${n}"]`).forEach((x) => x.classList.remove('on')); };
  touchEl.addEventListener('pointerup', up);
  touchEl.addEventListener('pointercancel', up);
  touchEl.addEventListener('contextmenu', (e) => e.preventDefault());

  // Геймпад
  let padStart = false;
  function pollPad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const p = pads && Array.from(pads).find(Boolean);
    if (!p) return;
    const ax = p.axes[0] || 0, btn = (i) => p.buttons[i] && p.buttons[i].pressed;
    press('left', ax < -0.4 || btn(14), 'pad');
    press('right', ax > 0.4 || btn(15), 'pad');
    press('jump', btn(0) || btn(12), 'pad');
    press('dash', btn(1) || btn(5) || btn(7), 'pad');
    press('fire', btn(2) || btn(3), 'pad');
    const st = btn(9);
    if (st && !padStart) { if (mode === 'play') pause(); else if (mode === 'pause') resume(); }
    padStart = st;
  }

  /* ---------- цикл ---------- */
  let acc = 0, lastT = performance.now();
  const STEP = 1000 / 60;
  function frame(now) {
    acc += Math.min(100, now - lastT);
    lastT = now;
    pollPad();
    while (acc >= STEP) {
      if (mode === 'play') { E.update(); I.jumpPressed = I.dashPressed = I.firePressed = false; }
      else sceneT++;
      acc -= STEP;
    }
    if (mode === 'play' || mode === 'pause' || mode === 'result') E.render(ctx);
    else { E.renderScene(ctx, sceneWorld, sceneT); ctx.fillStyle = 'rgba(5,4,15,0.45)'; ctx.fillRect(0, 0, K.VW, K.VH); }
    requestAnimationFrame(frame);
  }

  function start() {
    const fontsReady = document.fonts && document.fonts.load ? Promise.all([document.fonts.load('20px "Pixelify Sans"'), document.fonts.load('16px "Press Start 2P"')]).catch(() => {}) : Promise.resolve();
    fontsReady.then(() => {});
    titleScreen();
    requestAnimationFrame(frame);
    window.addEventListener('resize', updateTouch);
  }
  // Для автотестов: доступ к состоянию.
  K.debug = { E, startStage: (w, s) => play(w, s), mode: () => mode, save: () => save };
  start();
})();

</script>
