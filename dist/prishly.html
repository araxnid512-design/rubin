<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пришлый</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Forum&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Разворот книги: слева миниатюра в двойной рамке, справа текст и выборы; над разворотом — строка учёта, как в амбарной книге. */
:root {
  --desk: #dde2e6;
  --paper: #f6f6f2;
  --paper-2: #eaede8;
  --ink: #19202d;
  --ink-2: #4f596a;
  --rule: #c3c9d1;
  --brass: #8a5d14;
  --brass-soft: #c9a55c;
  --blood: #a1352a;
  --moss: #2f6b40;
  --scrim: rgba(12, 16, 24, 0.55);
  --shadow: 0 1px 0 rgba(25, 32, 45, 0.04), 0 16px 34px -22px rgba(25, 32, 45, 0.45);
  --f-display: 'Forum', 'Cormorant Garamond', 'Times New Roman', serif;
  --f-body: 'Alegreya', Georgia, 'Times New Roman', serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0c1018; --paper: #141a25; --paper-2: #1b2331; --ink: #e7e4da; --ink-2: #9aa3b2; --rule: #2b3446;
    --brass: #d8ad5e; --brass-soft: #8c6c33; --blood: #e8806c; --moss: #86c995; --scrim: rgba(0, 0, 0, 0.62);
    --shadow: 0 16px 34px -22px rgba(0, 0, 0, 0.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0c1018; --paper: #141a25; --paper-2: #1b2331; --ink: #e7e4da; --ink-2: #9aa3b2; --rule: #2b3446;
  --brass: #d8ad5e; --brass-soft: #8c6c33; --blood: #e8806c; --moss: #86c995; --scrim: rgba(0, 0, 0, 0.62);
  --shadow: 0 16px 34px -22px rgba(0, 0, 0, 0.8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--desk); }
body {
  margin: 0;
  background: var(--desk);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 40px;
  -webkit-font-smoothing: antialiased;
}
body.locked { overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { max-width: 1280px; margin: 0 auto; display: grid; gap: 12px; }

/* ---------- шапка ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); }
.brand { background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--f-display); font-size: 1.9rem; letter-spacing: 0.06em; line-height: 1; color: var(--ink); }
.brand:hover { color: var(--brass); }
.when { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); min-width: 0; }
.tools { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; }
.tbtn {
  font-family: var(--f-mono); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase;
  background: transparent; border: 1px solid var(--rule); color: var(--ink); padding: 7px 10px; border-radius: 2px; cursor: pointer;
}
.tbtn:hover { border-color: var(--brass); color: var(--brass); }
#gal-count { color: var(--brass); font-variant-numeric: tabular-nums; }

/* ---------- строка учёта ---------- */
.stats { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
.stat { background: var(--paper); padding: 7px 10px 8px; display: grid; align-content: start; gap: 1px; min-width: 0; }
.sl { font-family: var(--f-mono); font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sv { font-family: var(--f-display); font-size: 1.45rem; line-height: 1.05; font-variant-numeric: tabular-nums; }
.ss { font-family: var(--f-mono); font-size: 0.6rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { display: block; height: 3px; background: var(--paper-2); margin-top: 3px; }
.bar span { display: block; height: 100%; background: var(--moss); }
.stat[data-k="sus"] .bar span { background: var(--blood); }
.stat.warn .sv { color: var(--blood); }
.stat.up { animation: up 1.6s ease-out; }
.stat.down { animation: down 1.6s ease-out; }
@keyframes up { from { background: color-mix(in srgb, var(--moss) 26%, var(--paper)); } to { background: var(--paper); } }
@keyframes down { from { background: color-mix(in srgb, var(--blood) 26%, var(--paper)); } to { background: var(--paper); } }

/* ---------- разворот ---------- */
.spread { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); background: var(--paper); border: 1px solid var(--rule); box-shadow: var(--shadow); }
.plate { margin: 0; padding: 22px; display: flex; flex-direction: column; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; min-width: 0; }
.frame { border: 1px solid var(--ink); padding: 5px; }
.art { aspect-ratio: 16 / 9; max-width: 100%; background: #0b0f18; border: 1px solid var(--ink); overflow: hidden; }
.art svg { display: block; width: 100%; height: 100%; }
figcaption { display: flex; flex-wrap: wrap; gap: 4px 12px; font-family: var(--f-mono); font-size: 0.66rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.cap-n { color: var(--brass); font-variant-numeric: tabular-nums; }
.cap-t { color: var(--ink); }
.cap-c { margin-left: auto; }
.page { padding: 26px 30px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; border-left: 1px solid var(--rule); }

.eyebrow { font-family: var(--f-mono); font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--brass); }
.eyebrow.bad { color: var(--blood); }
.title { font-family: var(--f-display); font-weight: 400; font-size: clamp(1.7rem, 2.6vw, 2.4rem); line-height: 1.08; margin: -6px 0 0; text-wrap: balance; letter-spacing: 0.01em; }
.text { max-width: 62ch; }
.text p { margin: 0 0 0.75em; }
.text p:last-child { margin-bottom: 0; }
.lead p:first-child::first-letter { float: left; font-family: var(--f-display); font-size: 3.4em; line-height: 0.8; padding: 0.07em 0.1em 0 0; color: var(--brass); }

.weeknote { font-family: var(--f-mono); font-size: 0.68rem; line-height: 1.7; color: var(--ink-2); border-bottom: 1px dashed var(--rule); padding-bottom: 10px; }
.wn-h { text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink); margin-right: 4px; }
.weeknote strong { color: var(--blood); font-weight: 600; }
.g { color: var(--moss); }
.b { color: var(--blood); }

/* ---------- выборы ---------- */
.choices { display: grid; gap: 8px; margin-top: 2px; }
.choice {
  display: grid; grid-template-columns: 2.1em minmax(0, 1fr) auto; align-items: start; gap: 4px 10px;
  text-align: left; padding: 11px 12px; background: var(--paper-2); border: 1px solid transparent; border-radius: 3px; cursor: pointer;
  transition: border-color 0.15s, background 0.15s, transform 0.15s;
}
.choice:hover:not(:disabled) { border-color: var(--brass); background: var(--paper); }
.choice:active:not(:disabled) { transform: translateY(1px); }
.choice:disabled { cursor: not-allowed; opacity: 0.55; }
.num { font-family: var(--f-display); font-size: 1.15rem; color: var(--brass); line-height: 1.25; }
.cbody { display: grid; gap: 3px; min-width: 0; }
.ct { line-height: 1.35; }
.meta { display: flex; flex-wrap: wrap; gap: 2px 10px; font-family: var(--f-mono); font-size: 0.64rem; color: var(--ink-2); }
.m-need { color: var(--blood); }
kbd { font-family: var(--f-mono); font-size: 0.6rem; color: var(--ink-2); border: 1px solid var(--rule); border-radius: 2px; padding: 1px 5px; }
@media (hover: none) { kbd { display: none; } }

.outcome { display: grid; gap: 12px; animation: rise 0.45s ease-out; }
.asterism { text-align: center; color: var(--brass); font-size: 1.1rem; letter-spacing: 0.3em; }
.chosen { color: var(--ink-2); }
.chosen em { color: var(--ink); }
.roll { font-family: var(--f-mono); font-size: 0.72rem; padding: 7px 10px; border: 1px solid currentColor; border-radius: 2px; }
.roll.ok { color: var(--moss); }
.roll.bad { color: var(--blood); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--f-mono); font-size: 0.68rem; padding: 3px 8px; border: 1px solid currentColor; border-radius: 99px; }
.chip.g { color: var(--moss); }
.chip.b { color: var(--blood); }
.next { justify-self: start; font-family: var(--f-display); font-size: 1.15rem; letter-spacing: 0.04em; background: var(--ink); color: var(--paper); border: 0; padding: 10px 18px; border-radius: 3px; cursor: pointer; }
.next:hover { background: var(--brass); }

/* ---------- Летописец ---------- */
.chron { margin-top: auto; border-top: 1px solid var(--rule); padding-top: 10px; font-family: var(--f-mono); font-size: 0.66rem; color: var(--ink-2); }
.chron summary { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; cursor: pointer; list-style: none; }
.chron summary::-webkit-details-marker { display: none; }
.chron summary::before { content: '+'; color: var(--brass); width: 0.8em; }
.chron[open] summary::before { content: '−'; }
.chron-n { text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink); }
.chron-ms { color: var(--brass); }
.chron-t { margin-left: auto; letter-spacing: 0.12em; color: var(--brass); }
.chron ul { margin: 8px 0 0; padding-left: 1.4em; }
.chron li { margin: 2px 0; }
.chron-alt { margin-top: 6px; }

/* ---------- титул и финал ---------- */
.cover-title { font-family: var(--f-display); font-weight: 400; font-size: clamp(3rem, 7vw, 5.4rem); line-height: 0.9; margin: 0; letter-spacing: 0.05em; }
.cover-sub { font-family: var(--f-display); font-size: 1.3rem; color: var(--brass); margin: -4px 0 0; letter-spacing: 0.14em; text-transform: uppercase; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin: 2px 0; }
.facts div { background: var(--paper); padding: 8px 10px; min-width: 0; }
.facts dt { font-family: var(--f-display); font-size: 1.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.facts dd { margin: 3px 0 0; font-family: var(--f-mono); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); }
.note { font-size: 0.95rem; color: var(--ink-2); max-width: 62ch; margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 10px 14px; border: 1px solid var(--ink); background: transparent; color: var(--ink); border-radius: 3px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--brass); color: var(--brass); }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.primary:hover:not(:disabled) { background: var(--brass); color: var(--paper); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.small { padding: 7px 10px; font-size: 0.64rem; }
.endlist { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.endlist li { font-family: var(--f-mono); font-size: 0.64rem; padding: 3px 8px; border: 1px dashed var(--rule); color: var(--ink-2); border-radius: 2px; }
.endlist li.got { border-style: solid; border-color: var(--brass); color: var(--ink); }

/* ---------- панели ---------- */
.sheet {
  position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
}
.sheet-panel { margin: auto; width: 100%; max-width: 1120px; height: 100%; background: var(--paper); border: 1px solid var(--rule); display: flex; flex-direction: column; box-shadow: var(--shadow); min-width: 0; }
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--rule); }
.sheet-head h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.45rem; line-height: 1.15; margin: 0; min-width: 0; text-wrap: balance; }
#sheet-close { margin-left: auto; }
.sheet-body { overflow: auto; padding: 18px; flex: 1; min-height: 0; overscroll-behavior: contain; }
.sheet-lede { color: var(--ink-2); margin: 0 0 14px; max-width: 70ch; }

.gal-h { font-family: var(--f-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--brass); margin: 20px 0 8px; font-weight: 600; }
.gal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.thumb { display: grid; gap: 5px; padding: 0; background: none; border: 0; text-align: left; cursor: pointer; min-width: 0; }
.th-art { display: block; aspect-ratio: 16 / 9; overflow: hidden; border: 1px solid var(--rule); background: #0b0f18; }
.th-art svg { display: block; width: 100%; height: 100%; }
.thumb:hover .th-art { border-color: var(--brass); }
.th-cap { font-size: 0.82rem; line-height: 1.25; }
.th-n { font-family: var(--f-mono); font-size: 0.64rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.thumb.seen .th-n::after { content: ' ●'; color: var(--brass); }
.view-art { aspect-ratio: 16 / 9; max-width: 100%; border: 1px solid var(--ink); overflow: hidden; background: #0b0f18; }
.view-art svg { display: block; width: 100%; height: 100%; }
.view-tags { font-family: var(--f-mono); font-size: 0.68rem; color: var(--ink-2); }

.inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.inv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 12px; padding: 10px; border: 1px solid var(--rule); background: var(--paper-2); border-radius: 3px; min-width: 0; }
.inv.is-built { background: var(--paper); border-color: var(--brass-soft); }
.inv-art { aspect-ratio: 16 / 9; overflow: hidden; border: 1px solid var(--rule); align-self: start; background: #0b0f18; }
.inv-art svg { display: block; width: 100%; height: 100%; }
.inv h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.2rem; line-height: 1.15; margin: 0 0 3px; }
.inv p { margin: 0 0 4px; font-size: 0.9rem; }
.inv-eff { font-family: var(--f-mono); font-size: 0.64rem; color: var(--moss); }
.inv-cost { font-family: var(--f-mono); font-size: 0.64rem; color: var(--ink-2); }
.inv-act { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; }
.built { font-family: var(--f-mono); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--brass); }
.locked { font-family: var(--f-mono); font-size: 0.62rem; color: var(--blood); }
.debt-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--blood); border-radius: 3px; margin-bottom: 14px; }

.log { list-style: none; padding: 0; margin: 0; }
.log li { display: grid; grid-template-columns: 4.6em minmax(0, 1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--rule); }
.lw { font-family: var(--f-mono); font-size: 0.68rem; color: var(--brass); font-variant-numeric: tabular-nums; }
.ll { font-family: var(--f-mono); font-size: 0.6rem; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.06em; }
.lr { font-family: var(--f-mono); font-size: 0.64rem; color: var(--ink-2); }

.about { max-width: 70ch; }
.about h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.3rem; margin: 18px 0 6px; }
.about p { margin: 0 0 10px; }
.bench { margin: 12px 0; display: grid; gap: 10px; justify-items: start; }
.bench-out { width: 100%; }
.bench-out .sample { border-top: 1px solid var(--rule); padding: 8px 0; }
.bench-out .sample .eyebrow { display: block; margin-bottom: 2px; }
.bench-out .sample p { margin: 4px 0 0; font-size: 0.92rem; }

.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60;
  background: var(--ink); color: var(--paper); font-family: var(--f-mono); font-size: 0.72rem; padding: 9px 14px; border-radius: 3px; box-shadow: var(--shadow); max-width: calc(100% - 32px);
}

/* ---------- живые иллюстрации ---------- */
.art-live svg { animation: develop 0.7s ease-out; }
.art-live .spin { animation: spin 16s linear infinite; }
.art-live .spin-slow { animation: spin 48s linear infinite; }
.art-live .flicker { animation: flicker 1.6s ease-in-out infinite alternate; }
.art-live .drift { animation: drift 26s ease-in-out infinite alternate; }
.art-live .tw { animation: tw 3.2s ease-in-out infinite alternate; }
.art-live .fall { animation: fall 7s ease-in-out infinite alternate; }
@keyframes develop { from { opacity: 0; filter: saturate(0.2) brightness(1.25); } to { opacity: 1; filter: none; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes flicker { 0% { opacity: 1; } 50% { opacity: 0.76; } 100% { opacity: 0.95; } }
@keyframes drift { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
@keyframes tw { from { opacity: 0.25; } to { opacity: 1; } }
@keyframes fall { from { transform: translateY(-10px); } to { transform: translateY(10px); } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .art-live svg, .art-live svg *, .outcome, .stat.up, .stat.down { animation: none !important; }
}

/* ---------- узкие экраны ---------- */
@media (max-width: 960px) {
  .spread { grid-template-columns: minmax(0, 1fr); }
  .plate { position: static; padding: 14px; border-bottom: 1px solid var(--rule); }
  .page { border-left: 0; padding: 20px 18px; }
  .stats { grid-template-columns: repeat(5, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  body { font-size: 16px; padding-block: 10px 28px; }
  .brand { font-size: 1.6rem; }
  .tools { margin-left: 0; width: 100%; }
  .stat { padding: 5px 6px 6px; }
  .sv { font-size: 1.15rem; }
  .sl { font-size: 0.52rem; letter-spacing: 0.03em; }
  .cap-c { margin-left: 0; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .inv { grid-template-columns: minmax(0, 1fr); }
  .choice { grid-template-columns: 1.8em minmax(0, 1fr); }
  .sheet-body { padding: 14px; }
  .gal-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="brand" type="button" id="btn-home" title="На титульную страницу">Пришлый</button>
    <div class="when" id="when">Книга первая · Серый Брод</div>
    <nav class="tools" aria-label="Разделы">
      <button class="tbtn" type="button" id="btn-workshop" hidden>Мастерская</button>
      <button class="tbtn" type="button" id="btn-chronicle" hidden>Летопись</button>
      <button class="tbtn" type="button" id="btn-gallery">Галерея <span id="gal-count">0/100</span></button>
      <button class="tbtn" type="button" id="btn-menu">О книге</button>
    </nav>
  </header>
  <section class="stats" id="stats" aria-label="Положение героя" hidden></section>
  <main class="spread">
    <figure class="plate">
      <div class="frame"><div class="art art-live" id="art"></div></div>
      <figcaption id="cap"></figcaption>
    </figure>
    <article class="page" id="page" aria-live="polite"></article>
  </main>
</div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head"><h2 id="sheet-title"></h2><button class="tbtn" type="button" id="sheet-close">Закрыть</button></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
/* Пришлый — общие утилиты: случайность с зерном, текстовая грамматика, генератор имён. */
(function () {
  'use strict';
  const R = (window.R = window.R || {});

  R.hash = function (str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  };

  // Детерминированный генератор для иллюстраций: одна и та же сцена всегда рисуется одинаково.
  R.mulberry = function (a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  R.clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // Игровая случайность. Состояние хранится в сохранении, поэтому перезагрузка страницы
  // не даёт «перебросить» кубик.
  R.makeRng = function (seed) {
    let s = seed >>> 0;
    const next = () => {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), 1 | t);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    return {
      next,
      state: () => s,
      setState: (v) => { s = v >>> 0; },
      int: (a, b) => a + Math.floor(next() * (b - a + 1)),
      pick: (arr) => arr[Math.floor(next() * arr.length)],
      chance: (p) => next() < p,
      weighted(items, wf) {
        let tot = 0;
        const ws = items.map((it) => { const w = Math.max(0, wf(it)); tot += w; return w; });
        if (tot <= 0) return null;
        let x = next() * tot;
        for (let i = 0; i < items.length; i++) { x -= ws[i]; if (x <= 0) return items[i]; }
        return items[items.length - 1];
      },
    };
  };

  // Грамматика Летописца: [вариант|вариант] — случайный выбор, {имя} — подстановка переменной.
  R.expand = function (str, vars, rng) {
    if (typeof str !== 'string') return '';
    let out = str;
    const re = /\[([^\[\]]*)\]/;
    let guard = 0;
    while (re.test(out) && guard++ < 300) out = out.replace(re, (_, body) => rng.pick(body.split('|')));
    return out.replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] !== undefined ? vars[k] : m));
  };

  R.plural = function (n, forms) {
    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return forms[2];
    if (b > 1 && b < 5) return forms[1];
    if (b === 1) return forms[0];
    return forms[2];
  };

  const M1 = ['Ган', 'Бер', 'Ульф', 'Тор', 'Ред', 'Вил', 'Эд', 'Гер', 'Сиг', 'Хар', 'Лот', 'Ар', 'Бор', 'Кун', 'Дит', 'Ост', 'Фал', 'Яр', 'Мил', 'Рад'];
  const M2 = ['ольд', 'ик', 'ман', 'рих', 'вин', 'ер', 'берт', 'мар', 'о', 'ан', 'им', 'ош', 'ек'];
  const F1 = ['Аль', 'Бер', 'Гре', 'Ин', 'Лис', 'Мар', 'Эль', 'Хиль', 'Ур', 'Ве', 'Дан', 'Ро', 'Сан', 'Ти', 'Мил'];
  const F2 = ['та', 'да', 'ина', 'гит', 'ла', 'ве', 'са', 'ника', 'ена', 'рун'];
  const NICK = ['Кривой', 'Рыжий', 'Косой', 'Молчун', 'Тощий', 'Бородач', 'Хромой', 'Весельчак', 'Сова', 'Щербатый', 'Длинный', 'Лис'];
  R.nameM = (rng) => rng.pick(M1) + rng.pick(M2);
  R.nameF = (rng) => rng.pick(F1) + rng.pick(F2);
  R.nick = (rng) => rng.pick(NICK);
})();

</script>
<script>
/* Пришлый — иллюстрации, нарисованные кодом.
   Каждая сцена собирается из слоёв: небо, дальние горы, средний план, передний план, эффекты.
   Цвета слоёв выводятся из палитры времени суток: чем дальше слой, тем сильнее он растворяется
   в дымке горизонта. Так сто картинок выглядят как работа одного художника. */
(function () {
  'use strict';
  const R = (window.R = window.R || {});
  const f = (n) => Math.round(n * 10) / 10;
  const pts = (a) => a.map((p) => f(p[0]) + ',' + f(p[1])).join(' ');
  const poly = (a, extra) => `<polygon points="${pts(a)}"${extra || ''}/>`;
  const GOLD = '#d6b25e';
  const CLOTH = ['#8e3a2f', '#35597f', '#a8822f', '#4b7446', '#6b3f73', '#9a5a2a'];

  function hx(c) {
    c = c.replace('#', '');
    if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
    return [0, 2, 4].map((i) => parseInt(c.slice(i, i + 2), 16));
  }
  function mix(a, b, t) {
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const A = hx(a), B = hx(b);
    return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
  }
  R.mix = mix;

  const PAL = {
    dawn:   { sky: ['#27325e', '#b25f7c', '#f3b57d'], sun: '#ffe1a6', near: '#22192f', light: '#ffcf7a' },
    day:    { sky: ['#3b78b8', '#8bbfe4', '#dcecf6'], sun: '#fff7da', near: '#2b4434', light: '#ffe49a' },
    golden: { sky: ['#4a74a2', '#d6b07a', '#f5d9a2'], sun: '#fff0c0', near: '#3a2a1a', light: '#ffd47a' },
    dusk:   { sky: ['#1b1937', '#7a3456', '#ec874a'], sun: '#ffcd7e', near: '#1c1125', light: '#ffb35c', dark: 1 },
    night:  { sky: ['#03061a', '#0b1736', '#1c2d57'], sun: '#f1efe0', near: '#060a17', light: '#ffc66b', dark: 1 },
    storm:  { sky: ['#13171d', '#313a45', '#5a646f'], sun: '#d8dde2', near: '#101418', light: '#ffd98a', dark: 1 },
    magic:  { sky: ['#0c0420', '#35145a', '#7a3da2'], sun: '#f1dcff', near: '#120922', light: '#d8adff', dark: 1 },
    fire:   { sky: ['#150404', '#5a1608', '#d4582a'], sun: '#ffd28c', near: '#140705', light: '#ffb050', dark: 1 },
    winter: { sky: ['#7c97b2', '#bccad7', '#eaf0f4'], sun: '#ffffff', near: '#2f3d4c', light: '#ffd98a', snow: '#f1f5f9' },
    winnight: { sky: ['#050a1e', '#15254a', '#34507a'], sun: '#eef2ff', near: '#0a1222', light: '#ffc66b', snow: '#b9c8dc', dark: 1 },
    mist:   { sky: ['#5d686e', '#99a19c', '#c8cabd'], sun: '#f0eee0', near: '#2f3631', light: '#ffd98a' },
    spring: { sky: ['#5a98cf', '#a7d2e9', '#e6f5ee'], sun: '#fffbe0', near: '#2a5232', light: '#fff0a0' },
    // Интерьеры: wall — цвет стены, он же «дымка» для дальних предметов.
    tavern:   { wall: '#6a4327', floor: '#3b2414', near: '#170e07', light: '#ffb45e', tex: 'logs', dark: 1 },
    kitchen:  { wall: '#5f4630', floor: '#3a2a1b', near: '#160f08', light: '#ffb85e', tex: 'logs', dark: 1 },
    stone:    { wall: '#5a5754', floor: '#36322d', near: '#14110e', light: '#ffc777', tex: 'stone', dark: 1 },
    study:    { wall: '#4b3a2c', floor: '#2b2018', near: '#120c07', light: '#ffd28a', tex: 'planks', dark: 1 },
    noble:    { wall: '#55252e', floor: '#2b1a1b', near: '#14090b', light: '#ffd88f', tex: 'stone', dark: 1 },
    dungeon:  { wall: '#33373a', floor: '#1d2022', near: '#09090a', light: '#ff9a4a', tex: 'stone', dark: 1 },
    chapel:   { wall: '#6a6872', floor: '#3a3840', near: '#17161b', light: '#ffe6ae', tex: 'stone', dark: 1 },
    workshop: { wall: '#4a3e35', floor: '#29221c', near: '#110d0a', light: '#ffa244', tex: 'planks', dark: 1 },
    cave:     { wall: '#211b33', floor: '#17132a', near: '#07050c', light: '#b98cff', tex: 'none', dark: 1 },
    bath:     { wall: '#6b4a2d', floor: '#3d2a19', near: '#1a1008', light: '#ffc27a', tex: 'logs', dark: 1 },
  };

  let UID = 0;

  class Pic {
    constructor(key) {
      this.r = R.mulberry(R.hash(key));
      this.id = 'k' + (++UID).toString(36) + '_';
      this.o = [];
      this.d = [];
      this.n = 0;
      this.use('day');
    }
    use(name) { this.p = PAL[name]; this.hz = this.p.wall || this.p.sky[2]; return this; }
    rn(a, b) { return a + (b - a) * this.r(); }
    pk(a) { return a[Math.floor(this.r() * a.length)]; }
    add(s) { this.o.push(s); return this; }
    col(d) { return mix(this.hz, this.p.near, 0.12 + 0.88 * d); }
    shade(d, k) { return mix(this.col(d), '#000000', k === undefined ? 0.3 : k); }
    tint(c, d) { return mix(this.hz, c, 0.3 + 0.7 * d); }
    uid() { return this.id + (this.n++); }

    lin(stops, x2, y2) {
      const id = this.uid();
      this.d.push(`<linearGradient id="${id}" x1="0" y1="0" x2="${x2 || 0}" y2="${y2 === undefined ? 1 : y2}">` +
        stops.map((s) => `<stop offset="${s[0]}" stop-color="${s[1]}" stop-opacity="${s[2] === undefined ? 1 : s[2]}"/>`).join('') + '</linearGradient>');
      return `url(#${id})`;
    }
    rad(stops) {
      const id = this.uid();
      this.d.push(`<radialGradient id="${id}">` +
        stops.map((s) => `<stop offset="${s[0]}" stop-color="${s[1]}" stop-opacity="${s[2] === undefined ? 1 : s[2]}"/>`).join('') + '</radialGradient>');
      return `url(#${id})`;
    }
    glowF() {
      if (!this._gf) {
        this._gf = this.uid();
        this.d.push(`<filter id="${this._gf}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`);
      }
      return `url(#${this._gf})`;
    }
    blurF(sd) {
      const id = this.uid();
      this.d.push(`<filter id="${id}" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="${sd}"/></filter>`);
      return `url(#${id})`;
    }
    svg() {
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false"><defs>${this.d.join('')}</defs>${this.o.join('')}</svg>`;
    }

    /* ---------- небо ---------- */
    sky(name) {
      this.use(name);
      const s = this.p.sky;
      return this.add(`<rect width="800" height="450" fill="${this.lin([[0, s[0]], [0.5, s[1]], [0.76, s[2]], [1, s[2]]])}"/>`);
    }
    sun(x, y, r, op) {
      r = r || 28; op = op === undefined ? 1 : op;
      const c = this.p.sun;
      const g = this.rad([[0, c, 0.75 * op], [0.22, c, 0.3 * op], [1, c, 0]]);
      return this.add(`<circle cx="${x}" cy="${y}" r="${r * 6}" fill="${g}"/><circle cx="${x}" cy="${y}" r="${r}" fill="${c}" opacity="${op}"/>`);
    }
    moon(x, y, r, o) {
      r = r || 20; o = o || {};
      const c = o.c || this.p.sun;
      let s = `<circle cx="${x}" cy="${y}" r="${r * 4}" fill="${this.rad([[0, c, 0.35], [1, c, 0]])}"/>`;
      if (o.crescent) s += `<path d="M${x},${y - r}A${r},${r} 0 1 1 ${x},${y + r}A${f(r * 0.68)},${r} 0 1 0 ${x},${y - r}Z" fill="${c}"/>`;
      else s += `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/><circle cx="${f(x - r * 0.3)}" cy="${f(y - r * 0.2)}" r="${f(r * 0.22)}" fill="#000" opacity=".08"/><circle cx="${f(x + r * 0.28)}" cy="${f(y + r * 0.3)}" r="${f(r * 0.15)}" fill="#000" opacity=".08"/><circle cx="${f(x + r * 0.1)}" cy="${f(y - r * 0.45)}" r="${f(r * 0.1)}" fill="#000" opacity=".07"/>`;
      return this.add(s);
    }
    stars(n, maxY) {
      n = n || 90; maxY = maxY || 250;
      let s = '';
      for (let i = 0; i < n; i++) {
        const x = this.rn(0, 800), y = Math.pow(this.r(), 1.4) * maxY, r = this.rn(0.4, 1.5);
        s += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" opacity="${f(this.rn(0.25, 0.95))}"${i % 6 === 0 ? ` class="tw" style="animation-delay:-${f(this.rn(0, 4))}s"` : ''}/>`;
      }
      return this.add(`<g fill="#fff">${s}</g>`);
    }
    clouds(n, y0, y1, op, c) {
      c = c || mix(this.p.sky[1], '#ffffff', 0.25);
      let s = '';
      for (let i = 0; i < n; i++) {
        const cx = this.rn(-40, 840), cy = this.rn(y0, y1), w = this.rn(70, 170);
        for (let j = 0; j < 5; j++) s += `<ellipse cx="${f(cx + this.rn(-w / 2, w / 2))}" cy="${f(cy + this.rn(-8, 8))}" rx="${f(w * this.rn(0.25, 0.45))}" ry="${f(w * this.rn(0.1, 0.17))}"/>`;
      }
      return this.add(`<g class="drift" fill="${c}" opacity="${op === undefined ? 0.55 : op}">${s}</g>`);
    }
    rays(x, y, n, op, len) {
      let s = '';
      len = len || 700;
      for (let i = 0; i < n; i++) {
        const a = this.rn(0, Math.PI * 2), w = this.rn(0.03, 0.08);
        s += poly([[x, y], [x + Math.cos(a - w) * len, y + Math.sin(a - w) * len], [x + Math.cos(a + w) * len, y + Math.sin(a + w) * len]]);
      }
      return this.add(`<g fill="${this.p.light}" opacity="${op || 0.08}">${s}</g>`);
    }
    beams(x0, x1, y0, op) { // лучи сверху вниз, как сквозь кроны или окна
      let s = '';
      for (let x = x0; x < x1; x += this.rn(60, 120)) {
        const w = this.rn(14, 40);
        s += poly([[x, y0], [x + w, y0], [x + w + 140, 450], [x + 120, 450]]);
      }
      return this.add(`<g fill="${this.p.light}" opacity="${op || 0.1}">${s}</g>`);
    }
    meteor(x0, y0, x1, y1) {
      const g = this.lin([[0, '#fff', 0], [1, '#fff', 0.95]], 1, 0);
      return this.add(`<path d="M${x0},${y0}L${x1},${y1}" stroke="${g}" stroke-width="3" stroke-linecap="round"/><circle cx="${x1}" cy="${y1}" r="16" fill="${this.rad([[0, '#fff', 0.9], [1, '#fff', 0]])}"/>`);
    }
    aurora(y, op) {
      let s = '';
      const cols = ['#5cf2b0', '#7ad8ff', '#b07bff'];
      for (let i = 0; i < 3; i++) {
        const c = cols[i], yy = y + i * 26;
        let p = `M-20,${yy}`;
        for (let x = 0; x <= 840; x += 60) p += ` Q${x + 30},${f(yy + this.rn(-40, 40))} ${x + 60},${f(yy + this.rn(-20, 20))}`;
        const g = this.lin([[0, c, 0], [0.5, c, 0.55], [1, c, 0]]);
        s += `<path d="${p}" stroke="${g}" stroke-width="${f(this.rn(28, 46))}" fill="none" opacity="${op || 0.6}"/>`;
      }
      return this.add(`<g class="drift" filter="${this.blurF(6)}">${s}</g>`);
    }

    /* ---------- рельеф ---------- */
    noise(n, rough) {
      const a = new Array(n + 1).fill(0);
      a[0] = this.r(); a[n] = this.r();
      let disp = 1;
      for (let st = n / 2; st >= 1; st /= 2) {
        for (let i = st; i < n; i += st * 2) a[i] = (a[i - st] + a[i + st]) / 2 + (this.r() - 0.5) * disp;
        disp *= rough;
      }
      const mn = Math.min(...a), mx = Math.max(...a);
      return a.map((v) => (v - mn) / (mx - mn || 1));
    }
    ridge(d, base, amp, rough, o) {
      o = o || {};
      const n = 64, v = this.noise(n, rough || 0.55);
      const X = (i) => f(-10 + (i * 820) / n), Y = (i) => f(base - amp * v[i]);
      let p = `M-10,450L-10,${Y(0)}`;
      for (let i = 1; i <= n; i++) p += `L${X(i)},${Y(i)}`;
      this.add(`<path d="${p}L810,450Z" fill="${o.fill || this.col(d)}"/>`);
      if (o.caps || this.p.snow) {
        const T = base - amp * 0.5;
        let top = '', bot = [];
        for (let i = 0; i <= n; i++) {
          const y = base - amp * v[i];
          top += (i ? 'L' : 'M') + X(i) + ',' + f(y);
          bot.push(X(i) + ',' + f(y < T ? Math.min(y + 16, T) : y));
        }
        this.add(`<path d="${top}L${bot.reverse().join('L')}Z" fill="${this.p.snow || '#f4f6f8'}" opacity=".85"/>`);
      }
      return this;
    }
    hills(d, base, amp, fq, fill) {
      amp = amp === undefined ? 30 : amp; fq = fq || 1;
      const a = this.rn(0, 6), b = this.rn(0, 6);
      let p = 'M-10,450';
      for (let x = -10; x <= 810; x += 10) p += `L${x},${f(base - amp * (0.55 + 0.3 * Math.sin(x * 0.007 * fq + a) + 0.15 * Math.sin(x * 0.019 * fq + b)))}`;
      if (!fill && this.p.snow) fill = mix(this.p.snow, this.col(d), 0.12 + 0.22 * d);
      return this.add(`<path d="${p}L810,450Z" fill="${fill || this.col(d)}"/>`);
    }
    ground(d, y, fill) { return this.hills(d, y, 8, 1.5, fill); }
    mound(x, b, w, h, d, fill) { // отдельный холм под замок или башню
      return this.add(`<path d="M${x - w},${b}C${x - w * 0.5},${b} ${x - w * 0.45},${b - h} ${x},${b - h}C${x + w * 0.45},${b - h} ${x + w * 0.5},${b} ${x + w},${b}L${x + w},450L${x - w},450Z" fill="${fill || (this.p.snow ? mix(this.p.snow, this.col(d), 0.25) : this.col(d))}"/>`);
    }
    cliff(x0, x1, top, d, side) { // скала с обрывом
      const c = this.col(d);
      const p = side === 'left'
        ? `M-10,450L-10,${top}L${x1 - 60},${top - 10}L${x1 - 20},${top + 20}L${x1},${top + 70}L${x1 + 20},${top + 160}L${x1 + 10},450Z`
        : `M810,450L810,${top}L${x0 + 60},${top - 10}L${x0 + 20},${top + 20}L${x0},${top + 70}L${x0 - 20},${top + 160}L${x0 - 10},450Z`;
      return this.add(`<path d="${p}" fill="${c}"/>`);
    }

    /* ---------- растительность ---------- */
    pine(x, b, h) {
      const w = h * 0.8;
      const P = [[0, -1], [0.28, -0.66], [0.16, -0.66], [0.42, -0.34], [0.26, -0.34], [0.5, -0.06], [0.07, -0.06], [0.07, 0], [-0.07, 0], [-0.07, -0.06], [-0.5, -0.06], [-0.26, -0.34], [-0.42, -0.34], [-0.16, -0.66], [-0.28, -0.66]];
      return poly(P.map((q) => [x + q[0] * w, b + q[1] * h]));
    }
    leafy(x, b, h, c2) {
      const r = h * 0.3;
      const fillAttr = c2 ? ` fill="${c2}"` : '';
      return `<rect x="${f(x - h * 0.04)}" y="${f(b - h * 0.5)}" width="${f(h * 0.08)}" height="${f(h * 0.5)}"/>` +
        `<g${fillAttr}><circle cx="${f(x)}" cy="${f(b - h * 0.68)}" r="${f(r)}"/><circle cx="${f(x - r * 0.7)}" cy="${f(b - h * 0.52)}" r="${f(r * 0.8)}"/><circle cx="${f(x + r * 0.75)}" cy="${f(b - h * 0.55)}" r="${f(r * 0.75)}"/><circle cx="${f(x + r * 0.1)}" cy="${f(b - h * 0.86)}" r="${f(r * 0.6)}"/></g>`;
    }
    bare(x, b, h) {
      const w = f(Math.max(1.2, h * 0.05));
      return `<path d="M${f(x)},${f(b)}L${f(x)},${f(b - h * 0.6)}L${f(x - h * 0.25)},${f(b - h * 0.95)}M${f(x)},${f(b - h * 0.45)}L${f(x + h * 0.3)},${f(b - h * 0.8)}L${f(x + h * 0.38)},${f(b - h * 0.92)}M${f(x)},${f(b - h * 0.62)}L${f(x + h * 0.06)},${f(b - h)}M${f(x - h * 0.13)},${f(b - h * 0.78)}L${f(x - h * 0.05)},${f(b - h * 0.92)}M${f(x + h * 0.18)},${f(b - h * 0.65)}L${f(x + h * 0.3)},${f(b - h * 0.62)}" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round"/>`;
    }
    willow(x, b, h, d) {
      const c = this.col(d);
      const top = b - h, w = h * 0.55;
