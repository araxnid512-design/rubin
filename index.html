<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1f1a">
<link rel="manifest" href="manifest.webmanifest">
<title>Каменный Бег</title>
<style>
  :root { --ui: rgba(10, 30, 25, .78); --gold: #ffc94a; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0b1f1a;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas { position: fixed; inset: 0; display: block; }

  /* --- сенсорное управление --- */
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5; }
  body.touch #touch { display: block; }
  .pad {
    position: absolute; bottom: calc(12px + env(safe-area-inset-bottom));
    display: flex; gap: clamp(10px, 3vh, 20px); align-items: flex-end; pointer-events: auto;
  }
  .pad.left { left: calc(14px + env(safe-area-inset-left)); }
  .pad.right { right: calc(14px + env(safe-area-inset-right)); }
  .tb {
    width: clamp(58px, 15vh, 90px); height: clamp(58px, 15vh, 90px); border-radius: 50%;
    background: rgba(255, 255, 255, .16); border: 2px solid rgba(255, 255, 255, .35);
    display: grid; place-items: center; color: #fff;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
    transition: transform .06s, background .06s;
  }
  .tb svg { width: 46%; height: 46%; fill: #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .tb.on { background: rgba(255, 210, 110, .5); transform: scale(.93); }
  #bJ { width: clamp(70px, 19vh, 112px); height: clamp(70px, 19vh, 112px); background: rgba(255, 170, 40, .45); border-color: rgba(255, 220, 140, .7); }
  #bJ.on { background: rgba(255, 190, 70, .75); }

  #pauseBtn {
    position: fixed; z-index: 6; top: calc(10px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right));
    width: 46px; height: 46px; border-radius: 12px; border: 0; background: var(--ui);
    color: #fff; font-size: 18px; font-weight: 900; letter-spacing: 2px; display: none;
  }
  body.playing #pauseBtn { display: block; }

  /* --- оверлеи --- */
  .overlay {
    position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(10, 35, 28, .72), rgba(3, 12, 10, .9));
    color: #fff; text-align: center; padding: 16px; box-sizing: border-box;
  }
  .overlay.show { display: flex; }
  .card { max-width: 560px; width: 100%; }
  h1 {
    margin: 0 0 4px; font-size: clamp(30px, 9vh, 64px); letter-spacing: 2px; color: var(--gold);
    text-shadow: 0 4px 0 #8a4b10, 0 8px 20px rgba(0, 0, 0, .5);
  }
  h2 { margin: 0 0 10px; font-size: clamp(26px, 8vh, 48px); color: var(--gold); text-shadow: 0 3px 0 #8a4b10; }
  .sub { opacity: .9; margin: 0 0 clamp(10px, 4vh, 24px); font-size: clamp(14px, 3.6vh, 19px); }
  .btn {
    display: inline-block; border: 0; border-radius: 16px; cursor: pointer;
    padding: clamp(10px, 3vh, 16px) clamp(22px, 6vh, 40px); margin: 6px;
    font-size: clamp(16px, 4.5vh, 24px); font-weight: 800; color: #3b1f05;
    background: linear-gradient(#ffd96b, #f0a22a); box-shadow: 0 5px 0 #a35d0e, 0 10px 20px rgba(0, 0, 0, .35);
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #a35d0e; }
  .btn.alt { background: linear-gradient(#e8efe9, #b7c6bb); box-shadow: 0 5px 0 #5f7166; color: #13261d; }
  .help { margin-top: clamp(8px, 3vh, 20px); font-size: clamp(12px, 3vh, 15px); opacity: .75; line-height: 1.5; }
  .stats { font-size: clamp(15px, 4vh, 20px); line-height: 1.7; margin-bottom: 12px; }
  #rotate { z-index: 20; background: #0b1f1a; flex-direction: column; }
  #rotate .phone {
    width: 60px; height: 100px; border: 5px solid #fff; border-radius: 12px; margin: 0 auto 18px;
    animation: rot 2s ease-in-out infinite;
  }
  @keyframes rot { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<button id="pauseBtn" aria-label="Пауза">II</button>

<div id="touch">
  <div class="pad left">
    <div class="tb" id="bL"><svg viewBox="0 0 24 24"><path d="M16 3 6 12l10 9z"/></svg></div>
    <div class="tb" id="bR"><svg viewBox="0 0 24 24"><path d="m8 3 10 9-10 9z"/></svg></div>
  </div>
  <div class="pad right">
    <div class="tb" id="bA"><svg viewBox="0 0 24 24"><path d="M15.5 2.5c2.6-.9 5.6 1.6 5 4.4-.4 1.9-2.2 3-4 3.4L6.8 20.6a2 2 0 0 1-3-.1 2 2 0 0 1-.1-3L13.4 7.8c.1-2.4.4-4.6 2.1-5.3z"/></svg></div>
    <div class="tb" id="bJ"><svg viewBox="0 0 24 24"><path d="M12 3 3 14h6v7h6v-7h6z"/></svg></div>
  </div>
</div>

<div class="overlay show" id="startScr">
  <div class="card">
    <h1>КАМЕННЫЙ БЕГ</h1>
    <p class="sub">Помоги пещерному человеку Угу добраться до родной пещеры!</p>
    <button class="btn" id="playBtn">▶ ИГРАТЬ</button>
    <div class="help" id="helpText"></div>
  </div>
</div>

<div class="overlay" id="pauseScr">
  <div class="card">
    <h2>Пауза</h2>
    <button class="btn" id="resumeBtn">Продолжить</button>
    <button class="btn alt" id="restartBtn">Заново</button>
  </div>
</div>

<div class="overlay" id="endScr">
  <div class="card">
    <h2 id="endTitle">Победа!</h2>
    <div class="stats" id="endStats"></div>
    <button class="btn" id="againBtn">Играть снова</button>
  </div>
</div>

<div class="overlay" id="rotate">
  <div class="phone"></div>
  <div class="sub">Поверните телефон горизонтально</div>
</div>

<script>
'use strict';
// ============================================================
//  Каменный Бег — одноуровневый платформер про пещерного человека
// ============================================================
const TILE = 32, ROWS = 15, VH = ROWS * TILE, COLS = 172, RES = 2, STEP = 1 / 120;
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rng = seed => { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; };
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (isTouch) document.body.classList.add('touch');

let W = 0, H = 0, dpr = 1, scale = 1, viewW = 800;
let T = 0; // общее время для анимаций

function mk(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.ceil(w * RES); c.height = Math.ceil(h * RES);
  const g = c.getContext('2d'); g.scale(RES, RES);
  return [c, g];
}
function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function ell(g, x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); }

// ============================================================
//  Звук
// ============================================================
let AC = null;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f1, f2, dur, type = 'square', vol = 0.06) {
  if (!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
const seq = (notes, gap, dur, type) => notes.forEach((f, i) => setTimeout(() => tone(f, f, dur, type), i * gap));
const SFX = {
  jump: () => tone(260, 620, 0.16),
  coin: () => seq([988, 1319], 70, 0.12),
  bone: () => tone(600, 1300, 0.18, 'triangle', 0.1),
  stomp: () => tone(420, 70, 0.16),
  club: () => tone(160, 80, 0.1, 'triangle', 0.14),
  bump: () => tone(130, 90, 0.08),
  hit: () => tone(220, 60, 0.3, 'sawtooth'),
  die: () => tone(520, 50, 0.9, 'sawtooth'),
  power: () => seq([392, 523, 659, 784], 60, 0.09),
  check: () => seq([523, 784], 90, 0.15, 'triangle'),
  life: () => seq([659, 784, 1319, 1047, 1175, 1568], 70, 0.1),
  win: () => seq([523, 659, 784, 1047, 784, 1047], 140, 0.22),
};

// ============================================================
//  Графика: заранее отрисованные тайлы и фоны
// ============================================================
const TILES = {};
function stones(g, list) {
  for (const [x, y, w, h] of list) {
    g.fillStyle = '#5a3518'; rr(g, x - 0.6, y - 0.6, w + 1.2, h + 1.2, 3.5); g.fill();
    g.fillStyle = '#a8743f'; rr(g, x, y, w, h, 3); g.fill();
    g.fillStyle = 'rgba(255,225,170,.35)'; rr(g, x + 2, y + 1.4, w * 0.45, 2.2, 1); g.fill();
    g.fillStyle = 'rgba(60,30,10,.25)'; rr(g, x + 1, y + h - 2.6, w - 2, 2, 1); g.fill();
  }
}
function grass(g) {
  g.fillStyle = '#3f8f25'; g.fillRect(0, 0, 32, 10);
  for (let i = 0; i < 5; i++) { ell(g, i * 8 + (i % 2 ? 1 : 4), 10, 5, 4.5); g.fill(); }
  g.fillStyle = '#5db532'; g.fillRect(0, 0, 32, 6);
  for (let i = 0; i < 11; i++) {
    g.fillStyle = i % 2 ? '#8ad64a' : '#4aa02a';
    const x = i * 3.1 - 1; g.beginPath(); g.moveTo(x, 7); g.lineTo(x + 1.6, 0.5); g.lineTo(x + 3.2, 7); g.fill();
  }
  g.fillStyle = '#2d7a1c';
  ell(g, 6, 13, 1.8, 3.6, 0.3); g.fill(); ell(g, 19, 14, 1.8, 3.2, -0.3); g.fill(); ell(g, 27, 12, 1.6, 2.8, 0.2); g.fill();
  g.fillStyle = '#b4ef6a'; g.fillRect(0, 0, 32, 1.2);
}
function bevel(g, base, light, dark) {
  g.fillStyle = base; g.fillRect(0, 0, 32, 32);
  g.fillStyle = light; g.fillRect(0, 0, 32, 3); g.fillRect(0, 0, 3, 32);
  g.fillStyle = dark; g.fillRect(0, 29, 32, 3); g.fillRect(29, 0, 3, 32);
}
function makeTiles() {
  let c, g;
  [c, g] = mk(32, 32); g.fillStyle = '#6b4224'; g.fillRect(0, 0, 32, 32);
  stones(g, [[1, 1, 14, 9], [16, 0, 15, 10], [0, 11, 9, 10], [10, 11, 13, 10], [24, 11, 8, 10], [2, 22, 13, 9], [16, 22, 15, 9]]);
  TILES.dirt = c;

  [c, g] = mk(32, 32); g.fillStyle = '#6b4224'; g.fillRect(0, 0, 32, 32);
  stones(g, [[1, 12, 13, 9], [15, 11, 16, 10], [0, 22, 10, 9], [11, 22, 12, 9], [24, 22, 8, 9]]);
  grass(g); TILES.top = c;

  [c, g] = mk(32, 32); g.fillStyle = '#6b4224'; g.fillRect(0, 0, 32, 32);
  stones(g, [[1, 12, 13, 9], [15, 11, 16, 10], [3, 22, 12, 7], [16, 22, 12, 7]]);
  grass(g); g.fillStyle = 'rgba(30,15,5,.55)'; g.fillRect(0, 29, 32, 3); TILES.plat = c;

  [c, g] = mk(32, 32); bevel(g, '#8f8a7e', '#bdb8aa', '#5d594f');
  g.strokeStyle = '#5d594f'; g.lineWidth = 1.2;
  g.beginPath(); g.moveTo(8, 3); g.lineTo(12, 12); g.lineTo(9, 18); g.moveTo(12, 12); g.lineTo(20, 14);
  g.moveTo(22, 29); g.lineTo(24, 22); g.lineTo(28, 20); g.stroke(); TILES.stone = c;

  [c, g] = mk(32, 32); bevel(g, '#e0a83a', '#ffd970', '#9a6512');
  g.fillStyle = '#9a6512'; [[5, 5], [26, 5], [5, 26], [26, 26]].forEach(([x, y]) => { ell(g, x, y, 1.5, 1.5); g.fill(); });
  g.font = 'bold 22px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#fff1b8'; g.fillText('?', 17, 18); g.fillStyle = '#7a4a10'; g.fillText('?', 16, 17);
  TILES.q = c;

  [c, g] = mk(32, 32); bevel(g, '#7d6b55', '#9b8870', '#4f4234');
  g.fillStyle = '#4f4234'; [[5, 5], [26, 5], [5, 26], [26, 26]].forEach(([x, y]) => { ell(g, x, y, 1.5, 1.5); g.fill(); });
  TILES.used = c;
}

// фоновые слои: бесшовно повторяются по горизонтали
const BG = {};
function wrapDraw(g, w, fn) { for (const o of [-w, 0, w]) { g.save(); g.translate(o, 0); fn(); g.restore(); } }
function ridge(g, w, base, parts, color) {
  g.fillStyle = color; g.beginPath(); g.moveTo(0, VH);
  for (let x = 0; x <= w; x += 4) {
    let y = base;
    for (const [a, k, ph, sharp] of parts) {
      const s = Math.sin(Math.PI * x * k / w + ph);
      y -= sharp ? a * Math.pow(1 - Math.abs(s), 2.2) : a * s;
    }
    g.lineTo(x, y);
  }
  g.lineTo(w, VH); g.closePath(); g.fill();
}
const VOLCANOES = [{ x: 380, top: 118 }, { x: 1180, top: 150 }];
function makeFar() {
  const w = 1600, [c, g] = mk(w, VH);
  ridge(g, w, 300, [[90, 5, 0.3, 1], [50, 9, 1.2, 1], [14, 23, 0.4, 0]], '#a99bd3');
  for (const v of VOLCANOES) {
    const hb = 250, base = 360, ch = 26;
    const grd = g.createLinearGradient(0, v.top, 0, base);
    grd.addColorStop(0, '#7b3f36'); grd.addColorStop(0.5, '#6a3d55'); grd.addColorStop(1, '#5b4a7a');
    g.fillStyle = grd; g.beginPath();
    g.moveTo(v.x - hb, base); g.quadraticCurveTo(v.x - ch - 40, v.top + 90, v.x - ch, v.top);
    g.lineTo(v.x + ch, v.top); g.quadraticCurveTo(v.x + ch + 40, v.top + 90, v.x + hb, base); g.closePath(); g.fill();
    // тень на правом склоне
    g.fillStyle = 'rgba(40,20,60,.28)'; g.beginPath();
    g.moveTo(v.x + 4, v.top); g.lineTo(v.x + ch, v.top); g.quadraticCurveTo(v.x + ch + 40, v.top + 90, v.x + hb, base);
    g.lineTo(v.x + 40, base); g.closePath(); g.fill();
    // лава
    const R = rng(v.x);
    g.save(); g.shadowColor = '#ff4d00'; g.shadowBlur = 10; g.lineCap = 'round'; g.lineJoin = 'round';
    for (let i = 0; i < 7; i++) {
      let x = v.x + (R() - 0.5) * ch * 1.6, y = v.top + 2;
      const len = (base - v.top) * (0.35 + R() * 0.5), dir = x < v.x ? -1 : 1;
      g.strokeStyle = i % 2 ? '#ff8a1e' : '#ffb03a'; g.lineWidth = 2 + R() * 2.5;
      g.beginPath(); g.moveTo(x, y);
      for (let s = 0; s < 9; s++) { y += len / 9; x += dir * (len / 9) * (0.35 + R() * 0.6) + (R() - 0.5) * 6; g.lineTo(x, y); }
      g.stroke();
    }
    g.restore();
    g.fillStyle = '#ffd34a'; ell(g, v.x, v.top + 1, ch, 5); g.fill();
    g.fillStyle = '#ff7a1a'; ell(g, v.x, v.top + 3, ch * 0.7, 3); g.fill();
  }
  ridge(g, w, 345, [[60, 7, 2.1, 1], [30, 15, 0.7, 1], [10, 31, 0.2, 0]], '#8576b6');
  const haze = g.createLinearGradient(0, 300, 0, VH);
  haze.addColorStop(0, 'rgba(200,235,255,0)'); haze.addColorStop(1, 'rgba(200,235,255,.55)');
  g.fillStyle = haze; g.fillRect(0, 300, w, VH - 300);
  ridge(g, w, 372, [[18, 12, 0.2, 0], [10, 29, 1.0, 0], [6, 61, 0.3, 0]], '#4f9468');
  BG.far = { c, w };
}
function palm(g, x, base, h, lean, R) {
  const tx = x + lean, ty = base - h;
  g.strokeStyle = '#7a5530'; g.lineWidth = 9; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x, base); g.quadraticCurveTo(x + lean * 0.1, base - h * 0.5, tx, ty); g.stroke();
  g.strokeStyle = '#5b3d20'; g.lineWidth = 2;
  for (let i = 1; i < 12; i++) {
    const t = i / 12, px = (1 - t) * (1 - t) * x + 2 * (1 - t) * t * (x + lean * 0.1) + t * t * tx;
    const py = (1 - t) * (1 - t) * base + 2 * (1 - t) * t * (base - h * 0.5) + t * t * ty;
    g.beginPath(); g.moveTo(px - 4, py); g.lineTo(px + 4, py - 2); g.stroke();
  }
  for (let i = 0; i < 9; i++) {
    const a = -Math.PI + (i / 8) * Math.PI + (R() - 0.5) * 0.3, L = 46 + R() * 22;
    const ex = tx + Math.cos(a) * L, ey = ty + Math.sin(a) * L * 0.55 + 22;
    const mx = tx + Math.cos(a) * L * 0.5, my = ty + Math.sin(a) * L * 0.5 - 8;
    g.fillStyle = i % 2 ? '#2f8a2c' : '#3fa236';
    g.beginPath(); g.moveTo(tx, ty); g.quadraticCurveTo(mx, my - 8, ex, ey); g.quadraticCurveTo(mx, my + 8, tx, ty + 3); g.fill();
    g.strokeStyle = '#1f6a20'; g.lineWidth = 1; g.beginPath(); g.moveTo(tx, ty); g.quadraticCurveTo(mx, my, ex, ey); g.stroke();
  }
  g.fillStyle = '#6b4a1e'; ell(g, tx - 4, ty + 5, 4, 4); g.fill(); ell(g, tx + 4, ty + 6, 4, 4); g.fill();
}
function bush(g, x, y, s, col) { g.fillStyle = col; for (let i = 0; i < 5; i++) { ell(g, x + (i - 2) * s * 0.55, y - Math.sin(i / 4 * Math.PI) * s * 0.35, s * 0.42, s * 0.36); g.fill(); } }
function makeMid() {
  const w = 1300, [c, g] = mk(w, VH);
  wrapDraw(g, w, () => {
    const R = rng(42);
    const cliffs = [[60, 250, 170], [470, 210, 150], [820, 270, 200], [1130, 235, 120]];
    for (const [x, top, cw] of cliffs) {
      // водопад слева от скалы
      const fx = x - 30, fw = 34;
      const wg = g.createLinearGradient(fx, 0, fx + fw, 0);
      wg.addColorStop(0, '#bfe9ff'); wg.addColorStop(0.5, '#ffffff'); wg.addColorStop(1, '#9fd8f5');
      g.fillStyle = wg; g.fillRect(fx, top + 12, fw, VH - top);
      g.strokeStyle = 'rgba(120,190,230,.7)'; g.lineWidth = 1.5;
      for (let i = 0; i < 6; i++) { const lx = fx + 4 + i * 5.5; g.beginPath(); g.moveTo(lx, top + 14 + R() * 20); g.lineTo(lx, VH); g.stroke(); }
      g.fillStyle = 'rgba(255,255,255,.75)';
      for (let i = 0; i < 6; i++) { ell(g, fx + fw / 2 + (R() - 0.5) * 50, 392 + R() * 10, 16 + R() * 10, 8 + R() * 4); g.fill(); }
      // скала
      g.fillStyle = '#8b6a48'; g.beginPath(); g.moveTo(x, VH); g.lineTo(x + 6, top + 20);
      for (let i = 0; i <= 6; i++) g.lineTo(x + (cw / 6) * i, top + 6 + R() * 10);
      g.lineTo(x + cw - 4, top + 24); g.lineTo(x + cw + 6, VH); g.closePath(); g.fill();
      g.strokeStyle = 'rgba(80,55,35,.6)'; g.lineWidth = 2;
      for (let i = 0; i < 6; i++) { const lx = x + 12 + R() * (cw - 24); g.beginPath(); g.moveTo(lx, top + 30); g.lineTo(lx + (R() - 0.5) * 12, VH); g.stroke(); }
      g.fillStyle = 'rgba(255,230,190,.18)'; g.fillRect(x + 6, top + 20, cw * 0.25, VH - top);
      // зелень сверху
      for (let i = 0; i < 9; i++) { g.fillStyle = i % 2 ? '#4f9e33' : '#62b33c'; ell(g, x + (cw / 8) * i, top + 8 + R() * 6, 16 + R() * 8, 10 + R() * 4); g.fill(); }
      for (let i = 0; i < 3; i++) palm(g, x + 20 + R() * (cw - 40), top + 10, 40 + R() * 25, (R() - 0.5) * 30, R);
    }
    // озеро и джунгли у подножья
    const lg = g.createLinearGradient(0, 380, 0, VH);
    lg.addColorStop(0, '#5cc4e8'); lg.addColorStop(1, '#1f7fb4');

let map, items, enemies, decor, blockLoot, checkpoints, goalX, hutX, totalBones;
function mkItem(type, x, y) { return { type, x, y, t: Math.random() * 6, taken: false }; }
function buildLevel() {
  map = Array.from({ length: ROWS }, () => Array(COLS).fill(' '));
  items = []; enemies = []; decor = []; blockLoot = {}; checkpoints = [];
  const G = (a, b, top = 12) => { for (let x = a; x <= b; x++) for (let y = top; y < ROWS; y++) map[y][x] = '#'; };
  const S = (x, y, c) => { map[y][x] = c; };
  const P = (x, y, w) => { for (let i = 0; i < w; i++) S(x + i, y, '='); };
  const C = (x, y, n = 1) => { for (let i = 0; i < n; i++) items.push(mkItem('coin', (x + i) * TILE + 16, y * TILE + 16)); };
  const B = (x, y) => items.push(mkItem('bone', x * TILE + 16, y * TILE + 16));
  const Q = (x, y, loot = 'coin') => { S(x, y, '?'); blockLoot[x + ',' + y] = loot; };
  const D = (x, y = 11) => enemies.push({ type: 'dino', x: x * TILE, y: (y + 1) * TILE - 28, w: 30, h: 28, vx: 0, vy: 0, dir: -1, walk: 0, alive: true, squash: 0, knock: false, dead: false });
  const F = (x, y) => enemies.push({ type: 'ptero', x0: x * TILE, y0: y * TILE, x: x * TILE, y: y * TILE, w: 34, h: 20, dir: -1, t: Math.random() * 6, alive: true, knock: false, dead: false, vy: 0 });
  const SP = (a, b, y = 11) => { for (let x = a; x <= b; x++) S(x, y, '^'); };
  const sign = (x, y = 12) => decor.push({ type: 'sign', x: x * TILE + 16, y: y * TILE });

  // 1. Начало
  G(0, 24);
  C(5, 9, 4); Q(10, 8); S(11, 8, 'S'); Q(12, 8, 'meat'); S(13, 8, 'S'); Q(14, 8);
  B(12, 5); D(19); B(22, 10);
  // яма с водой 25-27
  G(28, 45);
  P(31, 9, 4); C(31, 8, 4); B(33, 6);
  sign(36); SP(38, 39); B(38, 8); D(43);
  // плато
  G(46, 55, 10); C(48, 7, 3); F(52, 7); B(54, 8);
  // яма 56-59 с островком
  P(57, 9, 2); C(57, 8, 2);
  // 2. Середина, точка сохранения
  G(60, 80); checkpoints.push({ x: 63 * TILE + 16, y: 12 * TILE, lit: false });
  D(68); Q(70, 8); Q(71, 8, 'meat'); Q(72, 8); B(71, 5); D(76); C(76, 9, 3);
  // широкая яма 81-85
  P(82, 10, 2); C(82, 8, 2);
  G(86, 100);
  sign(86); SP(88, 89); B(88, 8);
  for (let i = 0; i < 4; i++) for (let y = 11 - i; y <= 11; y++) { S(92 + i, y, 'S'); S(99 - i, y, 'S'); }
  B(96, 6); C(92, 9, 1); C(99, 9, 1);
  // яма 101-104
  G(105, 125);
  P(108, 8, 4); C(108, 7, 4); P(114, 5, 4); B(115, 4); B(117, 4);
  D(110); D(118); D(123); F(117, 8); Q(121, 8, 'meat');
  // яма 126-130 с платформой
  P(127, 9, 3); B(128, 7);
  // 3. Финал: лестница, флаг, пещера
  G(131, COLS - 1);
  D(135); C(136, 9, 3);
  for (let i = 0; i < 8; i++) for (let y = 11 - i; y <= 11; y++) S(140 + i, y, 'S');
  B(143, 6); B(147, 2);
  goalX = 156 * TILE + 16; hutX = 164 * TILE;

  // декор на траве
  const R = rng(1234);
  for (let x = 1; x < COLS - 1; x++) for (let y = 1; y < ROWS; y++) {
    if (map[y][x] === '#' && map[y - 1][x] === ' ' && R() < 0.22 && Math.abs(x * TILE - goalX) > 40 && x < 160) {
      decor.push({ type: R() < 0.5 ? 'rock' : 'fern', x: x * TILE + 4 + R() * 24, y: y * TILE, s: 0.7 + R() * 0.6 });
    }
  }
  totalBones = items.filter(i => i.type === 'bone').length;
}

function solidAt(tx, ty) {
  if (tx < 0 || tx >= COLS) return true;
  if (ty < 0 || ty >= ROWS) return false;
  return isSolidCh(map[ty][tx]);

    if (d.x < cam - 60 || d.x > cam + viewW + 60) continue;
    if (d.type === 'sign') drawSign(ctx, d.x, d.y);
    else if (d.type === 'rock') { ctx.fillStyle = '#7d7a72'; ell(ctx, d.x, d.y - 2, 9 * d.s, 5 * d.s); ctx.fill(); ctx.fillStyle = '#a5a197'; ell(ctx, d.x - 2 * d.s, d.y - 4 * d.s, 4.5 * d.s, 2.2 * d.s); ctx.fill(); }
    else {
      ctx.strokeStyle = '#3c9a2e'; ctx.lineWidth = 2;
      for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.quadraticCurveTo(d.x + i * 5 * d.s, d.y - 10 * d.s, d.x + i * 8 * d.s, d.y - (8 - Math.abs(i) * 2) * d.s); ctx.stroke(); }
    }
  }
  for (const cp of checkpoints) drawTotem(ctx, cp.x, cp.y, cp.lit);
  drawGoal(ctx, goalX, flagY);
  drawHut(ctx, hutX + 20, 12 * TILE);

  // тайлы
  for (let y = 0; y < ROWS; y++) for (let x = c0; x <= c1; x++) {
    const ch = map[y][x]; if (ch === ' ') continue;
    const tx = x * TILE; let ty = y * TILE;
    const b = bumpAnim[x + ',' + y]; if (b) ty -= Math.sin((b / 0.15) * Math.PI) * 6;
    let img = null;
    if (ch === '#') img = (y > 0 && isSolidCh(map[y - 1][x])) ? TILES.dirt : TILES.top;
    else if (ch === 'S') img = TILES.stone;
    else if (ch === '=') img = TILES.plat;
    else if (ch === '?') img = TILES.q;
    else if (ch === 'U') img = TILES.used;
    else if (ch === '^') { drawSpikes(ctx, tx, ty); continue; }
    ctx.drawImage(img, tx, ty, TILE + 0.4, TILE + 0.4);
    if (ch === '?') { ctx.fillStyle = `rgba(255,255,220,${0.18 + Math.sin(T * 5) * 0.15})`; ctx.fillRect(tx + 3, ty + 3, 26, 26); }
  }
  // предметы
  for (const it of items) {
    if (it.taken || it.x < cam - 40 || it.x > cam + viewW + 40) continue;
    const bob = Math.sin(it.t * 3) * 3;
    if (it.type === 'coin') drawCoin(ctx, it.x, it.y + bob, 9, Math.cos(it.t * 3));
    else if (it.type === 'bone') {
      ctx.fillStyle = 'rgba(255,255,200,.25)'; ell(ctx, it.x, it.y + bob, 16, 16); ctx.fill();
      drawBone(ctx, it.x, it.y + bob, 1.05, Math.sin(it.t * 2) * 0.3 - 0.4);
    } else drawMeat(ctx, it.x, it.y + (it.rise >= 1 ? bob * 0.5 : 0));
  }
  // враги
  for (const e of enemies) {
    if (e.dead || e.x < cam - 80 || e.x > cam + viewW + 80) continue;
    if (e.type === 'dino') drawDino(ctx, e); else drawPtero(ctx, e);
  }
  // игрок
  const p = player;
  if (!p.hidden && !(p.inv > 0 && state === 'play' && Math.floor(T * 14) % 2)) {
    if (state === 'dying') {
      ctx.save(); ctx.translate(p.x + p.w / 2, p.y + p.h / 2); ctx.rotate(Math.min(1, p.dieT * 2) * Math.PI); ctx.translate(-(p.x + p.w / 2), -(p.y + p.h / 2));
      drawCaveman(ctx, p.x + p.w / 2, p.y + p.h, p.face, 0, { air: true, run: false, attack: 0 }); ctx.restore();
    } else if (state === 'win' && winT < 1.3) {
      drawCaveman(ctx, p.x + p.w / 2 + 4, p.y + p.h, 1, 0, { air: true, run: false, attack: 0 });
    } else {
      drawCaveman(ctx, p.x + p.w / 2, p.y + p.h, p.face, p.anim, { air: !p.onGround, run: Math.abs(p.vx) > 10, attack: p.attack });
    }
  }
  // частицы
  for (const q of particles) {
    const a = clamp(q.life / q.max, 0, 1);
    if (q.coin) { drawCoin(ctx, q.x, q.y, 9, Math.cos(q.life * 30)); continue; }
    ctx.globalAlpha = a;
    if (q.text) {
      ctx.font = 'bold 14px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(q.text, q.x, q.y); ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
    } else { ctx.fillStyle = q.color; ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size); }
    ctx.globalAlpha = 1;
  }
  drawHUD();
}

function panel(g, x, y, w, h, r = 14) { g.fillStyle = 'rgba(10,30,25,.78)'; rr(g, x, y, w, h, r); g.fill(); }
function drawHUD() {
  if (state === 'start') return;
  const s = clamp(H / 400, 0.72, 1.25);
  ctx.setTransform(dpr * s, 0, 0, dpr * s, 0, 0);
  const sw = W / s, p = player;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  // левая панель
  panel(ctx, 12, 10, 236, 62);
  ctx.save(); ctx.beginPath(); ctx.rect(14, 12, 40, 58); ctx.clip();
  drawCaveman(ctx, 34, 98, 1, 0, { air: false, run: false, attack: 0 }, 1.15); ctx.restore();
  ctx.font = '800 18px system-ui, sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText('×' + Math.max(0, lives), 58, 28);
  for (let i = 0; i < 3; i++) drawHeart(ctx, 106 + i * 24, 26, 20, i < p.hearts);
  drawBone(ctx, 72, 54, 0.95, -0.5);
  ctx.fillText(String(bones).padStart(2, '0'), 88, 55);
  drawCoin(ctx, 140, 54, 9);
  ctx.fillText(String(coins).padStart(3, '0'), 156, 55);
  ctx.font = '600 13px system-ui, sans-serif'; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,30,25,.7)';
  ctx.strokeText(`Косточки: ${bones} / ${totalBones}`, 18, 86);
  ctx.fillStyle = '#fff'; ctx.fillText(`Косточки: ${bones} / ${totalBones}`, 18, 86);
  // прогресс уровня
  const bw = Math.min(260, sw * 0.26), bx = sw / 2 - bw / 2, prog = clamp(p.x / goalX, 0, 1);
  ctx.fillStyle = 'rgba(10,30,25,.6)'; rr(ctx, bx, 16, bw, 10, 5); ctx.fill();
  ctx.fillStyle = '#ffc94a'; rr(ctx, bx, 16, Math.max(10, bw * prog), 10, 5); ctx.fill();
  ctx.font = '600 12px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.fillText(fmtTime(playTime), sw / 2, 40);
  // уровень
  const rx = sw - 70 - 132;
  panel(ctx, rx, 10, 126, 46, 12);
  ctx.font = '800 18px system-ui, sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText('МИР 1-1', rx + 63, 34);
}

// ============================================================
//  Главный цикл
// ============================================================
let last = performance.now(), accT = 0;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now; T += dt;
  if (state === 'play' || state === 'dying' || state === 'win') {
    accT += dt;
    while (accT >= STEP) { update(STEP); accT -= STEP; }
  } else if (state === 'start') {
    camX = (Math.sin(T * 0.08) * 0.5 + 0.5) * 1400;
  }
  render();
  requestAnimationFrame(frame);
}

makeTiles(); makeFar(); makeMid(); makeNear(); makeClouds();
resetGame(); resize();
requestAnimationFrame(frame);
</script>
