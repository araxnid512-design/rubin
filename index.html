<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Zombie Viewer</title>
	<style>
		:root {
			--bg: #0d120d;
			--panel: rgba(18, 24, 18, 0.88);
			--border: #2f3d2c;
			--text: #d8e4d0;
			--muted: #8a9a82;
			--accent: #9bd16b;
			--accent-ink: #10180c;
			--danger: #d9534f;
		}
		* { box-sizing: border-box; }
		html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
			font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
		canvas { display: block; }
		#panel { position: absolute; top: 16px; left: 16px; width: 280px; max-width: calc(100vw - 32px);
			background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px;
			backdrop-filter: blur(6px); }
		h1 { font-size: 16px; margin: 0 0 2px; }
		.sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
		.label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin: 12px 0 6px; }
		.anims { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
		button { font: inherit; color: var(--text); background: #1d261b; border: 1px solid var(--border);
			border-radius: 6px; padding: 7px 8px; cursor: pointer; text-align: left; }
		button:hover { border-color: var(--accent); }
		button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
		button kbd { float: right; opacity: .6; font: 11px ui-monospace, monospace; }
		.row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
		.row input[type=range] { flex: 1; accent-color: var(--accent); }
		.row output { width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
		label.check { display: flex; align-items: center; gap: 8px; margin: 4px 0; cursor: pointer; }
		label.check input { accent-color: var(--accent); }
		select { width: 100%; font: inherit; color: var(--text); background: #1d261b; border: 1px solid var(--border);
			border-radius: 6px; padding: 6px; }
		#progress { height: 4px; background: #1d261b; border-radius: 2px; overflow: hidden; margin-top: 6px; }
		#progress div { height: 100%; width: 0; background: var(--accent); }
		#status { color: var(--muted); font-size: 12px; margin-top: 6px; font-variant-numeric: tabular-nums; }
		.wide { width: 100%; text-align: center; margin-top: 6px; }
		#drop { position: absolute; inset: 0; display: none; place-items: center; font-size: 22px;
			background: rgba(155, 209, 107, .12); border: 3px dashed var(--accent); pointer-events: none; }
		#drop.show { display: grid; }
		#error { color: var(--danger); font-size: 12px; margin-top: 6px; }
		@media (max-width: 600px) {
			#panel { top: auto; bottom: 16px; padding: 10px; }
			.hide-mobile { display: none; }
		}
	</style>
	<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
			}
		}
	</script>
</head>
<body>
	<div id="panel">
		<h1>🧟 Зомби</h1>
		<div class="sub">Low-poly skinned mesh · 19 костей · 5 анимаций</div>

		<div class="label">Анимация</div>
		<div class="anims" id="anims"></div>

		<div class="row"><span>Скорость</span><input id="speed" type="range" min="0" max="2" step="0.05" value="1"><output id="speedOut">1.0×</output></div>
		<div class="row"><span>Переход</span><input id="fade" type="range" min="0" max="1" step="0.05" value="0.3"><output id="fadeOut">0.3с</output></div>
		<div id="progress"><div></div></div>
		<div id="status">—</div>

		<div class="label">Вид</div>
		<label class="check"><input type="checkbox" id="skeleton"> Показать скелет</label>
		<label class="check"><input type="checkbox" id="wire"> Каркас (wireframe)</label>
		<label class="check"><input type="checkbox" id="rotate"> Автоповорот камеры</label>
		<label class="check"><input type="checkbox" id="pause"> Пауза <span class="hide-mobile" style="color:var(--muted)">(пробел)</span></label>

		<div class="label">Источник модели</div>
		<select id="source">
			<option value="procedural">Процедурная (src/zombie.js)</option>
			<option value="glb">Файл models/zombie.glb</option>
		</select>
		<button class="wide" id="download">⬇ Скачать zombie.glb</button>
		<div class="sub hide-mobile" style="margin:8px 0 0">Можно перетащить сюда любой .glb/.gltf, чтобы проверить его анимации.</div>
		<div id="error"></div>
	</div>
	<div id="drop">Отпустите файл .glb / .gltf</div>

	<script type="module">
		import * as THREE from 'three';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
		import { createZombie } from './src/zombie.js';

		const $ = (id) => document.getElementById(id);

		// ---------- Сцена ----------
		const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
		renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
		renderer.setSize(innerWidth, innerHeight);
		renderer.shadowMap.enabled = true;
		renderer.shadowMap.type = THREE.PCFSoftShadowMap;
		document.body.prepend(renderer.domElement);

		const scene = new THREE.Scene();
		scene.background = new THREE.Color(0x1a2318);
		scene.fog = new THREE.Fog(0x1a2318, 6, 18);

		const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 100);
		camera.position.set(2.6, 1.7, 3.6);
		const controls = new OrbitControls(camera, renderer.domElement);
		controls.target.set(0, 0.95, 0);
		controls.enableDamping = true;
		controls.autoRotateSpeed = 1.5;

		scene.add(new THREE.HemisphereLight(0xc8e0ff, 0x2a3320, 1.2));
		const moon = new THREE.DirectionalLight(0xdfe8ff, 2.2);
		moon.position.set(3, 6, 4);
		moon.castShadow = true;
		moon.shadow.mapSize.set(2048, 2048);
		Object.assign(moon.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.5, far: 20 });
		scene.add(moon);
		const rim = new THREE.DirectionalLight(0x9bd16b, 1.2);
		rim.position.set(-4, 3, -4);
		scene.add(rim);

		const ground = new THREE.Mesh(new THREE.CircleGeometry(12, 48), new THREE.MeshStandardMaterial({ color: 0x232d20, roughness: 1 }));
		ground.rotation.x = -Math.PI / 2;
		ground.receiveShadow = true;
		scene.add(ground);
		const grid = new THREE.GridHelper(12, 24, 0x3d4d38, 0x2c3828);
		grid.position.y = 0.001;
		scene.add(grid);

		// ---------- Модель и анимации ----------
		const state = { model: null, mixer: null, actions: {}, current: null, clips: [], skeletonHelper: null, source: 'procedural' };
		window.__zombie = state; // для автотестов
		const LOOP_ONCE = new Set(['Death', 'Attack']);

		function setModel(model, clips) {
			if (state.model) {
				scene.remove(state.model);
				state.mixer.stopAllAction();
			}
			if (state.skeletonHelper) scene.remove(state.skeletonHelper);

			state.model = model;
			state.clips = clips;
			state.mixer = new THREE.AnimationMixer(model);
			state.actions = {};
			state.current = null;
			model.traverse((o) => {
				if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; }
			});
			scene.add(model);

			state.skeletonHelper = new THREE.SkeletonHelper(model);
			state.skeletonHelper.visible = $('skeleton').checked;
			scene.add(state.skeletonHelper);
			applyWireframe();

			for (const clip of clips) {
				const action = state.mixer.clipAction(clip);
				if (LOOP_ONCE.has(clip.name)) {
					action.setLoop(THREE.LoopOnce, 1);
					action.clampWhenFinished = true;
				}
				state.actions[clip.name] = action;
			}
			buildButtons();
			$('error').textContent = clips.length ? '' : 'В модели нет анимаций';
			if (clips.length) play(clips.find((c) => c.name === 'Idle')?.name ?? clips[0].name, 0);
		}

		function play(name, fade = Number($('fade').value)) {
			const next = state.actions[name];
			if (!next) return;
			const prev = state.current && state.actions[state.current];
			next.reset().setEffectiveWeight(1).setEffectiveTimeScale(1).play();
			if (prev && prev !== next && fade > 0) next.crossFadeFrom(prev, fade, false);
			else if (prev && prev !== next) prev.stop();
			state.current = name;
			document.querySelectorAll('#anims button').forEach((b) => b.classList.toggle('active', b.dataset.name === name));
		}

		// После одноразовой атаки возвращаемся в Idle, Death остаётся на последнем кадре.
		function onFinished(e) {
			if (e.action.getClip().name === 'Attack' && state.current === 'Attack' && state.actions.Idle) play('Idle');
		}

		const ICONS = { Idle: '🧍', Walk: '🚶', Run: '🏃', Attack: '🦷', Death: '💀' };
		function buildButtons() {
			const box = $('anims');
			box.innerHTML = '';
			state.clips.forEach((clip, i) => {
				const b = document.createElement('button');
				b.dataset.name = clip.name;
				b.innerHTML = `${ICONS[clip.name] ?? '▶'} ${clip.name}${i < 9 ? `<kbd>${i + 1}</kbd>` : ''}`;
				b.onclick = () => play(clip.name);
				box.append(b);
			});
			state.mixer.addEventListener('finished', onFinished);
		}

		function applyWireframe() {
			state.model?.traverse((o) => { if (o.isMesh) o.material.wireframe = $('wire').checked; });
		}

		function loadProcedural() {
			const { model, animations } = createZombie();
			setModel(model, animations);
		}

		const loader = new GLTFLoader();
		function loadGLTF(url) {
			$('error').textContent = '';
			loader.load(url, (gltf) => setModel(gltf.scene, gltf.animations), undefined, (err) => {
				$('error').textContent = `Не удалось загрузить: ${err.message ?? err}`;
				console.error(err);
			});
		}

		$('source').onchange = (e) => {
			state.source = e.target.value;
			if (e.target.value === 'glb') loadGLTF('./models/zombie.glb');
			else loadProcedural();
		};

		$('download').onclick = async () => {
			const { model, animations } = createZombie();
			const glb = await new GLTFExporter().parseAsync(model, { binary: true, animations });
			const a = document.createElement('a');
			a.href = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' }));
			a.download = 'zombie.glb';
			a.click();
			setTimeout(() => URL.revokeObjectURL(a.href), 1000);
		};

		// Drag & drop своих моделей
		addEventListener('dragover', (e) => { e.preventDefault(); $('drop').classList.add('show'); });
		addEventListener('dragleave', (e) => { if (!e.relatedTarget) $('drop').classList.remove('show'); });
		addEventListener('drop', (e) => {
			e.preventDefault();
			$('drop').classList.remove('show');
			const file = e.dataTransfer.files[0];
			if (!file) return;
			const url = URL.createObjectURL(file);
			loadGLTF(url);
		});

		// ---------- Управление ----------
		$('speed').oninput = (e) => { $('speedOut').textContent = `${Number(e.target.value).toFixed(1)}×`; };
		$('fade').oninput = (e) => { $('fadeOut').textContent = `${Number(e.target.value).toFixed(1)}с`; };
		$('skeleton').onchange = (e) => { if (state.skeletonHelper) state.skeletonHelper.visible = e.target.checked; };
		$('wire').onchange = applyWireframe;
		$('rotate').onchange = (e) => { controls.autoRotate = e.target.checked; };
		addEventListener('keydown', (e) => {
			if (e.target.tagName === 'SELECT') return;
			const i = Number(e.key) - 1;
			if (state.clips[i]) play(state.clips[i].name);
			if (e.code === 'Space') { e.preventDefault(); $('pause').checked = !$('pause').checked; }
		});

		addEventListener('resize', () => {
			camera.aspect = innerWidth / innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(innerWidth, innerHeight);
		});

		const clock = new THREE.Clock();
		renderer.setAnimationLoop(() => {
			const dt = clock.getDelta();
			if (state.mixer && !$('pause').checked) state.mixer.update(dt * Number($('speed').value));
			const action = state.current && state.actions[state.current];
			if (action) {
				const d = action.getClip().duration;
				const t = Math.min(action.time, d);
				$('progress').firstElementChild.style.width = `${(t / d) * 100}%`;
				$('status').textContent = `${state.current}: ${t.toFixed(2)} / ${d.toFixed(2)} с`;
			}
			controls.update();
			renderer.render(scene, camera);
		});

		loadProcedural();
	</script>
</body>
</html>
