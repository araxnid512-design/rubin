// bass, alternate bass, upper strings
const CHORDS = {
  Am: [45, 52, [57, 60, 64]], Dm: [50, 45, [57, 62, 65]], E: [40, 47, [56, 59, 64]],
  G: [43, 50, [55, 59, 62]], C: [48, 43, [55, 60, 64]], F: [41, 48, [57, 60, 65]],
  Em: [40, 47, [55, 59, 64]], B7: [47, 42, [57, 59, 63]], D: [50, 45, [57, 62, 66]]
};
const PC = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 };
const midiOf = s => { const m = /^([a-g])(#?)(\d)$/.exec(s); return 12 * (+m[3] + 1) + PC[m[1]] + (m[2] ? 1 : 0); };
const hz = m => 440 * Math.pow(2, (m - 69) / 12);

const VOWEL = { 'а': 'a', 'я': 'a', 'о': 'o', 'ё': 'o', 'у': 'u', 'ю': 'u', 'э': 'e', 'е': 'e', 'и': 'i', 'ы': 'y' };

function syllables(text) {
  const out = []; let from = 0;
  for (let i = 0; i < text.length; i++) {
    const v = VOWEL[text[i].toLowerCase()];
    if (!v) continue;
    const onset = text.slice(from, i).toLowerCase();
    let cons = '';
    if (/[сзц]/.test(onset)) cons = 's'; else if (/[шщчж]/.test(onset)) cons = 'sh';
    else if (/[хф]/.test(onset)) cons = 'h'; else if (/[ткп]/.test(onset)) cons = 't';
    else if (/[а-яё]/.test(onset)) cons = 'm';
    out.push({ v, cons, from, to: i + 1 }); from = i + 1;
  }
  if (out.length) out[out.length - 1].to = text.length;
  return out;
}

const CAST = [
  { name: 'Струна', fs: 1.0, pan: -.25, vib: 5.3, det: -4, oct: 0, jacket: 0x4b5235, pants: 0x2c2f26, hat: 'cap',
    say: ['Сейчас ещё одну. Душевную.', 'Третья струна опять поплыла…', 'Подпевай, не стесняйся.'] },
  { name: 'Седой', fs: .88, pan: .3, vib: 4.7, det: 3, oct: -1, jacket: 0x3a3c40, pants: 0x25262a, hat: 'beard',
    say: ['Эх, молодёжь… Тяни ноту, тяни.', 'Двадцать лет хожу. Костёр — лучшее, что тут есть.', 'Тихо сегодня. Хорошая ночь.'] },
  { name: 'Малой', fs: 1.09, pan: -.05, vib: 5.8, det: 6, oct: 0, jacket: 0x6a5a34, pants: 0x30332a, hat: 'beanie',
    say: ['А я все слова знаю!', 'Первая ходка — и сразу с хабаром.', 'Можно мне потом гитару?'] },
  { name: 'Док', fs: .97, pan: .15, vib: 5.0, det: -7, oct: 0, jacket: 0x4f4a3e, pants: 0x2a2a24, hat: 'panama',
    say: ['Чай закипает. Кружку подставляй.', 'Гармошка у меня ещё дедова.', 'Ноги в тепле держи, вот и вся медицина.'] },
  { name: 'Леший', fs: .93, pan: -.35, vib: 4.9, det: 2, oct: 0, jacket: 0x33402f, pants: 0x232820, hat: 'hood',
    say: ['Слышишь? Лес подпевает.', 'Тропу я знаю. Утром выведу.', 'Огонь не трожь зря, он живой.'] }
];
const HARP = 3, GUITAR = 0, BASS = 1;

/* ================= Audio ================= */
let ctx = null, master, reverb, noiseBuf;
let song = null;          // current playback: { bus, voices, harp, queue, qi, tl, t0, spb, end, idx }
let userPaused = false, flare = 0;

function initAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = .01; comp.release.value = .25;
  master = ctx.createGain(); master.gain.value = .9; master.connect(comp); comp.connect(ctx.destination);

  noiseBuf = ctx.createBuffer(1, sr * 2, sr);
  const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3.2); }

  const rg = ctx.createGain(); rg.gain.value = .2; reverb.connect(rg); rg.connect(master);
  ambience();
}
const G = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
function filt(type, f, q) { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q) b.Q.value = q; return b; }
function panTo(node, p, dest) {
  if (ctx.createStereoPanner) { const s = ctx.createStereoPanner(); s.pan.value = p; node.connect(s); s.connect(dest); }
  else node.connect(dest);

function noiseLoop() { const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.start(0, Math.random() * 1.5); return s; }

function ambience() {
  // fire bed
  const bed = noiseLoop(), bf = filt('lowpass', 260), bg = G(.09); bed.connect(bf); bf.connect(bg); bg.connect(master);
  // wind in the pines

function makeVoice(bus, c) {
  const o = ctx.createOscillator(); o.type = 'sawtooth'; o.detune.value = c.det; o.frequency.value = 180;

    note(t, midi, v, cons, level) {
      const f = hz(midi), fm = FORMANT[v];

      env.gain.setTargetAtTime(level * (cons ? .05 : .5), t - .055, .013);
      env.gain.setTargetAtTime(level, t, .03);

        const s = ctx.createBufferSource(); s.buffer = noiseBuf;

      }
    },
    off(t) { env.gain.setTargetAtTime(0, t, .06); },
    stop() { try { o.stop(); l.stop(); } catch (e) {} }
  };
}

function makeHarp(bus) {
  const a = ctx.createOscillator(), b = ctx.createOscillator(); a.type = b.type = 'square'; b.detune.value = 9;

  a.start(); b.start(); trem.start();
