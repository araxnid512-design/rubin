<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Enemy Check</title>
	<style>
		:root { --bg: #1b201c; --text: #dfe6d8; }
		html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px system-ui, sans-serif; overflow: hidden; }
		#ui { position: fixed; top: 8px; left: 8px; z-index: 2; background: rgba(0,0,0,.5); padding: 6px 8px; border-radius: 8px; }
		#labels { position: fixed; bottom: 6px; left: 0; right: 0; display: flex; justify-content: space-around; opacity: .7; }
	</style>
	<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
</head>
<body>
	<!-- Заражённые игры крупно: четыре вида (спереди, сбоку, сзади, камера игры). ?id=ruber&clip=Charge&t=0.3 -->
	<div id="ui"><select id="id"></select> <select id="clip"></select> <input id="t" type="range" min="0" max="1" step="0.01" value="0"> <span id="tv"></span></div>
	<div id="labels"><span>спереди</span><span>сбоку (справа)</span><span>сзади</span><span>камера игры</span></div>
	<script type="module">
		import * as THREE from 'three';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

		const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
		renderer.setPixelRatio(devicePixelRatio);
		renderer.setSize(innerWidth, innerHeight);
		renderer.setScissorTest(true);
		renderer.toneMapping = THREE.ACESFilmicToneMapping;
		document.body.appendChild(renderer.domElement);
		const scene = new THREE.Scene();
		scene.background = new THREE.Color(0x2a302b);
		scene.add(new THREE.HemisphereLight(0xffffff, 0x445544, 2.0));
		const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(2, 4, 3); scene.add(sun);
		scene.add(new THREE.GridHelper(4, 8, 0x556655, 0x3a443a));
		// для масштаба — силуэт человека 1.8 м (как герой)
		const ruler = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.8, 12), new THREE.MeshBasicMaterial({ color: 0x8aa0c0, wireframe: true }));
		ruler.position.set(-1.1, 0.9, 0);
		scene.add(ruler);

		const qs = new URLSearchParams(location.search);
		const ids = ['runner', 'stomper', 'ruber'];
		const selId = document.getElementById('id'), sel = document.getElementById('clip');
		for (const id of ids) selId.add(new Option(id, id));
		selId.value = qs.get('id') || 'ruber';
		const loader = new GLTFLoader();
		const gltfs = {};
		let model = null, mixer = null, gltf = null;
		async function load(id) {
			gltfs[id] ??= await loader.loadAsync(`../models/game/${id}.glb`);
			if (model) scene.remove(model);
			gltf = gltfs[id];
			model = gltf.scene;
			scene.add(model);
			mixer = new THREE.AnimationMixer(model);
			sel.innerHTML = '';
			for (const c of gltf.animations) sel.add(new Option(c.name, c.name));
		}
		await load(selId.value);
		sel.value = qs.get('clip') || 'Idle';
		document.getElementById('t').value = qs.get('t') || 0;

		const cams = [
			[new THREE.PerspectiveCamera(30, 1, 0.1, 50), [0, 1.3, 5.2]],
			[new THREE.PerspectiveCamera(30, 1, 0.1, 50), [-5.2, 1.3, 0]],
			[new THREE.PerspectiveCamera(30, 1, 0.1, 50), [1.2, 1.8, -5.0]],
			[new THREE.PerspectiveCamera(42, 1, 0.1, 50), [0, 6.5, 4.9]],
		];
		window.pose = async (id, clipName, t) => {
			if (gltf !== gltfs[id]) await load(id);
			const clip = gltf.animations.find((c) => c.name === clipName) ?? gltf.animations[0];
			mixer.stopAllAction();
			mixer.clipAction(clip).play();
			mixer.setTime(Math.min(clip.duration - 1e-3, t * clip.duration));
			model.updateMatrixWorld(true);
			const w = innerWidth / cams.length, h = innerHeight;
			cams.forEach(([cam, p], i) => {
				cam.aspect = w / h; cam.updateProjectionMatrix();
				const target = new THREE.Vector3(0, i === 3 ? 0.8 : 1.05, 0);
				cam.position.set(...p); cam.lookAt(target);
				renderer.setViewport(i * w, 0, w, h); renderer.setScissor(i * w, 0, w, h);
				renderer.render(scene, cam);
			});
			document.getElementById('tv').textContent = `${id} · ${clip.name} ${(t * clip.duration).toFixed(2)} с`;
		};
		const redraw = () => pose(selId.value, sel.value, +document.getElementById('t').value);
		selId.onchange = async () => { await load(selId.value); redraw(); };
		sel.onchange = redraw; document.getElementById('t').oninput = redraw;
		await redraw();
		window.ready = true;
	</script>
</body>
</html>
