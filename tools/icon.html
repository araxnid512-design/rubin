<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<title>Game Icon</title>
	<style>body { margin: 0; background: #222; }</style>
	<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
</head>
<body>
	<!-- Иконка игры из её же моделей: выживший с АК-74 крупным планом в контровом свете на фоне рыжей
	     мути Улья с силуэтами заражённых. Слои для адаптивной иконки Android (фон, передний план,
	     монохромный силуэт) и обычная иконка; сохраняет scripts/render-icon.mjs в godot/icons/. -->
	<script type="module">
		import * as THREE from 'three';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
		import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
		import { WEAPONS } from '../game/weapons.js';

		const S = 864; // рендер вдвое крупнее 432 — потом уменьшаем, края мягче
		const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
		r.setPixelRatio(1);
		r.setSize(S, S);
		r.toneMapping = THREE.ACESFilmicToneMapping;
		r.toneMappingExposure = 1.15;
		r.outputColorSpace = THREE.SRGBColorSpace;
		document.body.appendChild(r.domElement);
		const pmrem = new THREE.PMREMGenerator(r);
		const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

		const loader = new GLTFLoader();
		const load = (n) => loader.loadAsync(`../models/game/${n}.glb`);
		const [player, runner, stomper] = await Promise.all(['player', 'runner', 'stomper'].map(load));
		const pose = (g, clipName, t) => {
			const m = SkeletonUtils.clone(g.scene);
			m.traverse((o) => { if (o.isMesh) o.frustumCulled = false; });
			const clip = g.animations.find((c) => c.name === clipName) ?? g.animations[0];
			const mixer = new THREE.AnimationMixer(m);
			mixer.clipAction(clip).play();
			mixer.setTime(t * clip.duration);
			return m;
		};

		// ---------- передний план: выживший с автоматом ----------
		const fg = new THREE.Scene();
		fg.environment = envTex;
		fg.environmentIntensity = 0.35;
		const hero = pose(player, 'AimRifle', 0.4);
		hero.getObjectByName('GripR')?.add(WEAPONS.ak74.make());
		hero.rotation.y = 0.75; // в три четверти к нам, ствол — вправо вперёд
		fg.add(hero);
		fg.add(new THREE.HemisphereLight(0x9fb4c8, 0x2a2420, 0.9));
		const key = new THREE.DirectionalLight(0xffe0c0, 1.9); key.position.set(1.5, 2.6, 3.4); fg.add(key);
		// контровой тёплый свет мути — сзади слева: светлый край по силуэту
		const rim = new THREE.DirectionalLight(0xff8a3c, 5.5); rim.position.set(-3, 2.2, -3.5); fg.add(rim);
		const rim2 = new THREE.DirectionalLight(0xffb070, 2.5); rim2.position.set(3, 1.5, -3); fg.add(rim2);
		const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
		cam.position.set(-0.25, 1.55, 3.0);
		cam.lookAt(0.12, 1.3, 0);

		// ---------- фон: рыжая муть, солнце сквозь дымку, силуэты заражённых ----------
		const bg = new THREE.Scene();
		const sky = document.createElement('canvas'); sky.width = sky.height = 512;
		const sx = sky.getContext('2d');
		const g1 = sx.createLinearGradient(0, 0, 0, 512);
		g1.addColorStop(0, '#2a1410'); g1.addColorStop(0.45, '#8a3418'); g1.addColorStop(0.7, '#d9742c'); g1.addColorStop(1, '#3a1a10');
		sx.fillStyle = g1; sx.fillRect(0, 0, 512, 512);
		const sun = sx.createRadialGradient(340, 300, 4, 340, 300, 220);
		sun.addColorStop(0, 'rgba(255,226,170,0.95)'); sun.addColorStop(0.2, 'rgba(255,170,90,0.55)'); sun.addColorStop(1, 'rgba(255,120,40,0)');
		sx.fillStyle = sun; sx.fillRect(0, 0, 512, 512);
		// споры в воздухе
		for (let i = 0; i < 90; i++) { sx.fillStyle = `rgba(255,${190 + Math.random() * 50 | 0},120,${(Math.random() * 0.5).toFixed(2)})`; sx.beginPath(); sx.arc(Math.random() * 512, Math.random() * 512, 0.8 + Math.random() * 2.2, 0, 7); sx.fill(); }
		bg.background = new THREE.CanvasTexture(sky);
		bg.background.colorSpace = THREE.SRGBColorSpace;
		const dark = new THREE.MeshBasicMaterial({ color: 0x140806 });
		const silhouette = (m) => { m.traverse((o) => { if (o.isMesh) o.material = dark; }); return m; };
		for (const [g, clip, x, z, ry, t] of [[runner, 'Walk', -1.3, -4, 0.4, 0.2], [stomper, 'Walk', 0.9, -5.5, -0.3, 0.6], [runner, 'Run', 2.2, -4.6, -0.6, 0.4], [runner, 'Idle', -2.6, -6.5, 0.8, 0.1]]) {
			const z0 = silhouette(pose(g, clip, t));
			z0.position.set(x, 0, z); z0.rotation.y = ry;
			bg.add(z0);
		}
		// земля и силуэты домов/столбов на горизонте
		const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshBasicMaterial({ color: 0x1a0c08 }));
		ground.rotation.x = -Math.PI / 2; bg.add(ground);
		for (const [x, w, h] of [[-5, 2.6, 1.8], [-2.2, 1.8, 1.3], [3.5, 2.8, 2.2], [6, 1.6, 1.2]]) {
			const house = new THREE.Mesh(new THREE.BoxGeometry(w, h, 1), dark); house.position.set(x, h / 2, -11); bg.add(house);
			const roof = new THREE.Mesh(new THREE.ConeGeometry(w * 0.75, h * 0.6, 4), dark); roof.position.set(x, h + h * 0.3, -11); roof.rotation.y = Math.PI / 4; bg.add(roof);
		}
		const pole = new THREE.Mesh(new THREE.BoxGeometry(0.12, 5, 0.12), dark); pole.position.set(-3.8, 2.5, -8); bg.add(pole);
		bg.fog = new THREE.Fog(0xb8582a, 4, 14);
		const bgCam = new THREE.PerspectiveCamera(40, 1, 0.1, 80);
		bgCam.position.set(0.3, 1.3, 2.5);
		bgCam.lookAt(0.3, 1.2, -4);

		const toCanvas = () => { const c = document.createElement('canvas'); c.width = c.height = S; c.getContext('2d').drawImage(r.domElement, 0, 0); return c; };
		r.setClearColor(0x000000, 0);
		r.render(bg, bgCam); const bgC = toCanvas();
		r.clear(); r.render(fg, cam); const fgC = toCanvas();

		const out = (src, size) => { const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(src, 0, 0, size, size); return c; };
		// обычная иконка: фон + выживший + виньетка + значок «17»
		const main = document.createElement('canvas'); main.width = main.height = S;
		const mx = main.getContext('2d');
		mx.drawImage(bgC, 0, 0); mx.drawImage(fgC, 0, 0);
		const vig = mx.createRadialGradient(S / 2, S / 2, S * 0.3, S / 2, S / 2, S * 0.72);
		vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.55)');
		mx.fillStyle = vig; mx.fillRect(0, 0, S, S);
		const badge = (ctx, cx, cy, rr) => {
			ctx.fillStyle = '#9c1c12'; ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 7); ctx.fill();
			ctx.lineWidth = rr * 0.12; ctx.strokeStyle = '#f0d9a8'; ctx.stroke();
			ctx.fillStyle = '#f6ead0'; ctx.font = `900 ${rr * 1.05}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
			ctx.fillText('17', cx, cy + rr * 0.06);
		};
		badge(mx, S * 0.8, S * 0.8, S * 0.11);
		// передний план адаптивной иконки — со значком, в безопасной зоне (центральные ~66%)
		const fgA = document.createElement('canvas'); fgA.width = fgA.height = S;
		const fx = fgA.getContext('2d');
		fx.drawImage(fgC, S * 0.19, S * 0.2, S * 0.62, S * 0.62);
		badge(fx, S * 0.64, S * 0.66, S * 0.07);
		// монохромная (тематическая иконка Android 13+): белый силуэт выжившего
		const mono = document.createElement('canvas'); mono.width = mono.height = S;
		const mo = mono.getContext('2d');
		mo.drawImage(fgC, S * 0.19, S * 0.2, S * 0.62, S * 0.62);
		mo.globalCompositeOperation = 'source-in'; mo.fillStyle = '#ffffff'; mo.fillRect(0, 0, S, S);
		window.icons = () => ({
			icon512: out(main, 512).toDataURL('image/png'),
			icon192: out(main, 192).toDataURL('image/png'),
			fg432: out(fgA, 432).toDataURL('image/png'),
			bg432: out(bgC, 432).toDataURL('image/png'),
			mono432: out(mono, 432).toDataURL('image/png'),
		});
		window.ready = true;
	</script>
</body>
</html>
