<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Icon Check</title>
	<style>
		:root { --bg: #1b201c; --text: #dfe6d8; --cell: #2a312b; }
		body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 13px system-ui, sans-serif; }
		.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
		figure { margin: 0; text-align: center; }
		img { display: block; background: var(--cell); border-radius: 10px; }
		.round { border-radius: 50%; }
	</style>
	<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
</head>
<body>
	<!-- Проверка иконок предметов и портретов героя (game/icons.js) -->
	<div class="row" id="out"></div>
	<script type="module">
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import { createIconFactory } from '../game/icons.js';
		import { WEAPONS } from '../game/weapons.js';
		import { BAG_ORDER } from '../game/items.js';
		const gltf = await new GLTFLoader().loadAsync('../models/game/player.glb');
		const icons = createIconFactory();
		const add = (src, label, cls = '') => {
			const f = document.createElement('figure');
			f.innerHTML = `<img class="${cls}" src="${src}"><figcaption>${label}</figcaption>`;
			document.getElementById('out').appendChild(f);
		};
		add(icons.portrait(gltf), 'портрет', 'round');
		for (const [k, w] of Object.entries(WEAPONS)) add(icons.weapon(k), w.name);
		for (const k of BAG_ORDER) add(icons.item(k), k);
		add(icons.figure(gltf, { melee: 'axe', gun: 'pistol' }, 'melee'), 'с топором');
		add(icons.figure(gltf, { melee: 'fireaxe', gun: 'obrez' }, 'gun'), 'с обрезом');
		add(icons.figure(gltf, { melee: 'axe', gun: 'aks' }, 'gun'), 'с автоматом');
		add(icons.figure(gltf, { melee: 'axe', gun: 'aks' }, 'melee'), 'автомат за спиной');
		window.ready = true;
	</script>
</body>
</html>
