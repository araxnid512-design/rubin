<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#222}canvas{width:100%;height:100%;display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { Renderer, RenderObject } from '../engine/renderer.js';
import { MeshBuilder, MAT } from '../engine/mesh.js';
import { Camera } from '../engine/camera.js';
import { V3, M3, Xf, RNG } from '../engine/math.js';
import { noiseTexture } from '../engine/noise.js';
const r = new Renderer(document.getElementById('c'));
r.noiseTex = r.texture(noiseTexture(256, 4, 1337), 256, 256, { format: 'r' });
r.detailTex = r.texture(noiseTexture(256, 16, 4242, 3), 256, 256, { format: 'r' });
const splat = new Uint8Array(64 * 64 * 4); for (let i = 0; i < 64 * 64; i++) { splat[i * 4 + 1] = 120; splat[i * 4 + 2] = (i % 64) > 28 && (i % 64) < 36 ? 255 : 0; }
r.splatTex = r.texture(splat, 64, 64, { mip: false, repeat: false });
const g = new MeshBuilder(); g.quad(new V3(-50, 0, -50), new V3(-50, 0, 50), new V3(50, 0, 50), new V3(50, 0, -50), [1, 1, 1, 0], new V3(0, 1, 0));
r.add(new RenderObject(r.createMesh(g.data()), 'ground')).shadow = false;
const mb = new MeshBuilder(); const rng = new RNG(3);
mb.addBox(new Xf(M3.ry(0.4), new V3(0, 1.5, 0)), new V3(4, 3, 2), [0.6, 0.58, 0.54, MAT.CONCRETE]);
mb.addCyl(new Xf(new M3(), new V3(5, 0, 2)), 0.3, 0.3, 0.9, 10, [0.3, 0.36, 0.25, MAT.PAINT]);
mb.addBlob(new V3(-5, 1, 3), new V3(1.5, 1, 1.5), [0.3, 0.4, 0.16, MAT.FOLIAGE], rng);
mb.beam(new V3(-3, 0, 6), new V3(3, 2, 6), 0.2, 0.2, [0.4, 0.24, 0.13, MAT.RUST]);
r.add(new RenderObject(r.createMesh(mb.data()), 'world'));
const cam = new Camera(); cam.pos = new V3(0, 14, 16); cam.target = new V3(0, 0, 0); cam.focus = new V3();
r.lights.push({ pos: new V3(5, 1.5, 2), range: 8, color: [1, 0.5, 0.2], energy: 2 });
function frame() { cam.update(innerWidth / innerHeight); r.fxBillboard(new V3(5, 1.6, 2), 0.8, [1, 0.6, 0.2, 1]); r.render(cam); window.__frames = (window.__frames || 0) + 1; requestAnimationFrame(frame); }
frame();
window.__ok = true;
</script></body></html>
