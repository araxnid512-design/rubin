<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#999;font-family:sans-serif}canvas{width:100%;height:100%;display:block}
#lab{position:fixed;inset:0;pointer-events:none}#lab div{position:absolute;transform:translate(-50%,0);font-size:12px;color:#111;background:rgba(255,255,255,.7);padding:1px 4px;border-radius:3px;white-space:nowrap}
#title{position:fixed;left:10px;top:6px;font-size:20px;font-weight:bold;color:#111}</style></head>
<body><canvas id="c"></canvas><div id="lab"></div><div id="title"></div>
<script type="module">
// Лист поз: 20 поз для выбранного оружия (?w=ak74) или все 20 видов оружия в одной позе (?all=aim).
import { Renderer, RenderObject } from '../engine/renderer.js';
import { MeshBuilder, MAT } from '../engine/mesh.js';
import { Camera } from '../engine/camera.js';
import { V3, M3, Xf } from '../engine/math.js';
import { noiseTexture } from '../engine/noise.js';
import { HumanRig } from '../game/rig_human.js';
import { WEAPONS, weapon } from '../game/items.js';
const r = new Renderer(document.getElementById('c'));
r.noiseTex = r.texture(noiseTexture(256, 4, 1337), 256, 256, { format: 'r' });
r.detailTex = r.texture(noiseTexture(256, 16, 4242, 3), 256, 256, { format: 'r' });
r.env.fog = [0.6, 0.6, 0.6]; r.env.clear = [0.6, 0.6, 0.6]; r.fogStart = 200; r.fogEnd = 400;
r.env.sunDir = new V3(0.45, 0.8, 0.55).norm();
const g = new MeshBuilder(); g.addBox(new Xf(new M3(), new V3(0, -0.05, 0)), new V3(80, 0.1, 80), [0.55, 0.55, 0.53, MAT.CONCRETE]);
const gro = r.add(new RenderObject(r.createMesh(g.data()), 'world')); gro.cutout = false;
const POSES = [['01', 'Стойка', 'idle'], ['02', 'Низкая готовность', 'low'], ['03', 'Оружие опущено', 'carry'], ['04', 'Прицел', 'aim'], ['05', 'Прицел в движении', 'aim_strafe'],
  ['06', 'Осмотр влево', 'look_l'], ['07', 'Осмотр вправо', 'look_r'], ['08', 'Взгляд вниз', 'look_d'], ['09', 'Шаг 1', 'walk0'], ['10', 'Шаг 2', 'walk1'],
  ['11', 'Шаг 3', 'walk2'], ['12', 'Шаг 4', 'walk3'], ['13', 'Выстрел (отдача)', 'fire'], ['14', 'Прицел влево', 'aim_left'], ['15', 'Шаг назад с прицелом', 'aim_back'],
  ['16', 'Перезарядка: извлечение', 'rel1'], ['17', 'Перезарядка: новый боезапас', 'rel2'], ['18', 'Перезарядка: досылание', 'rel3'], ['19', 'Осмотр оружия', 'inspect'], ['20', 'Стойка (возврат)', 'idle2']];
const q = new URLSearchParams(location.search);
const rigs = [];
function sim(o, t) { const dt = 1 / 30; const n = Math.round(t / dt); for (let i = 0; i < n; i++) { o.pos = o.pos.add(o.rig.velocity.mul(dt)); o.rig.update(dt, new Xf(new M3(), o.pos)); } }
function pose(code, wid, x, z) {
  const rig = new HumanRig(r, { head: 'helmet', headset: true, backpack: true, armband: true });
  rig.setWeapon(wid); const o = { rig, pos: new V3(x, 0, z) }; const w = weapon(wid);
  rig.holdState = 'idle'; rig.aimDir = new V3(0, 0, -1);
  switch (code) {
    case 'idle': case 'idle2': sim(o, code === 'idle' ? 1 : 2.3); break;
    case 'low': rig.holdState = 'low'; sim(o, 1); break;
    case 'carry': rig.holdState = 'carry'; sim(o, 1); break;
    case 'aim': rig.aiming = true; sim(o, 1); break;
    case 'aim_strafe': rig.aiming = true; rig.velocity = new V3(-1.3, 0, 0); sim(o, 1.13); break;
    case 'aim_left': rig.aiming = true; rig.aimDir = new V3(-0.6, 0, -0.8).norm(); sim(o, 1); break;
    case 'aim_back': rig.aiming = true; rig.velocity = new V3(0, 0, 1.2); sim(o, 1.2); break;
    case 'fire': rig.aiming = true; sim(o, 1); rig.onFire(); sim(o, 0.034); break;
    case 'look_l': rig.holdState = 'low'; rig.lookBias = 0.9; sim(o, 1); break;
    case 'look_r': rig.holdState = 'low'; rig.lookBias = -0.9; sim(o, 1); break;
    case 'look_d': rig.holdState = 'low'; rig.lookAt = o.pos.add(new V3(0.3, 0, -1.2)); sim(o, 1); break;
    case 'walk0': case 'walk1': case 'walk2': case 'walk3': {
      rig.holdState = 'low'; rig.velocity = new V3(0, 0, -1.6); sim(o, 1.2);
      const target = [0, 0.25, 0.5, 0.75][+code.slice(-1)]; let guard = 0;
      while (Math.abs(rig.phase - target) > 0.04 && guard++ < 200) sim(o, 1 / 30);
      break;
    }
    case 'rel1': case 'rel2': case 'rel3': rig.holdState = 'low'; sim(o, 0.6); rig.play('reload', w.reload_time); sim(o, w.reload_time * { rel1: 0.25, rel2: 0.5, rel3: 0.78 }[code]); break;
    case 'inspect': rig.holdState = 'low'; sim(o, 0.6); rig.play('inspect', 2.2); sim(o, 2.2 * 0.45); break;
  }
  // возвращаем персонажа на его клетку листа (вместе со стопами, закреплёнными в мире)
  const d = new V3(x, 0, z).sub(o.pos); o.pos = o.pos.add(d);
  for (const f of rig.feet) for (const k of ['pos', 'cur', 'from', 'to']) f[k] = f[k].add(d);
  if (rig.lookAt) rig.lookAt = rig.lookAt.add(d);
  rig.update(0.0001, new Xf(new M3(), o.pos));
  o.rig.velocity = new V3(); rig.update = () => {}; rigs.push(o); return o;
}
const labels = [];
const all = q.get('all');
const ids = Object.keys(WEAPONS);
const COLS = 5, DX = 2.2, DZ = 2.6;
if (all) {
  ids.forEach((id, i) => { const x = (i % COLS - 2) * DX, z = Math.floor(i / COLS) * DZ - 4; pose(all, id, x, z); labels.push([new V3(x, 0, z + 0.55), WEAPONS[id].name]); });
  document.getElementById('title').textContent = 'Все 20 видов оружия — поза: ' + all;
} else {
  const wid = q.get('w') || 'ak74';
  POSES.forEach(([n, name, code], i) => { const x = (i % COLS - 2) * DX, z = Math.floor(i / COLS) * DZ - 4; pose(code, wid, x, z); labels.push([new V3(x, 0, z + 0.55), n + ' ' + name]); });
  document.getElementById('title').textContent = WEAPONS[wid].name + ' — хват «' + weapon(wid).hold + '», перезарядка «' + weapon(wid).reload + '»';
}
const cam = new Camera(); cam.fov = 30 * Math.PI / 180;
const yaw = +(q.get('yaw') || 0.55);
const zoom = +(q.get('zoom') || 1), fx = +(q.get('fx') || 0), fz = +(q.get('fz') || -0.2);
window.setView = (yw) => { const c = new V3(fx, 0.6, fz); cam.pos = c.add(new V3(Math.sin(yw) * 13 / zoom, 9.5 / zoom, Math.cos(yw) * 13 / zoom)); cam.target = c; cam.focus = c; };
setView(yaw);
const lab = document.getElementById('lab');
const divs = labels.map(([p, t]) => { const d = document.createElement('div'); d.textContent = t; lab.appendChild(d); return d; });
function frame() {
  cam.update(innerWidth / innerHeight); r.setCamera(cam); r.shadowDist = 14; r.render(cam);
  labels.forEach(([p], i) => { const s = cam.project(p, innerWidth, innerHeight); if (s) { divs[i].style.left = s.x + 'px'; divs[i].style.top = s.y + 'px'; } });
  requestAnimationFrame(frame);
}
frame();
window.__ready = true;
</script></body></html>
