<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#222}canvas{width:100%;height:100%;display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { Renderer } from '../engine/renderer.js';
import { Camera } from '../engine/camera.js';
import { V3 } from '../engine/math.js';
import { GameWorld } from '../game/world.js';
const r = new Renderer(document.getElementById('c'));
const settings = { drawDistance: 140, grassDensity: 1, lights: true };
const w = new GameWorld(r, settings);
const cam = new Camera();
window.view = (px, py, pz, tx, ty, tz, far = 220) => { cam.pos = new V3(px, py, pz); cam.target = new V3(tx, ty, tz); cam.focus = new V3(tx, 0, tz); cam.far = far; r.uniforms.playerPos = new V3(0, -50, 0); };
view(0, 22, 4, 0, 0, -16);
const t0 = performance.now();
await w.build((p, t) => console.log('progress', p, t));
console.log('BUILD MS', Math.round(performance.now() - t0), JSON.stringify(w.stats), 'nav blocked', w.nav.blocked.reduce((a, b) => a + b, 0));
const pt = performance.now(); const path = w.nav.findPath(new V3(0, 0, 96), new V3(0, 0, -39)); console.log('PATH', path.length, path.reached, Math.round(performance.now() - pt), 'ms', JSON.stringify(path.map(p => [p.x, p.z])));
function frame() { cam.update(innerWidth / innerHeight); r.setCamera(cam); w.update(1 / 60); r.render(cam); window.__drawCalls = r.stats.drawCalls; window.__tris = r.stats.tris; requestAnimationFrame(frame); }
frame();
window.__ready = true; window.__world = w; window.__r = r;
</script></body></html>
