<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Weapon Check</title>
	<style>
		:root { --bg: #1b201c; --text: #dfe6d8; --cell: #39413a; }
		body { margin: 0; padding: 12px; background: var(--bg); color: var(--text); font: 13px system-ui, sans-serif; }
		.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 10px; }
		figure { margin: 0; text-align: center; }
		img { display: block; background: var(--cell); border-radius: 8px; }
	</style>
	<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
</head>
<body>
	<!-- Проверка моделей оружия (game/weapons.js): ?ids=scar,aug — вид справа с сеткой 10 см (ствол вправо),
	     вид сверху-сбоку и герой с оружием в руке (поза клипа из models/game/player.glb, хват — узел GripR).
	     &zoom=2 — вдвое крупнее, &hands=0 — без героя. Снимок страницы делают через Playwright. -->
	<div id="out"></div>
	<script type="module">
		import * as THREE from 'three';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
		import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
		import { WEAPONS, CLIPS } from '../game/weapons.js';

		const q = new URLSearchParams(location.search);
		const ids = (q.get('ids') ?? 'ak74,scar,fnfal,aug,pm63,spas12').split(',');
		const hands = q.get('hands') !== '0';
		const zoom = Number(q.get('zoom') ?? 1); // крупнее: ?zoom=2 — клетка 10 см вдвое больше
		const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
		r.setPixelRatio(1);
		r.toneMapping = THREE.ACESFilmicToneMapping;
		const scene = new THREE.Scene();
		scene.background = new THREE.Color(0x39413a);
		const pmrem = new THREE.PMREMGenerator(r);
		scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
		scene.environmentIntensity = 0.5;
		scene.add(new THREE.HemisphereLight(0xdfe6e0, 0x3a3a30, 1.0));
		const key = new THREE.DirectionalLight(0xfff2e0, 2.0);
		key.position.set(-3, 2, 4);
		const rim = new THREE.DirectionalLight(0xbcd8ff, 1.2);
		rim.position.set(3, 2, -3);
		scene.add(key, rim);
		const out = document.getElementById('out');
		let row = null;
		const add = (label, w, h, cam, extra = []) => {
			r.setSize(w, h, false);
			for (const o of extra) scene.add(o);
			r.render(scene, cam);
			for (const o of extra) scene.remove(o);
			const f = document.createElement('figure');
			f.innerHTML = `<img src="${r.domElement.toDataURL('image/png')}" width="${w}" height="${h}"><figcaption>${label}</figcaption>`;
			row.appendChild(f);
		};
		/** Сетка 10 см в плоскости YZ хвата (вид справа). */
		const grid = () => {
			const g = new THREE.GridHelper(2, 20, 0x667066, 0x4c544c);
			g.rotation.z = Math.PI / 2;
			g.position.x = 0.08;
			return g;
		};
		const gltf = hands ? await new GLTFLoader().loadAsync('../models/game/player.glb') : null;
		for (const id of ids) {
			const W = WEAPONS[id];
			if (!W) continue;
			row = document.createElement('div');
			row.className = 'row';
			out.appendChild(row);
			const g = W.make();
			// вид справа: ствол (−Y) — вправо, верх (+Z) — вверх; ортографическая камера, 1 м = 520 px
			const ortho = new THREE.OrthographicCamera(-0.8 / zoom, 0.8 / zoom, 0.3 / zoom, -0.3 / zoom, 0.01, 10);
			ortho.up.set(0, 0, 1);
			const cy = zoom > 1 ? -0.06 : -0.2;
			ortho.position.set(-3, cy, 0.04);
			ortho.lookAt(0, cy, 0.04);
			const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.012, 8, 6), new THREE.MeshBasicMaterial({ color: 0xff3020 }));
			if (g.userData.muzzle) muzzle.position.copy(g.userData.muzzle);
			const fist = new THREE.Mesh(new THREE.SphereGeometry(0.01, 8, 6), new THREE.MeshBasicMaterial({ color: 0x20c0ff }));
			scene.add(g);
			add(`${W.name} (${id}) — справа, клетка 10 см; красное — Muzzle, голубое — центр кулака`, 832, 312, ortho, [grid(), muzzle, fist]);
			// три четверти сверху и слева
			const persp = new THREE.PerspectiveCamera(30, 1.6, 0.01, 20);
			persp.up.set(0, 0, 1);
			persp.position.set(0.9, 0.45, 0.65);
			persp.lookAt(0, -0.2, 0.05);
			add('слева сверху', 400, 250, persp);
			scene.remove(g);
			if (!gltf) continue;
			// в руке: поза прицеливания и покоя
			for (const clipName of [CLIPS[W.anim].aim, CLIPS[W.anim].idle]) {
				const model = SkeletonUtils.clone(gltf.scene);
				const clip = gltf.animations.find((c) => c.name === clipName);
				if (clip) {
					const mixer = new THREE.AnimationMixer(model);
					mixer.clipAction(clip).play();
					mixer.setTime(Math.min(0.5, clip.duration * 0.5));
				}
				model.getObjectByName('GripR')?.add(W.make());
				model.updateMatrixWorld(true);
				const head = model.getObjectByName('mixamorigHead')?.getWorldPosition(new THREE.Vector3()) ?? new THREE.Vector3(0, 1.6, 0);
				const cam = new THREE.PerspectiveCamera(30, 0.9, 0.05, 20);
				cam.position.set(head.x - 2.4, 1.3, head.z + 1.1);
				cam.lookAt(head.x, 1.25, head.z + 0.25);
				add(clipName, 270, 300, cam, [model]);
			}
		}
		window.ready = true;
	</script>
</body>
</html>
