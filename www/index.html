<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Стикс: Дорога стабов</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="view"></canvas>

  <!-- HUD заезда -->
  <div id="hud">
    <div class="hud-row"><b id="h-speed">0</b><span>км/ч</span></div>
    <div class="hud-row"><b id="h-dist">0</b><span>м до стаба</span></div>
    <div class="hud-bar fuel" id="h-fuel-bar"><i id="h-fuel"></i><span>бензин <em id="h-fuel-v"></em></span></div>
    <div class="hud-bar hp"><i id="h-hp"></i><span>прочность</span></div>
    <div class="hud-bar nitro"><i id="h-nitro"></i><span>нитро</span></div>
  </div>
  <div id="loot">
    <span title="Спораны"><i class="ico sporan"></i><b id="h-sporan">0</b></span>
    <span title="Горох"><i class="ico peas"></i><b id="h-peas">0</b></span>
    <span title="Жемчуг"><i class="ico pearl"></i><b id="h-pearl">0</b></span>
    <span title="Убито"><i class="ico skull"></i><b id="h-kills">0</b></span>
  </div>
  <div id="hurt"></div>
  <div id="progress"><i id="p-best"></i><span id="p-car"></span></div>
  <div id="h-flip" class="hidden">Машина перевернулась…</div>
  <div id="toast" class="hidden"></div>

  <!-- Управление -->
  <button id="btn-brake" class="ctl left" aria-label="Тормоз / задний ход"><span>ТОРМОЗ</span></button>
  <button id="btn-nitro" class="ctl nitro" aria-label="Нитро"><span>НИТРО</span></button>
  <button id="btn-gas" class="ctl right" aria-label="Газ"><span>ГАЗ</span></button>

  <div id="menu" class="overlay">
    <div class="panel menu">
      <div class="logo">СТИКС</div>
      <div class="subtitle">Дорога стабов</div>
      <div class="wallet">
        <span><i class="ico sporan"></i><b id="m-sporans">0</b> споранов</span>
        <span><i class="ico peas"></i><b id="m-peas">0</b> горох</span>
        <span><i class="ico pearl"></i><b id="m-pearls">0</b> жемчуг</span>
      </div>
      <div id="m-levels"></div>
      <p class="muted small">Газ справа, тормоз и задний ход слева, нитро — синяя кнопка.
        В воздухе газ наклоняет машину назад, тормоз — вперёд.</p>
      <button id="m-reset" class="ghost">Сбросить прогресс</button>
    </div>
  </div>

  <div id="results" class="overlay hidden">
    <div class="panel results">
      <h1 id="r-title"></h1>
      <div id="r-table" class="facts"></div>
      <div class="total">Итого: <i class="ico sporan"></i><b id="r-total"></b></div>
      <button id="r-ok" class="primary">В стаб</button>
    </div>
  </div>

  <div id="pause" class="overlay hidden">
    <div class="panel">
      <h1>Пауза</h1>
      <button id="btn-resume" class="primary">Продолжить</button>
      <button id="btn-quit">Закончить заезд</button>
      <button id="btn-exit">Выйти из игры</button>
    </div>
  </div>

  <div id="rotate" class="overlay hidden">
    <div class="panel"><p>Поверните устройство горизонтально</p></div>
  </div>

  <script src="vendor/capacitor.js"></script>
  <script src="vendor/app.js"></script>
  <script src="vendor/status-bar.js"></script>
  <script src="vendor/screen-orientation.js"></script>
  <script src="vendor/planck.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/terrain.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/obstacles.js"></script>
  <script src="js/zombies.js"></script>
  <script src="js/pickups.js"></script>
  <script src="js/save.js"></script>
  <script src="js/run.js"></script>
  <script src="js/carDraw.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
