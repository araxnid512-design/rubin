<style>
/* Layout: a general's desk. Paper staff map on top (or left on wide screens), order book below (or right). */

body {
  background: var(--desk); color: var(--text); font-family: var(--f-body); font-size: 14px; line-height: 1.4;
  display: grid; grid-template-rows: auto minmax(220px, 46fr) 54fr; grid-template-columns: 100%;
  overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
h2, h3 { font-family: var(--f-head); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin: 0; }
h2 { font-size: 18px; } h3 { font-size: 13px; color: var(--dim); margin-top: 16px; margin-bottom: 6px; }

#hud {
  display: flex; align-items: center; gap: 10px; padding: 8px var(--gr) 8px var(--gl);
  border-bottom: 1px solid var(--rule); background: var(--panel);
}
#res { display: flex; gap: 12px; flex: 1; min-width: 0; flex-wrap: wrap; row-gap: 2px; }
.cell { display: flex; flex-direction: column; }
.cell small { font-family: var(--f-head); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); line-height: 1.2; }
.cell b { font-family: var(--f-mono); font-weight: 400; font-size: 15px; font-variant-numeric: tabular-nums; }
#speed { display: flex; border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; flex: none; }

#stage { position: relative; min-height: 0; background: #b9af8a; }

#toast {
  position: absolute; left: var(--gl); right: var(--gr); bottom: 10px; margin: 0 auto; width: fit-content; max-width: calc(100% - 32px);
  background: rgba(26, 28, 22, .92); border-left: 3px solid var(--brass); padding: 7px 12px; font-size: 13px;
  opacity: 0; transition: opacity .3s; pointer-events: none;
}
#toast.bad { border-color: var(--red); } #toast.good { border-color: var(--ok); } #toast.on { opacity: 1; }

#panel { min-height: 0; display: flex; flex-direction: column; background: var(--panel); border-top: 1px solid var(--rule); }
#tabs { display: flex; border-bottom: 1px solid var(--rule); padding: 0 var(--gr) 0 var(--gl); gap: 4px; flex: none; }

#body { flex: 1; overflow-y: auto; min-height: 0; padding: 12px var(--gr) calc(env(safe-area-inset-bottom, 0px) + 20px) var(--gl); }

}

.card { border-top: 1px solid var(--rule); padding: 9px 0; display: flex; justify-content: space-between; gap: 10px; align-items: center; }

.bar { height: 6px; background: var(--rule); margin: 4px 0 2px; } .bar i { display: block; height: 100%; background: var(--brass); }
.bar.hp i { background: var(--ok); }
.log { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; }
.log time { font-family: var(--f-mono); font-size: 12px; color: var(--dim); white-space: nowrap; padding-top: 1px; }

#over {

#over h1 { font-family: var(--f-head); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; font-size: clamp(34px, 10vw, 60px); line-height: 1.05; margin: 8px 0 14px; text-wrap: balance; }
#over p { color: var(--dim); font-size: 15px; line-height: 1.55; margin: 0 0 10px; }
#over .acts { max-width: 20em; margin-top: 20px; }

@media (min-width: 860px) {
  body { grid-template-rows: auto 1fr; grid-template-columns: 1fr 400px; }

  #panel { border-top: 0; border-left: 1px solid var(--rule); }

@media (prefers-reduced-motion: reduce) { #tabs button.alert { animation: none; } #toast { transition: none; } }

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const R = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
const KEY = 'rubezh-zastava-v1';
const NAMES = ['Сыч', 'Бурый', 'Гвоздь', 'Лис', 'Кремень', 'Тихий', 'Шмель', 'Корень', 'Дрозд', 'Маяк', 'Седло', 'Юла', 'Тополь', 'Жук', 'Сокол', 'Рыжий', 'Молот', 'Штиль', 'Цыган', 'Окунь', 'Варяг', 'Батя', 'Якорь', 'Мох', 'Ветер', 'Зуб', 'Грач', 'Полоз', 'Скиф', 'Хмурый'];
const SQN = ['Гранит', 'Кедр', 'Барс', 'Вепрь'];
const RANK = ['новобранцы', 'бойцы', 'ветераны', 'мастера'];
const TYPES = { m: { n: 'Стая', l: 'С', who: 'стая мутантов' }, b: { n: 'Мародёры', l: 'М', who: 'банда мародёров' }, c: { n: 'Немые', l: 'Н', who: 'отряд Немых' } };
const LOCS = [
  { n: 'Застава', x: 50, y: 74 },
  { n: 'Старый хутор', x: 30, y: 62, t: 'm', s: 45, inc: { s: 10 }, d: 'Брошенные дворы. В погребах завелась стая.' },
  { n: 'Автобаза', x: 70, y: 64, t: 'b', s: 70, inc: { p: 8 }, d: 'Гаражи и ремзона. Мародёры разбирают технику на продажу.' },
  { n: 'Элеватор', x: 46, y: 50, t: 'b', s: 110, inc: { s: 14 }, d: 'Высокая точка над всей долиной. Кто держит элеватор, тот видит дороги.' },
  { n: 'Торфяники', x: 22, y: 40, t: 'm', s: 130, inc: { a: .5, s: 4 }, d: 'Болото с аномалиями. Артефакты есть, но и зверья хватает.' },
  { n: 'Депо', x: 80, y: 44, t: 'b', s: 170, inc: { p: 14 }, d: 'Вагоны, станки, склад запчастей. Главная база мародёров.' },
  { n: 'НИИ «Кварц»', x: 40, y: 30, t: 'm', s: 220, inc: { a: 1, p: 6 }, d: 'Лаборатории под землёй. Оттуда лезет то, что раньше держали в клетках.' },
  { n: 'Радиополе', x: 72, y: 26, t: 'c', s: 260, inc: { s: 10, p: 10 }, d: 'Мачты и бункер связи. Немые до сих пор шлют отсюда свой сигнал.' },
  { n: 'Мёртвый посёлок', x: 28, y: 15, t: 'c', s: 320, inc: { s: 18 }, d: 'Пятиэтажки на окраине. В каждом окне может сидеть стрелок.' },
  { n: 'Станция «Зенит»', x: 58, y: 9, t: 'c', s: 480, inc: { a: 2, s: 10, p: 10 }, d: 'Последний оплот Немых. Здесь закончилась война, и здесь её надо добить.' }
];
const EDGES = [[0, 1], [0, 2], [1, 3], [2, 3], [1, 4], [2, 5], [3, 6], [4, 6], [5, 7], [6, 7], [6, 8], [7, 9], [8, 9]];
const elen = (a, b) => Math.hypot(LOCS[a].x - LOCS[b].x, LOCS[a].y - LOCS[b].y);
const BLD = {
  hq: { n: 'Штаб', max: 3, c: [70, 60], pos: [50, 42, 16, 10], eff: l => `до ${l + 1} отрядов, прочность ${150 + l * 100}` },
  bar: { n: 'Казарма', max: 3, c: [50, 30], pos: [31, 26, 14, 8], eff: l => `до ${4 + l * 4} бойцов` },
  work: { n: 'Мастерская', max: 3, c: [40, 60], pos: [69, 26, 14, 8], eff: l => l ? `сила бойцов +${l * 40}%, потери −${l * 10}%` : 'снаряжение базовое' },
  med: { n: 'Лазарет', max: 2, c: [40, 30], pos: [31, 58, 12, 7], eff: l => l ? `раненые встают в строй в ${1 + l} раза быстрее` : 'раненые лечатся медленно' },
  tow: { n: 'Вышки', max: 3, c: [30, 50], eff: l => ['периметр без вышек', '2 вышки', '4 вышки', '4 вышки с пулемётами'][l] },
  radio: { n: 'Радиоузел', max: 2, c: [30, 50], pos: [69, 58, 12, 7], eff: l => ['налёт виден за 5 часов', 'налёт виден за 12 часов, известна численность', 'то же, и контратаки на точки вдвое реже'][l] }
};
const TOWERS = [[18, 14], [82, 70], [82, 14], [18, 70]];
const ENEMY = { m: { hp: 50, sp: 8, rg: 3, dm: 12, cd: .8, hit: 1 }, b: { hp: 38, sp: 4.5, rg: 17, dm: 8, cd: 1.1, hit: .6 }, c: { hp: 60, sp: 4.5, rg: 20, dm: 12, cd: 1, hit: .65 } };
const PATROL = [[22, 18], [50, 18], [78, 18], [78, 42], [78, 66], [50, 66], [22, 66], [22, 42], [50, 52], [40, 36], [60, 36]];

let G, tab = 'ops', sel = 0, dirty = true, shots = [], towerCd = [0, 0, 0, 0], confirmNew = false;

/* ---------- state ---------- */
function newFighter() {
  const used = new Set(G.fighters.map(f => f.name)); const free = NAMES.filter(n => !used.has(n));
  const p = pick(PATROL);
  const f = { id: G.nid++, name: free.length ? pick(free) : pick(NAMES) + '-' + G.nid, hp: 100, xp: 0, sq: 0, x: p[0], y: p[1], tx: p[0], ty: p[1], w: 0, cd: 0 };
  G.fighters.push(f); return f;
}
function newGame() {
  G = { v: 1, h: 8, speed: 1, res: { s: 120, p: 60, a: 0 }, fighters: [], nid: 1, squads: [], sid: 1,
    bld: { hq: 1, bar: 1, work: 0, med: 0, tow: 0, radio: 0 }, build: null, recruit: { n: 0, left: 0 },
    locs: LOCS.map(L => ({ st: 'foe', enemy: L.s || 0, post: false, lost: 0 })), raid: null, plan: null, nextRaid: 62, warned: false,
    hqhp: 250, log: [], over: false, won: false, started: false };
  for (let i = 0; i < 8; i++) newFighter();
  formSquad(true);
  log('Генерал Гордеев принял командование заставой. В строю восемь человек.');
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(G)); } catch (e) {} }
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1 && s.fighters) { G = s; return true; } } catch (e) {} return false; }

const clock = h => `д.${Math.floor(h / 24) + 1} ${String(Math.floor(h) % 24).padStart(2, '0')}:00`;
function log(t, c) {
  G.log.unshift({ h: Math.floor(G.h), t, c: c || '' }); if (G.log.length > 70) G.log.pop();
  if (c) { const el = $('toast'); el.textContent = t; el.className = 'on ' + c; clearTimeout(log.tm); log.tm = setTimeout(() => el.className = c, 4200); }
  dirty = true;
}
const members = q => G.fighters.filter(f => f.sq === q.id);
const garrison = () => G.fighters.filter(f => f.sq === 0);
const squad = id => G.squads.find(q => q.id === id);
const atBase = f => f.sq === 0 || (squad(f.sq) || {}).state === 'base';
const rank = f => Math.min(3, Math.floor(f.xp / 2));
const power = f => (10 + 4 * G.bld.work) * (1 + .15 * rank(f)) * (f.hp < 35 ? .5 : 1);
const sqPower = q => Math.round(members(q).reduce((a, f) => a + power(f), 0));
const cap = () => 4 + G.bld.bar * 4;
const hqMax = () => 150 + G.bld.hq * 100;
const owned = () => G.locs.filter((l, i) => i && l.st !== 'foe').length;
function cost(k) { const l = G.bld[k], c = BLD[k].c; return { s: c[0] * (l + 1), p: c[1] * (l + 1), a: (l >= 2 ? 2 : 0) + (k === 'work' && l >= 1 ? 1 : 0) }; }
const afford = c => G.res.s >= (c.s || 0) && G.res.p >= (c.p || 0) && Math.floor(G.res.a) >= (c.a || 0);
const pay = c => { G.res.s -= c.s || 0; G.res.p -= c.p || 0; G.res.a -= c.a || 0; };
const costStr = c => [c.s ? c.s + ' прип.' : '', c.p ? c.p + ' дет.' : '', c.a ? c.a + ' арт.' : ''].filter(Boolean).join(' · ');

function kill(f, where) {
  G.fighters = G.fighters.filter(x => x !== f);
  log(`${f.name} погиб: ${where}.`, 'bad');
}
function hurt(f, d, where) { f.hp -= d; if (f.hp <= 0) kill(f, where); }

function formSquad(silent) {
  const g = garrison().sort((a, b) => b.hp - a.hp);
  if (g.length < 4 || G.squads.length >= G.bld.hq + 1) return;
  const name = SQN.find(n => !G.squads.some(q => q.name === n));
  const q = { id: G.sid++, name, state: 'base', node: 0, path: null, seg: 0, prog: 0, x: 50, y: 74 };
  G.squads.push(q); g.slice(0, 4).forEach(f => f.sq = q.id);
  if (!silent) log(`Сформирован отряд «${name}».`);
}
function path(from, to) {
  const D = LOCS.map(() => Infinity), P = LOCS.map(() => -1), done = new Set(); D[from] = 0;
  const ok = n => n === 0 || n === to || n === from || G.locs[n].st !== 'foe';
  for (;;) {
    let u = -1; D.forEach((d, i) => { if (!done.has(i) && d < Infinity && (u < 0 || d < D[u])) u = i; });
    if (u < 0) return null; if (u === to) break; done.add(u);
    EDGES.forEach(([a, b]) => { const v = a === u ? b : b === u ? a : -1; if (v < 0 || !ok(v)) return; const nd = D[u] + elen(u, v); if (nd < D[v]) { D[v] = nd; P[v] = u; } });
  }
  const p = [to]; while (p[0] !== from) p.unshift(P[p[0]]); return p;
}
function send(q, to) {
  const p = path(q.node, to) || (to === 0 ? [q.node, 0] : null); if (!p || p.length < 2) return false;
  q.state = 'move'; q.path = p; q.seg = 0; q.prog = 0; q.dest = to; dirty = true; return true;
}
function arrive(q) {
  q.path = null;
  if (q.node === 0) { q.state = 'base'; members(q).forEach(f => { f.x = 50 + R(-3, 3); f.y = 69; f.tx = f.x; f.ty = f.y; f.w = 0; }); log(`«${q.name}» вернулся на заставу.`); return; }
  const l = G.locs[q.node], L = LOCS[q.node];
  if (l.st === 'ours') { q.state = 'hold'; log(`«${q.name}» занял оборону: ${L.n}.`); }
  else { q.state = 'fight'; log(`«${q.name}» вступил в бой: ${L.n}.`); }
}
function moveSquads(dh) {
  G.squads.forEach(q => {
    if (q.state !== 'move') { const L = LOCS[q.node]; q.x = L.x; q.y = L.y; return; }
    q.prog += 5 * dh;
    for (;;) {
      const a = q.path[q.seg], b = q.path[q.seg + 1], len = elen(a, b);
      if (q.prog < len) { const t = q.prog / len; q.x = LOCS[a].x + (LOCS[b].x - LOCS[a].x) * t; q.y = LOCS[a].y + (LOCS[b].y - LOCS[a].y) * t; break; }
      q.prog -= len; q.seg++; q.node = b;
      if (q.seg >= q.path.length - 1) { q.x = LOCS[b].x; q.y = LOCS[b].y; arrive(q); break; }
    }
  });
}

/* ---------- hourly simulation ---------- */
function hourTick() {
  // construction and recruits
  if (G.build) { G.build.left--; if (G.build.left <= 0) { const k = G.build.k; G.bld[k]++; G.build = null; if (k === 'hq') G.hqhp = hqMax(); log(`Построено: ${BLD[k].n}, уровень ${G.bld[k]}.`, 'good'); } }
  if (G.recruit.n > 0) { G.recruit.left--; if (G.recruit.left <= 0) { const f = newFighter(); f.x = 50; f.y = 70; G.recruit.n--; G.recruit.left = 5; log(`На заставу пришёл новичок: ${f.name}.`); } }
  // healing
  const fed = G.res.s > 0;
  G.fighters.forEach(f => { if (f.hp >= 100) return; const q = f.sq ? squad(f.sq) : null; const home = !q || q.state === 'base';
    if (home && !G.raid && fed) f.hp = Math.min(100, f.hp + 2 * (1 + G.bld.med)); else if (q && q.state === 'hold') f.hp = Math.min(100, f.hp + .5); });
  if (!G.raid && G.hqhp < hqMax()) G.hqhp = Math.min(hqMax(), G.hqhp + 4);
  // battles at locations
  for (let i = 1; i < LOCS.length; i++) {
    const l = G.locs[i], L = LOCS[i]; if (l.st === 'ours') continue;
    const fs = G.squads.filter(q => q.state === 'fight' && q.node === i);

  G.fighters.forEach(f => { if (!atBase(f)) return; cx.fillStyle = f.hp < 35 ? '#7d6a8f' : BLUE; cx.strokeStyle = '#e8eef4'; cx.lineWidth = .25; cx.beginPath(); cx.arc(f.x, f.y, 1.05, 0, 7); cx.fill(); cx.stroke(); });
  if (G.raid) G.raid.en.forEach(e => { cx.fillStyle = RED; cx.strokeStyle = '#f1dcd2'; cx.lineWidth = .2; cx.beginPath(); cx.moveTo(e.x, e.y - 1.3); cx.lineTo(e.x + 1.2, e.y + 1); cx.lineTo(e.x - 1.2, e.y + 1); cx.closePath(); cx.fill(); cx.stroke(); });
}
cv.addEventListener('click', e => {
  if (!G.started) return;
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left - OX) / S, y = (e.clientY - r.top - OY) / S;
  if (tab !== 'ops') return;
  let b = -1, bd = Math.max(7, 26 / S); LOCS.forEach((L, i) => { const d = Math.hypot(L.x - x, L.y + 1.5 - y); if (d < bd) { bd = d; b = i; } });
  if (b === 0) { setTab('base'); return; }
  sel = b < 0 ? 0 : b; dirty = true; render(true);
});

/* ---------- panel ---------- */
function setTab(t) { tab = t; dirty = true; ['ops', 'base', 'log'].forEach(k => $('tab-' + k).setAttribute('aria-selected', k === t)); $('body').scrollTop = 0; render(true); }
const stateText = q => q.state === 'base' ? 'на заставе, в охранении' : q.state === 'move' ? 'в пути → ' + LOCS[q.dest].n : q.state === 'fight' ? 'ведёт бой: ' + LOCS[q.node].n : 'удерживает: ' + LOCS[q.node].n;
function sqCard(q, extra) {
  const m = members(q), rk = m.length ? RANK[Math.round(m.reduce((a, f) => a + rank(f), 0) / m.length)] : '';
  return `<div class="card"><div><b>«${q.name}»</b> <span class="dim">· ${m.length} чел., ${rk} · сила ${sqPower(q)}</span><div class="dim">${stateText(q)}</div>
    <div class="pips">${m.map(f => `<i class="${f.hp < 35 ? 'low' : ''}" style="--h:${Math.max(4, f.hp)}%" title="${f.name}"></i>`).join('')}</div></div><div class="row">${extra || ''}</div></div>`;
}
function incStr(c) { return [c.s ? `+${c.s} прип.` : '', c.p ? `+${c.p} дет.` : '', c.a ? `+${c.a} арт.` : ''].filter(Boolean).join(', ') + ' в сутки'; }
function opsHTML() {
  let h = '';
  if (sel) {
    const L = LOCS[sel], l = G.locs[sel], T = TYPES[L.t];
    h += `<div class="head"><h2>${L.n}</h2><span class="tag ${l.st}">${l.st === 'foe' ? T.n : l.st === 'ours' ? 'Наша' : 'Под ударом'}</span></div><p class="dim">${L.d}</p>`;
    h += `<p>${l.st === 'ours' ? 'Даёт' : 'Даст'}: ${incStr(L.inc)}.${l.st !== 'ours' ? ` Противник: сила <b class="bad">${Math.ceil(l.enemy)}</b>.` : ''}${l.st === 'cont' ? ` <span class="bad">Падёт через ${30 - l.lost} ч без помощи.</span>` : ''}${l.post ? ' Стоит блокпост.' : ''}</p>`;
    h += '<div class="acts">';
    const ok = l.st !== 'foe' || reachable(sel);
    if (!ok) h += '<p class="dim">Подхода нет. Сначала возьмите соседнюю точку на дороге.</p>';
    else G.squads.forEach(q => {
      if (q.state === 'move' || q.state === 'fight' || q.node === sel || !path(q.node, sel)) return;
      h += `<button class="btn go" data-a="send" data-i="${q.id}"><b>${l.st === 'ours' ? 'Поставить в оборону' : 'Отправить на зачистку'}: «${q.name}»</b><span>сила ${sqPower(q)}</span></button>`;
    });
    G.squads.filter(q => q.node === sel && (q.state === 'hold' || q.state === 'fight')).forEach(q => h += `<button class="btn" data-a="home" data-i="${q.id}"><b>${q.state === 'fight' ? 'Отвести' : 'Вернуть'} «${q.name}» на заставу</b><span></span></button>`);
    if (l.st === 'ours' && !l.post) { const c = { s: 30, p: 40 }; h += `<button class="btn" data-a="post" ${afford(c) ? '' : 'disabled'}><b>Поставить блокпост</b><span>${costStr(c)}</span></button><p class="dim">Блокпост сам отбивает слабые контратаки.</p>`; }
    h += '</div>';
  } else h += '<p class="dim">Нажмите точку на карте, чтобы отдать приказ. Красный ромб — противник, синий прямоугольник — наши.</p>';
  h += '<h3>Отряды</h3>' + (G.squads.length ? G.squads.map(q => sqCard(q, q.state === 'hold' || q.state === 'fight' ? `<button class="btn small" data-a="home" data-i="${q.id}"><b>На базу</b></button>` : '')).join('') : '<p class="dim">Отрядов нет. Сформируйте отряд на вкладке «Застава».</p>');
  return h;
}
function baseHTML() {
  const g = garrison(), total = G.fighters.length + G.recruit.n, hp = G.hqhp / hqMax() * 100;
  let h = `<div class="head"><h2>Застава «Рубеж»</h2><span class="tag ${G.raid ? 'foe' : 'ours'}">${G.raid ? 'Бой на периметре' : 'Спокойно'}</span></div>`;
  h += `<div class="bar hp"><i style="width:${hp}%"></i></div><p class="dim">Штаб: ${Math.ceil(G.hqhp)} / ${hqMax()}. В гарнизоне ${g.length} чел.${G.squads.filter(q => q.state === 'base').length ? ' и отряды на отдыхе' : ''} — периметр они держат сами.</p>`;
  if (G.raid) h += `<p class="bad">Противников на территории: ${G.raid.en.length}.</p>`;
  else if (G.warned) h += `<p class="bad">Разведка: нападение через ${Math.max(1, Math.ceil(G.nextRaid - G.h))} ч${G.plan && G.bld.radio ? ` — ${TYPES[G.plan.t].who}, до ${G.plan.n}` : ''}.</p>`;
  const rc = { s: 25 }, canR = afford(rc) && total < cap(), canF = g.length >= 4 && G.squads.length < G.bld.hq + 1;
  h += `<div class="acts"><button class="btn" data-a="recruit" ${canR ? '' : 'disabled'}><b>Нанять бойца</b><span>${total >= cap() ? 'казарма полна' : costStr(rc)}${G.recruit.n ? ` · в пути ${G.recruit.n}` : ''}</span></button>
    <button class="btn" data-a="form" ${canF ? '' : 'disabled'}><b>Сформировать отряд</b><span>${G.squads.length >= G.bld.hq + 1 ? 'нужен штаб выше' : g.length < 4 ? 'нужно 4 в гарнизоне' : '4 бойца'}</span></button></div>`;
  const home = G.squads.filter(q => q.state === 'base');
  if (home.length) h += '<h3>Отряды на заставе</h3>' + home.map(q => sqCard(q, `<button class="btn small" data-a="refill" data-i="${q.id}" ${members(q).length < 5 && g.length ? '' : 'disabled'}><b>Пополнить</b></button><button class="btn small" data-a="disband" data-i="${q.id}"><b>Распустить</b></button>`)).join('');
  h += '<h3>Строительство</h3>';
  Object.keys(BLD).forEach(k => {
    const B = BLD[k], l = G.bld[k], bu = G.build && G.build.k === k;
    let act = '';
    if (bu) act = `<span class="dim">ещё ${G.build.left} ч</span>`;
    else if (l >= B.max) act = '<span class="dim">предел</span>';
    else { const c = cost(k); act = `<button class="btn small" data-a="up" data-i="${k}" ${!G.build && afford(c) ? '' : 'disabled'}><b>${l ? 'Улучшить' : 'Построить'}</b><span>${costStr(c)}</span></button>`; }
    h += `<div class="card"><div><b>${B.n}</b> <span class="lv">${'■'.repeat(l)}${'□'.repeat(B.max - l)}</span><div class="dim">${B.eff(l)}${l < B.max ? ` → ${B.eff(l + 1)}` : ''}</div>${bu ? `<div class="bar"><i style="width:${(1 - G.build.left / G.build.total) * 100}%"></i></div>` : ''}</div><div class="row">${act}</div></div>`;
  });
  return h;
}
function logHTML() {
  return `<div class="log">${G.log.map(e => `<time>${clock(e.h)}</time><div class="${e.c}">${e.t}</div>`).join('')}</div>
    <div class="acts" style="margin-top:20px"><button class="btn" data-a="new"><b>${confirmNew ? 'Точно стереть всё и начать заново?' : 'Начать кампанию заново'}</b><span></span></button></div>`;
}
let lastHTML = '', lastRes = '', holding = false, lastRender = 0;
function render(force) {
  const res = `<div class="cell"><small>Припасы</small><b>${Math.floor(G.res.s)}</b></div><div class="cell"><small>Детали</small><b>${Math.floor(G.res.p)}</b></div><div class="cell"><small>Артефакты</small><b>${Math.floor(G.res.a)}</b></div><div class="cell"><small>Бойцы</small><b>${G.fighters.length}/${cap()}</b></div><div class="cell"><small>Время</small><b>${clock(G.h)}</b></div>`;
  if (res !== lastRes) { $('res').innerHTML = lastRes = res; }
  [0, 1, 3].forEach(v => $('sp' + v).setAttribute('aria-pressed', G.speed === v));
  $('tab-base').classList.toggle('alert', !!G.raid && tab !== 'base');
  if (holding && !force) return;
  const h = tab === 'ops' ? opsHTML() : tab === 'base' ? baseHTML() : logHTML();
  if (h !== lastHTML) { $('body').innerHTML = lastHTML = h; }
  dirty = false;
}
$('panel').addEventListener('pointerdown', () => holding = true);
addEventListener('pointerup', () => setTimeout(() => holding = false, 60)); addEventListener('pointercancel', () => holding = false);

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a, i = b.dataset.i;
  if (a !== 'new') confirmNew = false;
  if (a === 'tab') return setTab(i);
  if (a === 'begin') { if (i === 'new') { newGame(); sel = 0; } G.started = true; G.speed = G.over ? 0 : 1; $('over').hidden = true; setTab('ops'); save(); return; }
  if (a === 'cont') { $('over').hidden = true; G.speed = 1; return render(true); }
  if (a === 'speed') G.speed = +i;
  else if (a === 'send') { const q = squad(+i); if (q && send(q, sel)) log(`«${q.name}» выдвинулся: ${LOCS[sel].n}.`); }
  else if (a === 'home') { const q = squad(+i); if (q && q.node && send(q, 0)) log(`«${q.name}» возвращается на заставу.`); }
  else if (a === 'post') { const c = { s: 30, p: 40 }; if (afford(c) && G.locs[sel].st === 'ours') { pay(c); G.locs[sel].post = true; log(`${LOCS[sel].n}: поставлен блокпост.`); } }
  else if (a === 'recruit') { if (afford({ s: 25 }) && G.fighters.length + G.recruit.n < cap()) { pay({ s: 25 }); if (!G.recruit.n) G.recruit.left = 5; G.recruit.n++; } }
  else if (a === 'form') formSquad();
  else if (a === 'refill') { const q = squad(+i), g = garrison().sort((x, y) => y.hp - x.hp); while (q && members(q).length < 5 && g.length) g.shift().sq = q.id; }
  else if (a === 'disband') { const q = squad(+i); if (q && q.state === 'base') { members(q).forEach(f => f.sq = 0); G.squads = G.squads.filter(x => x !== q); log(`Отряд «${q.name}» распущен в гарнизон.`); } }
  else if (a === 'up') { const c = cost(i); if (!G.build && G.bld[i] < BLD[i].max && afford(c)) { pay(c); const t = 8 * (G.bld[i] + 1); G.build = { k: i, left: t, total: t }; log(`Начато строительство: ${BLD[i].n}.`); } }
  else if (a === 'new') { if (!confirmNew) confirmNew = true; else { confirmNew = false; try { localStorage.removeItem(KEY); } catch (e2) {} newGame(); sel = 0; overlay('intro'); } }
  dirty = true; render(true);
});

function overlay(kind) {
  const o = $('over'); o.hidden = false;
  if (kind === 'intro') o.innerHTML = `<div><div class="stamp">ПРИКАЗ № 1 · ЗАСТАВА «РУБЕЖ»</div><h1>Рубеж. Застава</h1>
    <p>Война с Немыми у станции «Зенит» выиграна, но от группировки «Рубеж» остались одна застава и восемь бойцов. Долина снова ничья: в хуторах стаи, на дорогах мародёры, а недобитые фанатики сидят на севере.</p>
    <p>Вы — генерал Гордеев. Гарнизон охраняет периметр сам. Ваше дело — строить заставу, набирать людей и посылать отряды брать точки на карте. Возьмите «Зенит», и долина ваша.</p>
    <div class="acts"><button class="btn go" data-a="begin" data-i="${G.h > 8 ? 'go' : 'new'}"><b>${G.h > 8 ? 'Продолжить кампанию' : 'Принять командование'}</b><span>${G.h > 8 ? clock(G.h) : ''}</span></button>${G.h > 8 ? '<button class="btn" data-a="begin" data-i="new"><b>Начать заново</b><span></span></button>' : ''}</div></div>`;
  else if (kind === 'win') o.innerHTML = `<div><div class="stamp">ДОНЕСЕНИЕ · ${clock(G.h)}</div><h1>«Зенит» взят</h1><p>Сигнал Немых замолчал. Над станцией флаг «Рубежа», и по всей долине это видят. Группировка восстановлена, генерал.</p><p>Точек под контролем: ${owned()} из 9. Бойцов в строю: ${G.fighters.length}.</p><div class="acts"><button class="btn go" data-a="cont"><b>Продолжать службу</b><span></span></button><button class="btn" data-a="begin" data-i="new"><b>Новая кампания</b><span></span></button></div></div>`;
  else o.innerHTML = `<div><div class="stamp">ПОСЛЕДНЯЯ ЗАПИСЬ · ${clock(G.h)}</div><h1>Застава пала</h1><p>Штаб разрушен, периметр прорван. «Рубеж» продержался ${Math.floor(G.h / 24) + 1} суток и взял точек: ${owned()}.</p><p>В следующий раз не уводите всех людей с базы и стройте вышки раньше.</p><div class="acts"><button class="btn go" data-a="begin" data-i="new"><b>Начать заново</b><span></span></button></div></div>`;
}

/* ---------- loop ---------- */
let last = performance.now(), acc = 0, saveT = 0, T = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const real = Math.min(.1, (now - last) / 1000); last = now; T += real;
  if (G.started && !G.over && G.speed > 0) {
    const dt = real * G.speed;
    G.h += dt; acc += dt; moveSquads(dt); baseSim(dt);
    while (acc >= 1) { acc -= 1; hourTick(); }
    if ((saveT += real) > 8) { saveT = 0; save(); }
  }
  if (bgMap) {
    cx.setTransform(1, 0, 0, 1, 0, 0); cx.drawImage(tab === 'base' ? bgBase : bgMap, 0, 0);
    cx.setTransform(S * DPR, 0, 0, S * DPR, OX * DPR, OY * DPR);
    tab === 'base' ? drawBase(T) : drawMap(T);
  }
  if (dirty || now - lastRender > 500) { lastRender = now; render(); }
}
if (!load()) newGame();
G.over = G.over && G.hqhp <= 0;
window._rz = { G: () => G, tick: n => { for (let i = 0; i < n; i++) { G.h += 1; moveSquads(1); for (let k = 0; k < 10; k++) baseSim(.1); hourTick(); } } };
new ResizeObserver(resize).observe($('stage')); resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
setTab('ops'); overlay(G.over ? 'lose' : 'intro');
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); last = performance.now(); });
requestAnimationFrame(frame);
})();
</script>
